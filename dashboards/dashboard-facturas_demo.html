<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Facturación · ExcelentIA</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f6f8;
    --white: #ffffff;
    --border: #dde1e9;
    --header-grad: linear-gradient(135deg, #0d1b3e 0%, #1a3a6b 60%, #1e5096 100%);
    --header-accent: #4a9fd4;
    --hover-card: #e8f0fb;
    --card-head: #dce8f7;
    --alert-bg: #f0f6ff;
    --alert-border: #c8d9f0;
    --alert-accent: #4a9fd4;
    --note-bg: #eef4fc;
    --note-accent: #1a3a6b;
    --text: #1a2035;
    --text-sec: #4a5068;
    --text-gray: #8a90a0;
    --green: #1a9e5c;
    --green-bg: #eafaf2;
    --red: #d63b3b;
    --red-bg: #fdf0f0;
    --blue: #1a5096;
    --blue-bg: #eaf1fb;
    --yellow: #b87a00;
    --yellow-bg: #fdf6e3;
  }

  body {
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* HEADER */
  .header {
    background: var(--header-grad);
    border-bottom: 3px solid var(--header-accent);
    padding: 0 32px;
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0;
    gap: 16px;
  }
  .header-left { display: flex; align-items: center; gap: 20px; }
  .header-logo { height: 48px; width: auto; }
  .header-divider { width: 1px; height: 36px; background: rgba(255,255,255,0.2); }
  .header-title { color: #fff; }
  .header-title h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .header-title p { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-empresa { text-align: right; color: #fff; }
  .header-empresa strong { font-size: 14px; font-weight: 700; display: block; }
  .header-empresa span { font-size: 12px; color: rgba(255,255,255,0.55); }
  .btn-refresh {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-family: 'Manrope', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-refresh:hover { background: rgba(255,255,255,0.22); }

  /* MAIN */
  .main { max-width: 1200px; margin: 0 auto; padding: 28px 24px 64px; }

  /* LOADING / ERROR */
  .loading {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 80px 24px; gap: 16px;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--header-accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { color: var(--text-sec); font-size: 14px; }
  .error-box {
    background: var(--red-bg); border: 1px solid #f5c6c6;
    border-left: 4px solid var(--red); border-radius: 10px;
    padding: 20px 24px; color: var(--red); font-size: 14px; margin: 32px 0;
  }

  /* SECTION LABEL */
  .section-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.2px; color: var(--text-gray); margin: 32px 0 14px;
  }

  /* PERIODO BAR */
  .periodo-bar {
    background: var(--note-bg); border-left: 4px solid var(--note-accent);
    border-radius: 8px; padding: 12px 18px; font-size: 13px; color: var(--text-sec);
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin-bottom: 8px;
  }
  .periodo-bar strong { color: var(--text); }

  /* KPI GRID */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 8px; }
  .kpi {
    background: var(--white); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 22px; transition: background 0.15s, border-color 0.15s;
    position: relative; overflow: hidden;
  }
  .kpi::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; border-radius: 12px 12px 0 0;
  }
  .kpi:hover { background: var(--hover-card); border-color: var(--alert-border); }
  .kpi.green::before { background: var(--green); }
  .kpi.red::before { background: var(--red); }
  .kpi.blue::before { background: var(--blue); }
  .kpi.yellow::before { background: var(--yellow); }
  .kpi-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-gray); margin-bottom: 10px; }
  .kpi-value { font-size: 28px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
  .kpi.green .kpi-value { color: var(--green); }
  .kpi.red .kpi-value { color: var(--red); }
  .kpi.blue .kpi-value { color: var(--blue); }
  .kpi.yellow .kpi-value { color: var(--yellow); }
  .kpi-currency { font-size: 16px; font-weight: 600; opacity: 0.55; margin-left: 4px; }
  .kpi-sub { font-size: 12px; color: var(--text-gray); margin-top: 8px; }

  /* CARDS */
  .card { background: var(--white); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
  .card-head {
    background: var(--card-head); border-bottom: 1px solid var(--border);
    padding: 13px 20px; font-size: 12px; font-weight: 700;
    color: var(--note-accent); text-transform: uppercase; letter-spacing: 0.6px;
  }
  .card-body { padding: 20px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* CHART */
  .chart-wrap {
    height: 200px; display: flex; align-items: flex-end;
    gap: 8px; padding-bottom: 0; border-bottom: 2px solid var(--border); position: relative;
  }
  .chart-month { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
  .chart-bars { display: flex; gap: 3px; align-items: flex-end; width: 100%; justify-content: center; height: 100%; }
  .chart-bar {
    width: 14px; border-radius: 4px 4px 0 0; position: relative;
    cursor: default; transition: opacity 0.15s; min-height: 2px;
  }
  .chart-bar:hover { opacity: 0.75; }
  .chart-bar.income { background: linear-gradient(180deg, #2db870, #1a9e5c); }
  .chart-bar.expense { background: linear-gradient(180deg, #e05555, #d63b3b); }
  .chart-bar .tip {
    position: absolute; bottom: calc(100% + 6px); left: 50%;
    transform: translateX(-50%); background: var(--text); color: #fff;
    font-size: 11px; font-family: 'Manrope', sans-serif; padding: 4px 8px;
    border-radius: 5px; white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity 0.15s; z-index: 10;
  }
  .chart-bar:hover .tip { opacity: 1; }
  .chart-labels { display: flex; gap: 8px; margin-top: 8px; }
  .chart-label { flex: 1; text-align: center; font-size: 10px; color: var(--text-gray); font-weight: 600; }
  .chart-legend { display: flex; gap: 18px; margin-top: 14px; font-size: 12px; color: var(--text-sec); }
  .chart-legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; }
  .legend-dot.i { background: #1a9e5c; }
  .legend-dot.e { background: #d63b3b; }

  /* IVA TABLE */
  .iva-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .iva-table th {
    background: var(--alert-bg); color: var(--text-sec); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.6px; padding: 10px 12px;
    border-bottom: 1px solid var(--border); text-align: left;
  }
  .iva-table th.r { text-align: right; }
  .iva-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); }
  .iva-table td.r { text-align: right; font-variant-numeric: tabular-nums; }
  .iva-table tbody tr:last-child td { border-bottom: none; }
  .iva-table tbody tr:hover { background: var(--hover-card); }
  .iva-table .total-row td {
    font-weight: 800; background: var(--alert-bg);
    border-top: 2px solid var(--border); border-bottom: none; color: var(--blue);
  }

  /* CLIENTES */
  .cliente-item { margin-bottom: 16px; }
  .cliente-item:last-child { margin-bottom: 0; }
  .cliente-row-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .cliente-nombre { font-size: 13px; font-weight: 700; color: var(--text); }
  .cliente-stats { font-size: 12px; color: var(--text-gray); font-weight: 600; }
  .cliente-bar-wrap { background: var(--bg); height: 7px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
  .cliente-bar { height: 100%; background: linear-gradient(90deg, var(--header-accent), var(--blue)); border-radius: 4px; }

  /* BADGES */
  .badge { display: inline-block; padding: 3px 9px; border-radius: 5px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge.ingreso { background: var(--green-bg); color: var(--green); }
  .badge.gasto { background: var(--red-bg); color: var(--red); }

  /* DETALLE TABLE */
  .detalle-wrap { overflow-x: auto; }
  .detalle-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 780px; }
  .detalle-table th {
    background: var(--card-head); color: var(--note-accent); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.6px; padding: 10px 12px;
    border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap;
  }
  .detalle-table th.r { text-align: right; }
  .detalle-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .detalle-table td.r { text-align: right; font-variant-numeric: tabular-nums; }
  .detalle-table tbody tr:last-child td { border-bottom: none; }
  .detalle-table tbody tr:hover { background: var(--hover-card); }
  .concepto-cell { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-sec); }

  /* ALERTS */
  .alert {
    background: var(--alert-bg); border: 1px solid var(--alert-border);
    border-left: 4px solid var(--alert-accent); border-radius: 8px;
    padding: 12px 15px; font-size: 13px; color: var(--text-sec);
    margin-bottom: 10px; display: flex; gap: 10px; align-items: flex-start;
  }
  .alert:last-child { margin-bottom: 0; }
  .alert.success { background: var(--green-bg); border-color: #b5e6cf; border-left-color: var(--green); }
  .alert.warning { background: var(--yellow-bg); border-color: #f0dfa0; border-left-color: var(--yellow); }
  .alert .ai { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .alert strong { color: var(--text); }

  /* FOOTER */
  .footer { border-top: 1px solid var(--border); padding-top: 20px; margin-top: 40px; text-align: center; font-size: 12px; color: var(--text-gray); }
  .footer a { color: var(--header-accent); text-decoration: none; }

  /* RESPONSIVE */
  @media (max-width: 960px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .grid-2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .header { padding: 0 16px; }
    .header-inner { flex-direction: column; align-items: flex-start; padding: 14px 0; gap: 12px; }
    .header-empresa { display: none; }
    .main { padding: 18px 14px 48px; }
    .kpi-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .kpi-value { font-size: 22px; }
    .periodo-bar { gap: 10px; font-size: 12px; flex-direction: column; align-items: flex-start; }
    .section-label { margin: 24px 0 10px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-left">
      <img src="https://excelentia.com.mx/assets/logo%20excelentIA.png" alt="ExcelentIA" class="header-logo"
           onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/fernandodavilaolvera-rgb/excelentia.com.mx/main/assets/logo%20excelentIA.png';">
      <div class="header-divider"></div>
      <div class="header-title">
        <h1>Dashboard de Facturación</h1>
        <p>Análisis financiero en tiempo real</p>
      </div>
    </div>
    <div class="header-right">
      <div class="header-empresa" id="header-empresa">
        <strong>Cargando...</strong>
        <span>conectando datos</span>
      </div>
      <button class="btn-refresh" onclick="cargarDatos()">
        ↻ Actualizar
      </button>
    </div>
  </div>
</header>

<main class="main">
  <div id="contenido">
    <div class="loading"><div class="spinner"></div><p>Leyendo datos del Sheet...</p></div>
  </div>
</main>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRycMwSEi9ZuS6pDy-ZdKtM6CxtoS9ggEqREPnUx3I2XkpBAxEbBKiFfDcFXNtk3JZQHrYHpTWBTHey/pub?gid=0&single=true&output=csv';

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/"/g,''));
  return lines.slice(1).map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (const c of line) {
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    cols.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (cols[i] || '').replace(/"/g,''); });
    return obj;
  }).filter(r => r.id && r.id.trim().length > 0);
}

const num = v => parseFloat(String(v).replace(',','.')) || 0;
const fmt = (n, d=2) => n.toLocaleString('es-MX', {minimumFractionDigits:d, maximumFractionDigits:d});

function fmtMes(yyyymm) {
  const [y, m] = yyyymm.split('-');
  const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${meses[parseInt(m)-1]} '${y.slice(2)}`;
}

async function cargarDatos() {
  document.getElementById('contenido').innerHTML =
    '<div class="loading"><div class="spinner"></div><p>Actualizando datos...</p></div>';
  try {
    const res = await fetch(SHEET_URL + '&t=' + Date.now());
    if (!res.ok) throw new Error('No se pudo conectar');
    const text = await res.text();
    renderDashboard(parseCSV(text));
  } catch(e) {
    document.getElementById('contenido').innerHTML =
      `<div class="error-box"><strong>Error al cargar datos:</strong> ${e.message}</div>`;
  }
}

function renderDashboard(rows) {
  const ingresos = rows.filter(r => r.tipo === 'ingreso');
  const gastos   = rows.filter(r => r.tipo === 'gasto');

  const totalI = ingresos.reduce((s,r) => s + num(r.base), 0);
  const totalG = gastos.reduce((s,r) => s + num(r.base), 0);
  const beneficio = totalI - totalG;
  const ivaRep = ingresos.reduce((s,r) => s + num(r.iva_monto), 0);
  const ivaSop = gastos.reduce((s,r) => s + num(r.iva_monto), 0);
  const ivaLiq = ivaRep - ivaSop;
  const margen = totalI > 0 ? beneficio / totalI * 100 : 0;

  const empresa = ingresos[0]?.emisor_nombre || gastos[0]?.receptor_nombre || '—';
  const rfc     = ingresos[0]?.emisor_rfc || '—';

  document.getElementById('header-empresa').innerHTML =
    `<strong>${empresa}</strong><span>${rfc}</span>`;

  // Evolución mensual
  const mMap = {};
  rows.forEach(r => {
    const k = r.fecha.slice(0,7);
    if (!mMap[k]) mMap[k] = {i:0, g:0};
    if (r.tipo==='ingreso') mMap[k].i += num(r.base);
    else mMap[k].g += num(r.base);
  });
  const meses = Object.keys(mMap).sort();
  const maxVal = Math.max(...meses.map(m => Math.max(mMap[m].i, mMap[m].g)), 1);

  // IVA trimestral
  const tMap = {};
  rows.forEach(r => {
    const [y,m] = r.fecha.split('-');
    const k = `Q${Math.ceil(parseInt(m)/3)} ${y}`;
    if (!tMap[k]) tMap[k] = {rep:0, sop:0};
    if (r.tipo==='ingreso') tMap[k].rep += num(r.iva_monto);
    else tMap[k].sop += num(r.iva_monto);
  });
  const trims = Object.entries(tMap).sort((a,b) => a[0].localeCompare(b[0]));

  // Top clientes
  const cMap = {};
  ingresos.forEach(r => {
    const k = r.receptor_nombre;
    if (!cMap[k]) cMap[k] = {total:0, count:0};
    cMap[k].total += num(r.base); cMap[k].count++;
  });
  const topC = Object.entries(cMap).sort((a,b) => b[1].total - a[1].total).slice(0,5);
  const maxC = topC[0]?.[1].total || 1;

  // Alertas
  const mitad = Math.floor(meses.length / 2);
  const primeraM = meses.slice(0,mitad).reduce((s,m) => s+mMap[m].i, 0);
  const segundaM = meses.slice(mitad).reduce((s,m) => s+mMap[m].i, 0);
  const crec = primeraM > 0 ? (segundaM-primeraM)/primeraM*100 : 0;
  const topPct = totalI > 0 ? (topC[0]?.[1].total||0)/totalI*100 : 0;
  const mejorMes = meses.reduce((b,m) => mMap[m].i > mMap[b].i ? m : b, meses[0]);
  const peorMes  = meses.reduce((w,m) => mMap[m].i < mMap[w].i ? m : w, meses[0]);

  // Fechas periodo
  const fechas = rows.map(r=>r.fecha).sort();
  const periodoIni = fmtMes(fechas[0].slice(0,7));
  const periodoFin = fmtMes(fechas[fechas.length-1].slice(0,7));
  const ahora = new Date().toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'});

  document.getElementById('contenido').innerHTML = `

    <div class="periodo-bar">
      <span>📅 <strong>Periodo:</strong> ${periodoIni} — ${periodoFin}</span>
      <span>📄 <strong>${rows.length} facturas</strong> · ${ingresos.length} ingresos · ${gastos.length} gastos</span>
      <span>🕐 <strong>Actualizado:</strong> ${ahora}</span>
    </div>

    <div class="section-label">Resumen ejecutivo</div>
    <div class="kpi-grid">
      <div class="kpi green">
        <div class="kpi-label">Facturación neta</div>
        <div class="kpi-value">${fmt(totalI)}<span class="kpi-currency">EUR</span></div>
        <div class="kpi-sub">${ingresos.length} facturas · ticket medio ${fmt(totalI/(ingresos.length||1))}</div>
      </div>
      <div class="kpi red">
        <div class="kpi-label">Gastos netos</div>
        <div class="kpi-value">${fmt(totalG)}<span class="kpi-currency">EUR</span></div>
        <div class="kpi-sub">${gastos.length} facturas recibidas</div>
      </div>
      <div class="kpi blue">
        <div class="kpi-label">Beneficio bruto</div>
        <div class="kpi-value">${fmt(beneficio)}<span class="kpi-currency">EUR</span></div>
        <div class="kpi-sub">Margen ${fmt(margen,1)} %</div>
      </div>
      <div class="kpi yellow">
        <div class="kpi-label">IVA a liquidar</div>
        <div class="kpi-value">${fmt(ivaLiq)}<span class="kpi-currency">EUR</span></div>
        <div class="kpi-sub">${fmt(ivaRep)} repercutido − ${fmt(ivaSop)} soportado</div>
      </div>
    </div>

    <div class="section-label">Evolución mensual y top clientes</div>
    <div class="grid-2">

      <div class="card">
        <div class="card-head">📈 Facturación mes a mes (base imponible)</div>
        <div class="card-body">
          <div class="chart-wrap">
            ${meses.map(m => {
              const hI = Math.max(mMap[m].i/maxVal*100, mMap[m].i>0?1.5:0);
              const hG = Math.max(mMap[m].g/maxVal*100, mMap[m].g>0?1.5:0);
              return `<div class="chart-month"><div class="chart-bars">
                <div class="chart-bar income" style="height:${hI}%"><div class="tip">Ingresos: ${fmt(mMap[m].i)} EUR</div></div>
                <div class="chart-bar expense" style="height:${hG}%"><div class="tip">Gastos: ${fmt(mMap[m].g)} EUR</div></div>
              </div></div>`;
            }).join('')}
          </div>
          <div class="chart-labels">
            ${meses.map(m => `<div class="chart-label">${fmtMes(m)}</div>`).join('')}
          </div>
          <div class="chart-legend">
            <div class="chart-legend-item"><div class="legend-dot i"></div> Ingresos</div>
            <div class="chart-legend-item"><div class="legend-dot e"></div> Gastos</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">🏆 Top clientes por facturación</div>
        <div class="card-body">
          ${topC.map(([nombre,d]) => {
            const pct = totalI>0 ? d.total/totalI*100 : 0;
            return `<div class="cliente-item">
              <div class="cliente-row-top">
                <span class="cliente-nombre">${nombre}</span>
                <span class="cliente-stats">${fmt(pct,1)} %</span>
              </div>
              <div class="cliente-bar-wrap">
                <div class="cliente-bar" style="width:${d.total/maxC*100}%"></div>
              </div>
              <div style="font-size:12px;color:var(--text-gray);margin-top:4px">${fmt(d.total)} EUR · ${d.count} factura${d.count!==1?'s':''}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-head">🧾 Liquidación de IVA por trimestre</div>
        <div class="card-body" style="padding:0">
          <table class="iva-table">
            <thead>
              <tr><th>Trimestre</th><th class="r">Repercutido</th><th class="r">Soportado</th><th class="r">A liquidar</th></tr>
            </thead>
            <tbody>
              ${trims.map(([k,d]) => `<tr>
                <td><strong>${k}</strong></td>
                <td class="r">${fmt(d.rep)} EUR</td>
                <td class="r">${fmt(d.sop)} EUR</td>
                <td class="r"><strong>${fmt(d.rep-d.sop)} EUR</strong></td>
              </tr>`).join('')}
              <tr class="total-row">
                <td>Total</td>
                <td class="r">${fmt(ivaRep)} EUR</td>
                <td class="r">${fmt(ivaSop)} EUR</td>
                <td class="r">${fmt(ivaLiq)} EUR</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-head">💡 Observaciones inteligentes</div>
        <div class="card-body">
          ${crec >= 0
            ? `<div class="alert success"><span class="ai">↗</span><div><strong>Tendencia positiva.</strong> Segunda mitad ${fmt(segundaM)} EUR vs primera ${fmt(primeraM)} EUR. Crecimiento +${fmt(crec,1)} %.</div></div>`
            : `<div class="alert warning"><span class="ai">↘</span><div><strong>Tendencia a la baja.</strong> Segunda mitad ${fmt(segundaM)} EUR vs primera ${fmt(primeraM)} EUR del periodo.</div></div>`}
          ${topPct > 40
            ? `<div class="alert warning"><span class="ai">⚠</span><div><strong>Concentración alta.</strong> ${topC[0][0]} representa el ${fmt(topPct,1)} % de la facturación. Conviene diversificar.</div></div>`
            : `<div class="alert"><span class="ai">✓</span><div><strong>Cartera saludable.</strong> ${topC[0]?.[0]} representa el ${fmt(topPct,1)} %. Buena diversificación.</div></div>`}
          <div class="alert"><span class="ai">📅</span><div><strong>Mejor mes:</strong> ${fmtMes(mejorMes)} con ${fmt(mMap[mejorMes].i)} EUR · <strong>Peor mes:</strong> ${fmtMes(peorMes)} con ${fmt(mMap[peorMes].i)} EUR.</div></div>
          <div class="alert"><span class="ai">🧾</span><div><strong>IVA total a liquidar:</strong> ${fmt(ivaLiq)} EUR en ${trims.length} trimestre${trims.length!==1?'s':''}.</div></div>
        </div>
      </div>
    </div>

    <div class="section-label">Detalle de facturas</div>
    <div class="card">
      <div class="detalle-wrap">
        <table class="detalle-table">
          <thead>
            <tr>
              <th>Tipo</th><th>Fecha</th><th>Nº</th><th>Contraparte</th>
              <th>Concepto</th><th class="r">Base</th><th class="r">IVA</th><th class="r">Total</th>
            </tr>
          </thead>
          <tbody>
            ${[...rows].sort((a,b)=>a.fecha<b.fecha?1:-1).map(r => {
              const cp = r.tipo==='ingreso' ? r.receptor_nombre : r.emisor_nombre;
              return `<tr>
                <td><span class="badge ${r.tipo}">${r.tipo==='ingreso'?'Ingreso':'Gasto'}</span></td>
                <td style="white-space:nowrap;color:var(--text-sec);font-size:12px">${r.fecha}</td>
                <td style="font-weight:700;white-space:nowrap;font-size:12px">${r.id}</td>
                <td style="font-size:12px;color:var(--text-sec)">${cp}</td>
                <td class="concepto-cell" title="${r.concepto}">${r.concepto}</td>
                <td class="r">${fmt(num(r.base))}</td>
                <td class="r" style="color:var(--text-gray)">${fmt(num(r.iva_monto))}</td>
                <td class="r"><strong>${fmt(num(r.total))}</strong></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div class="footer">
      Powered by <a href="https://excelentia.com.mx" target="_blank">ExcelentIA</a> ·
      Datos sincronizados desde Google Sheets ·
      Actualizado ${ahora}
    </div>
  `;
}

cargarDatos();
</script>
</body>
</html>
