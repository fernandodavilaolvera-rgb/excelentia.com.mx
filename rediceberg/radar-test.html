<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Radar Test — Eureka</title>
<link href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --bg:    #080c08;
  --card:  #0f150f;
  --border:#1c2e1c;
  --green: #aaff00;
  --green2:#ccff44;
  --cyan:  #00ffee;
  --yellow:#ffee00;
  --gdim:  rgba(170,255,0,0.12);
  --text:  #e8f5e8;
  --radius:16px;
  --font:  'Kodchasan', sans-serif;
}

html, body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100%;
  overflow-x: hidden;
}
body::before {
  content:''; position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(170,255,0,0.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(170,255,0,0.022) 1px, transparent 1px);
  background-size: 36px 36px;
  pointer-events:none; z-index:0;
}

.app {
  position:relative; z-index:1;
  max-width:480px; margin:0 auto;
  min-height:100vh;
  display:flex; flex-direction:column;
}

/* ══ SCREENS ══ */
.screen { display:none; flex-direction:column; flex:1; }
.screen.active { display:flex; animation:fadeUp .25s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* ══ ANIMACIONES ══ */
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
.sweep-hdr { transform-origin:26px 26px; animation:spin 3s linear infinite; }
.sweep-big { transform-origin:80px 80px; animation:spin 3s linear infinite; }

/* ══ BOTÓN PRIMARY ══ */
.btn-primary {
  background: linear-gradient(135deg,#aaff00,#ccff44);
  color:#050a05;
  border:none; border-radius:var(--radius);
  padding:17px 24px;
  font-family:var(--font); font-size:16px; font-weight:700;
  letter-spacing:2px; text-transform:uppercase;
  cursor:pointer; width:100%;
  transition:all .2s;
  box-shadow:0 0 36px rgba(170,255,0,.45),0 4px 16px rgba(170,255,0,.25);
  -webkit-appearance:none;
}
.btn-primary:active { transform:scale(.97); }
.btn-primary:disabled {
  opacity:.3; cursor:not-allowed; transform:none;
  background:var(--green); box-shadow:none;
}

/* ══ HEADER QUIZ / RESULTADO ══ */
.quiz-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.quiz-logo-box {
  width:84px; height:62px; flex-shrink:0;
  display:flex; align-items:center;
}
.quiz-logo-box img { height:62px; width:auto; object-fit:contain; max-width:84px; }
.quiz-title {
  flex:1; text-align:center;
  font-size:22px; font-weight:700;
  color:var(--green); letter-spacing:3px;
  text-transform:uppercase; line-height:1;
}
.quiz-radar-icon { width:52px; height:52px; flex-shrink:0; }

/* ══════════════════════════════
   PANTALLA 1 — INTRO
   Un solo bloque, todo junto, sin space-between
══════════════════════════════ */
#s-intro {
  min-height: 100vh;
  min-height: 100dvh;
  justify-content: center;   /* centra el bloque único verticalmente */
  align-items: center;
  padding: 20px 22px;
}

.intro-inner {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;                 /* espaciado único entre todos los elementos */
}

.intro-logo-box {
  height: 100px;
  display: flex; align-items: center; justify-content: center;
}
.intro-logo-box img { height: 100px; width: auto; object-fit: contain; }

.intro-radar-title {
  font-size: 52px; font-weight: 700;
  color: var(--green); letter-spacing: 4px;
  text-transform: uppercase; line-height: 1.05;
  text-align: center;
  text-shadow: 0 0 40px rgba(170,255,0,.55);
}

.intro-label {
  font-size: 13px; color: var(--green2);
  letter-spacing: 1.5px; text-transform: uppercase;
  font-weight: 700; text-align: center;
  margin-bottom: -4px;       /* acerca el label al input */
}

.intro-input {
  background: rgba(255,255,255,0.07);
  border: 1.5px solid rgba(170,255,0,0.4);
  border-radius: var(--radius);
  padding: 14px 18px;
  font-family: var(--font); font-size: 16px; color: var(--text);
  outline: none; width: 100%; text-align: center;
  -webkit-appearance: none;
  transition: border-color .2s, box-shadow .2s;
}
.intro-input:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(170,255,0,.15);
}
.intro-input::placeholder { color: var(--cyan); opacity: .5; }

.intro-radar-svg { flex-shrink: 0; }

.intro-tagline {
  font-size: 14px; color: var(--cyan);
  text-align: center; line-height: 1.5;
  font-weight: 600; letter-spacing: .5px;
  margin-top: -4px;          /* acerca el tagline al radar */
}

/* iPhone SE y pantallas < 670px de alto */
@media (max-height: 670px) {
  .intro-inner { gap: 10px; }
  .intro-logo-box { height: 80px; }
  .intro-logo-box img { height: 80px; }
  .intro-radar-title { font-size: 42px; }
  .intro-radar-svg { width: 110px !important; height: 110px !important; }
  #s-intro { padding: 12px 22px; }
}

/* ══════════════════════════════
   PANTALLAS 2–11 — QUIZ
══════════════════════════════ */
#s-quiz { overflow-y:auto; }

.progress-w { padding:14px 20px 0; flex-shrink:0; }
.pmeta {
  display:flex; justify-content:space-between;
  font-size:12px; color:var(--green2);
  margin-bottom:8px; letter-spacing:.5px; font-weight:600;
}
.ptrack { height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
.pfill {
  height:100%; background:var(--green); border-radius:2px;
  transition:width .5s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 10px var(--green);
}

.question-area {
  display:flex; flex-direction:column;
  padding:18px 20px 12px; gap:12px;
  flex-shrink:0;
}
.q-num { font-size:11px; font-weight:700; color:var(--cyan); letter-spacing:3px; text-transform:uppercase; }
.q-text { font-size:20px; font-weight:700; line-height:1.35; color:var(--text); }

.opts { display:flex; flex-direction:column; gap:10px; padding:0 20px; flex-shrink:0; }
.opt {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px 15px; display:flex; align-items:center; gap:12px;
  cursor:pointer; font-family:var(--font); font-size:14px; color:var(--text);
  text-align:left; transition:all .2s;
  -webkit-appearance:none; width:100%;
}
.opt.sel { border-color:var(--green); background:rgba(170,255,0,.07); box-shadow:0 0 20px rgba(170,255,0,.09); }
.opt-l {
  width:30px; height:30px; border-radius:50%;
  border:1px solid rgba(255,238,0,.4);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:var(--yellow);
  flex-shrink:0; transition:all .2s;
}
.opt.sel .opt-l { background:var(--green); color:#050a05; border-color:var(--green); }
.opt-t { flex:1; line-height:1.4; color:var(--text); }

/* Botón pegado justo abajo de las opciones */
.btn-quiz-wrap { padding:14px 20px 28px; flex-shrink:0; }

/* ══════════════════════════════
   PANTALLA 12 — RESULTADO
══════════════════════════════ */
#s-result { overflow-y:auto; }

.result-body {
  display:flex; flex-direction:column; align-items:center;
  padding:24px 22px 40px; gap:14px;
}
.res-logo-box {
  height:120px;
  display:flex; align-items:center; justify-content:center;
}
.res-logo-box img { height:120px; width:auto; object-fit:contain; }
.res-radar-title {
  font-size:40px; font-weight:700;
  color:var(--green); letter-spacing:4px;
  text-transform:uppercase; line-height:1.05;
  text-align:center;
  text-shadow:0 0 30px rgba(170,255,0,.5);
}
.res-user {
  font-size:15px; color:var(--cyan);
  letter-spacing:2px; text-transform:uppercase;
  font-weight:600; text-align:center;
}
.ring-wrap { position:relative; width:188px; height:188px; flex-shrink:0; }
.ring-wrap svg { transform:rotate(-90deg); }
.ring-label {
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
}
.ring-score { font-size:54px; font-weight:700; color:var(--green); line-height:1; }
.ring-max { font-size:13px; color:var(--green2); letter-spacing:1px; margin-top:2px; font-weight:600; }
.ring-arc { transition:stroke-dashoffset 1.3s cubic-bezier(.4,0,.2,1); }
.res-profile { text-align:center; }
.res-pname { font-size:24px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:10px; }
.res-pdesc { font-size:17px; color:var(--cyan); line-height:1.7; opacity:.9; }
.save-msg { font-size:12px; color:rgba(170,255,0,.6); text-align:center; min-height:14px; }
</style>
</head>
<body>
<div class="app">

  <!-- ══ PANTALLA 1 — INTRO ══ -->
  <div class="screen active" id="s-intro">
    <div class="intro-inner">

      <!-- Logo -->
      <div class="intro-logo-box">
        <img src="https://raw.githubusercontent.com/fernandodavilaolvera-rgb/excelentia.com.mx/main/assets/Eureka_Logo.png" alt="EÜREKa!">
      </div>

      <!-- Título -->
      <div class="intro-radar-title">RADAR<br>TEST</div>

      <!-- Label + Input + Botón — todo junto -->
      <p class="intro-label">Escribe tu nombre</p>
      <input class="intro-input" type="text" id="nombre" placeholder="Tu nombre aquí"
        autocomplete="off" autocorrect="off" autocapitalize="words">
      <button class="btn-primary" onclick="iniciar()">COMENZAR</button>

      <!-- Radar animado -->
      <svg class="intro-radar-svg" viewBox="0 0 160 160" width="130" height="130">
        <defs>
          <radialGradient id="rglow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#aaff00" stop-opacity=".18"/>
            <stop offset="100%" stop-color="#aaff00" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="80" cy="80" r="74" stroke="#aaff00" stroke-width="1" opacity=".2" fill="none"/>
        <circle cx="80" cy="80" r="54" stroke="#aaff00" stroke-width="1" opacity=".3" fill="none"/>
        <circle cx="80" cy="80" r="34" stroke="#aaff00" stroke-width="1" opacity=".45" fill="none"/>
        <circle cx="80" cy="80" r="14" stroke="#aaff00" stroke-width="1.5" opacity=".7" fill="none"/>
        <line x1="80" y1="6"  x2="80" y2="154" stroke="#aaff00" stroke-width=".5" opacity=".15"/>
        <line x1="6"  y1="80" x2="154" y2="80" stroke="#aaff00" stroke-width=".5" opacity=".15"/>
        <circle cx="80" cy="80" r="8" fill="#aaff00" opacity=".9" style="filter:drop-shadow(0 0 8px #aaff00)"/>
        <circle cx="80" cy="80" r="22" fill="url(#rglow)"/>
        <g class="sweep-big">
          <line x1="80" y1="80" x2="80" y2="6" stroke="#aaff00" stroke-width="2" stroke-linecap="round" opacity=".9"/>
          <line x1="80" y1="80" x2="138" y2="34" stroke="#aaff00" stroke-width="1" opacity=".4"/>
        </g>
        <circle cx="128" cy="36" r="3.5" fill="#aaff00" opacity=".9" style="filter:drop-shadow(0 0 5px #aaff00)"/>
        <circle cx="108" cy="22" r="2.5" fill="#00ffee" opacity=".7"/>
        <circle cx="52"  cy="118" r="2" fill="#aaff00" opacity=".5"/>
      </svg>

      <!-- Tagline -->
      <p class="intro-tagline">¿Qué tan conectado estás con lo que viene?</p>

    </div>
  </div>

  <!-- ══ PANTALLAS 2–11 — QUIZ ══ -->
  <div class="screen" id="s-quiz">
    <div class="quiz-header">
      <div class="quiz-logo-box">
        <img src="https://raw.githubusercontent.com/fernandodavilaolvera-rgb/excelentia.com.mx/main/assets/Eureka_Logo.png" alt="EÜREKa!">
      </div>
      <div class="quiz-title">RADAR TEST</div>
      <svg class="quiz-radar-icon" viewBox="0 0 52 52" fill="none">
        <circle cx="26" cy="26" r="23" stroke="#aaff00" stroke-width="1" opacity=".25"/>
        <circle cx="26" cy="26" r="16" stroke="#aaff00" stroke-width="1" opacity=".35"/>
        <circle cx="26" cy="26" r="9"  stroke="#aaff00" stroke-width="1" opacity=".5"/>
        <circle cx="26" cy="26" r="3"  fill="#aaff00"/>
        <line x1="26" y1="3"  x2="26" y2="49" stroke="#aaff00" stroke-width=".5" opacity=".18"/>
        <line x1="3"  y1="26" x2="49" y2="26" stroke="#aaff00" stroke-width=".5" opacity=".18"/>
        <g class="sweep-hdr">
          <line x1="26" y1="26" x2="26" y2="3" stroke="#aaff00" stroke-width="2" stroke-linecap="round"/>
          <line x1="26" y1="26" x2="45" y2="11" stroke="#aaff00" stroke-width=".8" opacity=".4"/>
        </g>
        <circle cx="42" cy="12" r="2.5" fill="#aaff00" opacity=".95"/>
        <circle cx="34" cy="7"  r="1.5" fill="#00ffee" opacity=".7"/>
      </svg>
    </div>
    <div class="progress-w">
      <div class="pmeta"><span id="ptexto">Pregunta 1 de 10</span></div>
      <div class="ptrack"><div class="pfill" id="pfill" style="width:10%"></div></div>
    </div>
    <div class="question-area">
      <div class="q-num" id="qnum">Pregunta 01</div>
      <div class="q-text" id="qtext"></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="btn-quiz-wrap">
      <button class="btn-primary" id="btnsig" onclick="siguiente()" disabled>SIGUIENTE →</button>
    </div>
  </div>

  <!-- ══ PANTALLA 12 — RESULTADO ══ -->
  <div class="screen" id="s-result">
    <div class="quiz-header">
      <div class="quiz-logo-box">
        <img src="https://raw.githubusercontent.com/fernandodavilaolvera-rgb/excelentia.com.mx/main/assets/Eureka_Logo.png" alt="EÜREKa!">
      </div>
      <div class="quiz-title">RADAR TEST</div>
      <svg class="quiz-radar-icon" viewBox="0 0 52 52" fill="none">
        <circle cx="26" cy="26" r="23" stroke="#aaff00" stroke-width="1" opacity=".25"/>
        <circle cx="26" cy="26" r="16" stroke="#aaff00" stroke-width="1" opacity=".35"/>
        <circle cx="26" cy="26" r="9"  stroke="#aaff00" stroke-width="1" opacity=".5"/>
        <circle cx="26" cy="26" r="3"  fill="#aaff00"/>
        <line x1="26" y1="3"  x2="26" y2="49" stroke="#aaff00" stroke-width=".5" opacity=".18"/>
        <line x1="3"  y1="26" x2="49" y2="26" stroke="#aaff00" stroke-width=".5" opacity=".18"/>
        <g class="sweep-hdr">
          <line x1="26" y1="26" x2="26" y2="3" stroke="#aaff00" stroke-width="2" stroke-linecap="round"/>
          <line x1="26" y1="26" x2="45" y2="11" stroke="#aaff00" stroke-width=".8" opacity=".4"/>
        </g>
        <circle cx="42" cy="12" r="2.5" fill="#aaff00" opacity=".95"/>
        <circle cx="34" cy="7"  r="1.5" fill="#00ffee" opacity=".7"/>
      </svg>
    </div>
    <div class="result-body">
      <div class="res-logo-box">
        <img src="https://raw.githubusercontent.com/fernandodavilaolvera-rgb/excelentia.com.mx/main/assets/Eureka_Logo.png" alt="EÜREKa!">
      </div>
      <div class="res-radar-title">RADAR TEST</div>
      <p class="res-user" id="resusr">—</p>
      <div class="ring-wrap">
        <svg width="188" height="188" viewBox="0 0 188 188">
          <circle cx="94" cy="94" r="80" stroke="#1c2e1c" stroke-width="14" fill="none"/>
          <circle cx="94" cy="94" r="80"
            stroke="#aaff00" stroke-width="14" fill="none"
            stroke-dasharray="502" stroke-dashoffset="502"
            stroke-linecap="round" id="rarc" class="ring-arc"
            style="filter:drop-shadow(0 0 10px #aaff00)"/>
        </svg>
        <div class="ring-label">
          <div class="ring-score" id="rscore">0</div>
          <div class="ring-max">DE 40 PTS</div>
        </div>
      </div>
      <div class="res-profile">
        <div class="res-pname" id="rpname">—</div>
        <div class="res-pdesc" id="rpdesc">—</div>
      </div>
      <p class="save-msg" id="savemsg"></p>
    </div>
  </div>

</div>
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyMPJzEHiXv4P1IjueKKm2IKUT-iB_2B_ysrzSZV7-AzQDJWClCDwIFyAVtN_Yjtoy_nQ/exec';

const PREGUNTAS = [
  { texto:'¿Qué es "corecore"?', opciones:[{t:'Un estilo musical',p:0},{t:'Una tendencia que satiriza las tendencias',p:2},{t:'Un tipo de tenis',p:0},{t:'Un videojuego',p:0}] },
  { texto:'¿Dónde nacen hoy muchas tendencias?', opciones:[{t:'En reportes de consultoras globales',p:2},{t:'En laboratorios de innovación de grandes corporativos',p:1},{t:'En comunidades digitales y creadores de contenido',p:4},{t:'En lanzamientos oficiales de grandes marcas',p:3}] },
  { texto:'¿Cómo te enteras normalmente de algo nuevo?', opciones:[{t:'Noticias',p:2},{t:'Redes sociales',p:4},{t:'Amigos / colegas',p:3},{t:'No sabría decir',p:1}] },
  { texto:'Cuando ves un producto nuevo…', opciones:[{t:'Lo observo',p:2},{t:'Lo ignoro',p:1},{t:'Lo compro / pruebo',p:4},{t:'Lo investigo',p:3}] },
  { texto:'¿Cada cuánto pruebas algo nuevo (producto, app, experiencia)?', opciones:[{t:'Siempre estoy probando',p:4},{t:'Casi nunca',p:1},{t:'De vez en cuando',p:2},{t:'Frecuentemente',p:3}] },
  { texto:'¿Has comprado algo solo porque lo viste en redes?', opciones:[{t:'Varias veces',p:3},{t:'Nunca',p:1},{t:'Tal vez una vez',p:2},{t:'Sí, seguido',p:4}] },
  { texto:'Cuando viajas…', opciones:[{t:'Voy a lo seguro',p:1},{t:'Busco cosas locales',p:3},{t:'Salgo activamente a explorar tendencias',p:4},{t:'Pruebo algo diferente',p:2}] },
  { texto:'¿Qué haces cuando ves algo interesante fuera de tu categoría?', opciones:[{t:'Lo veo como algo curioso sin aplicación',p:1},{t:'Lo guardo como referencia',p:2},{t:'Pienso si podría adaptarse',p:3},{t:'Busco activamente cómo llevarlo a mi negocio',p:4}] },
  { texto:'Cuando escuchas una idea nueva…', opciones:[{t:'La evalúo',p:3},{t:'Busco fallas',p:1},{t:'Pienso cómo hacerla mejor',p:4},{t:'La cuestiono',p:2}] },
  { texto:'¿Cuál describe mejor tu estilo?', opciones:[{t:'Prefiero lo probado',p:1},{t:'Me adapto',p:2},{t:'Me gusta explorar',p:3},{t:'Busco constantemente lo nuevo',p:4}] },
];

const PERFILES = [
  { nombre:'TREND ROOKIE',       min:10, max:18, color:'#64c8ff', desc:'Te mantienes informado, pero rara vez exploras activamente. Tu próximo paso: cuestionar lo que ya conoces.' },
  { nombre:'CULTURE SCANNER',    min:19, max:28, color:'#cc66ff', desc:'Detectas cambios, pero aún no siempre los conectas. Tienes el radar encendido — ahora úsalo con intención.' },
  { nombre:'OPPORTUNITY SEEKER', min:29, max:34, color:'#ffcc00', desc:'Ya ves oportunidades donde otros ven ruido. Exploras, conectas y detectas el potencial antes que la mayoría.' },
  { nombre:'EUREKA MINDSET',     min:35, max:40, color:'#aaff00', desc:'Exploras, conectas y transformas señales en oportunidades reales. Eres de los que construyen el futuro.' },
];

const LETRAS = ['A','B','C','D'];
let qActual=0, respuestas=[], pregsOrden=[], nombre='';

function mezclar(a){ return [...a].sort(()=>Math.random()-.5); }

function mostrar(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el = document.getElementById(id);
  el.classList.add('active');
  window.scrollTo(0,0);
  el.scrollTop = 0;
}

function iniciar(){
  nombre = document.getElementById('nombre').value.trim() || 'Participante';
  qActual = 0;
  respuestas = new Array(10).fill(null);
  pregsOrden = PREGUNTAS.map(p=>({...p, opciones:mezclar(p.opciones)}));
  mostrar('s-quiz');
  render();
}

function calcPts(){
  let s=0;
  for(let i=0;i<10;i++) if(respuestas[i]!==null) s += pregsOrden[i].opciones[respuestas[i]].p;
  return s;
}

function render(){
  const p = pregsOrden[qActual];
  document.getElementById('qnum').textContent   = `Pregunta ${String(qActual+1).padStart(2,'0')}`;
  document.getElementById('qtext').textContent  = p.texto;
  document.getElementById('ptexto').textContent = `Pregunta ${qActual+1} de 10`;
  document.getElementById('pfill').style.width  = `${((qActual+1)/10)*100}%`;
  document.getElementById('s-quiz').scrollTop   = 0;

  const c = document.getElementById('opts');
  c.innerHTML = '';
  p.opciones.forEach((op,i)=>{
    const b = document.createElement('button');
    b.className = 'opt'+(respuestas[qActual]===i?' sel':'');
    b.innerHTML = `<span class="opt-l">${LETRAS[i]}</span><span class="opt-t">${op.t}</span>`;
    b.onclick = ()=>{ respuestas[qActual]=i; render(); };
    c.appendChild(b);
  });

  const bs = document.getElementById('btnsig');
  bs.disabled = respuestas[qActual]===null;
  bs.textContent = qActual===9 ? 'VER MI RESULTADO →' : 'SIGUIENTE →';
}

function siguiente(){
  if(respuestas[qActual]===null) return;
  if(qActual<9){ qActual++; render(); }
  else mostrarResultado();
}

function mostrarResultado(){
  const total  = calcPts();
  const perfil = PERFILES.find(p=>total>=p.min&&total<=p.max) || PERFILES[3];

  document.getElementById('resusr').textContent = `✦ ${nombre.toUpperCase()} ✦`;
  document.getElementById('rscore').textContent = total;
  document.getElementById('rscore').style.color = perfil.color;
  document.getElementById('rpname').textContent = perfil.nombre;
  document.getElementById('rpname').style.color = perfil.color;
  document.getElementById('rpdesc').textContent = perfil.desc;

  mostrar('s-result');

  const arc = document.getElementById('rarc');
  arc.style.stroke = perfil.color;
  arc.style.filter = `drop-shadow(0 0 12px ${perfil.color})`;
  setTimeout(()=>{
    const pct = Math.max(0,(total-10)/30);
    arc.style.strokeDashoffset = 502-(pct*502);
  },150);

  guardar(nombre, total, perfil.nombre);
}

async function guardar(nombre,puntos,perfil){
  try{
    const d = JSON.parse(localStorage.getItem('eureka_radar')||'{}');
    d[perfil] = (d[perfil]||0)+1;
    localStorage.setItem('eureka_radar', JSON.stringify(d));
  }catch(e){}
  try{
    const url = `${APPS_SCRIPT_URL}?accion=radar&nombre=${encodeURIComponent(nombre)}&puntos=${puntos}&perfil=${encodeURIComponent(perfil)}`;
    await fetch(url,{method:'GET',mode:'no-cors'});
  }catch(e){}
}
</script>
