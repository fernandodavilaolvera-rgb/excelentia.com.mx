<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ventana al Mundo</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --mg:       #FF2D9B;
    --mg-dark:  #d4007a;
    --mg-light: #ffe6f5;
    --ns:       #C8B89A;
    --ns-dark:  #8a7460;
    --ns-light: #f5f0e8;
    --ii:       #7C3AED;
    --ii-dark:  #6D28D9;
    --ii-light: #f0ebff;
    --hb:       #87CEEB;
    --hb-dark:  #3a9ec4;
    --hb-light: #e8f6fd;

    --black:      #0a0a0f;
    --gray-bg:    #f0f2f5;
    --gray-light: #e5e7eb;
    --text-dark:  #111827;
    --text-mid:   #374151;
    --text-soft:  #6B7280;
    --white:      #ffffff;
    --header-h:   60px;
    --shadow:     0 4px 24px rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    font-family: 'Manrope', sans-serif;
    background: var(--gray-bg);
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: var(--black);
    height: var(--header-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    border-bottom: 3px solid transparent;
    transition: border-color 0.4s ease;
  }
  .header-logo img {
    height: 34px; width: auto; display: block;
  }
  .header-logo-fallback {
    display: none;
    font-family: 'Manrope', sans-serif;
    font-weight: 900; font-size: 15px;
    color: #fff; letter-spacing: 0.5px; text-transform: uppercase;
  }
  .header-back {
    display: none;
    align-items: center; gap: 5px;
    background: rgba(255,255,255,0.13);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 20px;
    color: var(--white);
    font-family: 'Manrope', sans-serif;
    font-size: 11px; font-weight: 700;
    cursor: pointer; padding: 6px 12px 6px 9px;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .header-back:active { background: rgba(255,255,255,0.25); }
  .header-back svg { width: 14px; height: 14px; flex-shrink: 0; }
  .header-back.visible { display: flex; }

  /* SCREENS */
  .screen { display: none; padding-top: var(--header-h); min-height: 100vh; }
  .screen.active { display: block; }

  /* PANTALLA NO-TERRITORIO */
  #screen-noterritorio {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 80px 24px; gap: 14px;
  }
  #screen-noterritorio .big-icon { font-size: 52px; }
  #screen-noterritorio h2 { font-size: 20px; font-weight: 800; color: var(--text-dark); }
  #screen-noterritorio p { font-size: 14px; color: var(--text-soft); line-height: 1.6; max-width: 280px; }

  /* SCREEN 2 — TERRITORIO */
  .territorio-hero-img { width: 100%; display: block; object-fit: cover; max-height: 200px; }
  @media (min-width: 600px) { .territorio-hero-img { max-height: 280px; } }

  .cat-section { margin-bottom: 6px; }
  .cat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 10px;
  }
  .cat-title-wrap { display: flex; align-items: center; gap: 10px; }
  .cat-icon-circle {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .cat-name {
    font-weight: 800; font-size: 15px;
    text-transform: uppercase; letter-spacing: 0.8px;
  }
  .cat-count { font-size: 11px; color: var(--text-soft); font-weight: 600; }

  .scroll-hint {
    text-align: right; padding: 0 16px 4px;
    font-size: 10px; color: var(--text-soft);
  }

  .carousel-wrap { padding: 0 16px; }
  .carousel {
    display: flex; gap: 10px;
    overflow-x: auto; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
    padding-bottom: 10px; padding-right: 32px;
  }
  .carousel::-webkit-scrollbar { display: none; }

  .product-card {
    scroll-snap-align: start; flex-shrink: 0; width: 148px;
    background: var(--white); border-radius: 14px; overflow: hidden;
    cursor: pointer; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    transition: transform 0.15s;
  }
  .product-card:active { transform: scale(0.97); }

  .pc-img-wrap { width: 100%; height: 138px; background: #f8f9fa; overflow: hidden; }
  .pc-img-wrap img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
  .pc-body { padding: 9px 10px 12px; }
  .pc-brand { font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 2px; }
  .pc-name {
    font-size: 11px; color: var(--text-mid); line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pc-claim {
    margin-top: 5px; display: inline-block;
    font-size: 9px; font-weight: 700; padding: 2px 6px;
    border-radius: 20px; color: white;
    text-transform: uppercase; letter-spacing: 0.4px;
  }

  .carousel-dots { display: flex; justify-content: center; gap: 5px; padding: 6px 0 18px; }
  .cdot { width: 6px; height: 4px; border-radius: 3px; background: var(--gray-light); transition: all 0.2s; }
  .cdot.active { width: 18px; }

  /* SCREEN 3 — PRODUCTO */
  #screen-producto { background: var(--gray-bg); }

  .producto-img-section {
    background: var(--white); padding: 24px 20px 18px;
    display: flex; justify-content: center; align-items: center; min-height: 230px;
  }
  .producto-img-section img { max-width: 210px; max-height: 210px; width: 100%; object-fit: contain; }

  .producto-body { padding: 16px 16px 100px; }

  .prod-cat-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 20px; color: white;
    font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .prod-brand { font-weight: 900; font-size: 26px; text-transform: uppercase; line-height: 1; margin-bottom: 4px; }
  .prod-name { font-size: 15px; color: var(--text-mid); font-weight: 500; line-height: 1.3; margin-bottom: 18px; }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .info-card { background: var(--white); border-radius: 12px; padding: 11px 13px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
  .info-card.full { grid-column: 1 / -1; }
  .info-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 4px; }
  .info-value { font-size: 13px; color: var(--text-dark); font-weight: 500; line-height: 1.4; }

  .racional-card {
    background: var(--white); border-radius: 12px; padding: 13px 15px;
    margin-bottom: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); border-left: 4px solid;
  }
  .racional-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 5px; }
  .racional-text { font-size: 13px; color: var(--text-mid); line-height: 1.5; }

  .oportunidad-card {
    background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
    border-radius: 12px; padding: 13px 15px; margin-bottom: 10px; border: 1px solid #BFDBFE;
  }
  .oportunidad-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: #1D4ED8; margin-bottom: 5px; }
  .oportunidad-text { font-size: 12px; color: #1e3a5f; line-height: 1.5; }

  /* COLORES */
  .color-mg { color: var(--mg); }
  .color-ns { color: var(--ns-dark); }
  .color-ii { color: var(--ii); }
  .color-hb { color: var(--hb-dark); }

  .bg-mg { background-color: var(--mg); }
  .bg-ns { background-color: var(--ns-dark); }
  .bg-ii { background-color: var(--ii); }
  .bg-hb { background-color: var(--hb-dark); }

  .border-mg { border-color: var(--mg); }
  .border-ns { border-color: var(--ns-dark); }
  .border-ii { border-color: var(--ii); }
  .border-hb { border-color: var(--hb-dark); }

  .label-mg { color: var(--mg); }
  .label-ns { color: var(--ns-dark); }
  .label-ii { color: var(--ii); }
  .label-hb { color: var(--hb-dark); }

  .cdot-mg.active { background: var(--mg); }
  .cdot-ns.active { background: var(--ns-dark); }
  .cdot-ii.active { background: var(--ii); }
  .cdot-hb.active { background: var(--hb-dark); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .screen.active > * { animation: fadeUp 0.28s ease both; }

  @media (max-width: 600px) {
    .info-grid { grid-template-columns: 1fr; }
    .info-card.full { grid-column: 1; }
    .prod-brand { font-size: 22px; }
  }
</style>
</head>

let currentTerritory = null;
let navHistory = [];

function init() {
  const params = new URLSearchParams(window.location.search);
  const t = params.get('t');
  if (t && TERRITORIES[t]) {
    openTerritorio(t);
  }
  // Si no hay parámetro, queda la pantalla de instrucción activa
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0, 0);
}

function openTerritorio(key) {
  currentTerritory = key;
  const t = TERRITORIES[key];

  // Color del borde del header
  document.getElementById('mainHeader').style.borderBottomColor = t.color;

  // Hero
  const hero = document.getElementById('territorio-hero-img');
  hero.src = t.hero;
  hero.alt = t.name;

  // Ocultar botón back (solo aparece en producto)
  document.getElementById('btnBack').classList.remove('visible');

  // Productos
  const fbProds    = PRODUCTS.filter(p => p.territory === key && p.tab === 'fb');
  const otherProds = PRODUCTS.filter(p => p.territory === key && p.tab === 'other');

  document.getElementById('territorio-content').innerHTML =
    buildSection('🍽️', 'ALIMENTOS Y BEBIDAS', fbProds, key) +
    buildSection('✨', 'OTRAS INDUSTRIAS', otherProds, key);

  showScreen('territorio');
}

function buildSection(icon, label, products, key) {
  if (!products.length) return '';
  const t = TERRITORIES[key];
  const cls = t.colorClass;
  const sid = label.replace(/\s/g,'-');

  const dots  = products.map((_,i) => `<div class="cdot cdot-${cls}${i===0?' active':''}"></div>`).join('');
  const cards = products.map(p => `
    <div class="product-card" onclick="openProducto(${p.id})">
      <div class="pc-img-wrap">
        <img src="${imgUrl(p.file)}" alt="${p.brand}" loading="lazy" onerror="this.style.opacity='.2'">
      </div>
      <div class="pc-body">
        <div class="pc-brand color-${cls}">${p.brand}</div>
        <div class="pc-name">${p.name}</div>
        ${p.claim ? `<span class="pc-claim bg-${cls}">${p.claim}</span>` : ''}
      </div>
    </div>`).join('');

  return `
    <div class="cat-section">
      <div class="cat-header">
        <div class="cat-title-wrap">
          <div class="cat-icon-circle" style="background:${t.color}22">${icon}</div>
          <span class="cat-name color-${cls}">${label}</span>
        </div>
        <span class="cat-count">${products.length} productos</span>
      </div>
      <div class="scroll-hint">desliza →</div>
      <div class="carousel-wrap">
        <div class="carousel" id="car-${sid}">${cards}</div>
      </div>
      <div class="carousel-dots">${dots}</div>
    </div>`;
}

function openProducto(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  navHistory.push('territorio');

  const t   = TERRITORIES[p.territory];
  const cls = t.colorClass;

  document.getElementById('btnBack').classList.add('visible');
  document.getElementById('backLabel').textContent = t.name;

  document.getElementById('prod-img').src = imgUrl(p.file);
  document.getElementById('prod-img').alt = `${p.brand} ${p.name}`;

  const isFb = p.tab === 'fb';
  let html = `
    <div class="prod-cat-badge bg-${cls}">${isFb ? '🍽️ Alimentos y Bebidas' : '✨ Otras Industrias'}</div>
    <div class="prod-brand color-${cls}">${p.brand}</div>
    <div class="prod-name">${p.name}</div>
    <div class="info-grid">
      <div class="info-card">
        <div class="info-label label-${cls}">Categoría</div>
        <div class="info-value">${p.cat}</div>
      </div>
      <div class="info-card">
        <div class="info-label label-${cls}">Ingrediente / Base</div>
        <div class="info-value">${p.ingredient || '—'}</div>
      </div>
      <div class="info-card full">
        <div class="info-label label-${cls}">Beneficio Funcional</div>
        <div class="info-value">${p.benefit || '—'}</div>
      </div>
      ${p.claim ? `<div class="info-card full"><div class="info-label label-${cls}">Claim Principal</div><div class="info-value" style="font-weight:700;font-size:15px;">${p.claim}</div></div>` : ''}
    </div>
    <div class="racional-card border-${cls}">
      <div class="racional-label label-${cls}">⭐ ¿Por qué está en ${t.name}?</div>
      <div class="racional-text">${p.racional}</div>
    </div>`;

  if (p.oportunidad) {
    html += `
    <div class="oportunidad-card">
      <div class="oportunidad-label">💡 Oportunidad en Food & Beverage</div>
      <div class="oportunidad-text">${p.oportunidad}</div>
    </div>`;
  }

  document.getElementById('prod-body').innerHTML = html;
  showScreen('producto');
}

function goBack() {
  const prev = navHistory.pop();
  if (prev === 'territorio') {
    document.getElementById('btnBack').classList.remove('visible');
    showScreen('territorio');
  }
}

// Swipe iOS-style
let txStart = 0;
document.addEventListener('touchstart', e => { txStart = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend',   e => {
  if (e.changedTouches[0].clientX - txStart > 80 && navHistory.length) goBack();
}, { passive: true });

(function() {
  const t = new URLSearchParams(window.location.search).get('t');
  if (t && ['mg','ns','ii','hb'].includes(t)) {
    document.addEventListener('DOMContentLoaded', function(){ openTerritorio(t); });
  }
})();
</script>
