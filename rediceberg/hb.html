<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hacking Body — Ventana al Mundo</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --color: #CBE5EC;
    --color-dark: #9BCAD4;
    --color-light: #edf6f9;
    --color-mid: #b5dce6;
    --black: #0a0a0f;
    --gray-bg: #f5f5f7;
    --gray-light: #e5e7eb;
    --text-dark: #111827;
    --text-mid: #374151;
    --text-soft: #6B7280;
    --white: #ffffff;
    --header-h: 64px;
    --radius: 16px;
    --shadow: 0 4px 24px rgba(203,229,236,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    font-family: 'Manrope', sans-serif;
    background-color: #f5f5f7;
    background-image: url('https://raw.githubusercontent.com/fernandodavilaolvera-rgb/excelentia.com.mx/main/rediceberg/img/fondoventanas.png');
    background-repeat: no-repeat;
    background-size: cover;
    background-position: top center;
    background-attachment: fixed;
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: var(--black);
    height: var(--header-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    border-bottom: 2px solid var(--color);
  }
  .header-logo-text {
    display: flex; flex-direction: column; gap: 2px;
    line-height: 1;
  }
  .header-logo-title {
    font-family: 'Manrope', sans-serif;
    font-weight: 900; font-size: 17px;
    color: var(--white); letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .header-logo-sub {
    font-family: 'Manrope', sans-serif;
    font-weight: 600; font-size: 7px;
    color: #00e5ff; letter-spacing: 1.4px;
    text-transform: uppercase;
  }
  .header-back {
    display: none;
    align-items: center; gap: 6px;
    background: none; border: none;
    color: var(--white); font-family: 'Manrope', sans-serif;
    font-size: 13px; font-weight: 600;
    cursor: pointer; padding: 6px 0;
    margin-left: auto;
    white-space: nowrap;
  }
  .header-back svg { width: 16px; height: 16px; flex-shrink: 0; }
  .header-back.visible { display: flex; }

  /* ── SCREENS ── */
  .screen {
    display: none;
    padding-top: var(--header-h);
    min-height: 100vh;
  }
  .screen.active { display: block; }

  /* ════════════════════════════════
     SCREEN 2 — TERRITORIO
  ════════════════════════════════ */

  /* Hero image — tarjeta flotante con esquinas curvas */
  .hero-img-wrap {
    padding: 16px 16px 8px;
  }
  .hero-img-wrap img {
    width: 100%;
    height: auto;
    max-height: 220px;
    object-fit: cover;
    object-position: center top;
    display: block;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(203,229,236,0.18);
  }

  @media (max-width: 600px) {
    .hero-img-wrap img { max-height: 180px; }
  }
  @media (min-width: 601px) {
    .hero-img-wrap { max-width: 700px; margin: 0 auto; }
  }

  /* Category section */
  .cat-section { margin-bottom: 4px; }
  .cat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 10px;
  }
  .cat-title-wrap { display: flex; align-items: center; gap: 10px; }
  .cat-icon-circle {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--color);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
  }
  .cat-name {
    font-weight: 900; font-size: 15px;
    text-transform: uppercase; letter-spacing: 1.5px;
    color: #1a4a5a;
  }
  .cat-ver {
    font-size: 12px; font-weight: 700;
    color: #1a4a5a; text-decoration: none;
    display: flex; align-items: center; gap: 3px;
    white-space: nowrap;
  }
  .cat-ver svg { width: 14px; height: 14px; }

  /* Carousel */
  .carousel-wrap { padding: 0 16px; }
  .carousel {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 6px;
    padding-right: 24px;
  }
  .carousel::-webkit-scrollbar { display: none; }

  .product-card {
    scroll-snap-align: start;
    flex-shrink: 0;
    width: 148px;
    height: 262px;
    background: var(--white);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    transition: transform 0.15s;
    display: flex;
    flex-direction: column;
  }
  .product-card:active { transform: scale(0.97); }

  .pc-img-wrap {
    width: 100%; height: 138px;
    flex-shrink: 0;
    background: #fafafa;
    position: relative; overflow: hidden;
  }
  .pc-img-wrap img {
    width: 100%; height: 100%;
    object-fit: contain;
    padding: 10px;
    transition: opacity 0.3s;
  }
  .pc-body {
    padding: 10px 10px 12px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .pc-brand {
    font-weight: 900; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.8px;
    color: #1a4a5a;
    margin-bottom: 2px;
    flex-shrink: 0;
  }
  .pc-name {
    font-size: 11px; color: var(--text-mid);
    line-height: 1.3; font-weight: 500;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }
  .pc-claim {
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    height: 36px;
    width: 100%;
    font-size: 9px; font-weight: 700;
    padding: 4px 8px;
    border-radius: 20px;
    background: var(--color);
    color: #1a4a5a;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
    line-height: 1.2;
  }

  /* Carousel dots */
  .carousel-dots {
    display: flex; justify-content: center; gap: 5px;
    padding: 8px 0 14px;
  }
  .cdot {
    width: 6px; height: 4px;
    border-radius: 3px;
    background: var(--gray-light);
    transition: all 0.2s;
  }
  .cdot.active { width: 18px; background: var(--color); }

  /* Separador sección */
  .section-divider {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--color-light), transparent);
    margin: 4px 16px 0;
  }

  /* Padding bottom para scroll */
  .screen-territorio-inner { padding-bottom: 40px; }

  @media (min-width: 601px) {
    .screen-territorio-inner { max-width: 700px; margin: 0 auto; }
    .cat-section { max-width: 700px; }
  }

  /* ════════════════════════════════
     SCREEN 3 — PRODUCTO
  ════════════════════════════════ */
  #screen-producto { background: var(--gray-bg); }

  .producto-img-section {
    background: var(--white);
    padding: 24px 20px 20px;
    display: flex; justify-content: center; align-items: center;
    min-height: 240px;
    position: relative;
  }
  .producto-img-section img {
    max-width: 220px; max-height: 220px;
    width: 100%; object-fit: contain;
    border-radius: 12px;
  }
  .prod-tab-badge {
    position: absolute; top: 16px; left: 16px;
    background: var(--color);
    color: #1a4a5a;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    padding: 4px 10px; border-radius: 20px;
  }

  .producto-body { padding: 16px 16px 80px; }

  .prod-brand {
    font-weight: 900; font-size: 28px;
    text-transform: uppercase;
    color: #1a4a5a;
    line-height: 1; margin-bottom: 4px;
    letter-spacing: -0.5px;
  }
  .prod-name {
    font-size: 16px; color: var(--text-mid);
    font-weight: 500; line-height: 1.3;
    margin-bottom: 20px;
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .info-card {
    background: var(--white);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.05);
  }
  .info-card.full { grid-column: 1 / -1; }
  .info-label {
    font-size: 9px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1.2px;
    color: #1a4a5a;
    margin-bottom: 5px;
  }
  .info-value {
    font-size: 13px; color: var(--text-dark);
    font-weight: 500; line-height: 1.4;
  }
  .info-value.highlight {
    font-size: 15px; font-weight: 800;
    color: #1a4a5a;
  }

  .racional-card {
    background: var(--white);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    border-left: 4px solid var(--color);
  }
  .racional-label {
    font-size: 9px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1.2px;
    color: #1a4a5a;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .racional-text {
    font-size: 13px; color: var(--text-mid);
    line-height: 1.6;
  }

  .oportunidad-card {
    background: linear-gradient(135deg, #f4fafc 0%, #edf6f9 100%);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    border: 1px solid var(--color-light);
  }
  .oportunidad-label {
    font-size: 9px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--color-dark);
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .oportunidad-text {
    font-size: 12px; color: #1a5f75;
    line-height: 1.6;
  }

  /* ── ANIMACIONES ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .screen.active .hero-img-wrap { animation: fadeUp 0.35s ease both; }
  .screen.active .cat-section { animation: fadeUp 0.35s ease both; }
  .screen.active .cat-section:nth-child(2) { animation-delay: 0.08s; }
  .screen.active .producto-img-section { animation: fadeUp 0.3s ease both; }
  .screen.active .producto-body { animation: fadeUp 0.3s ease 0.08s both; }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .prod-brand { font-size: 24px; }
    .info-grid { gap: 6px; }
    .info-card { padding: 10px 12px; }
  }
</style>
</head>

function imgUrl(filename) {
  const base = 'https://raw.githubusercontent.com/fernandodavilaolvera-rgb/excelentia.com.mx/main/rediceberg/ventana1/';
  return base + filename.split('').map(c => {
    if (/[a-zA-Z0-9_.\-]/.test(c)) return c;
    return encodeURIComponent(c);
  }).join('');
}

// ── ESTADO ──
let currentScreen = 'territorio';
let currentProduct = null;
let navHistory = [];

// ── RENDER CARRUSELES ──
function buildCarousel(tab, containerId, dotsId) {
  const products = PRODUCTS.filter(p => p.tab === tab);
  const carousel = document.getElementById(containerId);
  const dotsWrap = document.getElementById(dotsId);

  carousel.innerHTML = products.map(p => `
    <div class="product-card" onclick="openProducto(${p.id})">
      <div class="pc-img-wrap">
        <img src="${imgUrl(p.file)}" alt="${p.brand}" loading="lazy"
          onerror="this.style.opacity='0.25'; this.style.padding='30px';">
      </div>
      <div class="pc-body">
        <div class="pc-brand">${p.brand}</div>
        <div class="pc-name">${p.name}</div>
        ${p.claim ? `<span class="pc-claim">${p.claim}</span>` : ''}
      </div>
    </div>
  `).join('');

  dotsWrap.innerHTML = products.map((_, i) =>
    `<div class="cdot ${i === 0 ? 'active' : ''}" id="dot-${tab}-${i}"></div>`
  ).join('');

  // Actualizar dots al hacer scroll
  carousel.addEventListener('scroll', () => {
    const cardW = 148 + 10;
    const idx = Math.round(carousel.scrollLeft / cardW);
    dotsWrap.querySelectorAll('.cdot').forEach((d, i) => d.classList.toggle('active', i === idx));
  }, { passive: true });
}

// ── VER TODOS ──
function verTodos(tab) {
  const products = PRODUCTS.filter(p => p.tab === tab);
  const label = tab === 'fb' ? 'Alimentos y Bebidas' : 'Otras Industrias';
  navHistory.push('territorio');
  document.getElementById('btnBack').classList.add('visible');
  document.getElementById('backLabel').textContent = 'Territorio';
  document.getElementById('todos-title').textContent = label;
  const grid = document.getElementById('todos-grid');
  grid.innerHTML = products.map(p => `
    <div class="product-card" onclick="openProducto(${p.id})" style="width:100%;">
      <div class="pc-img-wrap">
        <img src="${imgUrl(p.file)}" alt="${p.brand}" loading="lazy"
          onerror="this.style.opacity='0.25'; this.style.padding='30px';">
      </div>
      <div class="pc-body">
        <div class="pc-brand">${p.brand}</div>
        <div class="pc-name">${p.name}</div>
        ${p.claim ? `<span class="pc-claim">${p.claim}</span>` : ''}
      </div>
    </div>
  `).join('');
  showScreen('todos');
}

// ── ABRIR PRODUCTO ──
function openProducto(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  currentProduct = p;
  const prev = currentScreen;
  navHistory.push(prev);

  document.getElementById('btnBack').classList.add('visible');
  document.getElementById('backLabel').textContent = 'Territorio';
  document.getElementById('prod-tab-badge').textContent = p.tab === 'fb' ? '💪 Alimentos y Bebidas' : '✨ Otras Industrias';
  document.getElementById('prod-img').src = imgUrl(p.file);
  document.getElementById('prod-img').alt = p.brand + ' ' + p.name;

  let html = `
    <div class="prod-brand">${p.brand}</div>
    <div class="prod-name">${p.name}</div>
    <div class="info-grid">
      <div class="info-card">
        <div class="info-label">Categoría</div>
        <div class="info-value">${p.cat}</div>
      </div>
      <div class="info-card">
        <div class="info-label">Ingrediente / Base</div>
        <div class="info-value">${p.ingredient || '—'}</div>
      </div>
      <div class="info-card">
        <div class="info-label">Beneficio Funcional</div>
        <div class="info-value">${p.benefit || '—'}</div>
      </div>
      ${p.claim ? `
      <div class="info-card">
        <div class="info-label">Claim Principal</div>
        <div class="info-value highlight">${p.claim}</div>
      </div>` : ''}
    </div>
    <div class="racional-card">
      <div class="racional-label">⭐ ¿Por qué está en Hacking Body?</div>
      <div class="racional-text">${p.racional}</div>
    </div>
  `;

  if (p.oportunidad) {
    html += `
      <div class="oportunidad-card">
        <div class="oportunidad-label">💡 Oportunidad en Food & Beverage</div>
        <div class="oportunidad-text">${p.oportunidad}</div>
      </div>
    `;
  }

  document.getElementById('prod-body').innerHTML = html;
  showScreen('producto');
}

// ── NAVEGACIÓN ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  currentScreen = id;
  window.scrollTo(0, 0);
}

function goBack() {
  const prev = navHistory.pop();
  if (!prev || prev === 'territorio') {
    document.getElementById('btnBack').classList.remove('visible');
    showScreen('territorio');
  } else {
    showScreen(prev);
    if (navHistory.length === 0) {
      document.getElementById('btnBack').classList.remove('visible');
    }
  }
}

// Swipe iOS-style
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx > 80 && navHistory.length > 0) goBack();
}, { passive: true });

// ── INIT ──
buildCarousel('fb', 'carousel-fb', 'dots-fb');
buildCarousel('other', 'carousel-other', 'dots-other');
</script>
