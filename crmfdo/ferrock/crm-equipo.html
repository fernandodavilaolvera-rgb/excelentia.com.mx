<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM · Equipo — ExcelentIA</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:#f5f6f8;color:#1a2035;min-height:100vh;font-size:15px}

/* ── HEADER FERROCK ── */
.header{background:linear-gradient(135deg,#0d1b3e 0%,#1a3a6b 60%,#1e5096 100%);border-bottom:3px solid #4a9fd4;padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.6rem}
.logo-header-wrap{display:flex;align-items:center;gap:.9rem}
.logo-box{background:#fff;border-radius:10px;padding:.4rem .75rem;display:flex;align-items:center;justify-content:center;min-width:80px;min-height:52px;flex-shrink:0}
.logo-box img{height:48px;width:auto;display:block}
.logo-fallback{font-family:'Manrope',sans-serif;font-size:15px;font-weight:800;color:#1a3a6b;display:none}
.logo-slogan{font-family:'Manrope',sans-serif;font-size:13px;font-weight:500;color:#fff;letter-spacing:.2px}
.header-module{color:#a8c4e0;font-size:.85rem;font-weight:700;text-align:right}
.header-module strong{color:#fff;font-size:.95rem;display:block}

/* ── MAIN ── */
.page{padding:1.25rem 1.5rem;max-width:860px;margin:0 auto}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-bottom:1.25rem}
.toolbar h2{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:.4rem}

.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .95rem;border-radius:8px;font-size:.83rem;font-weight:700;cursor:pointer;transition:.2s;border:none;font-family:'Manrope',sans-serif}
.btn-primary{background:#1a3a6b;color:#fff}.btn-primary:hover{background:#0d1b3e}
.btn-secondary{background:#f0f4ff;color:#1a3a6b;border:1px solid #c8d9f0}.btn-secondary:hover{background:#dce8f7}
.btn-danger{background:#fee2e2;color:#991b1b}.btn-danger:hover{background:#fecaca}
.btn-sm{padding:.32rem .6rem;font-size:.75rem}
.btn-icon{padding:.32rem .42rem;border-radius:6px;width:26px;height:26px;justify-content:center}

/* ── TABLA ── */
.equipo-wrap{margin-bottom:1.5rem}
.card{background:#fff;border:1px solid #dde1e9;border-radius:12px;overflow:hidden}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th{background:#dce8f7;padding:.55rem .8rem;text-align:left;font-weight:700;color:#1a2035;border-bottom:2px solid #c8d9f0;white-space:nowrap;user-select:none}
th.sortable{cursor:pointer}
th.sortable:hover{background:#c8d9f0}
th .arrow{font-size:.68rem;opacity:.5;margin-left:.25rem}
th.sorted .arrow{opacity:1;color:#1a3a6b}
/* filas 20% menos altas: padding reducido de .6rem a .48rem */
td{padding:.30rem .8rem;border-bottom:1px solid #eef2f8;color:#1a2035;vertical-align:middle}
tr:hover td{background:#f8faff}
tr:last-child td{border-bottom:none}
.member-avatar{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:#fff;flex-shrink:0}

/* icono WA */
.wa-btn{display:inline-flex;align-items:center;gap:.35rem;color:#fff;font-size:.78rem;font-weight:600;text-decoration:none;background:#25D366;padding:.22rem .55rem;border-radius:20px;transition:.15s;white-space:nowrap}
.wa-btn:hover{background:#1dbb57}
.wa-btn svg{width:14px;height:14px;flex-shrink:0}

/* mailto link */
.email-link{color:#1a3a6b;font-size:.78rem;text-decoration:none;font-weight:500}
.email-link:hover{text-decoration:underline}

/* ── VACÍO / CARGA ── */
.empty-state{text-align:center;padding:2.5rem 1rem;color:#8a90a0}
.empty-state span{font-size:2rem;display:block;margin-bottom:.5rem}
.loading{text-align:center;padding:1.5rem;color:#4a5068;font-size:.85rem}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #dde1e9;border-top-color:#4a9fd4;border-radius:50%;animation:spin .7s linear infinite;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── INFO BAR ── */
.info-bar{background:#f0f4ff;border:1px solid #c8d9f0;border-left:4px solid #4a9fd4;border-radius:8px;padding:.65rem 1rem;font-size:.8rem;color:#1a2035;margin-bottom:1.25rem;display:flex;align-items:center;gap:.5rem}

/* ── MODAL ── */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-backdrop.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{background:linear-gradient(135deg,#0d1b3e,#1a3a6b);color:#fff;padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;border-radius:14px 14px 0 0;position:sticky;top:0}
.modal-head h3{font-size:.95rem;font-weight:700}
.modal-close{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
.modal-body{padding:1.25rem}
.form-group{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.75rem}
label{font-size:.8rem;font-weight:600;color:#4a5068}
.modal-body input,.modal-body select{width:100%;padding:.5rem .7rem;border:1px solid #dde1e9;border-radius:8px;font-family:'Manrope',sans-serif;font-size:.83rem;color:#1a2035;background:#fff}
.modal-body input:focus,.modal-body select:focus{outline:none;border-color:#4a9fd4;box-shadow:0 0 0 3px rgba(74,159,212,.12)}
.modal-foot{padding:.85rem 1.25rem;border-top:1px solid #eef2f8;display:flex;gap:.6rem;justify-content:flex-end;position:sticky;bottom:0;background:#fff}

/* ── COLOR PICKER ── */
.color-options{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.2rem}
.color-opt{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.15s}
.color-opt:hover{transform:scale(1.12)}
.color-opt.selected{border-color:#1a2035;box-shadow:0 0 0 2px #fff inset}

/* ── RESPONSIVE ≤600px ── */
@media(max-width:600px){
  .header{padding:.6rem 1rem}
  .logo-header-wrap{flex-direction:column;align-items:flex-start;gap:.3rem}
  .logo-slogan{font-size:11px}
  .page{padding:1rem}
  .modal{max-width:100%;border-radius:14px 14px 0 0;align-self:flex-end;max-height:95vh}
  .modal-backdrop{align-items:flex-end;padding:0}
}
</style>
</head>
<body>

<main class="page">

  <div class="toolbar">
    <h2>👥 Equipo ExcelentIA</h2>
    <button class="btn btn-primary" onclick="abrirModal()">+ Agregar miembro</button>
  </div>

  <div class="info-bar">
    💡 Los miembros del equipo se usan como <strong>Responsables</strong> en Proyectos y Tareas del CRM.
  </div>

  <div class="equipo-wrap">
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:40px"></th>
              <th class="sortable" onclick="toggleSort()" id="th-nombre">
                Nombre <span class="arrow" id="sort-arrow">⇕</span>
              </th>
              <th>Rol</th>
              <th>WhatsApp</th>
              <th>Correo</th>
              <th style="width:80px"></th>
            </tr>
          </thead>
          <tbody id="equipo-tbody">
            <tr><td colspan="6"><div class="loading"><span class="spinner"></span>Cargando equipo...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<!-- MODAL CREAR / EDITAR -->
<div class="modal-backdrop" id="modal-miembro">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-titulo">👤 Nuevo Miembro</h3>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>ID (slug único) *</label>
        <input type="text" id="m-id" placeholder="Ej: fernando — sin espacios, en minúsculas">
        <span style="font-size:.72rem;color:#8a90a0;margin-top:.15rem">Debe coincidir con el que usan Proyectos y Tareas como Responsable</span>
      </div>
      <div class="form-group">
        <label>Nombre completo *</label>
        <input type="text" id="m-nombre" placeholder="Ej: Fernando Dávila Olvera">
      </div>
      <div class="form-group">
        <label>WhatsApp</label>
        <input type="tel" id="m-whatsapp" placeholder="+52 55 1234 5678">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="m-email" placeholder="correo@excelentia.com.mx">
      </div>
      <div class="form-group">
        <label>Rol</label>
        <input type="text" id="m-rol" placeholder="Ej: Director, Partner, Soporte">
      </div>
      <div class="form-group">
        <label>Color de identificación</label>
        <div class="color-options" id="color-options"></div>
        <input type="hidden" id="m-color" value="#1a3a6b">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" id="btn-guardar" onclick="guardarMiembro()">Guardar</button>
    </div>
  </div>
</div>

<script>
const N8N_BASE = 'https://n8n.excelentia.com.mx/webhook';
const ENDPOINT  = '/crm-equipo';

const COLORES_PRESET = [
  '#1a3a6b','#7c3aed','#059669','#dc2626',
  '#f97316','#0891b2','#be185d','#4338ca',
  '#b45309','#374151'
];

let ITEMS  = [];
let editId = null;
let sortDir = 1; // 1 = A→Z, -1 = Z→A

// ── HELPERS ──
function toStr(v){ return (v===null||v===undefined)?'':String(v); }
function escHtml(s){ return toStr(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function initials(nombre){
  const p = toStr(nombre).trim().split(/\s+/);
  return p.length>=2?(p[0][0]+p[1][0]).toUpperCase():toStr(nombre).slice(0,2).toUpperCase();
}
function limpiarWA(wa){
  return toStr(wa).replace(/[\s\-\(\)\+]/g,'');
}
function normalize(m){
  return {
    ID:        toStr(m.ID),
    Nombre:    toStr(m.Nombre),
    WhatsApp:  toStr(m.WhatsApp),
    Email:     toStr(m.Email),
    Rol:       toStr(m.Rol),
    Color:     toStr(m.Color)||'#1a3a6b'
  };
}

function showToast(msg,tipo='ok'){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:1.5rem;right:1.5rem;padding:.65rem 1.1rem;border-radius:8px;font-size:.83rem;font-weight:600;z-index:999;transition:.3s;font-family:Manrope,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.15)';document.body.appendChild(t);}
  t.style.background=tipo==='ok'?'#059669':'#dc2626';
  t.style.color='#fff';t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0';},2500);
}

// ── API ──
async function apiCall(accion,data={}){
  try{
    const res=await fetch(`${N8N_BASE}${ENDPOINT}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion,...data})});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  }catch(e){ console.error('Error crm-equipo:',e); return null; }
}

// ── COLOR PICKER ──
function initColorPicker(selected='#1a3a6b'){
  const wrap=document.getElementById('color-options');
  wrap.innerHTML=COLORES_PRESET.map(c=>`<div class="color-opt${c===selected?' selected':''}" style="background:${c}" title="${c}" onclick="selectColor('${c}')"></div>`).join('');
  document.getElementById('m-color').value=selected;
}
function selectColor(color){
  document.getElementById('m-color').value=color;
  document.querySelectorAll('.color-opt').forEach(el=>el.classList.toggle('selected',el.title===color));
}

// ── ORDEN POR NOMBRE ──
function toggleSort(){
  sortDir*=-1;
  const arrow=document.getElementById('sort-arrow');
  const th=document.getElementById('th-nombre');
  arrow.textContent=sortDir===1?'▲':'▼';
  th.classList.add('sorted');
  renderEquipo();
}

// ── CARGA ──
async function cargarEquipo(){
  document.getElementById('equipo-tbody').innerHTML='<tr><td colspan="6"><div class="loading"><span class="spinner"></span>Cargando equipo...</div></td></tr>';
  const res=await apiCall('get');
  ITEMS=(Array.isArray(res)?res:[]).map(normalize);
  renderEquipo();
}

// ── RENDER ──
function iconoWA(){
  return `<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`;
}

function renderEquipo(){
  const tbody=document.getElementById('equipo-tbody');
  if(!ITEMS.length){
    tbody.innerHTML='<tr><td colspan="6"><div class="empty-state"><span>👥</span>Sin miembros del equipo aún</div></td></tr>';
    return;
  }
  const lista=[...ITEMS].sort((a,b)=>a.Nombre.localeCompare(b.Nombre,'es')*sortDir);
  tbody.innerHTML=lista.map(m=>{
    const wa=limpiarWA(m.WhatsApp);
    const waHtml=wa
      ?`<a class="wa-btn" href="https://wa.me/${wa}" target="_blank">${iconoWA()} ${escHtml(m.WhatsApp)}</a>`
      :'<span style="color:#8a90a0;font-size:.75rem">—</span>';
    const emailHtml=m.Email
      ?`<a class="email-link" href="mailto:${escHtml(m.Email)}">${escHtml(m.Email)}</a>`
      :'<span style="color:#8a90a0;font-size:.75rem">—</span>';
    return `<tr>
      <td><div class="member-avatar" style="background:${escHtml(m.Color)}">${escHtml(initials(m.Nombre))}</div></td>
      <td style="font-weight:700">${escHtml(m.Nombre)}</td>
      <td style="color:#4a5068">${escHtml(m.Rol)||'—'}</td>
      <td>${waHtml}</td>
      <td>${emailHtml}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-secondary btn-sm btn-icon" onclick="abrirModal('${escHtml(m.ID)}')" title="Editar">✏️</button>
        <button class="btn btn-danger btn-sm btn-icon" onclick="eliminarMiembro('${escHtml(m.ID)}')" title="Eliminar">✕</button>
      </td>
    </tr>`;
  }).join('');
}

// ── MODAL ──
function abrirModal(id=null){
  editId=id;
  const m=id?ITEMS.find(x=>x.ID===id):null;
  document.getElementById('modal-titulo').textContent=m?'✏️ Editar Miembro':'👤 Nuevo Miembro';
  document.getElementById('btn-guardar').textContent=m?'Guardar cambios':'Guardar';
  const idInput=document.getElementById('m-id');
  idInput.value=m?.ID||'';
  idInput.readOnly=!!m;
  idInput.style.background=m?'#f5f6f8':'#fff';
  document.getElementById('m-nombre').value=m?.Nombre||'';
  document.getElementById('m-whatsapp').value=m?.WhatsApp||'';
  document.getElementById('m-email').value=m?.Email||'';
  document.getElementById('m-rol').value=m?.Rol||'';
  initColorPicker(m?.Color||'#1a3a6b');
  document.getElementById('modal-miembro').classList.add('open');
}
function cerrarModal(){
  document.getElementById('modal-miembro').classList.remove('open');
  editId=null;
}

async function guardarMiembro(){
  const id=document.getElementById('m-id').value.trim().toLowerCase().replace(/\s+/g,'-');
  const nombre=document.getElementById('m-nombre').value.trim();
  if(!id){showToast('El ID es obligatorio','err');return;}
  if(!nombre){showToast('El nombre es obligatorio','err');return;}
  if(!editId&&ITEMS.some(x=>x.ID===id)){showToast('Ya existe un miembro con ese ID','err');return;}
  const payload={
    ID:id,Nombre:nombre,
    WhatsApp:document.getElementById('m-whatsapp').value.trim(),
    Email:document.getElementById('m-email').value.trim(),
    Rol:document.getElementById('m-rol').value.trim(),
    Color:document.getElementById('m-color').value
  };
  const esEdicion=!!editId;
  const res=await apiCall(esEdicion?'update':'create',payload);
  if(res!==null){
    if(esEdicion){const idx=ITEMS.findIndex(x=>x.ID===editId);if(idx>-1)ITEMS[idx]=normalize(payload);showToast('✅ Miembro actualizado');}
    else{ITEMS.push(normalize(payload));showToast('✅ Miembro guardado');}
    cerrarModal();renderEquipo();
  }else{showToast('Error al guardar — revisa tu conexión','err');}
}

async function eliminarMiembro(id){
  const m=ITEMS.find(x=>x.ID===id);
  if(!m)return;
  if(!confirm(`¿Eliminar a "${m.Nombre}" del equipo?`))return;
  const res=await apiCall('delete',{ID:id});
  if(res!==null){ITEMS=ITEMS.filter(x=>x.ID!==id);renderEquipo();showToast('Miembro eliminado');}
  else showToast('Error al eliminar','err');
}

document.getElementById('modal-miembro').addEventListener('click',e=>{if(e.target===e.currentTarget)cerrarModal();});
document.addEventListener('DOMContentLoaded',cargarEquipo);
</script>
</body>
</html>
