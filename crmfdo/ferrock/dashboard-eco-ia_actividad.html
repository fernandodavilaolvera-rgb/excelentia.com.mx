<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Eco IA — ExcelentIA</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:           #f5f6f8;
      --card:         #ffffff;
      --border:       #dde1e9;
      --grad:         linear-gradient(135deg, #0d1b3e 0%, #1a3a6b 60%, #1e5096 100%);
      --accent:       #4a9fd4;
      --card-head:    #dce8f7;
      --alert-bg:     #f0f6ff;
      --alert-border: #c8d9f0;
      --note-bg:      #eef4fc;
      --text-main:    #1a2035;
      --text-sec:     #4a5068;
      --text-gray:    #8a90a0;
      --success:      #27ae60;
      --success-bg:   #eafaf1;
      --error:        #e74c3c;
      --error-bg:     #fdf0ef;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text-main); min-height: 100vh; }

    /* HEADER */
    .header {
      background: var(--grad);
      border-bottom: 3px solid var(--accent);
      padding: 1.1rem 2rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      position: sticky; top: 0; z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 1rem; }
    .logo-box {
      background: #fff; border-radius: 10px; padding: .4rem .75rem;
      display: flex; align-items: center; justify-content: center;
      min-width: 80px; min-height: 52px; flex-shrink: 0;
    }
    .logo-box img { height: 40px; width: auto; display: block; }
    .logo-fallback { font-family:'Manrope',sans-serif; font-size:15px; font-weight:800; color:#1a3a6b; display:none; }
    .header-info { color: #fff; }
    .header-info h1 { font-size: 1.05rem; font-weight: 700; line-height: 1.25; }
    .header-info p  { font-size: .75rem; color: rgba(255,255,255,.6); margin-top: .15rem; }
    .header-right { display: flex; align-items: center; gap: .75rem; }
    .badge-live {
      display: flex; align-items: center; gap: .4rem;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
      color: #fff; font-size: .72rem; font-weight: 700;
      padding: .3rem .75rem; border-radius: 20px;
    }
    .dot-live { width: 7px; height: 7px; border-radius: 50%; background: #2ecc71; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .badge-interno {
      background: rgba(74,159,212,.25); border: 1px solid rgba(74,159,212,.4);
      color: #a8d8f0; font-size: .72rem; font-weight: 700;
      padding: .3rem .75rem; border-radius: 20px;
    }
    .btn-refresh {
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
      color: #fff; font-family: 'Manrope', sans-serif; font-size: .78rem; font-weight: 700;
      padding: .4rem .9rem; border-radius: 8px; cursor: pointer; transition: background .2s;
    }
    .btn-refresh:hover { background: rgba(255,255,255,.22); }

    /* CONTAINER */
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* STATS */
    .stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem; margin-bottom: 1.75rem; }
    .stat-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.1rem 1.25rem; display: flex; flex-direction: column; gap: .3rem;
      position: relative; overflow: hidden;
    }
    .stat-card::before { content:''; position:absolute; top:0;left:0;right:0; height:3px; background:var(--accent); }
    .stat-card.ok::before  { background: var(--success); }
    .stat-card.err::before { background: var(--error); }
    .stat-card.dr::before  { background: #9b59b6; }
    .stat-label { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-gray); }
    .stat-value { font-size:1.9rem; font-weight:800; color:var(--text-main); line-height:1; }
    .stat-sub   { font-size:.75rem; color:var(--text-gray); margin-top:.1rem; }

    /* FILTROS */
    .filtros-row {
      display: flex; align-items: center; gap: .75rem;
      margin-bottom: 1.25rem; flex-wrap: wrap;
    }
    .filtros-row label { font-size:.78rem; font-weight:700; color:var(--text-sec); }
    .select-filtro, .search-input {
      font-family: 'Manrope', sans-serif; font-size:.85rem; color:var(--text-main);
      background:#fff; border:1.5px solid var(--border); border-radius:8px;
      padding:.5rem .9rem; outline:none; transition:border-color .2s;
    }
    .select-filtro:focus, .search-input:focus { border-color:var(--accent); }
    .search-input { width: 220px; }
    .btn-limpiar {
      font-family:'Manrope',sans-serif; font-size:.78rem; font-weight:700;
      color:var(--text-gray); background:#fff; border:1.5px solid var(--border);
      border-radius:8px; padding:.5rem .9rem; cursor:pointer; transition:all .2s;
    }
    .btn-limpiar:hover { border-color:var(--accent); color:#1a3a6b; }

    /* CARD TABLA */
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:1.5rem; }
    .card-head {
      background:var(--card-head); padding:.875rem 1.5rem;
      display:flex; align-items:center; justify-content:space-between;
      border-bottom:1px solid var(--border); gap:1rem; flex-wrap:wrap;
    }
    .card-head-left { display:flex; align-items:center; gap:.6rem; }
    .card-head h2 { font-size:.95rem; font-weight:700; color:#1a3a6b; }
    .card-count { background:var(--accent); color:#fff; font-size:.72rem; font-weight:700; padding:.2rem .6rem; border-radius:20px; min-width:24px; text-align:center; }

    /* TABLA */
    .table-wrap { overflow-x: auto; }
    table { width:100%; border-collapse:collapse; font-size:.84rem; }
    thead tr { background:#f8fafd; border-bottom:2px solid var(--border); }
    th { padding:.75rem 1rem; text-align:left; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-gray); white-space:nowrap; }
    tbody tr { border-bottom:1px solid #f0f2f5; transition:background .15s; }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:var(--alert-bg); }
    td { padding:.8rem 1rem; color:var(--text-sec); vertical-align:middle; }
    td.fecha  { color:var(--text-gray); font-size:.78rem; white-space:nowrap; }
    td.nombre { font-weight:700; color:var(--text-main); }
    td.imgs   { font-weight:600; text-align:center; }

    .pill-doctor {
      display:inline-block;
      background:var(--alert-bg); color:#1a3a6b;
      font-size:.72rem; font-weight:700;
      padding:.2rem .65rem; border-radius:20px;
      border:1px solid var(--alert-border);
      white-space:nowrap;
    }
    .badge-ok {
      display:inline-flex; align-items:center; gap:.3rem;
      background:var(--success-bg); color:var(--success);
      font-size:.73rem; font-weight:700;
      padding:.22rem .6rem; border-radius:20px; border:1px solid #b7e5c9;
    }
    .badge-err {
      display:inline-flex; align-items:center; gap:.3rem;
      background:var(--error-bg); color:var(--error);
      font-size:.73rem; font-weight:700;
      padding:.22rem .6rem; border-radius:20px; border:1px solid #f5c6c2;
    }
    .btn-ver {
      display:inline-flex; align-items:center; gap:.3rem;
      background:var(--alert-bg); color:#1a3a6b;
      border:1px solid var(--alert-border); border-radius:7px;
      padding:.32rem .7rem;
      font-family:'Manrope',sans-serif; font-size:.76rem; font-weight:700;
      text-decoration:none; transition:all .2s; white-space:nowrap;
    }
    .btn-ver:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
    .btn-ver-dis { opacity:.35; cursor:default; pointer-events:none; }

    /* ESTADOS */
    .state-box { padding:3rem 2rem; text-align:center; color:var(--text-gray); }
    .state-box .icon { font-size:2.5rem; margin-bottom:.75rem; }
    .state-box p { font-size:.9rem; line-height:1.6; }
    .spinner-sm {
      width:36px; height:36px; border:3px solid #dde1e9;
      border-top-color:var(--accent); border-radius:50%;
      animation:spin 1s linear infinite; margin:0 auto .75rem;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* NOTE FOOTER */
    .note-footer {
      background:var(--note-bg); border-left:4px solid #1a3a6b;
      border-radius:0 8px 8px 0; padding:.85rem 1.25rem;
      font-size:.8rem; color:var(--text-sec); margin-top:1.5rem;
      display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
    }

    /* RESPONSIVE */
    @media (max-width:1000px) { .stats-row { grid-template-columns:repeat(3,1fr); } }
    @media (max-width:700px)  { .stats-row { grid-template-columns:repeat(2,1fr); } }
    @media (max-width:600px) {
      .header { padding:1rem; flex-wrap:wrap; }
      .header-right { display:none; }
      .container { padding:1.25rem 1rem; }
      .stats-row { grid-template-columns:1fr 1fr; gap:.75rem; }
      .stat-value { font-size:1.6rem; }
      .filtros-row { flex-direction:column; align-items:flex-start; }
      .search-input { width:100%; }
    }
  </style>
</head>
<body>

<main class="container">

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <span class="stat-label">Total reportes</span>
      <span class="stat-value" id="stat-total">—</span>
      <span class="stat-sub" id="stat-sub-total">Cargando...</span>
    </div>
    <div class="stat-card ok">
      <span class="stat-label">Exitosos</span>
      <span class="stat-value" id="stat-ok">—</span>
      <span class="stat-sub" id="stat-sub-ok">&nbsp;</span>
    </div>
    <div class="stat-card err">
      <span class="stat-label">Con error</span>
      <span class="stat-value" id="stat-err">—</span>
      <span class="stat-sub" id="stat-sub-err">&nbsp;</span>
    </div>
    <div class="stat-card dr">
      <span class="stat-label">Doctores activos</span>
      <span class="stat-value" id="stat-drs">—</span>
      <span class="stat-sub" id="stat-sub-drs">&nbsp;</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Último reporte</span>
      <span class="stat-value" id="stat-ultimo" style="font-size:1rem;padding-top:.3rem;">—</span>
      <span class="stat-sub" id="stat-sub-ultimo">—</span>
    </div>
  </div>

  <!-- FILTROS -->
  <div class="filtros-row">
    <label>Filtrar por:</label>
    <select class="select-filtro" id="filtro-doctor" onchange="aplicarFiltros()">
      <option value="">Todos los doctores</option>
    </select>
    <select class="select-filtro" id="filtro-estado" onchange="aplicarFiltros()">
      <option value="">Todos los estados</option>
      <option value="exito">✓ Exitosos</option>
      <option value="error">✗ Con error</option>
    </select>
    <input class="search-input" id="search" type="text"
           placeholder="🔍 Buscar paciente..."
           oninput="aplicarFiltros()">
    <button class="btn-limpiar" onclick="limpiarFiltros()">✕ Limpiar</button>
  </div>

  <!-- TABLA -->
  <div class="card">
    <div class="card-head">
      <div class="card-head-left">
        <span>📋</span>
        <h2>Historial global de reportes</h2>
        <span class="card-count" id="tabla-count">0</span>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Doctor</th>
            <th>Paciente</th>
            <th style="text-align:center">Imágenes</th>
            <th>Estado</th>
            <th>Reporte</th>
          </tr>
        </thead>
        <tbody id="tabla-body">
          <tr><td colspan="6">
            <div class="state-box"><div class="spinner-sm"></div><p>Cargando reportes...</p></div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="note-footer">
    <strong>🔒 Vista interna ExcelentIA</strong> · Todos los reportes de todos los doctores
    <span style="margin-left:auto">Eco IA · <strong>ExcelentIA</strong></span>
  </div>

</main>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz6DTChYr1q6BjPXflDvRcqA5B0yDiOZzwDY3x1CBz__KaxZFW_vDVvJrTu_8fNj1S8/exec';

let todosLosReportes = [];

/* ── HORA MÉXICO ── */
// El Apps Script entrega "fecha_legible" ya formateada en GMT (desfase de 6h).
// Aquí recalculamos siempre a partir de "timestamp" (UTC real) y la convertimos
// a hora de Ciudad de México. Si no hay timestamp utilizable, usamos fecha_legible
// como último recurso (puede seguir mostrando GMT en ese caso extremo).
function formatFechaMX(rawTimestamp) {
  if (!rawTimestamp) return null;
  const d = new Date(rawTimestamp);
  if (isNaN(d.getTime())) return null;
  const partes = new Intl.DateTimeFormat('es-MX', {
    timeZone: 'America/Mexico_City',
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit', hour12: false
  }).formatToParts(d);
  const get = t => (partes.find(p => p.type === t) || {}).value || '';
  return `${get('day')}/${get('month')}/${get('year')} ${get('hour')}:${get('minute')}`;
}

/* ── CARGA ── */
function parsearRespuesta(data) {
  if (Array.isArray(data))           return data;
  if (Array.isArray(data.data))      return data.data;
  if (Array.isArray(data.rows))      return data.rows;
  if (Array.isArray(data.records))   return data.records;
  if (Array.isArray(data.logs))      return data.logs;
  if (Array.isArray(data.reportes))  return data.reportes;
  if (Array.isArray(data.results))   return data.results;
  return null;
}

async function cargarDatos() {
  mostrarCargando();
  try {
    // Sin filtro de doctor — trae todos
    const endpoints = [
      APPS_SCRIPT_URL + '?action=dashboard',
      APPS_SCRIPT_URL
    ];
    let filas = null, rawResp = null;
    for (const ep of endpoints) {
      try {
        const res = await fetch(ep);
        if (!res.ok) continue;
        const data = await res.json();
        rawResp = data;
        filas = parsearRespuesta(data);
        if (filas !== null) break;
      } catch(e) { continue; }
    }
    if (filas === null) {
      const raw = rawResp ? JSON.stringify(rawResp, null, 2).substring(0, 500) : 'Sin respuesta';
      throw new Error('Formato desconocido:\n' + raw);
    }
    todosLosReportes = [...filas].reverse(); // más reciente primero
    poblarFiltroDoctor(todosLosReportes);
    renderDashboard(todosLosReportes);
  } catch (err) {
    mostrarError(err.message);
  }
}

/* ── FILTROS ── */
function poblarFiltroDoctor(filas) {
  const sel = document.getElementById('filtro-doctor');
  const actual = sel.value;
  // Recopilar IDs únicos
  const ids = [...new Set(filas.map(f => (f.doctor_id || '').trim()).filter(Boolean))];
  sel.innerHTML = '<option value="">Todos los doctores</option>';
  ids.forEach(id => {
    const opt = document.createElement('option');
    opt.value = id;
    // Intentar usar nombre del doctor si está disponible
    const muestra = filas.find(f => f.doctor_id === id);
    opt.textContent = (muestra && muestra.nombre_doctor) ? muestra.nombre_doctor : id;
    sel.appendChild(opt);
  });
  if (actual) sel.value = actual;
}

function aplicarFiltros() {
  let filas = [...todosLosReportes];
  const doctor = document.getElementById('filtro-doctor').value;
  const estado = document.getElementById('filtro-estado').value;
  const q      = document.getElementById('search').value.trim().toLowerCase();

  if (doctor) filas = filas.filter(f => (f.doctor_id || '').trim() === doctor);
  if (estado === 'exito') filas = filas.filter(f => (f.estado||'').toLowerCase().includes('exit'));
  if (estado === 'error') filas = filas.filter(f => !(f.estado||'').toLowerCase().includes('exit'));
  if (q) filas = filas.filter(f =>
    (f.nombre_paciente||'').toLowerCase().includes(q) ||
    (f.nombre_doctor  ||'').toLowerCase().includes(q) ||
    (f.doctor_id      ||'').toLowerCase().includes(q) ||
    (f.fecha_legible  ||'').toLowerCase().includes(q)
  );
  renderTabla(filas);
}

function limpiarFiltros() {
  document.getElementById('filtro-doctor').value = '';
  document.getElementById('filtro-estado').value = '';
  document.getElementById('search').value = '';
  renderDashboard(todosLosReportes);
}

/* ── RENDER ── */
function renderDashboard(filas) {
  const total    = todosLosReportes.length; // stats siempre sobre total global
  const exitosos = todosLosReportes.filter(f => (f.estado||'').toLowerCase().includes('exit')).length;
  const errores  = total - exitosos;
  const drs      = new Set(todosLosReportes.map(f => f.doctor_id).filter(Boolean)).size;
  const ultimo   = todosLosReportes[0] || null; // ya está ordenado reciente primero

  document.getElementById('stat-total').textContent     = total;
  document.getElementById('stat-sub-total').textContent = total === 1 ? 'reporte generado' : 'reportes generados';
  document.getElementById('stat-ok').textContent        = exitosos;
  document.getElementById('stat-sub-ok').textContent    = total > 0 ? Math.round(exitosos/total*100) + '% tasa de éxito' : '—';
  document.getElementById('stat-err').textContent       = errores;
  document.getElementById('stat-sub-err').textContent   = errores === 0 ? 'Sin errores 🎉' : `error${errores > 1 ? 'es' : ''}`;
  document.getElementById('stat-drs').textContent       = drs;
  document.getElementById('stat-sub-drs').textContent   = drs === 1 ? 'doctor registrado' : 'doctores registrados';

  if (ultimo) {
    const fl = formatFechaMX(ultimo.timestamp) || ultimo.fecha_legible || (ultimo.timestamp||'').substring(0,16).replace('T',' ') || '—';
    const partes = fl.split(' ');
    document.getElementById('stat-ultimo').textContent     = partes[0] || fl;
    document.getElementById('stat-sub-ultimo').textContent = partes[1] ? 'a las ' + partes[1] : '';
  } else {
    document.getElementById('stat-ultimo').textContent     = '—';
    document.getElementById('stat-sub-ultimo').textContent = 'Sin reportes aún';
  }

  renderTabla(filas);
}

function renderTabla(filas) {
  const tbody = document.getElementById('tabla-body');
  document.getElementById('tabla-count').textContent = filas.length;

  if (!filas.length) {
    tbody.innerHTML = `<tr><td colspan="6">
      <div class="state-box">
        <div class="icon">📭</div>
        <p>No hay reportes que coincidan con los filtros.</p>
      </div>
    </td></tr>`;
    return;
  }

  tbody.innerHTML = filas.map(f => {
    const fecha   = formatFechaMX(f.timestamp) || f.fecha_legible || (f.timestamp||'').substring(0,16).replace('T',' ') || '—';
    const doctor  = f.nombre_doctor || f.doctor_id || '—';
    const nombre  = f.nombre_paciente || '—';
    const imgs    = f.num_imagenes || '—';
    const estado  = (f.estado||'').toLowerCase();
    const esOk    = estado.includes('exit') || estado.includes('ok') || estado.includes('success');
    const url     = f.url_reporte || '';

    const badgeHtml = esOk
      ? `<span class="badge-ok">✓ Exitoso</span>`
      : `<span class="badge-err">✗ Error</span>`;
    const linkHtml = url
      ? `<a class="btn-ver" href="${url}" target="_blank" rel="noopener">📄 Ver Word</a>`
      : `<span class="btn-ver btn-ver-dis">Sin link</span>`;

    return `<tr>
      <td class="fecha">${fecha}</td>
      <td><span class="pill-doctor">${esc(doctor)}</span></td>
      <td class="nombre">${esc(nombre)}</td>
      <td class="imgs">${imgs}</td>
      <td>${badgeHtml}</td>
      <td>${linkHtml}</td>
    </tr>`;
  }).join('');
}

/* ── ESTADOS UI ── */
function mostrarCargando() {
  ['stat-total','stat-ok','stat-err','stat-drs','stat-ultimo'].forEach(id => document.getElementById(id).textContent='—');
  document.getElementById('stat-sub-total').textContent = 'Cargando...';
  ['stat-sub-ok','stat-sub-err','stat-sub-drs','stat-sub-ultimo'].forEach(id => document.getElementById(id).textContent='');
  document.getElementById('tabla-body').innerHTML = `<tr><td colspan="6">
    <div class="state-box"><div class="spinner-sm"></div><p>Cargando reportes...</p></div>
  </td></tr>`;
  document.getElementById('tabla-count').textContent = '0';
}

function mostrarError(msg) {
  document.getElementById('stat-sub-total').textContent = 'Error de conexión';
  document.getElementById('tabla-body').innerHTML = `<tr><td colspan="6">
    <div class="state-box">
      <div class="icon">⚠️</div>
      <p><strong>No se pudo conectar al servidor de datos.</strong><br><br>
      <code style="font-size:.75rem;background:#f0f2f5;padding:.5rem 1rem;border-radius:6px;display:inline-block;text-align:left;white-space:pre-wrap;max-width:500px">${esc(msg)}</code><br><br>
      <button onclick="cargarDatos()" style="background:#1a3a6b;color:#fff;border:none;border-radius:8px;padding:.6rem 1.25rem;font-family:'Manrope',sans-serif;font-weight:700;cursor:pointer;font-size:.85rem;">
        ↻ Reintentar
      </button></p>
    </div>
  </td></tr>`;
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── INIT ── */
cargarDatos();
setInterval(cargarDatos, 5 * 60 * 1000);
</script>
</body>
</html>
