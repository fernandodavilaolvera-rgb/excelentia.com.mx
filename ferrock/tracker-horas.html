<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>⏱ Tracker de horas por proyecto</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:#f5f6f8;min-height:100vh}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.proj-grid{display:grid;gap:10px;grid-template-columns:repeat(5,1fr)}
@media(max-width:1100px){.proj-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:860px) {.proj-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px) {.proj-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:380px) {.proj-grid{grid-template-columns:1fr}}
.tab{border:none;background:none;font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;cursor:pointer;padding:11px 14px;white-space:nowrap;border-bottom:3px solid transparent;color:#8a90a0;transition:color .15s}
.tab.active{color:#1a3a6b;border-bottom-color:#4a9fd4}.tab:hover{color:#1a3a6b}
.card{background:#fff;border-radius:12px;padding:13px;border:1px solid #dde1e9;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:box-shadow .2s}
.card:hover{box-shadow:0 4px 16px rgba(26,58,107,.1)}
.btn{font-family:'Manrope',sans-serif;font-weight:700;cursor:pointer;border:none;border-radius:7px;font-size:12px;transition:opacity .15s,transform .1s}
.btn:hover{opacity:.85}.btn:active{transform:scale(.96)}
.act-btn{background:none;border:none;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.act-btn:disabled{opacity:.25;cursor:default}
input,select{font-family:'Manrope',sans-serif;font-size:13px;border:1px solid #dde1e9;border-radius:8px;padding:9px 12px;width:100%;color:#1a2035;background:#fff;outline:none}
input:focus,select:focus{border-color:#4a9fd4}
.bar-track{background:#f0f4f8;border-radius:5px;height:6px;overflow:hidden}
.bar-fill{height:6px;border-radius:5px;transition:width .5s ease}
.emoji-opt{cursor:pointer;font-size:19px;width:36px;height:36px;border-radius:7px;border:2px solid transparent;display:inline-flex;align-items:center;justify-content:center;transition:background .12s}
.emoji-opt:hover{background:#e8f0fb}.emoji-opt.sel{border-color:#4a9fd4;background:#e8f0fb}
.color-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s;flex-shrink:0}
.color-dot:hover{transform:scale(1.2)}.color-dot.sel{border-color:#1a2035;transform:scale(1.1)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:500px;max-height:94vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.slabel{font-size:10px;font-weight:700;color:#8a90a0;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;display:block}
.fchip{padding:5px 11px;border-radius:20px;font-family:'Manrope',sans-serif;font-size:11px;font-weight:700;cursor:pointer;border:1px solid #dde1e9;background:#fff;color:#4a5068}
.fchip.on{background:#1a3a6b;border-color:#1a3a6b;color:#fff}
.timer-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:10px;padding:8px 12px;flex-shrink:0}
.bk-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dde1e9;border-radius:10px;padding:9px 11px;transition:box-shadow .15s}
.bk-row:hover{box-shadow:0 2px 10px rgba(26,58,107,.08)}
.bk-fav{width:28px;height:28px;border-radius:7px;flex-shrink:0;object-fit:contain;background:#f5f6f8}
.bk-fallback{width:28px;height:28px;border-radius:7px;flex-shrink:0;background:#e8f0fb;display:flex;align-items:center;justify-content:center;font-size:14px}
@media(max-width:600px){
  .header-row{flex-direction:column!important;align-items:flex-start!important}
  .hstats{display:grid!important;grid-template-columns:1fr 1fr 1fr;width:100%!important;gap:6px!important}
  .row3{grid-template-columns:1fr 1fr!important}
  .bk-row{flex-wrap:wrap}
}
</style>
</head>
<body>

<!-- ① HEADER persistente -->
<div id="header_div"></div>
<!-- ② BANNER persistente -->
<div id="banner_div"></div>

<!-- ③ EDIT PROJECT MODAL -->
<div id="edit_modal" style="display:none" class="modal-bg" onclick="if(event.target===this)closeEdit()">
  <div class="modal-box">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div>
        <div style="font-weight:800;font-size:16px;color:#1a2035">✏️ Editar proyecto</div>
        <div id="em_sub" style="color:#8a90a0;font-size:12px;margin-top:1px"></div>
      </div>
      <button onclick="closeEdit()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#ccc">✕</button>
    </div>
    <div style="margin-bottom:14px">
      <span class="slabel">Nombre</span>
      <input id="em_name" type="text" oninput="EP.name=this.value;document.getElementById('em_pname').textContent=this.value||'Nombre del proyecto'">
    </div>
    <div style="margin-bottom:14px">
      <span class="slabel">Emoji</span>
      <div id="em_emojis" style="display:flex;flex-wrap:wrap;gap:3px"></div>
    </div>
    <div style="margin-bottom:12px">
      <span class="slabel">Color</span>
      <div id="em_colors" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:9px"></div>
      <div style="display:flex;align-items:center;gap:10px;background:#f5f6f8;padding:9px;border-radius:10px">
        <div id="em_pbox" style="width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0"><span id="em_pemoji"></span></div>
        <div id="em_pname" style="font-weight:700;font-size:13px;color:#1a2035"></div>
      </div>
    </div>
    <div style="border-top:2px dashed #dde1e9;margin:14px 0"></div>
    <div style="margin-bottom:12px">
      <span class="slabel">➕ Registrar sesión</span>
      <div id="em_cur" style="background:#f0f6ff;border:1px solid #c8d9f0;border-radius:8px;padding:9px 12px;margin-bottom:10px;font-size:12px;color:#2d6aa0"></div>
      <div class="row3" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
        <div><label style="font-size:11px;font-weight:700;color:#4a5068;display:block;margin-bottom:4px">Horas</label><input id="em_m_h" type="number" min="0" max="24" placeholder="0"></div>
        <div><label style="font-size:11px;font-weight:700;color:#4a5068;display:block;margin-bottom:4px">Minutos</label><input id="em_m_m" type="number" min="0" max="59" placeholder="0"></div>
        <div><label style="font-size:11px;font-weight:700;color:#4a5068;display:block;margin-bottom:4px">Fecha</label><input id="em_m_d" type="date"></div>
      </div>
      <input id="em_m_n" type="text" placeholder="Notas (opcional)" style="margin-bottom:8px">
      <button onclick="addManualToProject()" class="btn" style="width:100%;background:#3AAA35;color:#fff;padding:10px;font-size:13px">➕ Agregar sesión</button>
    </div>
    <div style="border-top:2px dashed #dde1e9;margin:14px 0"></div>
    <div style="margin-bottom:14px">
      <span class="slabel">🔧 Ajustar totales (reemplaza historial)</span>
      <div class="row3" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
        <div><label style="font-size:11px;font-weight:700;color:#4a5068;display:block;margin-bottom:4px">Horas</label><input id="em_hours" type="number" min="0" max="9999" placeholder="0" oninput="EP.editHours=this.value;updWarn()"></div>
        <div><label style="font-size:11px;font-weight:700;color:#4a5068;display:block;margin-bottom:4px">Minutos</label><input id="em_mins" type="number" min="0" max="59" placeholder="0" oninput="EP.editMinutes=this.value;updWarn()"></div>
        <div><label style="font-size:11px;font-weight:700;color:#4a5068;display:block;margin-bottom:4px">Fecha inicio</label><input id="em_date" type="date" oninput="EP.editStartDate=this.value;updWarn()"></div>
      </div>
      <div id="em_warn" style="display:none;background:#fff3e0;border:1px solid #ffe0b2;border-radius:8px;padding:9px 12px;font-size:12px;color:#e65100;gap:7px">
        <span>⚠️</span><span>Esto <strong>reemplazará</strong> todas las sesiones existentes con una sola de ajuste.</span>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="closeEdit()" style="flex:1;background:#f0f4f8;color:#4a5068;padding:11px">Cancelar</button>
      <button class="btn" onclick="saveEdit()" style="flex:2;background:#1a3a6b;color:#fff;padding:11px">✓ Guardar proyecto</button>
    </div>
  </div>
</div>

<!-- ④ EDIT BOOKMARK MODAL -->
<div id="bk_modal" style="display:none" class="modal-bg" onclick="if(event.target===this)closeBkEdit()">
  <div class="modal-box" style="max-width:420px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-weight:800;font-size:16px;color:#1a2035">✏️ Editar marcador</div>
      <button onclick="closeBkEdit()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#ccc">✕</button>
    </div>
    <div style="margin-bottom:14px">
      <span class="slabel">Nombre</span>
      <input id="bk_e_name" type="text">
    </div>
    <div style="margin-bottom:16px">
      <span class="slabel">URL</span>
      <input id="bk_e_url" type="text" placeholder="https://...">
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="closeBkEdit()" style="flex:1;background:#f0f4f8;color:#4a5068;padding:11px">Cancelar</button>
      <button class="btn" onclick="saveBkEdit()" style="flex:2;background:#1a3a6b;color:#fff;padding:11px">✓ Guardar</button>
    </div>
  </div>
</div>

<!-- ⑤ APP -->
<div id="app"></div>

<script>
const DEFAULT_PROJECTS=[
  {id:'citas',       name:'Citas Médicas',   full:'Agente de Citas Médicas', emoji:'🗓️',color:'#4a9fd4',isDefault:true},
  {id:'eco',         name:'Eco-IA',           full:'Eco-IA',                  emoji:'🫀', color:'#1a3a6b',isDefault:true},
  {id:'correos',     name:'Correos',          full:'Resumen de Correos',       emoji:'📧', color:'#2d6aa0',isDefault:true},
  {id:'berimbau',    name:'Berimbau',         full:'Club Berimbau',            emoji:'⚽', color:'#3AAA35',isDefault:true},
  {id:'ventana',     name:'Ventana al Mundo', full:'Ventana al Mundo',         emoji:'🌍', color:'#e67e22',isDefault:true},
  {id:'inmobiliaria',name:'Inmobiliarios',    full:'Agentes Inmobiliarios',    emoji:'🏠', color:'#8e44ad',isDefault:true},
];
const EMOJIS=['🚀','💼','🎯','⚡','🌟','💡','🔧','📊','🎨','🏗️','🤖','💬','🔑','📚','🌐','🏆','📱','🎵','✍️','🧩','🔔','🌈','💰','🧪','📸','🌿','🎸','🏋️','🎭','🖥️'];
const COLORS=['#4a9fd4','#1a3a6b','#2d6aa0','#3AAA35','#e67e22','#8e44ad','#ef4b1f','#e74c3c','#16a085','#f39c12','#2980b9','#27ae60','#d35400','#c0392b','#1abc9c','#7f8c8d','#e91e63','#795548'];
const SK='tracker:sessions-v4',PK='tracker:projects-v2',BK='tracker:bookmarks-v1';

let sessions = JSON.parse(localStorage.getItem(SK)||'[]');
let projects = JSON.parse(localStorage.getItem(PK)||'null')||DEFAULT_PROJECTS.map(p=>({...p}));
let bookmarks = JSON.parse(localStorage.getItem(BK)||'[]');

let activeTimers={}, tickIntvl=null;
let view='timer';
let filterDate='all', filterDateStart='', filterDateEnd='', filterProject='all';
let toast=null, toastTimer=null;
let newProj={name:'',emoji:'🚀',color:'#4a9fd4'};
let newBk={name:'',url:''};
let showAddBk=false;
let EP=null, EB=null;

function saveSess(){localStorage.setItem(SK,JSON.stringify(sessions));}
function saveProj(){localStorage.setItem(PK,JSON.stringify(projects));}
function saveBk(){localStorage.setItem(BK,JSON.stringify(bookmarks));}
function td(){return new Date().toISOString().split('T')[0];}
function fmtTime(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return[h,m,sc].map(v=>String(v).padStart(2,'0')).join(':');}
function fmtHrs(h){
  if(!h||h<0.008)return'—';
  const hh=Math.floor(h),mm=Math.round((h-hh)*60);
  if(mm===60)return`${hh+1}h`;if(hh===0)return`${mm}min`;if(mm===0)return`${hh}h`;return`${hh}h ${mm}min`;
}
function fmtDate(iso){if(!iso)return'';return new Date(iso+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});}
function activeCount(){return Object.keys(activeTimers).length;}

function getFiltered(withProject=false){
  let s=[...sessions];
  const now=new Date();
  if(filterDate==='week'){
    const ws=new Date(now);ws.setDate(now.getDate()-now.getDay());ws.setHours(0,0,0,0);
    s=s.filter(x=>new Date(x.date+'T12:00:00')>=ws);
  }else if(filterDate==='month'){
    s=s.filter(x=>{const d=new Date(x.date+'T12:00:00');return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});
  }else if(filterDate==='year'){
    s=s.filter(x=>new Date(x.date+'T12:00:00').getFullYear()===now.getFullYear());
  }else if(filterDate==='custom'&&filterDateStart&&filterDateEnd){
    s=s.filter(x=>x.date>=filterDateStart&&x.date<=filterDateEnd);
  }
  if(withProject&&filterProject!=='all') s=s.filter(x=>x.projectId===filterProject);
  return s;
}
function getTotals(src){
  return projects.map(p=>{
    const ps=(src||sessions).filter(x=>x.projectId===p.id);
    const total=ps.reduce((a,x)=>a+x.duration,0);
    const startDate=sessions.filter(x=>x.projectId===p.id).length>0?[...sessions.filter(x=>x.projectId===p.id)].map(x=>x.date).sort()[0]:null;
    return{...p,total,startDate};
  });
}
function grandTotal(t){return t.reduce((a,p)=>a+p.total,0);}

function showToast(msg){
  const t=document.getElementById('toast_div');
  if(t)t.innerHTML=`<div style="position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#0d1b3e;color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;box-shadow:0 6px 24px rgba(0,0,0,.28);white-space:nowrap;animation:fadeDown .25s ease">${msg}</div>`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{const t=document.getElementById('toast_div');if(t)t.innerHTML='';},3000);
}

function exportCSV(){
  if(!sessions.length){showToast('⚠️ No hay sesiones para exportar');return;}
  const rows=sessions.map(s=>{
    const p=projects.find(x=>x.id===s.projectId);
    return[s.id,`"${(p?.full||'?').replace(/"/g,'""')}"`,s.date,
      Math.round(s.duration*100)/100,`"${fmtHrs(s.duration)}"`,
      `"${(s.notes||'').replace(/"/g,'""')}"`,s.type==='timer'?'Timer':'Manual'].join(',');
  });
  const csv=['\uFEFFID,Proyecto,Fecha,Horas,Duración,Notas,Tipo',...rows].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download=`tracker-horas-${td()}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  showToast('✅ CSV descargado ('+sessions.length+' sesiones)');
}

// ── BOOKMARKS ─────────────────────────────────────────────────
function faviconUrl(url){
  try{const d=new URL(url).hostname;return`https://www.google.com/s2/favicons?sz=64&domain=${d}`;}
  catch(e){return null;}
}
function normalizeUrl(u){
  u=u.trim();
  if(!u)return'';
  if(!/^https?:\/\//i.test(u)) u='https://'+u;
  return u;
}
function addBookmark(){
  const name=newBk.name.trim();
  const url=normalizeUrl(newBk.url);
  if(!name||!url){showToast('⚠️ Completa nombre y URL');return;}
  bookmarks.push({id:Date.now(),name,url});
  saveBk();showToast('✅ "'+name+'" agregado');
  newBk={name:'',url:''};showAddBk=false;render();
}
function deleteBookmark(id){
  const bk=bookmarks.find(b=>b.id===id);
  if(!confirm(`¿Eliminar "${bk?.name}"?`))return;
  bookmarks=bookmarks.filter(b=>b.id!==id);saveBk();showToast('🗑 Eliminado');render();
}
function moveBookmark(id,dir){
  const idx=bookmarks.findIndex(b=>b.id===id);
  if(idx<0)return;
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=bookmarks.length)return;
  [bookmarks[idx],bookmarks[newIdx]]=[bookmarks[newIdx],bookmarks[idx]];
  saveBk();render();
}
function editBookmark(id){
  const bk=bookmarks.find(b=>b.id===id);if(!bk)return;
  EB={id};
  document.getElementById('bk_e_name').value=bk.name;
  document.getElementById('bk_e_url').value=bk.url;
  document.getElementById('bk_modal').style.display='flex';
}
function saveBkEdit(){
  if(!EB)return;
  const name=document.getElementById('bk_e_name').value.trim();
  const url=normalizeUrl(document.getElementById('bk_e_url').value);
  if(!name||!url){showToast('⚠️ Completa nombre y URL');return;}
  const idx=bookmarks.findIndex(b=>b.id===EB.id);
  if(idx>=0){bookmarks[idx]={...bookmarks[idx],name,url};saveBk();}
  document.getElementById('bk_modal').style.display='none';EB=null;
  showToast('✅ Marcador actualizado');render();
}
function closeBkEdit(){document.getElementById('bk_modal').style.display='none';EB=null;}

function exportBookmarks(){
  if(!bookmarks.length){showToast('⚠️ No hay marcadores para exportar');return;}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(bookmarks,null,2)],{type:'application/json'}));
  a.download=`favs-urls-${td()}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  showToast('✅ '+bookmarks.length+' marcadores exportados');
}
function importBookmarksFile(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!Array.isArray(data))throw new Error('formato inválido');
      const valid=data.filter(b=>b&&b.name&&b.url).map(b=>({id:Date.now()+Math.random(),name:String(b.name),url:normalizeUrl(String(b.url))}));
      if(!valid.length){showToast('⚠️ El archivo no tiene marcadores válidos');return;}
      if(confirm(`¿Importar ${valid.length} marcador(es)?\nSe agregarán a tu lista actual.`)){
        bookmarks=[...bookmarks,...valid];saveBk();showToast('✅ '+valid.length+' importados');render();
      }
    }catch(err){showToast('❌ Archivo inválido');}
  };
  reader.readAsText(file);
  input.value='';
}

// ── HEADER persistente ─────────────────────────────────────────
function renderHeader(){
  const allTotals=getTotals(),allGT=grandTotal(allTotals),nActive=activeCount();
  document.getElementById('header_div').innerHTML=`
  <div style="background:linear-gradient(135deg,#0d1b3e 0%,#1a3a6b 60%,#1e5096 100%);border-bottom:3px solid #4a9fd4;padding:14px 20px">
    <div class="header-row" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="background:#fff;border-radius:10px;padding:5px 12px;display:flex;align-items:center;justify-content:center;min-width:70px;min-height:42px;flex-shrink:0">
        <img src="https://excelentia.com.mx/assets/logo%20excelentIA.png" style="height:32px;width:auto" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span style="display:none;font-weight:800;font-size:12px;color:#1a3a6b">Excelent<span style="color:#4a9fd4">IA</span></span>
      </div>
      <div style="flex:1;min-width:160px">
        <div style="color:#fff;font-weight:800;font-size:16px;line-height:1.2">⏱ Tracker de horas por proyecto</div>
        ${nActive>0
          ?`<div style="margin-top:4px"><span style="background:#ef4b1f;color:#fff;font-size:9px;font-weight:700;border-radius:20px;padding:2px 8px">⏱ ${nActive} corriendo</span></div>`
          :`<div style="margin-top:4px;color:#7ab3d4;font-size:11px">Seguimiento por proyecto</div>`}
      </div>
      <div class="hstats" style="display:flex;gap:8px;flex-shrink:0">
        ${[['Total',allGT>0?fmtHrs(allGT):'—'],['Sesiones',sessions.length],['Proyectos',projects.length]].map(([l,v])=>`
        <div style="background:rgba(255,255,255,.11);border-radius:8px;padding:7px 11px;text-align:center;min-width:72px">
          <div style="color:#7ab3d4;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">${l}</div>

        </div>`).join('')}

// ── BANNER persistente ────────────────────────────────────────
function renderBanner(){
  const b=document.getElementById('banner_div');if(!b)return;
  const now=Date.now(),pids=Object.keys(activeTimers);
  if(!pids.length){b.innerHTML='';renderHeader();return;}
  const chips=pids.map(pid=>{
    const p=projects.find(x=>x.id===pid);
    const secs=Math.floor((now-activeTimers[pid])/1000);
    const col=p?.color||'#4a9fd4';
    return`<div class="timer-chip" style="border:1px solid ${col}40">
      <span style="font-size:16px">${p?.emoji||'⏱'}</span>
      <div>
        <div style="color:#fff;font-weight:700;font-size:12px;line-height:1.2">${p?.name||pid}</div>
        <div style="color:${col};font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.1">${fmtTime(secs)}</div>
      </div>
      <button onclick="stopTimer('${pid}')" class="btn" style="background:${col};color:#fff;padding:5px 10px;font-size:11px">⏹ Stop</button>
    </div>`;
  }).join('');
  b.innerHTML=`<div style="background:#0d1b3e;padding:10px 16px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px">
      <span style="color:#7ab3d4;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">${pids.length} cronómetro${pids.length!==1?'s':''} activo${pids.length!==1?'s':''}</span>
      ${pids.length>1?`<button onclick="stopAll()" class="btn" style="background:rgba(239,75,31,.8);color:#fff;padding:5px 12px;font-size:11px">⏹ Detener todos</button>`:''}
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">${chips}</div>
  </div>`;
  renderHeader();
}

// ── TIMER ─────────────────────────────────────────────────────
function startTimer(pid){
  if(pid in activeTimers){stopTimer(pid);return;}
  activeTimers[pid]=Date.now();
  renderBanner();
  if(!tickIntvl) tickIntvl=setInterval(renderBanner,1000);
  render();
}
async function stopTimer(pid,notify=true){
  if(!(pid in activeTimers))return;
  const dur=(Date.now()-activeTimers[pid])/3600000;
  delete activeTimers[pid];
  if(!Object.keys(activeTimers).length){clearInterval(tickIntvl);tickIntvl=null;}
  renderBanner();
  if(dur>=0.005){
    sessions.unshift({id:Date.now(),projectId:pid,date:td(),duration:dur,notes:'',type:'timer'});
    saveSess();
    if(notify)showToast('✅ '+fmtHrs(dur)+' — '+(projects.find(p=>p.id===pid)?.name||''));
  }
  render();
}
async function stopAll(){
  const pids=Object.keys(activeTimers);
  for(const pid of pids)await stopTimer(pid,false);
  showToast('✅ '+pids.length+' cronómetro'+(pids.length!==1?'s':'')+' detenido'+(pids.length!==1?'s':''));
}

// ── PROJECTS ──────────────────────────────────────────────────
function addProject(){
  const name=newProj.name.trim();
  if(!name){showToast('⚠️ Escribe un nombre');return;}
  projects.push({id:'p_'+Date.now(),name,full:name,emoji:newProj.emoji,color:newProj.color,isDefault:false});
  saveProj();showToast('✅ "'+name+'" creado');
  newProj={name:'',emoji:'🚀',color:'#4a9fd4'};render();
}
function buildCurInfo(){
  if(!EP)return'';
  const ps=sessions.filter(x=>x.projectId===EP.id);
  const total=ps.reduce((a,s)=>a+s.duration,0);
  const sd=ps.length>0?[...ps].map(s=>s.date).sort()[0]:null;
  return`<strong>Total actual:</strong> ${fmtHrs(total)} · Desde: ${sd?fmtDate(sd):'Sin sesiones'} · ${ps.length} sesión${ps.length!==1?'es':''}`;
}
function editProject(id){
  const p=projects.find(x=>x.id===id);if(!p)return;
  const ps=sessions.filter(s=>s.projectId===id);
  const total=ps.reduce((a,s)=>a+s.duration,0);
  const sd=ps.length>0?[...ps].map(s=>s.date).sort()[0]:td();
  EP={id,name:p.name,full:p.full,emoji:p.emoji,color:p.color,
    editHours:Math.floor(total),editMinutes:Math.round((total-Math.floor(total))*60),
    editStartDate:sd,origTotal:total,
    origStartDate:ps.length>0?[...ps].map(s=>s.date).sort()[0]:null};
  document.getElementById('em_sub').textContent=p.full;
  document.getElementById('em_name').value=EP.name;
  document.getElementById('em_cur').innerHTML=buildCurInfo();
  document.getElementById('em_m_h').value='';document.getElementById('em_m_m').value='';
  document.getElementById('em_m_d').value=td();document.getElementById('em_m_n').value='';
  document.getElementById('em_hours').value=EP.editHours;
  document.getElementById('em_mins').value=EP.editMinutes;
  document.getElementById('em_date').value=EP.editStartDate;
  document.getElementById('em_warn').style.display='none';
  document.getElementById('em_pname').textContent=EP.name;
  document.getElementById('em_pbox').style.background=EP.color;
  document.getElementById('em_pemoji').textContent=EP.emoji;
  document.getElementById('em_emojis').innerHTML=EMOJIS.map(e=>
    `<span class="emoji-opt${EP.emoji===e?' sel':''}" onclick="pickEmoji('${e}')">${e}</span>`).join('')+
    `<input type="text" maxlength="2" placeholder="✏️" oninput="pickEmoji(this.value||'🚀')" style="width:36px;height:36px;text-align:center;font-size:16px;padding:4px;flex-shrink:0">`;
  document.getElementById('em_colors').innerHTML=COLORS.map(c=>
    `<div class="color-dot${EP.color===c?' sel':''}" style="background:${c}" onclick="pickColor('${c}')"></div>`).join('')+
    `<input type="color" value="${EP.color}" oninput="pickColor(this.value)" style="width:24px;height:24px;border-radius:50%;padding:0;border:2px solid #dde1e9;cursor:pointer">`;
  document.getElementById('edit_modal').style.display='flex';
}
function addManualToProject(){
  if(!EP)return;
  const h=parseFloat(document.getElementById('em_m_h').value||0);
  const m=parseFloat(document.getElementById('em_m_m').value||0);
  const dur=h+m/60;
  if(dur<=0){showToast('⚠️ Ingresa horas o minutos');return;}
  const date=document.getElementById('em_m_d').value||td();
  const notes=document.getElementById('em_m_n').value||'';
  sessions.unshift({id:Date.now(),projectId:EP.id,date,duration:dur,notes,type:'manual'});
  saveSess();
  document.getElementById('em_cur').innerHTML=buildCurInfo();
  document.getElementById('em_m_h').value='';document.getElementById('em_m_m').value='';document.getElementById('em_m_n').value='';
  showToast('✅ '+fmtHrs(dur)+' agregadas');
}
function pickEmoji(e){if(!EP)return;EP.emoji=e;document.getElementById('em_pemoji').textContent=e;document.querySelectorAll('#em_emojis .emoji-opt').forEach(x=>x.classList.toggle('sel',x.textContent===e));}
function pickColor(c){if(!EP)return;EP.color=c;document.getElementById('em_pbox').style.background=c;document.querySelectorAll('#em_colors .color-dot').forEach(x=>x.classList.toggle('sel',x.getAttribute('onclick')===`pickColor('${c}')`) );}
function updWarn(){
  if(!EP)return;
  const nd=parseFloat(document.getElementById('em_hours').value||0)+parseFloat(document.getElementById('em_mins').value||0)/60;
  EP.editHours=document.getElementById('em_hours').value;EP.editMinutes=document.getElementById('em_mins').value;EP.editStartDate=document.getElementById('em_date').value;
  const w=document.getElementById('em_warn');
  if(w)w.style.display=(Math.abs(nd-(EP.origTotal||0))>0.008||EP.editStartDate!==EP.origStartDate)?'flex':'none';
}
function saveEdit(){
  if(!EP)return;const name=EP.name.trim();if(!name){showToast('⚠️ Nombre vacío');return;}
  const idx=projects.findIndex(p=>p.id===EP.id);
  if(idx>=0){projects[idx]={...projects[idx],name,full:name,emoji:EP.emoji,color:EP.color};saveProj();}
  const nd=parseFloat(EP.editHours||0)+parseFloat(EP.editMinutes||0)/60;
  if(Math.abs(nd-(EP.origTotal||0))>0.008||EP.editStartDate!==EP.origStartDate){
    sessions=sessions.filter(s=>s.projectId!==EP.id);
    if(nd>0)sessions.unshift({id:Date.now(),projectId:EP.id,date:EP.editStartDate||td(),duration:nd,notes:'✏️ Ajuste',type:'manual'});
    saveSess();
  }
  document.getElementById('edit_modal').style.display='none';EP=null;showToast('✅ Proyecto actualizado');render();
}
function closeEdit(){document.getElementById('edit_modal').style.display='none';EP=null;}
function resetProject(id){
  if(id in activeTimers)stopTimer(id,false);
  const proj=projects.find(p=>p.id===id),cnt=sessions.filter(s=>s.projectId===id).length;
  if(cnt===0){showToast('ℹ️ Sin sesiones que reiniciar');return;}
  if(!confirm(`¿Reiniciar "${proj?.full}"?\nSe borrarán ${cnt} sesión(es).`))return;
  sessions=sessions.filter(s=>s.projectId!==id);saveSess();showToast('🔄 Reiniciado');render();
}
function deleteProject(id){
  if(id in activeTimers)stopTimer(id,false);
  const proj=projects.find(p=>p.id===id),cnt=sessions.filter(s=>s.projectId===id).length;
  let msg=`¿Eliminar "${proj?.full}"?`;if(cnt>0)msg+=`\nSe borrarán ${cnt} sesión(es).`;
  if(!confirm(msg))return;
  projects=projects.filter(p=>p.id!==id);sessions=sessions.filter(s=>s.projectId!==id);
  saveSess();saveProj();showToast('🗑 Eliminado');render();
}
function delSession(id){sessions=sessions.filter(s=>s.id!==id);saveSess();render();}

// ── CHARTS ────────────────────────────────────────────────────
function verticalBarChart(filteredSessions){
  const data=projects.map(p=>({
    ...p,total:filteredSessions.filter(s=>s.projectId===p.id).reduce((a,s)=>a+s.duration,0)
  })).filter(p=>p.total>0).sort((a,b)=>b.total-a.total);
  if(!data.length)return`<div style="text-align:center;padding:40px;color:#8a90a0;font-size:13px">Sin datos en este período</div>`;
  const gt=data.reduce((a,p)=>a+p.total,0),maxV=data[0].total,maxH=200;
  return`<div style="display:flex;align-items:flex-end;gap:6px;height:${maxH}px;border-bottom:2px solid #f0f4f8;padding:0 4px">
    ${data.map(p=>{
      const bh=Math.max(6,Math.round((p.total/maxV)*maxH)),pct=Math.round((p.total/gt)*100);
      return`<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px">
        <div style="font-size:10px;font-weight:800;color:${p.color};text-align:center;white-space:nowrap">${fmtHrs(p.total)}</div>
        <div style="font-size:9px;color:#8a90a0">${pct}%</div>
        <div style="width:clamp(16px,70%,56px);background:${p.color};border-radius:5px 5px 0 0;height:${bh}px;flex-shrink:0"></div>
      </div>`;}).join('')}
  </div>
  <div style="display:flex;gap:6px;padding:8px 4px 0">
    ${data.map(p=>`<div style="flex:1;min-width:0;text-align:center;font-size:10px;color:#4a5068;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.full}">${p.emoji} ${p.name}</div>`).join('')}
  </div>`;
}

    <div style="color:#8a90a0;font-size:12px;margin-bottom:14px">Usa ✏️ para editar, agregar horas o ajustar totales</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${getTotals().map(p=>{const cnt=sessions.filter(s=>s.projectId===p.id).length,isA=p.id in activeTimers;
      return`<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid ${isA?p.color:'#dde1e9'}">
        <div style="width:34px;height:34px;border-radius:9px;background:${p.color};display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">${p.emoji}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:13px;color:#1a2035">${p.full}${isA?' <span style="background:#3AAA35;color:#fff;border-radius:10px;font-size:9px;padding:1px 6px">▶ corriendo</span>':''}</div>
          <div style="font-size:11px;color:#8a90a0;margin-top:2px">${cnt} sesión${cnt!==1?'es':''} · ${fmtHrs(p.total)||'Sin horas'}${p.startDate?` · 📅 ${fmtDate(p.startDate)}`:''}
            · <span style="background:${p.isDefault?'#e8f0fb':'#eef4fc'};color:${p.isDefault?'#2d6aa0':'#4a9fd4'};border-radius:20px;padding:1px 6px;font-weight:700;font-size:10px">${p.isDefault?'Predefinido':'Personalizado'}</span>
          </div>
        </div>
        <div style="display:flex;gap:4px;flex-shrink:0">
          <button class="act-btn" onclick="editProject('${p.id}')" title="Editar" style="background:#e8f0fb;color:#2d6aa0">✏️</button>
          <button class="act-btn" onclick="resetProject('${p.id}')" title="Reiniciar" style="background:#fff3e0;color:#e67e22">🔄</button>
          <button class="act-btn" onclick="deleteProject('${p.id}')" title="Eliminar" style="background:#fde8e8;color:#e74c3c">🗑️</button>
        </div>
      </div>`;}).join('')}
    </div>
  </div>
  <div style="text-align:center;padding:4px 0 8px">
    <a href="https://docs.google.com/spreadsheets/d/1vZ3maVtNn23aGFl31HxI4fn7tWDnwDV-hD7XK6tNOFo/edit" target="_blank"
      style="display:inline-flex;align-items:center;gap:8px;background:#f0f6ff;border:1px solid #c8d9f0;color:#2d6aa0;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;text-decoration:none">
      📊 Ver historial en Google Sheets
    </a>
  </div>
  `:''}

  <!-- ══ FAVS URL'S ══ -->
  ${view==='favs'?`
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:3px;flex-wrap:wrap">
      <div style="font-weight:800;font-size:15px;color:#1a2035">Tus marcadores (${bookmarks.length})</div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button onclick="exportBookmarks()" class="btn" style="background:#f0f6ff;color:#2d6aa0;border:1px solid #c8d9f0;padding:7px 12px;font-size:11px">⬇️ Exportar</button>
        <label class="btn" style="background:#f0f6ff;color:#2d6aa0;border:1px solid #c8d9f0;padding:7px 12px;font-size:11px;display:inline-flex;align-items:center;cursor:pointer">
          ⬆️ Importar
          <input type="file" accept="application/json" onchange="importBookmarksFile(this)" style="display:none">
        </label>
      </div>
    </div>
    <div style="color:#8a90a0;font-size:12px;margin-bottom:14px">Usa ↑↓ para reordenar · clic en el nombre para abrir</div>
    ${bookmarks.length===0?`
    <div style="text-align:center;padding:50px 20px;color:#8a90a0">
      <div style="font-size:44px;margin-bottom:10px">🔗</div>
      <div style="font-weight:700;font-size:15px;color:#1a2035">Sin marcadores aún</div>
      <div style="font-size:12px;margin-top:4px">Agrega tu primer link con el botón de abajo</div>
    </div>`:`
    <div style="display:flex;flex-direction:column;gap:7px">
      ${bookmarks.map((b,i)=>{
        const fav=faviconUrl(b.url);
        const domain=(()=>{try{return new URL(b.url).hostname;}catch(e){return b.url;}})();
        return`<div class="bk-row">
          ${fav?`<img class="bk-fav" src="${fav}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                 <div class="bk-fallback" style="display:none">🔗</div>`
               :`<div class="bk-fallback">🔗</div>`}
          <a href="${b.url}" target="_blank" rel="noopener" style="flex:1;min-width:0;text-decoration:none">
            <div style="font-weight:700;font-size:13px;color:#1a2035;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b.name}</div>
            <div style="font-size:11px;color:#8a90a0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${domain}</div>
          </a>
          <div style="display:flex;gap:2px;flex-shrink:0">
            <button class="act-btn" onclick="moveBookmark(${b.id},-1)" title="Subir" ${i===0?'disabled':''} style="background:#f5f6f8;color:#4a5068">↑</button>
            <button class="act-btn" onclick="moveBookmark(${b.id},1)" title="Bajar" ${i===bookmarks.length-1?'disabled':''} style="background:#f5f6f8;color:#4a5068">↓</button>
            <button class="act-btn" onclick="editBookmark(${b.id})" title="Editar" style="background:#e8f0fb;color:#2d6aa0">✏️</button>
            <button class="act-btn" onclick="deleteBookmark(${b.id})" title="Eliminar" style="background:#fde8e8;color:#e74c3c">🗑️</button>
          </div>
        </div>`;
      }).join('')}
    </div>`}
  </div>

  <button class="btn" onclick="toggleAddBk()" style="display:block;width:100%;margin-top:12px;background:${showAddBk?'#f0f4f8':'#1a3a6b'};color:${showAddBk?'#4a5068':'#fff'};border:1px solid #dde1e9;padding:13px;font-size:14px">
    ${showAddBk?'✕  Cancelar':'+ Agregar marcador'}
  </button>

  ${showAddBk?`<div class="card" style="margin-top:8px;border-left:4px solid #4a9fd4">
    <div style="font-weight:800;font-size:15px;color:#1a2035;margin-bottom:3px">➕ Nuevo marcador</div>
    <div style="color:#8a90a0;font-size:12px;margin-bottom:14px">Tus links favoritos, siempre a la mano</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <input type="text" placeholder="Nombre (ej: Mi CRM, Drive Ferrock…)" value="${newBk.name}" oninput="newBk.name=this.value">
      <input type="text" placeholder="https://..." value="${newBk.url}" oninput="newBk.url=this.value">
      <button onclick="addBookmark()" class="btn" style="background:#3AAA35;color:#fff;padding:11px;font-size:13px">✓ Agregar marcador</button>
    </div>
  </div>`:''}
  `:''}

  </div>`;
}

function setView(v){view=v;render();}
function toggleAddBk(){showAddBk=!showAddBk;render();}
render();
</script>
</body>
</html>
