<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>⏱ Tracker de Horas — ExcelentIA</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:#f5f6f8;min-height:100vh}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.proj-grid{display:grid;gap:10px;grid-template-columns:repeat(5,1fr)}
@media(max-width:1100px){.proj-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:860px) {.proj-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px) {.proj-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:380px) {.proj-grid{grid-template-columns:1fr}}
.chart-grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:700px){.chart-grid{grid-template-columns:1fr}}
.tab{border:none;background:none;font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;cursor:pointer;padding:11px 14px;white-space:nowrap;border-bottom:3px solid transparent;color:#8a90a0;transition:color .15s}
.tab.active{color:#1a3a6b;border-bottom-color:#4a9fd4}.tab:hover{color:#1a3a6b}
.card{background:#fff;border-radius:12px;padding:13px;border:1px solid #dde1e9;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:box-shadow .2s,border .2s}
.card:hover{box-shadow:0 4px 16px rgba(26,58,107,.1)}
.btn{font-family:'Manrope',sans-serif;font-weight:700;cursor:pointer;border:none;border-radius:7px;font-size:12px;transition:opacity .15s,transform .1s}
.btn:hover{opacity:.85}.btn:active{transform:scale(.96)}
.act-btn{background:none;border:none;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;transition:background .15s}
input,select{font-family:'Manrope',sans-serif;font-size:13px;border:1px solid #dde1e9;border-radius:8px;padding:9px 12px;width:100%;color:#1a2035;background:#fff;outline:none}
input:focus,select:focus{border-color:#4a9fd4}
.bar-track{background:#f0f4f8;border-radius:5px;height:6px;overflow:hidden}
.bar-fill{height:6px;border-radius:5px;transition:width .5s ease}
.emoji-opt{cursor:pointer;font-size:19px;width:36px;height:36px;border-radius:7px;border:2px solid transparent;display:inline-flex;align-items:center;justify-content:center;transition:background .12s}
.emoji-opt:hover{background:#e8f0fb}.emoji-opt.sel{border-color:#4a9fd4;background:#e8f0fb}
.color-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s;flex-shrink:0}
.color-dot:hover{transform:scale(1.2)}.color-dot.sel{border-color:#1a2035;transform:scale(1.1)}
.toggle{width:40px;height:22px;border-radius:11px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;border:none}
.toggle-knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.slabel{font-size:10px;font-weight:700;color:#8a90a0;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:block}
.timer-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:10px;padding:8px 12px;flex-shrink:0}
@media(max-width:560px){.stat-grid{grid-template-columns:1fr 1fr!important}.row3{grid-template-columns:1fr 1fr!important}.btn-row{flex-direction:column!important}}
</style>
</head>
<body>

<!-- ① BANNER — fuera de #app, nunca se destruye con render() -->
<div id="banner_div"></div>

<!-- ② EDIT MODAL — fuera de #app, sin scroll jump -->
<div id="edit_modal" style="display:none" class="modal-bg" onclick="if(event.target===this)closeEdit()">
  <div class="modal-box">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div>
        <div style="font-weight:800;font-size:16px;color:#1a2035">✏️ Editar proyecto</div>
        <div id="em_subtitle" style="color:#8a90a0;font-size:12px;margin-top:2px"></div>
      </div>
      <button onclick="closeEdit()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#ccc;line-height:1">✕</button>
    </div>
    <div style="margin-bottom:16px">
      <span class="slabel">Nombre</span>
      <input id="em_name" type="text" oninput="EP.name=this.value;document.getElementById('em_prev_name').textContent=this.value||'Nombre del proyecto'">
    </div>
    <div style="margin-bottom:16px">
      <span class="slabel">Emoji</span>
      <div id="em_emojis" style="display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px"></div>
    </div>
    <div style="margin-bottom:16px">
      <span class="slabel">Color</span>
      <div id="em_colors" style="display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:10px"></div>
      <div style="display:flex;align-items:center;gap:10px;background:#f5f6f8;padding:10px;border-radius:10px">
        <div id="em_prev_box" style="width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">
          <span id="em_prev_emoji"></span>
        </div>
        <div id="em_prev_name" style="font-weight:700;font-size:13px;color:#1a2035"></div>
      </div>
    </div>
    <div style="border-top:2px dashed #dde1e9;margin:18px 0"></div>
    <div style="margin-bottom:10px">
      <span class="slabel">⏱ Horas acumuladas y fecha de inicio</span>
      <div id="em_current" style="background:#f0f6ff;border:1px solid #c8d9f0;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:#2d6aa0"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px">
      <div>
        <label style="font-size:11px;font-weight:700;color:#4a5068;display:block;margin-bottom:5px">Horas nuevas</label>
        <input id="em_hours" type="number" min="0" max="9999" placeholder="0" oninput="EP.editHours=this.value;updWarn()">
      </div>
      <div>
        <label style="font-size:11px;font-weight:700;color:#4a5068;display:block;margin-bottom:5px">Minutos</label>
        <input id="em_minutes" type="number" min="0" max="59" placeholder="0" oninput="EP.editMinutes=this.value;updWarn()">
      </div>
      <div>
        <label style="font-size:11px;font-weight:700;color:#4a5068;display:block;margin-bottom:5px">Fecha de inicio</label>
        <input id="em_date" type="date" oninput="EP.editStartDate=this.value;updWarn()">
      </div>
    </div>
    <div id="em_warn" style="display:none;background:#fff3e0;border:1px solid #ffe0b2;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:#e65100;gap:8px">
      <span>⚠️</span><span>Cambiar horas o fecha <strong>consolidará</strong> el historial en una sesión de ajuste.</span>
    </div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn" onclick="closeEdit()" style="flex:1;background:#f0f4f8;color:#4a5068;padding:12px;font-size:13px">Cancelar</button>
      <button class="btn" onclick="saveEdit()" style="flex:2;background:#1a3a6b;color:#fff;padding:12px;font-size:13px">✓ Guardar cambios</button>
    </div>
  </div>
</div>

<!-- ③ APP — se reconstruye en cada render() -->
<div id="app"></div>

<script>
const DEFAULT_PROJECTS=[
  {id:'citas',       name:'Citas Médicas',   full:'Agente de Citas Médicas', emoji:'🗓️',color:'#4a9fd4',isDefault:true},
  {id:'eco',         name:'Eco-IA',           full:'Eco-IA',                  emoji:'🫀', color:'#1a3a6b',isDefault:true},
  {id:'correos',     name:'Correos',          full:'Resumen de Correos',       emoji:'📧', color:'#2d6aa0',isDefault:true},
  {id:'berimbau',    name:'Berimbau',         full:'Club Berimbau',            emoji:'⚽', color:'#3AAA35',isDefault:true},
  {id:'ventana',     name:'Ventana al Mundo', full:'Ventana al Mundo',         emoji:'🌍', color:'#e67e22',isDefault:true},
  {id:'inmobiliaria',name:'Inmobiliarios',    full:'Agentes Inmobiliarios',    emoji:'🏠', color:'#8e44ad',isDefault:true},
];
const EMOJIS=['🚀','💼','🎯','⚡','🌟','💡','🔧','📊','🎨','🏗️','🤖','💬','🔑','📚','🌐','🏆','📱','🎵','✍️','🧩','🔔','🌈','💰','🧪','📸','🌿','🎸','🏋️','🎭','🖥️'];
const COLORS=['#4a9fd4','#1a3a6b','#2d6aa0','#3AAA35','#e67e22','#8e44ad','#ef4b1f','#e74c3c','#16a085','#f39c12','#2980b9','#27ae60','#d35400','#c0392b','#1abc9c','#7f8c8d','#e91e63','#795548'];
const SK='tracker:sessions-v4',PK='tracker:projects-v2',CFG='tracker:config-v1';

let sessions  = JSON.parse(localStorage.getItem(SK)||'[]');
let projects  = JSON.parse(localStorage.getItem(PK)||'null')||DEFAULT_PROJECTS.map(p=>({...p}));
let cfg       = JSON.parse(localStorage.getItem(CFG)||'{}');
let sheetsUrl = cfg.sheetsUrl||'';
let sheetsOn  = cfg.sheetsOn||false;

// Multi-timer state
let activeTimers = {};  // {pid: startTimestamp}
let tickIntvl    = null;

let view='tracker', showManual=false, syncing=false;
let toast=null, toastTimer=null;
let newProj={name:'',emoji:'🚀',color:'#4a9fd4'};
let mData={projectId:projects[0]?.id||'',hours:'',minutes:'',date:td(),notes:''};
let EP=null;

function saveSess(){localStorage.setItem(SK,JSON.stringify(sessions));}
function saveProj(){localStorage.setItem(PK,JSON.stringify(projects));}
function saveCfg(){localStorage.setItem(CFG,JSON.stringify({sheetsUrl,sheetsOn}));}
function td(){return new Date().toISOString().split('T')[0];}
function fmtTime(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return[h,m,sc].map(v=>String(v).padStart(2,'0')).join(':');}
function fmtHrs(h){
  if(!h||h<0.008)return'—';
  const hh=Math.floor(h),mm=Math.round((h-hh)*60);
  if(mm===60)return`${hh+1}h`;if(hh===0)return`${mm}min`;if(mm===0)return`${hh}h`;return`${hh}h ${mm}min`;
}
function fmtDate(iso){if(!iso)return'';return new Date(iso+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});}
function getTotals(){
  return projects.map(p=>{
    const ps=sessions.filter(s=>s.projectId===p.id);
    const total=ps.reduce((a,s)=>a+s.duration,0);
    const startDate=ps.length>0?[...ps].map(s=>s.date).sort()[0]:null;
    return{...p,total,startDate};
  });
}
function grandTotal(t){return t.reduce((a,p)=>a+p.total,0);}
function pendingCount(){return sessions.filter(s=>!s.synced).length;}
function activeCount(){return Object.keys(activeTimers).length;}

function showToast(msg){
  toast=msg;render();clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{toast=null;render();},3000);
}

// ── BANNER (vive fuera de #app — nunca se destruye) ───────────
// Se llama cada segundo desde el tick Y cuando cambia el estado
function renderBanner(){
  const b=document.getElementById('banner_div');
  if(!b)return;
  const now=Date.now();
  const pids=Object.keys(activeTimers);

  if(pids.length===0){b.innerHTML='';return;}

  // Calcula elapsed actualizado en cada llamada
  const chips=pids.map(pid=>{
    const p=projects.find(x=>x.id===pid);
    const secs=Math.floor((now-activeTimers[pid])/1000);
    const col=p?.color||'#4a9fd4';
    return`<div class="timer-chip" style="border:1px solid ${col}40">
      <span style="font-size:16px">${p?.emoji||'⏱'}</span>
      <div>
        <div style="color:#fff;font-weight:700;font-size:12px;line-height:1.2">${p?.name||pid}</div>
        <div style="color:${col};font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;line-height:1">${fmtTime(secs)}</div>
      </div>
      <button onclick="stopTimer('${pid}')" class="btn" style="background:${col};color:#fff;padding:5px 10px;font-size:11px;flex-shrink:0">⏹ Stop</button>
    </div>`;
  }).join('');

  b.innerHTML=`
  <div style="background:#0d1b3e;padding:10px 16px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:6px">
        <div style="width:8px;height:8px;border-radius:50%;background:#3AAA35;animation:blink 1.4s ease-in-out infinite"></div>
        <span style="color:#7ab3d4;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">${pids.length} activo${pids.length!==1?'s':''}</span>
      </div>
      ${pids.length>1?`<button onclick="stopAll()" class="btn" style="background:rgba(239,75,31,.8);color:#fff;padding:5px 12px;font-size:11px">⏹ Detener todos</button>`:''}
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">${chips}</div>
  </div>`;
}

// ── TIMER ─────────────────────────────────────────────────────
function startTimer(pid){
  // Toggle: si ya corre, lo detiene
  if(pid in activeTimers){stopTimer(pid);return;}

  activeTimers[pid]=Date.now();
  renderBanner(); // actualiza el banner inmediatamente

  if(!tickIntvl){
    // Un solo intervalo global que actualiza el banner cada segundo
    tickIntvl=setInterval(renderBanner, 1000);
  }
  render(); // actualiza las tarjetas (colores, botones)
}

async function stopTimer(pid, notify=true){
  if(!(pid in activeTimers))return;
  const dur=(Date.now()-activeTimers[pid])/3600000;
  delete activeTimers[pid];

  if(Object.keys(activeTimers).length===0){
    clearInterval(tickIntvl);tickIntvl=null;
  }

  renderBanner(); // actualiza banner inmediatamente

  if(dur>=0.005){
    const s={id:Date.now(),projectId:pid,date:td(),duration:dur,notes:'',type:'timer',synced:false};
    sessions.unshift(s);saveSess();
    if(notify)showToast('✅ '+fmtHrs(dur)+' — '+(projects.find(p=>p.id===pid)?.name||''));
    syncOne(s);
  } else {
    render();
  }
}

async function stopAll(){
  const pids=Object.keys(activeTimers);
  if(!pids.length)return;
  for(const pid of pids) await stopTimer(pid,false);
  showToast('✅ '+pids.length+' cronómetro'+(pids.length!==1?'s':'')+' detenido'+(pids.length!==1?'s':''));
}

async function saveManual(){
  const dur=parseFloat(mData.hours||0)+parseFloat(mData.minutes||0)/60;
  if(dur<=0)return;
  const s={id:Date.now(),projectId:mData.projectId,date:mData.date,duration:dur,notes:mData.notes,type:'manual',synced:false};
  sessions.unshift(s);saveSess();
  showToast('✅ '+fmtHrs(dur)+' registradas');
  mData={projectId:mData.projectId,hours:'',minutes:'',date:td(),notes:''};
  showManual=false;syncOne(s);render();
}
function delSession(id){sessions=sessions.filter(s=>s.id!==id);saveSess();render();}
function delAll(){if(confirm('¿Borrar todo el historial?')){sessions=[];saveSess();render();}}

// ── Projects ──────────────────────────────────────────────────
function addProject(){
  const name=newProj.name.trim();
  if(!name){showToast('⚠️ Escribe un nombre');return;}
  projects.push({id:'p_'+Date.now(),name,full:name,emoji:newProj.emoji,color:newProj.color,isDefault:false});
  saveProj();showToast('✅ "'+name+'" creado');
  newProj={name:'',emoji:'🚀',color:'#4a9fd4'};render();
}

function editProject(id){
  const p=projects.find(x=>x.id===id);if(!p)return;
  const ps=sessions.filter(s=>s.projectId===id);
  const total=ps.reduce((a,s)=>a+s.duration,0);
  const startDate=ps.length>0?[...ps].map(s=>s.date).sort()[0]:td();
  EP={id,name:p.name,full:p.full,emoji:p.emoji,color:p.color,
    editHours:Math.floor(total),editMinutes:Math.round((total-Math.floor(total))*60),
    editStartDate:startDate,origTotal:total,
    origStartDate:ps.length>0?[...ps].map(s=>s.date).sort()[0]:null,sessionCount:ps.length};
  document.getElementById('em_subtitle').textContent=p.full;
  document.getElementById('em_name').value=EP.name;
  document.getElementById('em_current').innerHTML='<strong>Actualmente:</strong> '+fmtHrs(EP.origTotal)+' · Desde: '+(EP.origStartDate?fmtDate(EP.origStartDate):'Sin sesiones')+' · '+EP.sessionCount+' sesión'+(EP.sessionCount!==1?'es':'');
  document.getElementById('em_hours').value=EP.editHours;
  document.getElementById('em_minutes').value=EP.editMinutes;
  document.getElementById('em_date').value=EP.editStartDate;
  document.getElementById('em_prev_name').textContent=EP.name;
  document.getElementById('em_warn').style.display='none';
  document.getElementById('em_prev_box').style.background=EP.color;
  document.getElementById('em_prev_emoji').textContent=EP.emoji;
  document.getElementById('em_emojis').innerHTML=EMOJIS.map(e=>
    `<span class="emoji-opt${EP.emoji===e?' sel':''}" onclick="pickEmoji('${e}')">${e}</span>`).join('')+
    `<input type="text" maxlength="2" placeholder="✏️" oninput="pickEmoji(this.value||'🚀')" style="width:38px;height:36px;text-align:center;font-size:17px;padding:4px;flex-shrink:0;border:1px solid #dde1e9;border-radius:7px;font-family:'Manrope',sans-serif">`;
  document.getElementById('em_colors').innerHTML=COLORS.map(c=>
    `<div class="color-dot${EP.color===c?' sel':''}" style="background:${c}" onclick="pickColor('${c}')"></div>`).join('')+
    `<input type="color" value="${EP.color}" oninput="pickColor(this.value)" style="width:24px;height:24px;border-radius:50%;padding:0;border:2px solid #dde1e9;cursor:pointer">`;
  document.getElementById('edit_modal').style.display='flex';
}
function pickEmoji(e){if(!EP)return;EP.emoji=e;document.getElementById('em_prev_emoji').textContent=e;document.querySelectorAll('#em_emojis .emoji-opt').forEach(x=>x.classList.toggle('sel',x.textContent===e));}
function pickColor(c){if(!EP)return;EP.color=c;document.getElementById('em_prev_box').style.background=c;document.querySelectorAll('#em_colors .color-dot').forEach(x=>x.classList.toggle('sel',x.getAttribute('onclick')===`pickColor('${c}')`));}
function updWarn(){if(!EP)return;const nd=parseFloat(EP.editHours||0)+parseFloat(EP.editMinutes||0)/60;const w=document.getElementById('em_warn');if(w)w.style.display=(Math.abs(nd-(EP.origTotal||0))>0.008||EP.editStartDate!==EP.origStartDate)?'flex':'none';}
function saveEdit(){
  if(!EP)return;const name=EP.name.trim();if(!name){showToast('⚠️ Nombre vacío');return;}
  const idx=projects.findIndex(p=>p.id===EP.id);
  if(idx>=0){projects[idx]={...projects[idx],name,full:name,emoji:EP.emoji,color:EP.color};saveProj();}
  const nd=parseFloat(EP.editHours||0)+parseFloat(EP.editMinutes||0)/60;
  if(Math.abs(nd-(EP.origTotal||0))>0.008||EP.editStartDate!==EP.origStartDate){
    sessions=sessions.filter(s=>s.projectId!==EP.id);
    if(nd>0){const s={id:Date.now(),projectId:EP.id,date:EP.editStartDate||td(),duration:nd,notes:'✏️ Ajuste manual',type:'manual',synced:false};sessions.unshift(s);syncOne(s);}
    saveSess();
  }
  document.getElementById('edit_modal').style.display='none';EP=null;showToast('✅ Proyecto actualizado');render();
}
function closeEdit(){document.getElementById('edit_modal').style.display='none';EP=null;}

function resetProject(id){
  if(id in activeTimers)stopTimer(id,false);
  const proj=projects.find(p=>p.id===id),cnt=sessions.filter(s=>s.projectId===id).length;
  if(cnt===0){showToast('ℹ️ No hay sesiones que reiniciar');return;}
  if(!confirm(`¿Reiniciar "${proj?.full}"?\nSe borrarán ${cnt} sesión(es).`))return;
  sessions=sessions.filter(s=>s.projectId!==id);saveSess();showToast('🔄 "'+proj?.name+'" reiniciado');render();
}
function deleteProject(id){
  if(id in activeTimers)stopTimer(id,false);
  const proj=projects.find(p=>p.id===id),cnt=sessions.filter(s=>s.projectId===id).length;
  let msg=`¿Eliminar "${proj?.full}"?`;if(cnt>0)msg+=`\nSe borrarán ${cnt} sesión(es).`;
  if(!confirm(msg))return;
  projects=projects.filter(p=>p.id!==id);sessions=sessions.filter(s=>s.projectId!==id);
  saveSess();saveProj();showToast('🗑 "'+proj?.name+'" eliminado');render();
}

// ── Sheets ────────────────────────────────────────────────────
async function syncOne(session){
  if(!sheetsOn||!sheetsUrl)return;
  try{
    const proj=projects.find(p=>p.id===session.projectId);
    await fetch(sheetsUrl,{method:'POST',mode:'no-cors',body:JSON.stringify({
      id:String(session.id),projectName:proj?.full||'—',date:session.date,
      duration:Math.round(session.duration*1000)/1000,durationFormatted:fmtHrs(session.duration),
      notes:session.notes||'',type:session.type
    })});
    session.synced=true;saveSess();render();
  }catch(e){}
}
async function syncPending(){
  if(syncing||!sheetsOn||!sheetsUrl)return;
  const pending=sessions.filter(s=>!s.synced);
  if(!pending.length){showToast('✅ Todo ya sincronizado');return;}

  for(const s of pending)await syncOne(s);
  syncing=false;render();showToast('☁️ Sesiones enviadas a Sheets');
}
async function testConn(){
  if(!sheetsUrl){showToast('⚠️ Primero pega la URL');return;}
  showToast('🔄 Probando…');
  try{await fetch(sheetsUrl,{mode:'no-cors'});showToast('✅ URL válida');}
  catch(e){showToast('❌ No se pudo conectar');}
}

// ── SVG Donut ─────────────────────────────────────────────────
function svgDonut(totals,gt){
  const R=72,CX=120,CY=120,r=44,circ=2*Math.PI*R;
  const slices=totals.filter(p=>p.total>0);
  if(!slices.length)return`<text x="${CX}" y="${CY+5}" text-anchor="middle" fill="#8a90a0" font-family="Manrope" font-size="12">Sin datos</text>`;
  let offset=0,paths='';
  slices.forEach(p=>{
    const pct=p.total/gt,dash=pct*circ;
    paths+=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${p.color}" stroke-width="26" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${CX} ${CY})"/>`;
    if(pct>0.07){const ang=(offset+dash/2)/circ*2*Math.PI-Math.PI/2;const lx=CX+Math.cos(ang)*(R+16),ly=CY+Math.sin(ang)*(R+16);paths+=`<text x="${lx}" y="${ly+4}" text-anchor="middle" fill="#fff" font-family="Manrope" font-size="9" font-weight="700">${Math.round(pct*100)}%</text>`;}
    offset+=dash;
  });
  paths+=`<circle cx="${CX}" cy="${CY}" r="${r}" fill="white"/>`;
  paths+=`<text x="${CX}" y="${CY-5}" text-anchor="middle" fill="#1a2035" font-family="Manrope" font-size="11" font-weight="700">Total</text>`;
  paths+=`<text x="${CX}" y="${CY+13}" text-anchor="middle" fill="#1a3a6b" font-family="Manrope" font-size="14" font-weight="800">${fmtHrs(gt)}</text>`;
  return paths;
}

    <div style="font-weight:700;font-size:14px;color:#1a2035;margin-bottom:3px">🔗 URL del Web App</div>
    <div style="font-size:12px;color:#8a90a0;margin-bottom:12px">Pégala aquí después de configurar el Apps Script</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <input type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${sheetsUrl}" oninput="sheetsUrl=this.value">
      <div class="btn-row" style="display:flex;gap:8px">
        <button class="btn" onclick="testConn()" style="background:#f0f6ff;color:#2d6aa0;border:1px solid #c8d9f0;padding:10px;flex:1">🔌 Probar URL</button>
        <button class="btn" onclick="saveCfg();showToast('✅ URL guardada')" style="background:#1a3a6b;color:#fff;padding:10px;flex:1">💾 Guardar</button>
      </div>
    </div>
  </div>
  `:''}

  </div>`;
}

function setView(v){view=v;render();}
function toggleManual(){showManual=!showManual;render();}
render();
</script>
