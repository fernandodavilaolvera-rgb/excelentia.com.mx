<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wonderville · Dashboard de Ventas</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060d0b; --card: #0d1f18; --border: #1a3d2a;
    --neon: #00ff88; --cyan: #00e5ff; --magenta: #ff2d78;
    --orange: #ff9500; --yellow: #ffe600;
    --text: #f0fff8; --muted: #9dcfb5; --dim: #2a4a38;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; min-height: 100vh; overflow-x: hidden; }

  #node-canvas { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; opacity:0.55; }
  .content { position: relative; z-index: 1; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 2rem; border-bottom: 1px solid var(--border);
    background: rgba(6,13,11,0.9); backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 100; gap: 1rem; flex-wrap: wrap;
  }
  .header-logo { height: 48px; width: auto; border-radius: 8px; }
  .header-title { font-family: 'Black Ops One', cursive; font-size: 1.3rem; color: var(--neon); text-shadow: 0 0 20px rgba(0,255,136,0.6); letter-spacing: 1px; line-height: 1.2; }
  .header-title span { display: block; font-family: 'Nunito', sans-serif; font-size: 0.72rem; font-weight: 800; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; }
  .header-right { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }

  /* Pestañas */
  .tabs-wrap { max-width: 1300px; margin: 1.5rem auto 0; padding: 0 2rem; }
  .tabs { display: inline-flex; gap: 0.4rem; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 0.4rem; }
  .tab-btn { font-family: 'Black Ops One', cursive; font-size: 0.72rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); background: transparent; border: none; border-radius: 10px; padding: 0.65rem 1.3rem; cursor: pointer; transition: all 0.2s; }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--bg); background: var(--neon); box-shadow: 0 0 15px rgba(0,255,136,0.4); }
  .pane { display: none; }
  .pane.active { display: block; }

  main { padding: 1.5rem 2rem 2rem; max-width: 1300px; margin: 0 auto; }
  .section-title { font-family: 'Black Ops One', cursive; font-size: 0.72rem; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); margin-top: 2rem; }
  .section-title:first-child { margin-top: 0; }

  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1rem; }
  .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.4rem 1.2rem; position: relative; overflow: hidden; transition: transform 0.2s; }
  .kpi-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius:16px 16px 0 0; }
  .kpi-card.green::before  { background: var(--neon); }
  .kpi-card.cyan::before   { background: var(--cyan); }
  .kpi-card.magenta::before { background: var(--magenta); }
  .kpi-card.orange::before { background: var(--orange); }
  .kpi-card:hover { transform: translateY(-3px); }
  .kpi-label { font-size: 0.7rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem; }
  .kpi-value { font-family: 'Black Ops One', cursive; font-size: 2rem; line-height: 1; margin-bottom: 0.3rem; }
  .kpi-card.green  .kpi-value { color: var(--neon);    text-shadow: 0 0 20px rgba(0,255,136,0.4); }
  .kpi-card.cyan   .kpi-value { color: var(--cyan);    text-shadow: 0 0 20px rgba(0,229,255,0.4); }
  .kpi-card.magenta .kpi-value { color: var(--magenta); text-shadow: 0 0 20px rgba(255,45,120,0.4); }
  .kpi-card.orange .kpi-value { color: var(--orange);  text-shadow: 0 0 20px rgba(255,149,0,0.4); }
  .kpi-sub { font-size: 0.74rem; color: var(--muted); font-weight: 700; }

  .semana-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.7rem; margin-bottom: 1rem; }
  .semana-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 0.85rem; transition: transform 0.2s; }
  .semana-card:hover { transform: translateY(-3px); border-color: var(--dim); }
  .semana-num { font-family: 'Black Ops One', cursive; font-size: 0.58rem; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 0.3rem; }
  .semana-date { font-size: 0.64rem; font-weight: 800; color: #5a8a72; margin-bottom: 0.15rem; }
  .semana-rango { font-size: 0.56rem; font-weight: 700; color: var(--dim); margin-bottom: 0.8rem; }
  .semana-total { font-family: 'Black Ops One', cursive; font-size: 1.25rem; color: var(--neon); text-shadow: 0 0 15px rgba(0,255,136,0.35); margin-bottom: 0.8rem; }
  .semana-breakdown { display: flex; flex-direction: column; gap: 0.25rem; }
  .semana-row { display: flex; justify-content: space-between; }
  .semana-key { font-size: 0.6rem; color: var(--muted); font-weight: 700; }
  .semana-val { font-size: 0.6rem; color: var(--text); font-weight: 800; }
  .semana-divider { height: 1px; background: var(--border); margin: 0.4rem 0; }

  .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; }
  .chart-card h3 { font-family: 'Black Ops One', cursive; font-size: 0.78rem; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 1.2rem; }
  .full-chart { margin-bottom: 1rem; }
  .bar-legend { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .bar-legend-item { display: flex; align-items: center; gap: 0.4rem; }
  .bar-legend-dot { width: 10px; height: 10px; border-radius: 3px; }
  .bar-legend-text { font-size: 0.68rem; font-weight: 800; color: var(--muted); }
  .stacked-bars { display: flex; align-items: flex-end; gap: 0.6rem; height: 260px; justify-content: flex-start; overflow-x: auto; padding-bottom: 6px; }
  .stacked-bar-wrap { flex: 0 0 120px; display: flex; flex-direction: column; align-items: center; gap: 0.4rem; height: 100%; justify-content: flex-end; min-width: 120px; }
  .stacked-bar-col { width: 100%; display: flex; flex-direction: column; border-radius: 6px 6px 0 0; overflow: hidden; }
  .stacked-bar-val { font-family: 'Black Ops One', cursive; font-size: 0.64rem; color: var(--text); text-align: center; white-space: nowrap; }
  .stacked-bar-label { font-size: 0.64rem; font-weight: 800; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; text-align: center; }
  .stacked-bar-date { font-size: 0.5rem; color: #5a8a72; font-weight: 700; text-align: center; }

  .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1rem; }
  .chart-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
  .chart-card-header h3 { margin-bottom: 0; }
  .chart-total-badge { font-family: 'Black Ops One', cursive; font-size: 0.85rem; color: var(--neon); background: rgba(0,255,136,0.08); border: 1px solid rgba(0,255,136,0.25); padding: 0.25rem 0.7rem; border-radius: 20px; white-space: nowrap; }
  .prod-bars { display: flex; flex-direction: column; gap: 1rem; }
  .prod-bar-row { display: flex; flex-direction: column; gap: 0.3rem; }
  .prod-bar-top { display: flex; justify-content: space-between; align-items: baseline; }
  .prod-name { font-size: 0.74rem; font-weight: 800; color: var(--text); }
  .prod-stats { font-size: 0.7rem; color: var(--muted); font-weight: 700; }
  .prod-track { height: 6px; background: var(--dim); border-radius: 10px; overflow: hidden; }
  .prod-fill { height: 100%; border-radius: 10px; }
  .est-note { font-size: 0.62rem; color: var(--dim); font-weight: 700; margin-top: 0.8rem; font-style: italic; }

  .char-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0.7rem; margin-bottom: 1rem; }
  .char-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 0.5rem 0.8rem; text-align: center; transition: transform 0.2s; overflow: hidden; }
  .char-card:hover { transform: translateY(-4px); border-color: var(--cyan); }
  .char-card.concurso { border-color: var(--orange); }
  .char-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; margin-bottom: 0.5rem; display: block; }
  .char-img-placeholder { width: 100%; aspect-ratio: 1; border-radius: 8px; margin-bottom: 0.5rem; background: var(--dim); display: none; align-items: center; justify-content: center; font-size: 1.5rem; }
  .char-img-placeholder.show { display: flex; }
  .char-card.concurso .char-img-placeholder { font-size: 3.2rem; }
  .char-name { font-size: 0.58rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.4rem; }
  .char-qty { font-family: 'Black Ops One', cursive; font-size: 1.4rem; color: var(--cyan); text-shadow: 0 0 10px rgba(0,229,255,0.4); }
  .char-card.concurso .char-qty { color: var(--orange); text-shadow: 0 0 10px rgba(255,149,0,0.4); }
  .char-monto { font-size: 0.6rem; color: #5a8a72; font-weight: 700; }

  .accordion-list { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1rem; }
  .accordion-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .accordion-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.2rem; cursor: pointer; transition: background 0.2s; user-select: none; }
  .accordion-header:hover { background: rgba(0,255,136,0.05); }
  .accordion-left { display: flex; align-items: center; gap: 0.8rem; }
  .accordion-sem { font-family: 'Black Ops One', cursive; font-size: 0.72rem; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .accordion-date { font-size: 0.68rem; font-weight: 700; color: #5a8a72; }
  .accordion-badge { font-family: 'Black Ops One', cursive; font-size: 0.78rem; padding: 0.2rem 0.7rem; border-radius: 20px; background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.25); color: var(--cyan); white-space: nowrap; }
  .accordion-badge.zero { background: rgba(255,255,255,0.04); border-color: var(--border); color: var(--muted); }
  .accordion-arrow { color: var(--muted); font-size: 0.8rem; transition: transform 0.25s; flex-shrink: 0; }
  .accordion-item.open .accordion-arrow { transform: rotate(180deg); }
  .accordion-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; border-top: 0px solid var(--border); }
  .accordion-item.open .accordion-body { max-height: 600px; border-top: 1px solid var(--border); }
  .accordion-inner { padding: 1rem 1.2rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .accordion-empty { font-size: 0.75rem; color: var(--muted); font-style: italic; }
  .char-row { display: flex; align-items: center; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px solid rgba(26,61,42,0.5); }
  .char-row:last-child { border-bottom: none; }
  .char-row-left { display: flex; align-items: center; gap: 0.7rem; }
  .char-thumb { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
  .char-thumb-placeholder { width: 32px; height: 32px; border-radius: 6px; background: var(--dim); display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
  .char-row-name { font-size: 0.75rem; font-weight: 800; color: var(--text); }
  .char-row-right { display: flex; align-items: center; gap: 0.8rem; }
  .char-row-qty { font-family: 'Black Ops One', cursive; font-size: 1rem; color: var(--cyan); }
  .char-row-monto { font-size: 0.68rem; color: var(--muted); font-weight: 700; }

  /* Estados T2 */
  .status-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 3rem 2rem; text-align: center; max-width: 720px; margin: 2rem auto; }
  .status-emoji { font-size: 2.5rem; margin-bottom: 1rem; }
  .status-title { font-family: 'Black Ops One', cursive; font-size: 1rem; color: var(--neon); letter-spacing: 1px; margin-bottom: 0.6rem; }
  .status-text { font-size: 0.85rem; color: var(--muted); font-weight: 700; line-height: 1.5; }
  .spinner { width: 42px; height: 42px; border: 4px solid var(--dim); border-top-color: var(--neon); border-radius: 50%; margin: 0 auto 1.2rem; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .t2-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .t2-status { font-size: 0.7rem; font-weight: 800; color: var(--muted); letter-spacing: 0.5px; }
  .t2-status b { color: var(--neon); }
  .btn-refresh { font-family: 'Nunito', sans-serif; font-size: 0.72rem; font-weight: 900; letter-spacing: 0.5px; color: var(--bg); background: var(--cyan); border: none; border-radius: 10px; padding: 0.55rem 1.1rem; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 12px rgba(0,229,255,0.35); }
  .btn-refresh:hover { transform: translateY(-2px); }
  .btn-refresh:disabled { opacity: 0.5; cursor: default; transform: none; }

  footer { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.7rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; border-top: 1px solid var(--border); margin-top: 1rem; }

  @media (max-width: 1100px) { .char-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 900px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .products-grid { grid-template-columns: 1fr; }
    .char-grid { grid-template-columns: repeat(4, 1fr); }
    .semana-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 600px) {
    main { padding: 1rem; }
    header { padding: 0.8rem 1rem; }
    .tabs-wrap { padding: 0 1rem; }
    .header-title { font-size: 0.95rem; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
    .kpi-value { font-size: 1.4rem; }
    .semana-grid { grid-template-columns: repeat(2, 1fr); }
    .char-grid { grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
    .stacked-bars { height: 150px; gap: 0.4rem; overflow-x: auto; padding-bottom: 4px; }
    .stacked-bar-wrap { flex: 0 0 92px; min-width: 92px; }
    .stacked-bar-val { font-size: 0.42rem; }
    .stacked-bar-label { font-size: 0.4rem; }
    .stacked-bar-date { font-size: 0.36rem; }
    .products-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<canvas id="node-canvas"></canvas>
<div class="content">

<header>
  <img src="https://excelentia.com.mx/assets/logo_ride_the_cyclone.jpg" alt="RTC" class="header-logo" onerror="this.style.display='none'">
  <div class="header-title">
    WONDERVILLE STORE
    <span>Dashboard de Ventas · Ride the Cyclone</span>
  </div>
  <div class="header-right">
    <div class="t2-status" id="globalBadge">Temporada 2 en curso</div>
  </div>
</header>

<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab-btn" id="tabBtn-t1" onclick="switchTab('t1')">Temporada 1</button>
    <button class="tab-btn active" id="tabBtn-t2" onclick="switchTab('t2')">Temporada 2</button>
  </div>
</div>

<main>
  <div class="pane" id="pane-t1"></div>
  <div class="pane active" id="pane-t2">
    <div class="status-box" id="t2-loading">
      <div class="spinner"></div>
      <div class="status-title">Leyendo tu Sheet…</div>
      <div class="status-text">Cargando las ventas de la Temporada 2.</div>
    </div>
  </div>
</main>

<footer>Wonderville Store · Ride the Cyclone · Powered by Ferrock</footer>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const GITHUB = 'https://raw.githubusercontent.com/fernandodavilaolvera-rgb/excelentia.com.mx/main/assets/rtc/';

// Sheet 2 (el que llena Fernando manualmente y lee el dashboard)
const SHEET2_ID = '1qfA1TbscRI_86owZhzKgalMBY6-ZMI4ZojOLjrPOZNc';
const GVIZ_URL  = `https://docs.google.com/spreadsheets/d/${SHEET2_ID}/gviz/tq?tqx=out:json&gid=0`;

// Semana 1 de la Temporada 2 = lunes 20 de julio 2026 (funciones los martes)
const INICIO_T2 = new Date(2026, 6, 20); // mes 6 = julio

// Precios base SOLO para estimar recaudación por producto (el dinero real sale del Sheet)
const PRECIOS = { playera:350, oraculo:150, sticker:120, bolsa:210, gorra:150 };

// Personajes con playera (los 7). 'col' = índice de columna en el Sheet (A=0)
const CHARS = [
  { key:'Constance', col:7,  img:'Constance.png',  fb:'💀' },
  { key:'Jane Doe',  col:5,  img:'Jane%20Doe.png', fb:'🔱' },
  { key:'Ocean',     col:6,  img:'Ocean.png',      fb:'🌊' },
  { key:'Mischa',    col:9,  img:'Mischa.png',      fb:'🦋' },
  { key:'Noel',      col:8,  img:'Noel.png',        fb:'⚡' },
  { key:'Ricky',     col:10, img:'Ricky.png',       fb:'🎸' },
  { key:'Karnak',    col:11, img:'Karnak.png',      fb:'🏺' },
];
const CHAR_KEYS = CHARS.map(c => c.key);
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* ============================================================
   DATOS TEMPORADA 1 (fijos)
   ============================================================ */
const SEMANAS_T1 = [
  { num:1, fecha:'21 Abr 2026', efectivo:6270, tarjeta:0, transfer:810, total:7080,
    bolsas:9, stickers:6, oraculos:30, gorras:0, playeras:0, chars:{} },
  { num:2, fecha:'28 Abr 2026', efectivo:8450, tarjeta:0, transfer:5540, total:13990,
    bolsas:6, stickers:11, oraculos:12, gorras:6, playeras:25, chars:{} },
  { num:3, fecha:'5 May 2026', efectivo:7860, tarjeta:0, transfer:2010, total:9870,
    bolsas:4, stickers:4, oraculos:15, gorras:3, playeras:17, chars:{} },
  { num:4, fecha:'12 May 2026', efectivo:6130, tarjeta:0, transfer:4840, total:10970,
    bolsas:6, stickers:3, oraculos:20, gorras:4, playeras:17,
    chars:{'Constance':2,'Ricky':4,'Noel':6,'Karnak':3,'Ocean':2} },
  { num:5, fecha:'19 May 2026', efectivo:3990, tarjeta:0, transfer:3410, total:7400,
    bolsas:0, stickers:15, oraculos:0, gorras:0, playeras:16,
    chars:{'Mischa':3,'Ricky':6,'Noel':1,'Karnak':1,'Ocean':2,'Jane Doe':3} },
  { num:6, fecha:'26 May 2026', efectivo:6830, tarjeta:0, transfer:1300, total:8130,
    bolsas:4, stickers:5, oraculos:15, gorras:3, playeras:12,
    chars:{'Constance':1,'Ricky':1,'Karnak':2,'Ocean':4,'Mischa':4} },
  { num:7, fecha:'2 Jun 2026', efectivo:3490, tarjeta:0, transfer:2660, total:6150,
    bolsas:1, stickers:2, oraculos:17, gorras:0, playeras:9,
    chars:{'Constance':1,'Jane Doe':3,'Ocean':1,'Mischa':1,'Noel':2,'Ricky':1,'Karnak':0} },
  { num:8, fecha:'9 Jun 2026', efectivo:4690, tarjeta:0, transfer:4090, total:8780,
    bolsas:5, stickers:4, oraculos:18, gorras:0, playeras:13,
    chars:{'Constance':1,'Ricky':2,'Noel':3,'Karnak':2,'Ocean':3,'Mischa':1,'Jane Doe':1} },
  { num:9, fecha:'16 Jun 2026', efectivo:3140, tarjeta:0, transfer:4870, total:8010,
    bolsas:0, stickers:3, oraculos:9, gorras:0, playeras:18,
    chars:{'Constance':0,'Ricky':6,'Noel':2,'Karnak':1,'Ocean':2,'Mischa':2,'Jane Doe':5} },
  { num:10, fecha:'23 Jun 2026', efectivo:12220, tarjeta:0, transfer:4240, total:16460,
    bolsas:1, stickers:10, oraculos:30, gorras:4, playeras:16,
    chars:{'Constance':0,'Ricky':3,'Noel':0,'Karnak':6,'Ocean':0,'Mischa':0,'Jane Doe':7},
    especiales:{'Concurso':11} },
];

/* ============================================================
   UTILIDADES
   ============================================================ */
function money(n){ return '$' + Math.round(n).toLocaleString('es-MX'); }
function pct(part, whole){ return whole > 0 ? (part/whole*100).toFixed(1) + '%' : '0%'; }

function esc(str){ return String(str).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Playeras de una semana = SOLO los 7 personajes (los especiales van aparte)
function totalPlayeras(s){
  if (typeof s.playeras === 'number') return s.playeras;
  return Object.entries(s.chars || {}).filter(([k]) => CHAR_KEYS.includes(k)).reduce((a,[,v]) => a+v, 0);
}
// Diseños especiales de una semana (Art en T2, Concurso en T1): junta s.especiales + claves no-personaje de chars
function especialesDe(s){
  const e = Object.assign({}, s.especiales || {});
  Object.entries(s.chars || {}).forEach(([k,v]) => { if (!CHAR_KEYS.includes(k)) e[k] = (e[k]||0) + v; });
  return e;
}
function totalEspeciales(s){ return Object.values(especialesDe(s)).reduce((a,v) => a+v, 0); }

/* ============================================================
   RENDER DE UNA TEMPORADA (sirve para T1 y T2)
   ============================================================ */
function renderTemporada(semanas, paneEl){
  const tot = {
    total:0, efectivo:0, tarjeta:0, transfer:0,
    bolsas:0, stickers:0, oraculos:0, gorras:0, playeras:0, especiales:0, espRev:0, piezas:0
  };
  const charTotals = {};
  const specialTotals = {};
  CHAR_KEYS.forEach(k => charTotals[k] = 0);

  semanas.forEach(s => {
    tot.total    += s.total    || 0;
    tot.efectivo += s.efectivo || 0;
    tot.tarjeta  += s.tarjeta  || 0;
    tot.transfer += s.transfer || 0;
    tot.bolsas   += s.bolsas   || 0;
    tot.stickers += s.stickers || 0;
    tot.oraculos += s.oraculos || 0;
    tot.gorras   += s.gorras   || 0;
    tot.playeras += totalPlayeras(s);
    tot.espRev   += s.espRev || 0;
    // personajes
    Object.entries(s.chars || {}).forEach(([k,v]) => {
      if (CHAR_KEYS.includes(k)) charTotals[k] = (charTotals[k]||0) + v;
    });
    // especiales (nombre real / Art / Concurso) — se agrupan ignorando
    // mayúsculas y acentos, pero se muestran como se escribieron la 1a vez
    Object.entries(especialesDe(s)).forEach(([k,v]) => {
      const key = normaliza(k);
      if (!specialTotals[key]) specialTotals[key] = { name: k, qty: 0 };
      specialTotals[key].qty += v;
      tot.especiales += v;
    });
  });
  tot.piezas = tot.bolsas + tot.stickers + tot.oraculos + tot.gorras + tot.playeras + tot.especiales;
  const nfunc = semanas.length;
  const prom = nfunc ? tot.total / nfunc : 0;

  /* ---- KPIs ---- */
  let html = `<p class="section-title">Resumen General</p><div class="kpi-grid">
    <div class="kpi-card green">
      <div class="kpi-label">Total Acumulado</div>
      <div class="kpi-value">${money(tot.total)}</div>
      <div class="kpi-sub">${nfunc} func · ${tot.piezas} piezas · ${money(prom)} prom</div>
    </div>
    <div class="kpi-card cyan">
      <div class="kpi-label">Efectivo</div>
      <div class="kpi-value">${money(tot.efectivo)}</div>
      <div class="kpi-sub">${pct(tot.efectivo, tot.total)} del total</div>
    </div>
    <div class="kpi-card magenta">
      <div class="kpi-label">Tarjeta</div>
      <div class="kpi-value">${money(tot.tarjeta)}</div>
      <div class="kpi-sub">${pct(tot.tarjeta, tot.total)} del total</div>
    </div>
    <div class="kpi-card orange">
      <div class="kpi-label">Transferencia</div>
      <div class="kpi-value">${money(tot.transfer)}</div>
      <div class="kpi-sub">${pct(tot.transfer, tot.total)} del total</div>
    </div>
  </div>`;

  /* ---- Por función (cards) ---- */
  html += `<p class="section-title">Por Función</p><div class="semana-grid">`;
  semanas.forEach(s => {
    const pl = totalPlayeras(s);
    const esp = totalEspeciales(s);
    const rango = s.rango ? `<div class="semana-rango">${esc(s.rango)}</div>` : '';
    html += `<div class="semana-card">
      <div class="semana-num">Función ${s.num}</div>
      <div class="semana-date">${esc(s.fecha)}</div>${rango}
      <div class="semana-total">${money(s.total)}</div>
      <div class="semana-breakdown">
        <div class="semana-row"><span class="semana-key">Efectivo</span><span class="semana-val">${money(s.efectivo)}</span></div>
        ${(s.tarjeta>0)?`<div class="semana-row"><span class="semana-key">Tarjeta</span><span class="semana-val">${money(s.tarjeta)}</span></div>`:''}
        <div class="semana-row"><span class="semana-key">Transfer</span><span class="semana-val">${money(s.transfer)}</span></div>
        <div class="semana-divider"></div>
        <div class="semana-row"><span class="semana-key">Bolsas</span><span class="semana-val">${s.bolsas||0}</span></div>
        <div class="semana-row"><span class="semana-key">Stickers</span><span class="semana-val">${s.stickers||0}</span></div>
        <div class="semana-row"><span class="semana-key">Oráculos</span><span class="semana-val">${s.oraculos||0}</span></div>
        <div class="semana-row"><span class="semana-key">Gorras</span><span class="semana-val">${s.gorras||0}</span></div>
        <div class="semana-row"><span class="semana-key">Playeras</span><span class="semana-val">${pl}</span></div>
        ${(esp>0)?`<div class="semana-row"><span class="semana-key" style="color:var(--orange)">Especiales</span><span class="semana-val" style="color:var(--orange)">${esp}</span></div>`:''}
      </div>
    </div>`;
  });
  html += `</div>`;

  /* ---- Gráfica por función (barras apiladas por forma de pago) ---- */
  html += `<p class="section-title">Recaudación por Función</p>
    <div class="chart-card full-chart">
      <div class="bar-legend">
        <div class="bar-legend-item"><span class="bar-legend-dot" style="background:var(--neon)"></span><span class="bar-legend-text">Efectivo</span></div>
        <div class="bar-legend-item"><span class="bar-legend-dot" style="background:var(--magenta)"></span><span class="bar-legend-text">Tarjeta</span></div>
        <div class="bar-legend-item"><span class="bar-legend-dot" style="background:var(--cyan)"></span><span class="bar-legend-text">Transfer</span></div>
      </div>
      <div class="stacked-bars">`;
  const MAX_PX = 210;
  const maxTotal = Math.max(1, ...semanas.map(s => s.total || 0));
  semanas.forEach(s => {
    const barPx = Math.round((s.total / maxTotal) * MAX_PX);
    const ePx = s.total ? Math.round((s.efectivo/s.total)*barPx) : 0;
    const taPx = s.total ? Math.round((s.tarjeta/s.total)*barPx) : 0;
    const trPx = Math.max(0, barPx - ePx - taPx);
    html += `<div class="stacked-bar-wrap">
      <div class="stacked-bar-val">$${(s.total/1000).toFixed(1)}k</div>
      <div class="stacked-bar-col" style="height:${barPx}px;">
        <div style="height:${trPx}px;background:var(--cyan);opacity:0.9;min-height:${trPx>0?2:0}px;"></div>
        <div style="height:${taPx}px;background:var(--magenta);min-height:${taPx>0?2:0}px;"></div>
        <div style="height:${ePx}px;background:var(--neon);min-height:${ePx>0?2:0}px;"></div>
      </div>
      <div class="stacked-bar-label">F${s.num}</div>
      <div class="stacked-bar-date">${esc((s.fecha||'').replace(/ \d{4}$/,''))}</div>
    </div>`;
  });
  html += `</div></div>`;

  /* ---- Rendimiento por producto ---- */
  const productos = [
    {name:'Playeras', qty:tot.playeras, rev:tot.playeras*PRECIOS.playera, color:'var(--magenta)'},
    {name:'Oráculos', qty:tot.oraculos, rev:tot.oraculos*PRECIOS.oraculo, color:'var(--cyan)'},
    {name:'Stickers', qty:tot.stickers, rev:tot.stickers*PRECIOS.sticker, color:'var(--neon)'},
    {name:'Bolsas',   qty:tot.bolsas,   rev:tot.bolsas*PRECIOS.bolsa,     color:'var(--orange)'},
    {name:'Gorras',   qty:tot.gorras,   rev:tot.gorras*PRECIOS.gorra,     color:'var(--yellow)'},
    // Especiales: precio variable por diseño → solo unidades, sin estimar dinero
    {name:'Especiales', qty:tot.especiales, rev:tot.espRev, color:'#ffb64a', sinRev: !(tot.espRev > 0)},
  ].sort((a,b) => b.qty - a.qty);
  const maxQ = Math.max(1, ...productos.map(p => p.qty));
  const maxR = Math.max(1, ...productos.filter(p => !p.sinRev).map(p => p.rev));
  let qBars = '', rBars = '';
  productos.forEach(p => {
    qBars += `<div class="prod-bar-row"><div class="prod-bar-top"><span class="prod-name">${p.name}</span><span class="prod-stats">${p.qty} unidades</span></div><div class="prod-track"><div class="prod-fill" style="width:${(p.qty/maxQ*100).toFixed(1)}%;background:${p.color}"></div></div></div>`;
    if (p.sinRev) return;
    rBars += `<div class="prod-bar-row"><div class="prod-bar-top"><span class="prod-name">${p.name}</span><span class="prod-stats">${money(p.rev)}</span></div><div class="prod-track"><div class="prod-fill" style="width:${(p.rev/maxR*100).toFixed(1)}%;background:${p.color}"></div></div></div>`;
  });
  html += `<p class="section-title">Rendimiento por Producto</p>
    <div class="products-grid">
      <div class="chart-card">
        <div class="chart-card-header"><h3>📦 Unidades vendidas</h3><span class="chart-total-badge">${tot.piezas} uds</span></div>
        <div class="prod-bars">${qBars}</div>
      </div>
      <div class="chart-card">
        <div class="chart-card-header"><h3>💰 Recaudación por producto</h3><span class="chart-total-badge">estimado</span></div>
        <div class="prod-bars">${rBars}</div>
        <div class="est-note">* Estimado con precios base. Los diseños especiales se calculan restando los productos de precio conocido al total real de cada venta. El dinero real total y por forma de pago sale directo del Sheet.</div>
      </div>
    </div>`;

  /* ---- Playeras por personaje (solo los 7) ---- */
  html += `<p class="section-title">Playeras · Total por Personaje</p><div class="char-grid">`;
  CHARS.forEach(ch => {
    const qty = charTotals[ch.key] || 0;
    html += `<div class="char-card">
      <img class="char-img" src="${GITHUB}${ch.img}" alt="${esc(ch.key)}" onerror="this.style.display='none';this.nextElementSibling.classList.add('show')">
      <div class="char-img-placeholder">${ch.fb}</div>
      <div class="char-name">${esc(ch.key)}</div>
      <div class="char-qty">${qty}</div>
      <div class="char-monto">${money(qty*PRECIOS.playera)}</div>
    </div>`;
  });
  html += `</div>`;

  /* ---- Diseños especiales (aparte de playeras) ---- */
  const specialEntries = Object.values(specialTotals)
    .filter(o => o.qty > 0).sort((a,b) => b.qty - a.qty);
  if (specialEntries.length){
    html += `<p class="section-title">Diseños Especiales</p><div class="char-grid">`;
    specialEntries.forEach(({name, qty}) => {
      html += `<div class="char-card concurso">
        <div class="char-img-placeholder show">🏆</div>
        <div class="char-name">${esc(name)}</div>
        <div class="char-qty">${qty}</div>
      </div>`;
    });
    html += `</div>`;
  }

  /* ---- Acordeón: detalle por función ---- */
  html += `<p class="section-title">Playeras · Detalle por Función</p><div class="accordion-list">`;
  semanas.forEach(s => {
    const pl = totalPlayeras(s);
    const esp = especialesDe(s);
    const espTot = totalEspeciales(s);
    const charEntries = Object.entries(s.chars || {}).filter(([k,v]) => v > 0 && CHAR_KEYS.includes(k));
    const assigned = charEntries.reduce((a,[,v]) => a+v, 0);
    const unassigned = pl - assigned;
    const totalLinea = pl + espTot;
    const badgeClass = totalLinea === 0 ? 'zero' : '';
    const badgeText = totalLinea === 0 ? 'sin playeras'
      : `${pl} playera${pl!==1?'s':''}${espTot>0?` · ${espTot} especial${espTot!==1?'es':''}`:''}`;
    let body = '';
    if (totalLinea === 0) {
      body = `<div class="accordion-empty">Sin ventas de playeras esta función</div>`;
    } else {
      charEntries.forEach(([name, qty]) => {
        const ch = CHARS.find(c => c.key === name);
        const thumb = `<img class="char-thumb" src="${GITHUB}${ch.img}" alt="${esc(name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="char-thumb-placeholder" style="display:none">${ch.fb}</div>`;
        body += `<div class="char-row"><div class="char-row-left">${thumb}<span class="char-row-name">${esc(name)}</span></div><div class="char-row-right"><span class="char-row-qty">${qty}</span><span class="char-row-monto">${money(qty*PRECIOS.playera)}</span></div></div>`;
      });
      if (unassigned > 0) {
        body += `<div class="char-row"><div class="char-row-left"><div class="char-thumb-placeholder">🎭</div><span class="char-row-name" style="color:var(--muted)">Sin personaje asignado</span></div><div class="char-row-right"><span class="char-row-qty" style="color:var(--muted)">${unassigned}</span><span class="char-row-monto">${money(unassigned*PRECIOS.playera)}</span></div></div>`;
      }
      Object.entries(esp).filter(([,v]) => v > 0).forEach(([name, qty]) => {
        body += `<div class="char-row"><div class="char-row-left"><div class="char-thumb-placeholder">🏆</div><span class="char-row-name">${esc(name)} <span style="color:var(--orange);font-size:0.6rem">(especial)</span></span></div><div class="char-row-right"><span class="char-row-qty" style="color:var(--orange)">${qty}</span></div></div>`;
      });
    }
    html += `<div class="accordion-item">
      <div class="accordion-header">
        <div class="accordion-left"><span class="accordion-sem">Función ${s.num}</span><span class="accordion-date">${esc(s.fecha)}</span></div>
        <div style="display:flex;align-items:center;gap:0.8rem"><span class="accordion-badge ${badgeClass}">${badgeText}</span><span class="accordion-arrow">▼</span></div>
      </div>
      <div class="accordion-body"><div class="accordion-inner">${body}</div></div>
    </div>`;
  });
  html += `</div>`;

  paneEl.innerHTML = html;

  // Listeners del acordeón
  paneEl.querySelectorAll('.accordion-item').forEach(item => {
    item.querySelector('.accordion-header').addEventListener('click', () => {
      const isOpen = item.classList.contains('open');
      paneEl.querySelectorAll('.accordion-item.open').forEach(el => el.classList.remove('open'));
      if (!isOpen) item.classList.add('open');
    });
  });
}

/* ============================================================
   TEMPORADA 2 · LECTURA EN VIVO DEL SHEET (gviz)
   ============================================================ */
function cell(row, i){
  const c = row.c && row.c[i];
  if (!c || c.v == null) return 0;
  const v = c.v;
  return (typeof v === 'number') ? v : (parseFloat(v) || 0);
}
function cellStr(row, i){
  const c = row.c && row.c[i];
  return (c && c.v != null) ? String(c.v) : '';
}

/* ------------------------------------------------------------------
   NOMBRE REAL DE LOS DISEÑOS ESPECIALES
   La columna "Productos" (15) guarda el detalle en texto, ej:
       "1x Karnak, 1x Paola"
   Los productos fijos ya los conoce el dashboard; lo que sobra en ese
   texto es el diseño especial con su nombre y cantidad reales.
   Si no se puede identificar, cae de vuelta a "Art 1/2/3".
   ------------------------------------------------------------------ */
const PRODUCTOS_FIJOS = [
  'constance','jane doe','janedoe','ocean','mischa','noel','ricky','karnak',
  'tote bag','totebag','bolsa','bolsas','oraculo','oraculos','oráculo','oráculos',
  'gorra','gorras','sticker','stickers','playera','playeras'
];
function normaliza(s){
  return String(s).toLowerCase().trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')  // quita acentos
    .replace(/\s+/g,' ');
}
// "1x Karnak, 1x Paola" → [{qty:1,name:'Karnak'}, {qty:1,name:'Paola'}]
function parseProductos(txt){
  if (!txt) return [];
  return String(txt).split(/[,;\n]+/).map(p => {
    const m = p.trim().match(/^(\d+)\s*[xX×]\s*(.+)$/);
    if (!m) return null;
    const name = m[2].trim();
    return name ? { qty: parseInt(m[1],10) || 0, name } : null;
  }).filter(Boolean);
}
// Devuelve { 'Paola': 2, ... } para una fila del Sheet
function especialesDeFila(row){
  const arts = [cell(row,12), cell(row,13), cell(row,14)];
  const artTot = arts.reduce((a,v)=>a+v, 0);
  if (!artTot) return {};
  // nombres del texto que NO son productos fijos
  const sueltos = parseProductos(cellStr(row,15))
    .filter(i => i.qty > 0 && PRODUCTOS_FIJOS.indexOf(normaliza(i.name)) === -1);
  const sumaSueltos = sueltos.reduce((a,i)=>a+i.qty, 0);
  if (sueltos.length && sumaSueltos === artTot){
    const out = {};
    sueltos.forEach(i => { out[i.name] = (out[i.name]||0) + i.qty; });
    return out;
  }
  // fallback: no cuadra o no hay nombre → se queda como Art 1/2/3
  const out = {};
  ['Art 1','Art 2','Art 3'].forEach((n,k) => { if (arts[k]) out[n] = arts[k]; });
  return out;
}
function parseFecha(row){
  const c = row.c && row.c[0];
  if (!c || c.v == null) return null;
  const v = c.v;
  // gviz Date: "Date(2026,6,20,14,30,0)"
  if (typeof v === 'string' && v.indexOf('Date(') === 0){
    const n = v.slice(5, -1).split(',').map(x => parseInt(x,10));
    return new Date(n[0], n[1], n[2]||1, n[3]||0, n[4]||0, n[5]||0);
  }
  if (typeof v === 'string'){
    const s = v.trim();
    // ISO "2026-07-20 ..."
    const iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (iso){ const dt = new Date(+iso[1], +iso[2]-1, +iso[3]); if(!isNaN(dt)) return dt; }
    // "20/7/2026, 14:30" o "20/7/2026"
    const p = s.split(',')[0].trim().split('/');
    if (p.length === 3){
      const dt = new Date(parseInt(p[2],10), parseInt(p[1],10)-1, parseInt(p[0],10));
      if (!isNaN(dt)) return dt;
    }
  }
  // respaldo: fecha ya formateada por gviz en c.f
  if (c.f){ const dt = new Date(c.f); if(!isNaN(dt)) return dt; }
  return null;
}
function funcionIndex(fecha){
  const f = new Date(fecha.getFullYear(), fecha.getMonth(), fecha.getDate());
  let idx = Math.floor((f - INICIO_T2) / 86400000 / 7);
  return idx < 0 ? 0 : idx;
}
function fechaFuncion(idx){
  const martes = new Date(INICIO_T2.getFullYear(), INICIO_T2.getMonth(), INICIO_T2.getDate() + idx*7 + 1);
  return `${martes.getDate()} ${MESES[martes.getMonth()]} ${martes.getFullYear()}`;
}
function rangoFuncion(idx){
  const lun = new Date(INICIO_T2.getFullYear(), INICIO_T2.getMonth(), INICIO_T2.getDate() + idx*7);
  const dom = new Date(lun.getFullYear(), lun.getMonth(), lun.getDate() + 6);
  return `${lun.getDate()} ${MESES[lun.getMonth()]} – ${dom.getDate()} ${MESES[dom.getMonth()]}`;
}

let T2_IGNORADAS = 0;
function agruparT2(rows){
  const grupos = {};
  T2_IGNORADAS = 0;
  rows.forEach(row => {
    const fecha = parseFecha(row);
    const total = cell(row, 16);
    // ¿la fila tiene algún dato real?
    const hayDatos = total > 0 || cell(row,1)||cell(row,2)||cell(row,3)||cell(row,4)||
      cell(row,5)||cell(row,6)||cell(row,7)||cell(row,8)||cell(row,9)||cell(row,10)||
      cell(row,11)||cell(row,12)||cell(row,13)||cell(row,14);
    if (!fecha) { if (hayDatos) T2_IGNORADAS++; return; } // sin fecha = resumen/basura → se ignora
    const idx = funcionIndex(fecha);
    if (!grupos[idx]){
      grupos[idx] = {
        num: idx + 1, fecha: fechaFuncion(idx), rango: rangoFuncion(idx),
        efectivo:0, tarjeta:0, transfer:0, total:0,
        bolsas:0, stickers:0, oraculos:0, gorras:0, playeras:0, chars:{}, especiales:{}, espRev:0
      };
    }
    const g = grupos[idx];
    g.bolsas   += cell(row, 1);
    g.stickers += cell(row, 2);
    g.oraculos += cell(row, 3);
    g.gorras   += cell(row, 4);
    g.total    += total;
    g.efectivo += cell(row, 17);
    g.tarjeta  += cell(row, 18);
    g.transfer += cell(row, 19);
    // Personajes (playeras)
    CHARS.forEach(ch => {
      const q = cell(row, ch.col);
      if (q) g.chars[ch.key] = (g.chars[ch.key]||0) + q;
    });
    // Diseños especiales → con su NOMBRE REAL leído de la columna Productos
    const espFila = especialesDeFila(row);
    let qEsp = 0;
    Object.entries(espFila).forEach(([name, q]) => {
      if (q) { g.especiales[name] = (g.especiales[name]||0) + q; qEsp += q; }
    });
    // Dinero de los especiales = total REAL de la venta − lo que valen los
    // productos de precio conocido. Se calcula venta por venta para que un
    // descuento aislado no contamine toda la temporada.
    if (qEsp > 0){
      const playerasFila = CHARS.reduce((a,ch) => a + cell(row, ch.col), 0);
      const conocidos =
        playerasFila   * PRECIOS.playera +
        cell(row,1)    * PRECIOS.bolsa   +
        cell(row,2)    * PRECIOS.sticker +
        cell(row,3)    * PRECIOS.oraculo +
        cell(row,4)    * PRECIOS.gorra;
      const resto = total - conocidos;
      g.espRev = (g.espRev || 0) + (resto > 0 ? resto : 0);
    }
  });
  // playeras = suma de personajes (los especiales van aparte)
  Object.values(grupos).forEach(g => {
    g.playeras = Object.values(g.chars).reduce((a,v)=>a+v, 0);
  });
  return Object.values(grupos).sort((a,b) => a.num - b.num);
}

let t2Timer = null;
async function cargarT2(manual){
  const pane = document.getElementById('pane-t2');
  const btn = document.getElementById('t2-refresh-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Leyendo…'; }
  if (!pane.dataset.loaded){
    pane.innerHTML = `<div class="status-box" id="t2-loading">
      <div class="spinner"></div>
      <div class="status-title">Leyendo tu Sheet…</div>
      <div class="status-text">Cargando las ventas de la Temporada 2.</div>
    </div>`;
  }
  try {
    const resp = await fetch(GVIZ_URL + '&_=' + Date.now());
    const txt = await resp.text();
    const json = JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
    const rows = (json.table && json.table.rows) ? json.table.rows : [];
    const semanas = agruparT2(rows);

    if (semanas.length === 0){
      pane.dataset.loaded = '';
      pane.innerHTML = `<div class="status-box">
        <div class="status-emoji">🎭</div>
        <div class="status-title">Aún no hay funciones registradas</div>
        <div class="status-text">Copia las ventas de tu Sheet 1 al Sheet 2 y aparecerán aquí solitas.<br>El dashboard se actualiza cada vez que abres o recargas la página.</div>
        <div style="margin-top:1.4rem"><button class="btn-refresh" id="t2-refresh-btn" onclick="cargarT2(true)">↻ Volver a leer</button></div>
      </div>`;
      return;
    }

    const hora = new Date().toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    let toolbar = `<div class="t2-toolbar">
      <div class="t2-status">Leyendo el Sheet en vivo · <b>${semanas.length} función${semanas.length>1?'es':''}</b> · última lectura ${hora}</div>
      <button class="btn-refresh" id="t2-refresh-btn" onclick="cargarT2(true)">↻ Actualizar</button>
    </div>`;
    const wrap = document.createElement('div');
    renderTemporada(semanas, wrap);
    pane.innerHTML = toolbar;
    pane.appendChild(wrap);
    pane.dataset.loaded = '1';
    document.getElementById('globalBadge').innerHTML = `Temporada 2 · <b style="color:var(--neon)">${money(semanas.reduce((a,s)=>a+s.total,0))}</b>`;
  } catch (err){
    pane.dataset.loaded = '';
    pane.innerHTML = `<div class="status-box">
      <div class="status-emoji">📡</div>
      <div class="status-title">No pude leer el Sheet</div>
      <div class="status-text">Revisa que el Sheet 2 esté compartido como "Cualquier persona con el enlace puede ver".<br>Si estás abriendo el archivo local, súbelo a GitHub Pages para que cargue en vivo.</div>
      <div style="margin-top:1.4rem"><button class="btn-refresh" id="t2-refresh-btn" onclick="cargarT2(true)">↻ Reintentar</button></div>
    </div>`;
  }
}

/* ============================================================
   PESTAÑAS
   ============================================================ */
function switchTab(t){
  ['t1','t2'].forEach(k => {
    document.getElementById('pane-'+k).classList.toggle('active', k===t);
    document.getElementById('tabBtn-'+k).classList.toggle('active', k===t);
  });
  if (t === 't2'){
    // refresco automático cada 90s mientras la pestaña esté abierta
    if (!document.getElementById('pane-t2').dataset.loaded) cargarT2();
    clearInterval(t2Timer);
    t2Timer = setInterval(cargarT2, 90000);
  } else {
    clearInterval(t2Timer);
  }
}

/* ============================================================
   FONDO ANIMADO
   ============================================================ */
(function(){
  const canvas = document.getElementById('node-canvas');
  const ctx = canvas.getContext('2d');
  let W, H;
  const nodes = [];
  function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  for(let i=0;i<55;i++) nodes.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5});
  function draw(){
    ctx.clearRect(0,0,W,H);
    nodes.forEach(n=>{n.x+=n.vx;n.y+=n.vy;if(n.x<0)n.x=W;if(n.x>W)n.x=0;if(n.y<0)n.y=H;if(n.y>H)n.y=0;});
    for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
      const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<130){ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.strokeStyle=`rgba(0,255,136,${(1-d/130)*.3})`;ctx.lineWidth=.8;ctx.stroke();}
    }
    nodes.forEach(n=>{ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fillStyle='rgba(0,229,255,0.5)';ctx.fill();});
    requestAnimationFrame(draw);
  }
  draw();
})();

renderTemporada(SEMANAS_T1, document.getElementById('pane-t1'));
