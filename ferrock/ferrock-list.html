<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12A150">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ferrock List">
<title>Ferrock List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6EC; --card:#FFFFFF; --bd:#EFE3D4;
  --g1:#7ED957; --g2:#12A150; --naranja:#FF7A1A;
  --tx:#2B2B2B; --tx2:#6B6560; --tx3:#A9A29B;
  --maxw:720px; --sh:0 2px 10px rgba(120,90,50,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:118px;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 14px}
.disp{font-family:'Fredoka','Nunito',sans-serif}

header{background:linear-gradient(120deg,#7ED957 0%,#12A150 65%,#0B8A45 100%);padding:calc(env(safe-area-inset-top) + 16px) 0 22px;border-radius:0 0 26px 26px;position:sticky;top:0;z-index:60;box-shadow:0 4px 16px rgba(18,161,80,.22)}
.brand{display:flex;align-items:center;gap:11px}
.brand .cart{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 46px}
.brand h1{margin:0;font-size:27px;font-weight:600;color:#fff;letter-spacing:.3px;line-height:1.05}
.brand small{display:block;font-family:'Nunito';font-size:12px;font-weight:700;color:rgba(255,255,255,.82);letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
.syncbadge{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit;border:none}
.syncbadge .led{width:8px;height:8px;border-radius:50%;background:#D6F5A0;flex:0 0 8px}
.syncbadge.busy .led{background:#FFE08A}
.syncbadge.off .led{background:#FFD1D1}

.lists-bar{display:flex;gap:8px;overflow-x:auto;padding:14px 14px 2px;max-width:var(--maxw);margin:0 auto;scrollbar-width:none}
.lists-bar::-webkit-scrollbar{display:none}
.chip-list{flex:0 0 auto;background:#fff;border:1.5px solid var(--bd);color:var(--tx2);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;white-space:nowrap;box-shadow:var(--sh)}
.chip-list.on{background:var(--naranja);border-color:var(--naranja);color:#fff}
.chip-list.add{border-style:dashed;color:var(--g2);background:#fff}

.adder{background:var(--card);border-radius:20px;padding:8px 8px 8px 16px;margin-top:12px;box-shadow:var(--sh);border:1.5px solid var(--bd)}
.adder-row{display:flex;gap:8px;align-items:center}
#newItem{flex:1;min-width:0;border:none;background:transparent;font-family:inherit;font-size:17px;font-weight:700;color:var(--tx);padding:12px 0;outline:none}
#newItem::placeholder{color:var(--tx3);font-weight:600}
#newQty{width:72px;flex:0 0 72px;border:1.5px solid var(--bd);border-radius:12px;background:#FDFAF6;font-family:inherit;font-size:14px;font-weight:800;color:var(--tx2);padding:10px 6px;text-align:center;outline:none}
#newQty::placeholder{color:var(--tx3);font-weight:600}
.btn-add{flex:0 0 50px;width:50px;height:50px;border:none;border-radius:16px;background:linear-gradient(135deg,#FF9A3C,#FF7A1A);color:#fff;font-size:28px;font-weight:600;font-family:'Fredoka';cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:0;box-shadow:0 3px 9px rgba(255,122,26,.35)}
.btn-add:active{transform:scale(.94)}
.sugs{display:flex;flex-wrap:wrap;gap:6px;padding:2px 8px 8px 0}
.sug{border:1.5px solid var(--bd);background:#FDFAF6;border-radius:999px;padding:7px 13px 7px 10px;font-family:inherit;font-size:13.5px;font-weight:800;color:var(--tx2);cursor:pointer;display:flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}

.summary{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 10px}
.summary b{font-family:'Fredoka';font-size:20px;font-weight:600;color:var(--tx)}
.summary span{font-size:13px;font-weight:800;color:var(--tx3)}

.group{background:var(--card);border-radius:18px;margin-bottom:11px;overflow:hidden;box-shadow:var(--sh)}
.group-head{display:flex;align-items:center;gap:9px;padding:11px 15px}
.group-head h3{margin:0;font-family:'Fredoka';font-size:15px;font-weight:600;letter-spacing:.2px}
.group-head .n{margin-left:auto;font-size:12px;font-weight:800;color:#fff;border-radius:999px;padding:2px 10px;min-width:26px;text-align:center}
.item{display:flex;align-items:center;gap:12px;padding:14px 15px;border-top:1px solid #F5EFE7;cursor:pointer}
.item:active{background:#FFFBF5}
.check{width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:2.5px solid #E2DAD1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:800}
.item-txt{flex:1;min-width:0}
.item-title{font-size:16.5px;font-weight:700;color:var(--tx);word-break:break-word}
.item-qty{font-size:12.5px;font-weight:800;color:var(--naranja);margin-top:1px}
.btn-edit{flex:0 0 34px;width:34px;height:34px;border:none;background:transparent;color:var(--tx3);font-size:15px;cursor:pointer;border-radius:10px}
.bought .item-title{text-decoration:line-through;color:var(--tx3);font-weight:600}
.bought .item-qty{color:var(--tx3)}
.bought .check{background:#C9C2BA;border-color:#C9C2BA}
.done-group .group-head{background:#F1EDE7}
.done-group .group-head h3{color:var(--tx2)}
.done-group .group-head .n{background:#C9C2BA}

.editor{padding:13px 15px;background:#FFFBF5;border-top:1px solid #F5EFE7}
.editor input{width:100%;border:1.5px solid var(--bd);border-radius:12px;padding:11px;font-family:inherit;font-size:15px;font-weight:700;color:var(--tx);margin-bottom:9px;outline:none;background:#fff}
.cats-grid{display:flex;flex-wrap:wrap;gap:7px}
.cat-chip{border:2px solid var(--bd);background:#fff;border-radius:999px;padding:8px 13px 8px 10px;font-family:inherit;font-size:13.5px;font-weight:800;color:var(--tx2);cursor:pointer;display:flex;align-items:center;gap:7px}
.cat-chip.on{color:var(--tx)}
.cat-chip.new{border-style:dashed;color:var(--g2)}
.editor-actions{display:flex;gap:8px;margin-top:12px}
.editor-actions button{flex:1;border:none;border-radius:12px;padding:12px;font-family:inherit;font-size:14.5px;font-weight:800;cursor:pointer}
.b-save{background:var(--g2);color:#fff}
.b-del{background:#FFECEC;color:#D93636;flex:0 0 48px !important}

.empty{text-align:center;padding:46px 20px;color:var(--tx3)}
.empty .big{font-size:46px;margin-bottom:12px}
.empty p{font-size:14.5px;font-weight:700;margin:4px 0}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(255,255,255,.96);border-top:1.5px solid var(--bd);padding:9px 14px calc(env(safe-area-inset-bottom) + 9px);backdrop-filter:blur(10px)}
.dock-in{max-width:var(--maxw);margin:0 auto;display:flex;gap:7px}
.dock button{flex:1;border:1.5px solid var(--bd);background:#fff;border-radius:14px;padding:9px 3px;font-family:inherit;font-size:10.5px;font-weight:800;color:var(--tx2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.dock button:active{background:#FFF6EC}
.dock button .ic{font-size:18px;line-height:1}
.dock button.warn{color:#D93636}

.overlay{position:fixed;inset:0;background:rgba(60,45,30,.42);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.modal{background:var(--card);width:100%;max-width:var(--maxw);border-radius:24px 24px 0 0;max-height:88vh;overflow-y:auto;padding:20px 16px calc(env(safe-area-inset-bottom) + 22px)}
.modal h2{margin:0 0 4px;font-family:'Fredoka';font-size:21px;font-weight:600;color:var(--tx)}
.modal .sub{font-size:13.5px;font-weight:600;color:var(--tx2);margin:0 0 16px;line-height:1.45}
.modal input,.modal textarea{width:100%;border:1.5px solid var(--bd);border-radius:13px;padding:13px;font-family:inherit;font-size:15px;font-weight:700;color:var(--tx);outline:none;margin-bottom:10px;background:#FFFBF5}
.modal textarea{font-size:12px;font-weight:600;height:110px;resize:vertical}
.m-actions{display:flex;gap:8px;margin-top:14px}
.m-actions button{flex:1;border:none;border-radius:14px;padding:14px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer}
.b-primary{background:var(--g2);color:#fff}
.b-orange{background:var(--naranja);color:#fff}
.b-ghost{background:#F3EDE5;color:var(--tx2)}
.b-danger{background:#FFECEC;color:#D93636}

.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 6px}
.sw-c{width:40px;height:40px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 0 0 1.5px var(--bd)}
.sw-c.on{box-shadow:0 0 0 3px var(--tx)}

.sec-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--bd);border-radius:14px;margin-bottom:8px;background:#fff}
.sec-item .nm{flex:1;font-size:14.5px;font-weight:800;color:var(--tx)}
.sec-item button{width:36px;height:36px;border:1.5px solid var(--bd);background:#FFFBF5;border-radius:11px;font-size:14px;color:var(--tx2);cursor:pointer;font-family:inherit;font-weight:800}
.tip{background:#EAF7EE;border:1.5px solid #C7E7D2;border-left:5px solid var(--g2);border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:600;color:#2C5E3F;margin-bottom:14px;line-height:1.5}
.code{font-family:ui-monospace,Menlo,monospace;font-size:19px;font-weight:800;letter-spacing:2px;text-align:center;background:#FFF6EC;border:2px dashed var(--g2);border-radius:14px;padding:14px;color:var(--g2);margin-bottom:12px}
.code.link{font-size:12.5px;letter-spacing:0;word-break:break-all;line-height:1.5;text-align:left;font-weight:700}
.switch-row{display:flex;align-items:center;gap:12px;padding:13px;border:1.5px solid var(--bd);border-radius:14px;margin-bottom:10px}
.switch-row .nm{flex:1;font-size:14.5px;font-weight:800;color:var(--tx)}
.switch-row small{display:block;font-size:12.5px;font-weight:600;color:var(--tx3);margin-top:2px}
.sw{width:50px;height:29px;border-radius:999px;background:#E2DAD1;border:none;position:relative;cursor:pointer;flex:0 0 50px}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--g2)}
.sw.on::after{left:24px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;background:var(--tx);color:#fff;padding:12px 22px;border-radius:999px;font-size:13.5px;font-weight:800;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
.toast.on{opacity:1}

@media (max-width:600px){
  .brand h1{font-size:23px}
  .brand .cart{width:42px;height:42px;flex:0 0 42px;font-size:22px}
  .syncbadge{padding:5px 9px;font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

@page{size:Letter;margin:13mm}
@media print{
  *{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  body{background:#fff;padding-bottom:0}
  .no-print,.dock,.adder,.lists-bar,.overlay,.toast,.btn-edit,.syncbadge{display:none !important}
  header{position:static;border-radius:0;box-shadow:none;padding:12px 0}
  .wrap{max-width:100%;padding:0}
  main,.group{break-inside:auto}
  .item,.group-head,.tip{break-inside:avoid}
  h1,h2,h3,.group-head{break-after:avoid}
  p,li{orphans:3;widows:3}
  thead{display:table-header-group}
  a[href]:after{content:none}
  .group{border:1.5px solid #E2DAD1;box-shadow:none;margin-bottom:8px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <span class="cart">🛒</span>
      <h1 class="disp">Ferrock List<small>Lista del súper</small></h1>
      <button class="syncbadge" id="syncBadge"><span class="led"></span><span id="syncTxt">En la nube</span></button>
    </div>
  </div>
</header>

<div class="lists-bar no-print" id="listsBar"></div>

<div class="wrap">
  <div class="adder no-print">
    <div class="adder-row">
      <input id="newItem" type="text" placeholder="¿Qué falta?" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <input id="newQty" type="text" placeholder="Cant." autocomplete="off">
      <button class="btn-add" id="btnAdd" aria-label="Agregar producto">+</button>
    </div>
    <div class="sugs" id="sugs"></div>
  </div>

  <div class="summary">
    <b class="disp" id="sumTitle">Mi lista</b>
    <span id="sumCount"></span>
  </div>

  <main id="listBody"></main>
</div>

<div class="dock no-print">
  <div class="dock-in">
    <button id="dkSecs"><span class="ic">🎨</span>Secciones</button>
    <button id="dkShare"><span class="ic">📤</span>Compartir</button>
    <button id="dkPrint"><span class="ic">🖨️</span>Imprimir</button>
    <button id="dkClear" class="warn"><span class="ic">🧹</span>Limpiar</button>
    <button id="dkSet"><span class="ic">⚙️</span>Ajustes</button>
  </div>
</div>

<div class="overlay" id="ov"><div class="modal" id="ovBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   FERROCK LIST — lista del súper ordenada por colores
   Sincroniza siempre contra Supabase (esquema ferrock)
   El espacio va en la URL: ?l=<espacio>
   ========================================================= */

const SB={
  url:'https://rcotlydvsubvdapubnkx.supabase.co',
  key:'sb_publishable_cikBH4AxmpYZbk_gGNZelg_y-NBVX9T'
};

const PALETTE=['#2FB344','#8BC34A','#F2B705','#FF9F1C','#FF7A1A','#E0383E','#D6336C',
               '#8E44AD','#6C5CE7','#3F3D9E','#1A73A8','#22B8CF','#17A398','#8E2E4B',
               '#C97B2B','#6D9F3E','#7B5E57','#8A90A0'];

const BASE_CATS={
  verduras:{n:'Frutas y verduras',c:'#2FB344'}, carnes:{n:'Carnicería y pollo',c:'#E0383E'},
  salchichon:{n:'Salchichonería',c:'#FF7A1A'}, lacteos:{n:'Lácteos y huevo',c:'#F2B705'},
  panaderia:{n:'Panadería y tortillas',c:'#C97B2B'}, abarrotes:{n:'Abarrotes',c:'#8E2E4B'},
  congelados:{n:'Congelados',c:'#22B8CF'}, bebidas:{n:'Bebidas',c:'#1A73A8'},
  higiene:{n:'Higiene y farmacia',c:'#3F3D9E'}, limpieza:{n:'Limpieza del hogar',c:'#17A398'},
  ropa:{n:'Ropa',c:'#8E44AD'}, mascotas:{n:'Mascotas',c:'#6D9F3E'}, otros:{n:'Otros',c:'#8A90A0'}
};
const BASE_ROUTE=['verduras','carnes','salchichon','lacteos','panaderia','abarrotes','congelados','bebidas','higiene','limpieza','ropa','mascotas','otros'];

const SEED={
verduras:'jitomate,tomate verde,cebolla,cebolla morada,ajo,papa,zanahoria,chayote,calabaza,calabacita,brócoli,coliflor,lechuga,espinaca,pepino,chile serrano,chile poblano,cilantro,perejil,apio,elote,nopales,aguacate,plátano,manzana,naranja,limón,mango,papaya,piña,sandía,melón,fresa,uva,pera,guayaba,toronja,betabel,champiñones,ejotes,camote,pimiento,jengibre',
carnes:'pollo,pechuga de pollo,muslo de pollo,milanesa,bistec,carne molida,arrachera,costillas,chuleta,pierna de cerdo,carne para asar,pescado,filete de pescado,camarón,salmón',
salchichon:'jamón,salchicha,tocino,chorizo,salami,pavo,mortadela,queso panela,queso manchego,queso oaxaca,queso fresco,queso crema,queso amarillo,requesón',
lacteos:'leche,yogurt,crema,mantequilla,huevo,media crema,leche condensada,leche evaporada,leche deslactosada,queso cottage',
panaderia:'tortillas,tortillas de harina,bolillo,pan dulce,pan de caja,pan integral,baguette,tostadas,croissant,pastel,donas',
abarrotes:'arroz,frijol,lenteja,azúcar,sal,aceite,aceite de oliva,harina,pasta,sopa de pasta,atún,sardina,mayonesa,mostaza,catsup,salsa,vinagre,consomé,café,té,chocolate,galletas,cereal,avena,miel,mermelada,nuez,cacahuate,aceitunas,chiles en vinagre,puré de tomate,caldo de pollo,pimienta,comino,orégano,canela,levadura,gelatina,frituras,palomitas,mole,leche en polvo',
congelados:'helado,verduras congeladas,pizza congelada,nuggets,papas congeladas,hielo,paletas',
bebidas:'agua,garrafón,refresco,jugo,cerveza,vino,tequila,agua mineral,leche de almendra,bebida energética,suero',
higiene:'pasta de dientes,cepillo de dientes,shampoo,acondicionador,jabón de baño,desodorante,papel higiénico,rastrillo,crema corporal,toallas femeninas,pañales,enjuague bucal,hilo dental,algodón,curitas,aspirina,alcohol,bloqueador,cotonetes',
limpieza:'detergente,suavizante,cloro,jabón para trastes,fibra,escoba,trapeador,bolsas de basura,servilletas,papel de cocina,limpiador multiusos,aromatizante,insecticida,esponja,guantes,pinol,desengrasante',
ropa:'calcetines,calzones,playera,pants,pijama,toalla,sábanas,tenis,cinturón,ropa interior',
mascotas:'croquetas,arena para gato,alimento para gato,premios para perro'
};

/* ---------- ALMACENAMIENTO LOCAL ---------- */
const OLD3='ferrock_list_v3', OLD2='ferrock_list_v2', OLD1='lista_super_v1';
const ESP_KEY='ferrock_espacio', mem={};
let ESP=null;
const keyFor=e=>'ferrock_list_v4_'+e;
const KEY=()=>keyFor(ESP);
const DB={
  async get(k){ if(window.storage){try{const r=await window.storage.get(k);return r?r.value:null}catch(e){}}
    try{return localStorage.getItem(k)}catch(e){return mem[k]||null} },
  async set(k,v){ if(window.storage){try{await window.storage.set(k,v);return}catch(e){}}
    try{localStorage.setItem(k,v)}catch(e){mem[k]=v} }
};

/* ---------- ESPACIO (identificador que va en la URL) ---------- */
const ABC='abcdefghijkmnopqrstuvwxyz23456789';
function newEsp(){ let s='fl'; for(let i=0;i<10;i++) s+=ABC[Math.floor(Math.random()*ABC.length)]; return s; }
function cleanEsp(x){ return String(x||'').trim().toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,40); }
function urlEsp(){ try{ return cleanEsp(new URLSearchParams(location.search).get('l')||'') }catch(e){ return '' } }
function putUrl(e){
  try{ const u=new URL(location.href); u.searchParams.set('l',e); history.replaceState(null,'',u.pathname+u.search+u.hash); }catch(x){}
}
function linkFor(e){
  const base=(location.origin&&location.origin!=='null')
    ? location.origin+location.pathname
    : location.href.split('?')[0].split('#')[0];
  return base+'?l='+e;
}

let S=null, editing=null, wakeLock=null, pushT=null, pollT=null, syncing=false;
const uid=()=>Math.random().toString(36).slice(2,10);
const now=()=>Date.now();
const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const L=()=>S.lists.find(l=>l.id===S.active&&!l.del)||S.lists.filter(l=>!l.del)[0];
const LIVE=()=>S.lists.filter(l=>!l.del);
const IT=l=>(l&&l.items?l.items.filter(i=>!i.del):[]);
const C=k=>S.cats[k]||S.cats.otros||{n:'Otros',c:'#8A90A0'};

function save(local){ DB.set(KEY(),JSON.stringify(S)); if(!local) queuePush(); }

function freshState(){
  const dict={}; for(const k in SEED) SEED[k].split(',').forEach(w=>dict[w.trim()]=k);
  return {lists:[{id:uid(),name:'Súper',items:[],mt:now(),seed:true}],active:null,
    cats:JSON.parse(JSON.stringify(BASE_CATS)),route:BASE_ROUTE.slice(),catsMt:now(),
    dict,keepAwake:false,sync:{rev:0,ok:null}};
}

(async function init(){
  /* 1. ¿Qué espacio abrimos? URL > guardado en este aparato > uno nuevo */
  const fromUrl=urlEsp();
  let mio=cleanEsp(await DB.get(ESP_KEY));
  if(fromUrl){ ESP=fromUrl; if(!mio){ await DB.set(ESP_KEY,ESP); mio=ESP; } }
  else if(mio){ ESP=mio; }

  /* 2. Datos locales de ese espacio */
  let raw = ESP ? await DB.get(KEY()) : null;

  /* 3. Migración de lo que ya existía (solo hacia mi propio espacio) */
  let viejo=null;
  if(!raw && !fromUrl){
    const prev = await DB.get(OLD3) || await DB.get(OLD2) || await DB.get(OLD1);
    if(prev){ try{ viejo=JSON.parse(prev) }catch(e){} }
  }
  if(!ESP){
    /* primer uso: si el respaldo viejo traía código de familia, se conserva
       como espacio para no perder lo que ya estaba en la nube */
    const anterior = viejo && viejo.sync ? cleanEsp(viejo.sync.codigo) : '';
    ESP = (anterior && anterior.length>=4) ? anterior : newEsp();
    await DB.set(ESP_KEY,ESP);
  }
  putUrl(ESP); installManifest();

  /* 4. Estado */
  if(raw){ try{S=JSON.parse(raw)}catch(e){S=null} }
  if(!S && viejo){
    try{
      S=freshState(); delete S.lists;
      if(viejo.lists) S.lists=viejo.lists.map(l=>({id:l.id||uid(),name:l.name,mt:l.mt||now(),del:l.del,
        items:(l.items||[]).map(i=>({...i,mt:i.mt||now()}))}));
      if(viejo.cats) S.cats=Object.assign(S.cats,viejo.cats);
      if(viejo.route) S.route=viejo.route.filter(k=>S.cats[k]);
      if(viejo.catsMt) S.catsMt=viejo.catsMt;
      S.dict=Object.assign(S.dict,viejo.dict||{});
      S.keepAwake=!!viejo.keepAwake;
      S.active=viejo.active||null;
      S.sync={rev:0,ok:null,dirty:true};
    }catch(e){ S=null }
  }
  if(!S) S=freshState();
  if(!S.cats) S.cats=JSON.parse(JSON.stringify(BASE_CATS));
  if(!S.route||!S.route.length) S.route=Object.keys(S.cats);
  Object.keys(S.cats).forEach(k=>{if(!S.route.includes(k))S.route.push(k)});
  S.route=S.route.filter(k=>S.cats[k]);
  if(!S.catsMt) S.catsMt=now();
  if(!S.sync) S.sync={rev:0,ok:null};
  delete S.sync.codigo;
  if(!S.lists||!LIVE().length) S.lists=[{id:uid(),name:'Súper',items:[],mt:now(),seed:true}];
  S.lists.forEach(l=>{l.items=l.items||[];l.mt=l.mt||now();l.items.forEach(i=>i.mt=i.mt||now())});
  if(!S.active||!LIVE().some(l=>l.id===S.active)) S.active=LIVE()[0].id;
  purge(); save(1); render(); paintBadge();
  if(S.keepAwake) askWakeLock();
  syncNow(); startPoll();
})();

/* borra los fantasmas viejos (más de 30 días marcados como eliminados) */
function purge(){
  const lim=now()-30*24*3600*1000;
  S.lists.forEach(l=>{l.items=l.items.filter(i=>!(i.del&&(i.mt||0)<lim))});
  S.lists=S.lists.filter(l=>!(l.del&&(l.mt||0)<lim));
}

/* =============== SINCRONIZACIÓN =============== */
async function rpc(fn,body){
  const r=await fetch(SB.url+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB.key,'Authorization':'Bearer '+SB.key},
    body:JSON.stringify(body)});
  if(!r.ok) throw new Error('http '+r.status);
  return r.json();
}
const payload=()=>({lists:S.lists,cats:S.cats,route:S.route,catsMt:S.catsMt,dict:S.dict});

function mergeRemote(R){
  if(!R) return false;
  const before=JSON.stringify([S.lists,S.cats,S.route]);
  const map={}; S.lists.forEach(l=>map[l.id]=l);
  (R.lists||[]).forEach(rl=>{
    const ll=map[rl.id];
    if(!ll){ S.lists.push(rl); return; }
    if((rl.mt||0)>(ll.mt||0)){ ll.name=rl.name; ll.del=rl.del; ll.mt=rl.mt; }
    const im={}; ll.items.forEach(i=>im[i.id]=i);
    (rl.items||[]).forEach(ri=>{
      const li=im[ri.id];
      if(!li) ll.items.push(ri);
      else if((ri.mt||0)>(li.mt||0)) Object.assign(li,ri);
    });
  });
  S.cats=Object.assign({},R.cats||{},S.cats);
  const base=((R.catsMt||0)>(S.catsMt||0))?(R.route||[]):S.route;
  const merged=base.filter(k=>S.cats[k]);
  Object.keys(S.cats).forEach(k=>{if(!merged.includes(k))merged.push(k)});
  S.route=merged; S.catsMt=Math.max(S.catsMt||0,R.catsMt||0);
  S.dict=Object.assign({},R.dict||{},S.dict);
  if((R.lists||[]).length){
    const rid={}; R.lists.forEach(r=>rid[r.id]=1);
    S.lists=S.lists.filter(l=>!(l.seed&&!IT(l).length&&!rid[l.id]));
  }
  if(!LIVE().length) S.lists.push({id:uid(),name:'Súper',items:[],mt:now(),seed:true});
  if(!LIVE().some(l=>l.id===S.active)) S.active=LIVE()[0].id;
  return before!==JSON.stringify([S.lists,S.cats,S.route]);
}

async function syncNow(force){
  if(!S||!ESP||syncing) return;
  syncing=true; paintBadge();
  try{
    const res=await rpc('ferrock_pull',{p_codigo:ESP,p_rev:S.sync.rev||0});
    const row=Array.isArray(res)?res[0]:res;
    let changed=false;
    if(row){
      if(row.payload){ changed=mergeRemote(row.payload); S.sync.rev=row.rev; }
      else S.sync.rev=row.rev;
    }
    if(!row||changed||force||S.sync.dirty){
      const rev=await rpc('ferrock_push',{p_codigo:ESP,p_payload:payload()});
      S.sync.rev=(typeof rev==='number')?rev:S.sync.rev;
      S.sync.dirty=false;
    }
    S.sync.ok=true; S.sync.last=now();
    DB.set(KEY(),JSON.stringify(S));
    if(changed) render();
  }catch(e){ S.sync.ok=false; }
  syncing=false; paintBadge();
}
function queuePush(){
  if(!ESP) return;
  S.sync.dirty=true; paintBadge();
  clearTimeout(pushT); pushT=setTimeout(()=>syncNow(true),1200);
}
function startPoll(){ clearInterval(pollT); pollT=setInterval(()=>{ if(document.visibilityState==='visible') syncNow(); },7000); }
function paintBadge(){
  const b=document.getElementById('syncBadge'), t=document.getElementById('syncTxt');
  if(!b||!S) return;
  const off = S.sync.ok===false;
  const busy = !off && (S.sync.dirty||syncing);
  b.classList.toggle('off',off);
  b.classList.toggle('busy',busy);
  t.textContent = off ? 'Sin conexión' : (busy ? 'Guardando…' : 'En la nube');
}
document.getElementById('syncBadge').onclick=()=>{ syncNow(true); toast('Buscando cambios…') };
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){ syncNow(); if(S&&S.keepAwake) askWakeLock(); }
});

function render(){renderLists();renderBody();paintBadge()}

function renderLists(){
  const bar=document.getElementById('listsBar'); bar.innerHTML='';
  LIVE().forEach(l=>{

    b.className='chip-list'+(l.id===S.active?' on':'');

    b.textContent=l.name+(p?' · '+p:'');
    b.onclick=()=>{ if(l.id===S.active) modalList(l); else {S.active=l.id;editing=null;save(1);render()} };
    bar.appendChild(b);
  });
  const a=document.createElement('button');
  a.className='chip-list add'; a.textContent='+ Lista'; a.onclick=()=>modalList(null);
  bar.appendChild(a);
}

function renderBody(){
  const box=document.getElementById('listBody'); box.innerHTML='';
  const list=L(), items=IT(list);
  document.getElementById('sumTitle').textContent=list.name;
  const p=items.filter(i=>!i.done).length, d=items.filter(i=>i.done).length;
  document.getElementById('sumCount').textContent=items.length?`${p} por comprar · ${d} en el carrito`:'';
  if(!items.length){
    box.innerHTML='<div class="empty"><div class="big">🍎</div><p>Aquí no falta nada todavía.</p><p>Escribe arriba lo primero que necesites.</p></div>';
    return;
  }
  S.route.forEach(k=>{
    const g=items.filter(i=>!i.done&&i.cat===k);
    if(g.length) box.appendChild(groupEl(C(k),g,false));
  });
  const dn=items.filter(i=>i.done);
  if(dn.length){
    dn.sort((a,b)=>S.route.indexOf(a.cat)-S.route.indexOf(b.cat));
    const el=groupEl({n:'Ya en el carrito',c:'#C9C2BA'},dn,true);
    el.classList.add('done-group'); box.appendChild(el);
  }
}

function groupEl(cat,arr,isDone){
  const g=document.createElement('section'); g.className='group';
  const h=document.createElement('div'); h.className='group-head';
  if(!isDone) h.style.background=hexA(cat.c,.13);
  h.innerHTML=`<span class="dot" style="background:${cat.c};width:13px;height:13px;flex:0 0 13px"></span>
    <h3 class="disp" style="color:${isDone?'':shade(cat.c)}">${esc(cat.n)}</h3>
    <span class="n" style="background:${cat.c}">${arr.length}</span>`;
  g.appendChild(h);
  arr.forEach(it=>{
    const c=C(it.cat), row=document.createElement('div');
    row.className='item'+(it.done?' bought':'');
    row.innerHTML=`<span class="check" style="${it.done?'':'border-color:'+c.c}">${it.done?'✓':''}</span>
      <span class="item-txt"><span class="item-title">${esc(it.title)}</span>
      ${it.qty?`<span class="item-qty">${esc(it.qty)}</span>`:''}</span>
      <button class="btn-edit" aria-label="Editar">✏️</button>`;
    row.querySelector('.item-txt').onclick=()=>toggle(it.id);
    row.querySelector('.check').onclick=()=>toggle(it.id);
    row.querySelector('.btn-edit').onclick=e=>{e.stopPropagation();editing=(editing===it.id?null:it.id);renderBody()};
    g.appendChild(row);
    if(editing===it.id) g.appendChild(editorEl(it));
  });
  return g;
}

function editorEl(it){
  const d=document.createElement('div'); d.className='editor';
  d.innerHTML=`<input id="edT" value="${esc(it.title)}" placeholder="Producto">
    <input id="edQ" value="${esc(it.qty||'')}" placeholder="Cantidad (2 kg, 3 piezas…)">
    <div class="cats-grid" id="edCats"></div>
    <div class="editor-actions"><button class="b-del" id="edDel">🗑</button>
    <button class="b-save" id="edSave">Guardar</button></div>`;
  setTimeout(()=>{
    let sel=it.cat; const grid=d.querySelector('#edCats');
    const paint=()=>{
      grid.innerHTML='';
      S.route.forEach(k=>{
        const c=C(k), b=document.createElement('button');
        b.className='cat-chip'+(k===sel?' on':'');
        if(k===sel){b.style.borderColor=c.c;b.style.background=hexA(c.c,.1)}
        b.innerHTML=`<span class="dot" style="background:${c.c}"></span>${esc(c.n)}`;
        b.onclick=()=>{sel=k;paint()}; grid.appendChild(b);
      });
      const nb=document.createElement('button');
      nb.className='cat-chip new'; nb.innerHTML='<span style="font-size:15px">＋</span> Nueva sección';
      nb.onclick=()=>modalNewCat(k=>{sel=k;paint()}); grid.appendChild(nb);
    };
    paint();
    d.querySelector('#edSave').onclick=()=>{
      const t=d.querySelector('#edT').value.trim();
      if(!t) return toast('Ponle nombre al producto');
      it.title=cap(t); it.qty=d.querySelector('#edQ').value.trim(); it.cat=sel; it.mt=now();
      S.dict[norm(t)]=sel; editing=null; save(); render(); toast('Listo');
    };
    d.querySelector('#edDel').onclick=()=>{
      it.del=true; it.mt=now(); editing=null; save(); render(); toast('Eliminado');
    };
  },0);
  return d;
}

const inp=document.getElementById('newItem'), qty=document.getElementById('newQty');
inp.addEventListener('input',renderSugs);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryAdd()}});
qty.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryAdd()}});
document.getElementById('btnAdd').addEventListener('click',e=>{e.preventDefault();tryAdd()});

function renderSugs(){
  const box=document.getElementById('sugs'); box.innerHTML='';
  const q=norm(inp.value); if(!q) return;
  const keys=Object.keys(S.dict).filter(k=>S.cats[S.dict[k]]);
  const a=keys.filter(k=>k.startsWith(q)), b=keys.filter(k=>!k.startsWith(q)&&k.includes(q));
  [...a,...b].slice(0,6).forEach(k=>{
    const c=C(S.dict[k]), el=document.createElement('button'); el.className='sug';
    el.innerHTML=`<span class="dot" style="background:${c.c}"></span>${esc(cap(k))}`;
    el.onclick=()=>{inp.value=cap(k);commit(cap(k),S.dict[k])};
    box.appendChild(el);
  });
}
function tryAdd(){
  const t=inp.value.trim();
  if(!t){ inp.focus(); return toast('Escribe qué falta'); }
  const known=S.dict[norm(t)];
  if(known&&S.cats[known]) return commit(t,known);
  modalPickCat(t);
}
function modalPickCat(title){
  openModal(`<h2>¿En qué sección va?</h2>
    <p class="sub"><b>${esc(cap(title))}</b> es nuevo. Elige su color y lo recuerdo para siempre.</p>
    <div class="cats-grid" id="pkGrid"></div>
    <div class="m-actions"><button class="b-ghost" onclick="closeModal()">Cancelar</button></div>`);
  const grid=document.getElementById('pkGrid');
  S.route.forEach(k=>{
    const c=C(k), b=document.createElement('button');
    b.className='cat-chip'; b.style.borderColor=c.c;
    b.innerHTML=`<span class="dot" style="background:${c.c}"></span>${esc(c.n)}`;
    b.onclick=()=>{closeModal();commit(title,k)}; grid.appendChild(b);
  });
  const nb=document.createElement('button');
  nb.className='cat-chip new'; nb.innerHTML='<span style="font-size:15px">＋</span> Nueva sección';
  nb.onclick=()=>modalNewCat(k=>{closeModal();commit(title,k)}); grid.appendChild(nb);
}
function commit(title,cat){
  const l=L(), key=norm(title);
  const dup=IT(l).find(i=>norm(i.title)===key&&!i.done);
  if(dup){ if(qty.value.trim()){dup.qty=qty.value.trim();dup.mt=now()} toast('Ya estaba en la lista'); }
  else l.items.unshift({id:uid(),title:cap(title),qty:qty.value.trim(),cat,done:false,mt:now()});
  S.dict[key]=cat;
  inp.value=''; qty.value=''; document.getElementById('sugs').innerHTML='';
  save(); render(); inp.focus();
}
function toggle(id){
  const it=IT(L()).find(i=>i.id===id); if(!it) return;
  it.done=!it.done; it.mt=now(); editing=null; save(); render();
  if(navigator.vibrate) navigator.vibrate(8);
}

function modalEditCat(k){

  openModal(`<h2>Editar sección</h2>

  const sw=document.getElementById('ecSw');
  const paint=()=>{sw.innerHTML='';PALETTE.forEach(x=>{const b=document.createElement('button');

function modalDelCat(k){
  if(k==='otros') return toast('Otros no se puede eliminar');
  const c=C(k);
  const used=S.lists.reduce((a,l)=>a+IT(l).filter(i=>i.cat===k).length,0);
  openModal(`<h2>Eliminar “${esc(c.n)}”</h2>
    <p class="sub">${used?`Los ${used} producto(s) de esta sección se pasan a <b>Otros</b>; no se borran.`:'No hay productos en esta sección.'}</p>
    <div class="m-actions"><button class="b-ghost" id="dcNo">Cancelar</button>
    <button class="b-danger" id="dcSi">Sí, eliminar</button></div>`);
  document.getElementById('dcNo').onclick=()=>document.getElementById('dkSecs').onclick();
  document.getElementById('dcSi').onclick=()=>{
    if(!S.cats.otros) S.cats.otros={n:'Otros',c:'#8A90A0'};
    if(!S.route.includes('otros')) S.route.push('otros');
    S.lists.forEach(l=>l.items.forEach(i=>{if(i.cat===k){i.cat='otros';i.mt=now()}}));
    Object.keys(S.dict).forEach(w=>{if(S.dict[w]===k)S.dict[w]='otros'});
    delete S.cats[k]; S.route=S.route.filter(x=>x!==k); S.catsMt=now();
    save(); render(); document.getElementById('dkSecs').onclick(); toast('Sección eliminada');
  };
}

  const nd=Object.keys(S.dict).length, ns=S.route.length;
  openModal(`<h2>Ajustes</h2><p class="sub">Tus listas se guardan solas en la nube; quien abra tu enlace ve y edita lo mismo que tú.</p>
    <div class="m-actions"><button class="b-primary" id="stLink">🔗 Mi enlace</button></div>
    <div class="m-actions"><button class="b-orange" id="stNew">＋ Crear un espacio para alguien más</button></div>
    <div class="switch-row" style="margin-top:12px"><span class="nm">Pantalla siempre encendida<small>Para que no se apague mientras compras</small></span>
      <button class="sw ${S.keepAwake?'on':''}" id="swWake"></button></div>
    <div class="tip">Reconozco <b>${nd}</b> productos con su color, repartidos en <b>${ns}</b> secciones.</div>
    <div class="m-actions"><button class="b-ghost" id="stExp">Respaldar</button><button class="b-ghost" id="stImp">Restaurar</button></div>
    <div class="m-actions"><button class="b-ghost" onclick="closeModal()">Cerrar</button></div>`);
  document.getElementById('stLink').onclick=modalMiEnlace;
  document.getElementById('stNew').onclick=modalNuevoEspacio;
  document.getElementById('swWake').onclick=async e=>{
    S.keepAwake=!S.keepAwake; e.target.classList.toggle('on',S.keepAwake);
    if(S.keepAwake) askWakeLock(); else if(wakeLock){try{await wakeLock.release()}catch(x){}wakeLock=null}
    save(1);
  };
  document.getElementById('stExp').onclick=()=>{
    const j=JSON.stringify(S);
    openModal(`<h2>Respaldo</h2><p class="sub">Copia este texto y guárdalo; con él restauras listas, secciones y diccionario en otro teléfono.</p>
      <textarea id="bkT" readonly>${esc(j)}</textarea>
      <div class="m-actions"><button class="b-ghost" onclick="closeModal()">Cerrar</button><button class="b-primary" id="bkC">Copiar</button></div>`);
    document.getElementById('bkC').onclick=()=>{copy(j);toast('Respaldo copiado')};
  };
  document.getElementById('stImp').onclick=()=>{
    openModal(`<h2>Restaurar</h2><p class="sub">Pega aquí un respaldo; reemplaza lo que tienes ahora.</p>
      <textarea id="rsT" placeholder="Pega el respaldo"></textarea>
      <div class="m-actions"><button class="b-ghost" onclick="closeModal()">Cancelar</button><button class="b-primary" id="rsGo">Restaurar</button></div>`);
    document.getElementById('rsGo').onclick=()=>{
      try{const o=JSON.parse(document.getElementById('rsT').value); if(!o.lists) throw 0;
        const rev=S.sync.rev||0;
        S=o; if(!S.cats)S.cats=JSON.parse(JSON.stringify(BASE_CATS)); if(!S.route)S.route=Object.keys(S.cats);
        S.sync={rev:rev,ok:null,dirty:true};
        if(!S.active||!LIVE().some(l=>l.id===S.active)) S.active=LIVE()[0].id;
        save();render();closeModal();toast('Todo restaurado');
      }catch(e){toast('Ese respaldo no se puede leer')}
    };
  };
};

function shareBox(titulo,sub,url,extra,wa){
  openModal(`<h2>${titulo}</h2>
    <p class="sub">${sub}</p>
    <div class="code link" id="lkTxt">${esc(url)}</div>
    ${extra||''}
    <div class="m-actions"><button class="b-ghost" id="lkCopy">Copiar</button>
    <button class="b-primary" id="lkWa">WhatsApp</button></div>
    <div class="m-actions"><button class="b-ghost" id="lkBack">Volver</button></div>`);
  document.getElementById('lkCopy').onclick=()=>{copy(url);toast('Enlace copiado')};
  document.getElementById('lkWa').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(wa||url),'_blank');
  document.getElementById('lkBack').onclick=()=>document.getElementById('dkSet').onclick();
}

function modalMiEnlace(){
  shareBox('Mi enlace',
    'Este es el enlace de tus listas. Quien lo abra ve y edita exactamente lo mismo que tú, al momento. Mándalo solo a quien quieras que entre.',
    linkFor(ESP),
    '<div class="tip">Guárdalo en tu teléfono; si algún día cambias de aparato, con este enlace recuperas todo.</div>',
    'Te paso nuestra lista del súper 🛒 ábrela aquí y los dos vemos lo mismo: '+linkFor(ESP));
}

function modalNuevoEspacio(){
  const otro=newEsp();
  shareBox('Un espacio para alguien más',
    'Aquí tienes un enlace nuevo y vacío, aparte del tuyo. El tuyo no se toca y esa persona no ve tus listas.',
    linkFor(otro),
    '<div class="tip">Sirve para la casa de tus papás, la oficina o cualquier lista que no quieras mezclar con la tuya.</div>',
    'Te comparto tu lista del súper 🛒 ábrela desde aquí: '+linkFor(otro));
}

/* =============== LISTAS =============== */
function modalList(list){
  const isNew=!list;
  openModal(`<h2>${isNew?'Nueva lista':'Editar lista'}</h2>
    <p class="sub">${isNew?'Súper, farmacia, ferretería… las que quieras.':'Cambia el nombre, duplícala o bórrala.'}</p>
    <input id="lnName" placeholder="Nombre de la lista" value="${isNew?'':esc(list.name)}">
    <div class="m-actions"><button class="b-ghost" onclick="closeModal()">Cancelar</button>
    <button class="b-primary" id="lnOk">${isNew?'Crear':'Guardar'}</button></div>
    ${isNew?'':`<div class="m-actions"><button class="b-ghost" id="lnDup">Duplicar</button>${LIVE().length>1?'<button class="b-danger" id="lnDel">Eliminar</button>':''}</div>`}`);
  const nm=document.getElementById('lnName'); setTimeout(()=>nm.focus(),90);
  document.getElementById('lnOk').onclick=()=>{
    const v=nm.value.trim(); if(!v) return toast('Ponle nombre');
    if(isNew){const l={id:uid(),name:v,items:[],mt:now()};S.lists.push(l);S.active=l.id}
    else {list.name=v;list.mt=now()}
    save();render();closeModal();
  };
  if(!isNew){
    document.getElementById('lnDup').onclick=()=>{
      const cl={id:uid(),name:list.name+' (copia)',mt:now(),
        items:IT(list).map(i=>({...i,id:uid(),done:false,mt:now()}))};
      S.lists.push(cl);S.active=cl.id;save();render();closeModal();toast('Lista duplicada');
    };
    const del=document.getElementById('lnDel');
    if(del) del.onclick=()=>{
      list.del=true;list.mt=now();S.active=LIVE()[0].id;save();render();closeModal();toast('Lista eliminada');
    };
  }
}

/* =============== UTILIDADES =============== */
function asText(){
  const l=L(); let out='🛒 '+l.name+'\n';
  S.route.forEach(k=>{
    const g=IT(l).filter(i=>!i.done&&i.cat===k); if(!g.length) return;
    out+='\n'+C(k).n.toUpperCase()+'\n';
    g.forEach(i=>out+='• '+i.title+(i.qty?' — '+i.qty:'')+'\n');
  });
  return out.trim();
}
function copy(t){ if(navigator.clipboard) navigator.clipboard.writeText(t).catch(()=>fb(t)); else fb(t);
  function fb(x){const a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()} }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function shade(h){const n=parseInt(h.slice(1),16);
  return `rgb(${Math.round((n>>16&255)*.62)},${Math.round((n>>8&255)*.62)},${Math.round((n&255)*.62)})`}
function openModal(html){document.getElementById('ovBody').innerHTML=html;document.getElementById('ov').classList.add('on')}
function closeModal(){document.getElementById('ov').classList.remove('on')}
document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')closeModal()};
let tT; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),1900)}
async function askWakeLock(){try{if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}

function installManifest(){
  const icon='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" rx="110" fill="#12A150"/><circle cx="196" cy="392" r="34" fill="#fff"/><circle cx="330" cy="392" r="34" fill="#fff"/><path d="M96 120h60l52 214h176l46-142H188" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/></svg>');
  const m={name:'Ferrock List',short_name:'Ferrock List',start_url:location.pathname+location.search,display:'standalone',background_color:'#FFF6EC',theme_color:'#12A150',icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any'}]};
  try{const l=document.createElement('link');l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l)}catch(e){}
  const al=document.createElement('link'); al.rel='apple-touch-icon'; al.href=icon; document.head.appendChild(al);
}
