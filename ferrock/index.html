<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferrock — ExcelentIA File Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f6f8;
  --surface:#ffffff;
  --border:#dde1e9;
  --header-grad:linear-gradient(135deg,#0d1b3e 0%,#1a3a6b 60%,#1e5096 100%);
  --header-accent:#4a9fd4;
  --hover-bg:#e8f0fb;
  --card-head:#dce8f7;
  --text:#1a2035;
  --text2:#4a5068;
  --text3:#8a90a0;
  --accent:#4a9fd4;
  --accent-dark:#1a3a6b;
  --green:#2d9e5f;
}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}

/* NAV */
nav{background:var(--header-grad);border-bottom:2px solid var(--header-accent);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100;}
.nav-brand{display:flex;flex-direction:column;line-height:1.1;}
.nav-brand-main{font-size:16px;font-weight:800;color:#fff;letter-spacing:-0.02em;}
.nav-brand-sub{font-size:10px;font-weight:500;color:rgba(255,255,255,0.5);letter-spacing:.06em;text-transform:uppercase;}
.nav-links{display:flex;gap:12px;align-items:center;}
.nav-link{font-size:12px;font-weight:500;color:rgba(255,255,255,0.75);text-decoration:none;padding:7px 12px;border-radius:7px;transition:background .15s;}
.nav-link:hover{background:rgba(255,255,255,0.12);color:#fff;}



/* STATS */
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-bottom:1px solid var(--border);}
.stat{padding:16px 20px;border-right:1px solid var(--border);text-align:center;}
.stat:last-child{border-right:none;}
.stat-num{font-size:24px;font-weight:800;color:var(--accent-dark);line-height:1;letter-spacing:-0.02em;}
.stat-label{font-size:10px;color:var(--text3);font-weight:600;margin-top:3px;text-transform:uppercase;letter-spacing:.06em;}

/* SEARCH BAR */
.search-bar{padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.search-wrap{position:relative;flex:1;max-width:480px;}
.search-wrap input{width:100%;padding:9px 12px 9px 38px;font-family:'Manrope',sans-serif;font-size:13px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border-color .15s;}
.search-wrap input:focus{border-color:var(--accent);background:#fff;}
.search-wrap input::placeholder{color:var(--text3);}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px;pointer-events:none;}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap;}
.pill{font-size:11px;font-weight:700;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none;}
.pill.active{background:var(--accent-dark);color:#fff;border-color:var(--accent-dark);}
.pill:hover:not(.active){border-color:var(--accent);color:var(--accent);}

/* MAIN GRID */
.main{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 24px 40px;}
.col{display:flex;flex-direction:column;gap:12px;}

/* FOLDER CARD */
.folder-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:box-shadow .15s;}
.folder-card:hover{box-shadow:0 2px 14px rgba(26,58,107,0.09);}
.folder-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card-head);cursor:pointer;user-select:none;border-bottom:1px solid var(--border);transition:background .12s;}
.folder-head:hover{background:var(--hover-bg);}
.folder-head.open{background:var(--hover-bg);}
.folder-ico{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#1a3a6b,#4a9fd4);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.folder-info{flex:1;min-width:0;}
.folder-name{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.folder-path{font-size:10px;color:var(--text3);font-weight:500;margin-top:1px;font-family:monospace;}
.folder-meta{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.folder-count{font-size:10px;font-weight:700;background:var(--accent-dark);color:#fff;padding:3px 9px;border-radius:12px;}
.chevron{font-size:15px;color:var(--text3);transition:transform .2s;}
.folder-head.open .chevron{transform:rotate(180deg);}

.folder-body{display:none;}
.folder-body.open{display:block;}

/* SUBGROUPS */
.subgroup{border-bottom:1px solid var(--border);}
.subgroup:last-child{border-bottom:none;}
.subgroup-head{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;background:transparent;transition:background .12s;user-select:none;}
.subgroup-head:hover{background:var(--bg);}
.subgroup-ico{font-size:14px;color:var(--accent);}
.subgroup-label{font-size:10px;font-weight:700;color:var(--text2);flex:1;text-transform:uppercase;letter-spacing:.07em;}
.subgroup-cnt{font-size:10px;color:var(--text3);background:var(--bg);border:1px solid var(--border);padding:1px 7px;border-radius:10px;font-weight:600;}
.sub-chev{font-size:13px;color:var(--text3);transition:transform .2s;}
.subgroup-head.open .sub-chev{transform:rotate(180deg);}
.subgroup-files{display:none;padding:4px 10px 10px;}
.subgroup-files.open{display:block;}

/* FILE ITEMS */
.file-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;text-decoration:none;transition:background .12s;border:1px solid transparent;}
.file-item:hover{background:var(--hover-bg);border-color:var(--border);}
.ext-badge{font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;min-width:32px;text-align:center;text-transform:uppercase;flex-shrink:0;letter-spacing:.03em;}
.ext-html{background:#fde8e8;color:#b83232;}
.ext-img{background:#e8eefe;color:#3248b8;}
.ext-md{background:#f0e8fe;color:#7032b8;}
.ext-css{background:#e8feee;color:#1a7b3a;}
.ext-js{background:#fef8e8;color:#9a7000;}
.ext-other{background:var(--bg);color:var(--text3);}
.file-name{font-size:12px;font-weight:500;color:var(--text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-item:hover .file-name{color:var(--accent);}
.file-open{font-size:12px;color:var(--text3);opacity:0;transition:opacity .12s;flex-shrink:0;}
.file-item:hover .file-open{opacity:1;}

/* FOLDER TAB FILTERS */
.folder-tabs{display:flex;gap:4px;margin-left:auto;margin-right:8px;}
.ftab{font-size:10px;font-weight:700;padding:3px 9px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--accent-dark);cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none;}
.ftab:hover{background:var(--hover-bg);border-color:var(--accent);}
.ftab.active{background:var(--accent-dark);color:#fff;border-color:var(--accent-dark);}
.ftab.zero{opacity:0.35;pointer-events:none;}
.status-wrap{padding:48px 24px;text-align:center;color:var(--text3);grid-column:1/-1;}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-state{grid-column:1/-1;text-align:center;padding:36px;color:var(--text3);font-size:13px;}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);}
.footer-l{font-size:11px;color:var(--text3);}
.footer-r{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* RESPONSIVE */
@media(max-width:640px){
  nav,footer{padding:0 14px;}
  nav{height:52px;}
  .logo-box{min-height:44px;min-width:68px;}
  .logo-box img{height:30px;}
  .hero{padding:20px 16px 24px;}
  .hero-title{font-size:20px;}
  .stats-strip{grid-template-columns:repeat(2,1fr);}
  .stat:nth-child(2){border-right:none;}
  .stat:nth-child(3){border-top:1px solid var(--border);}
  .stat:nth-child(4){border-top:1px solid var(--border);border-right:none;}
  .search-bar{padding:10px 14px;flex-wrap:wrap;}
  .filter-pills{display:none;}
  .main{grid-template-columns:1fr;padding:12px 14px 32px;}
  footer{padding:12px 14px;flex-direction:column;gap:6px;text-align:center;}
}
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <span class="nav-brand-main">FERROCK</span>
    <span class="nav-brand-sub">by ExcelentIA</span>
  </div>
  <div class="nav-links">
    <a class="nav-link" href="https://excelentia.com.mx" target="_blank">← Sitio principal</a>
    <a class="nav-link" href="https://github.com/fernandodavilaolvera-rgb/excelentia.com.mx" target="_blank">GitHub</a>
  </div>
</nav>



<div class="stats-strip">
  <div class="stat"><div class="stat-num" id="sTotal">—</div><div class="stat-label">Archivos</div></div>
  <div class="stat"><div class="stat-num" id="sHtml">—</div><div class="stat-label">HTML</div></div>
  <div class="stat"><div class="stat-num" id="sCarpetas">—</div><div class="stat-label">Carpetas</div></div>
  <div class="stat"><div class="stat-num" id="sHora">—</div><div class="stat-label">Actualizado</div></div>
</div>

<div class="search-bar">
  <div class="search-wrap">
    <span class="search-icon"><i class="ti ti-search" aria-hidden="true"></i></span>
    <input type="text" id="search" placeholder="Buscar archivo o carpeta…" oninput="doFilter()">
  </div>
  <div class="filter-pills">
    <span class="pill active" data-ext="all"  onclick="setExt(this)">Todo</span>
    <span class="pill" data-ext="html" onclick="setExt(this)">HTML</span>
    <span class="pill" data-ext="img"  onclick="setExt(this)">Imágenes</span>
    <span class="pill" data-ext="other" onclick="setExt(this)">Otros</span>
  </div>
</div>

<div class="main" id="mainGrid">
  <div class="status-wrap" id="statusEl">
    <div class="spinner"></div>
    Conectando con GitHub API…
  </div>
</div>

<footer>
  <div class="footer-l">ferrock · excelentia.com.mx/ferrock</div>
  <div class="footer-r"><div class="live-dot"></div>Datos en tiempo real · GitHub API</div>
</footer>

<script>
const REPO   = 'fernandodavilaolvera-rgb/excelentia.com.mx';
const BRANCH = 'main';
const BASE   = 'https://excelentia.com.mx';
const EXCLUDE = ['.git', 'node_modules'];
const IMG_EXTS = ['png','jpg','jpeg','gif','svg','webp','ico'];

const FOLDER_CFG = {
  '':            { label:'Raíz del sitio',      icon:'🌐', desc:'/' },
  'assets':      { label:'Assets / Imágenes',   icon:'🖼️', desc:'/assets/' },
  'agentes':     { label:'Agentes IA',           icon:'🤖', desc:'/agentes/' },
  'clientes':    { label:'Clientes',             icon:'🏢', desc:'/clientes/' },
  'rediceberg':  { label:'Ventana al Mundo',     icon:'🪟', desc:'/rediceberg/' },
  'herramientas':{ label:'Herramientas',         icon:'🛠️', desc:'/herramientas/' },
  'ferrock':     { label:'Ferrock',              icon:'📁', desc:'/ferrock/' },
  'legal':       { label:'Legal',                icon:'📄', desc:'/legal/' },
  'forms':       { label:'Formularios',          icon:'📋', desc:'/forms/' },
};

let allFiles  = [];
let activeExt = 'all';

function getExt(name) {
  const p = name.split('.');
  return p.length > 1 ? p.pop().toLowerCase() : '';
}
function isImg(ext) { return IMG_EXTS.includes(ext); }
function extClass(ext) {
  if (ext === 'html') return 'ext-html';
  if (isImg(ext))     return 'ext-img';
  if (ext === 'md')   return 'ext-md';
  if (ext === 'css')  return 'ext-css';
  if (ext === 'js')   return 'ext-js';
  return 'ext-other';
}
function fileUrl(path) {
  const parts  = path.split('/');
  const name   = parts[parts.length - 1];
  const ext    = getExt(name);
  const folder = parts.slice(0, -1).join('/');
  if (ext === 'html') {
    const base = name.replace(/\.html$/, '');
    return folder ? `${BASE}/${folder}/${base}` : `${BASE}/${base}`;
  }
  return folder ? `${BASE}/${folder}/${name}` : `${BASE}/${name}`;
}

function matchExt(ext) {
  if (activeExt === 'all')   return true;
  if (activeExt === 'html')  return ext === 'html';
  if (activeExt === 'img')   return isImg(ext);
  if (activeExt === 'other') return ext !== 'html' && !isImg(ext);
  return true;
}

function setExt(el) {
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  activeExt = el.dataset.ext;
  doFilter();
}

function doFilter() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  renderAll(q);
}

function buildFolderMap(files) {
  const map = {};
  files.forEach(f => {
    if (f.type !== 'blob') return;
    const parts     = f.path.split('/');
    const topFolder = parts.length > 1 ? parts[0] : '';
    if (EXCLUDE.includes(topFolder) || EXCLUDE.includes(f.path)) return;
    if (!map[topFolder]) map[topFolder] = [];
    map[topFolder].push(f);
  });
  return map;
}

function groupBySubtype(files) {
  const html = [], imgs = [], others = [];
  files.forEach(f => {
    const name = f.path.split('/').pop();
    const ext  = getExt(name);
    if (ext === 'html')   html.push(f);
    else if (isImg(ext))  imgs.push(f);
    else                  others.push(f);
  });
  return { html, imgs, others };
}

let _uid = 0;
function uid() { return 'id' + (++_uid); }

/* Filtra y re-renderiza los archivos dentro de una carpeta abierta */
function applyFolderTab(btn, bodyId) {
  const tab = btn.dataset.tab;
  btn.closest('.folder-tabs').querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  /* Abrir la carpeta si está colapsada */
  const body = document.getElementById(bodyId);
  const head = body.previousElementSibling;
  if (!body.classList.contains('open')) {
    body.classList.add('open');
    head.classList.add('open');
  }

  body.querySelectorAll('.file-item').forEach(item => {
    const ext = item.dataset.ext || '';
    let show = false;
    if (tab === 'all')   show = true;
    if (tab === 'html')  show = ext === 'html';
    if (tab === 'img')   show = IMG_EXTS.includes(ext);
    if (tab === 'other') show = ext !== 'html' && !IMG_EXTS.includes(ext);
    item.style.display = show ? '' : 'none';
  });
}

function renderFileList(files) {
  return files.map(f => {
    const name = f.path.split('/').pop();
    const ext  = getExt(name);
    const url  = fileUrl(f.path);
    return `<a class="file-item" href="${url}" target="_blank" rel="noopener" data-ext="${ext}">
      <span class="ext-badge ${extClass(ext)}">${ext || 'file'}</span>
      <span class="file-name">${name}</span>
      <span class="file-open"><i class="ti ti-external-link" aria-hidden="true"></i></span>
    </a>`;
  }).join('');
}

function renderAll(q = '') {
  const grid = document.getElementById('mainGrid');
  const folderMap = buildFolderMap(allFiles);
  const folderKeys = Object.keys(folderMap);
  if (!folderKeys.length) return;

  const allKeys = [...new Set([...Object.keys(FOLDER_CFG), ...folderKeys])].filter(k => folderMap[k]);
  const cards = [];

  allKeys.forEach(folder => {
    const files = folderMap[folder] || [];
    const filtered = files.filter(f => {
      const name = f.path.split('/').pop();
      const ext  = getExt(name);
      const matchQ = !q || name.toLowerCase().includes(q) || folder.toLowerCase().includes(q);
      return matchQ && matchExt(ext);
    });
    if (!filtered.length) return;

    const cfg = FOLDER_CFG[folder] || { label: folder || 'Raíz', icon: '📁', desc: `/${folder}/` };
    const { html, imgs, others } = groupBySubtype(filtered);

    /* Tabs: solo mostrar los que tienen archivos */
    const tabHtml  = html.length   ? '' : ' zero';
    const tabImg   = imgs.length   ? '' : ' zero';
    const tabOther = others.length ? '' : ' zero';

    cards.push({ cfg, files: filtered, html, imgs, others, count: filtered.length, tabHtml, tabImg, tabOther });
  });

  if (!cards.length) {
    grid.innerHTML = `<div class="empty-state"><i class="ti ti-search-off" style="font-size:28px;display:block;margin-bottom:8px;" aria-hidden="true"></i>Sin resultados para "<strong>${q}</strong>"</div>`;
    return;
  }

  const colA = [], colB = [];
  cards.forEach((c, i) => (i % 2 === 0 ? colA : colB).push(c));

  function colHTML(cards) {
    return cards.map(c => {
      const headId = uid();
      const bodyId = uid();
      return `<div class="folder-card">
        <div class="folder-head" id="${headId}" onclick="toggleFolder(this,'${bodyId}')">
          <div class="folder-ico">${c.cfg.icon}</div>
          <div class="folder-info">
            <div class="folder-name">${c.cfg.label}</div>
            <div class="folder-path">${c.cfg.desc}</div>
          </div>
          <div class="folder-tabs" onclick="event.stopPropagation()">
            <span class="ftab active" data-tab="all"   onclick="applyFolderTab(this,'${bodyId}')">Todo&nbsp;${c.count}</span>
            <span class="ftab${c.tabHtml}"  data-tab="html"  onclick="applyFolderTab(this,'${bodyId}')">HTML&nbsp;${c.html.length}</span>
            <span class="ftab${c.tabImg}"   data-tab="img"   onclick="applyFolderTab(this,'${bodyId}')">Img&nbsp;${c.imgs.length}</span>
            <span class="ftab${c.tabOther}" data-tab="other" onclick="applyFolderTab(this,'${bodyId}')">Otros&nbsp;${c.others.length}</span>
          </div>
          <span class="chevron"><i class="ti ti-chevron-down" aria-hidden="true"></i></span>
        </div>
        <div class="folder-body" id="${bodyId}">
          <div style="padding:6px 10px 10px;">${renderFileList(c.files)}</div>
        </div>
      </div>`;
    }).join('');
  }

  grid.innerHTML = `
    <div class="col">${colHTML(colA)}</div>
    <div class="col">${colHTML(colB)}</div>
  `;
}

function toggleFolder(head, id) {
  head.classList.toggle('open');
  document.getElementById(id).classList.toggle('open');
}

async function loadRepo() {
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`);
    if (!r.ok) throw new Error('GitHub API error ' + r.status);
    const d = await r.json();
    allFiles = d.tree || [];
    document.getElementById('statusEl').style.display = 'none';

    const visible = allFiles.filter(f => f.type === 'blob' && !EXCLUDE.some(e => f.path.startsWith(e)));
    const totalFiles   = visible.length;
    const totalHTML    = visible.filter(f => getExt(f.path.split('/').pop()) === 'html').length;
    const folderMap    = buildFolderMap(allFiles);
    const totalFolders = Object.keys(folderMap).filter(k => k !== '').length;

    document.getElementById('sTotal').textContent    = totalFiles;
    document.getElementById('sHtml').textContent     = totalHTML;
    document.getElementById('sCarpetas').textContent = totalFolders;
    document.getElementById('sHora').textContent     = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });

    renderAll();
  } catch (e) {
    document.getElementById('statusEl').innerHTML =
      `<p style="color:#b83232;font-weight:600;">No se pudo conectar con GitHub</p>
       <p style="font-size:11px;margin-top:8px;font-family:monospace;color:#8a90a0">${e.message}</p>`;
  }
}

loadRepo();
</script>
</body>
</html>
