<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mexibus Radio WiFi</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --hd:#F96302; --hd-dark:#D65200; --hd-ink:#231F20;
  --bg:#f5f6f8; --surface:#fff; --border:#dde1e9;
  --text:#231F20; --text2:#4a5068; --text3:#8a90a0;
  --ok:#2e9e5b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:22px 0 30px;line-height:1.5;
}
.stage{width:100%;max-width:460px;padding:0 16px}
.phone{
  background:var(--surface);border:1px solid var(--border);border-radius:22px;
  overflow:hidden;box-shadow:0 10px 34px rgba(35,31,32,.14);
}
.phone-top{
  background:#eef1f5;border-bottom:1px solid var(--border);
  padding:8px 14px;display:flex;align-items:center;gap:8px;
  font-size:11.5px;color:var(--text3);font-weight:600;
}
.dot{width:8px;height:8px;border-radius:50%;background:#cdd3dd;flex-shrink:0}
.dot.on{background:var(--ok)}

.screen{display:none;animation:fade .32s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.hero{background:var(--hd);border-bottom:4px solid var(--hd-dark);padding:22px 22px 20px;text-align:center}
.hero img{width:82px;height:82px;display:block;margin:0 auto 14px;border-radius:6px}
.hero h1{color:#fff;font-size:21px;font-weight:800;letter-spacing:-.3px;line-height:1.3}
.hero p{color:#ffe2cd;font-size:13.5px;margin-top:7px;font-weight:600}

.body-pad{padding:20px 20px 24px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--text2);margin-bottom:5px}
.field input{
  width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:9px;
  font-family:'Manrope',sans-serif;font-size:15px;color:var(--text);background:#fbfcfd;
}
.field input:focus{outline:none;border-color:var(--hd);background:#fff}

.legal{display:flex;gap:9px;align-items:flex-start;margin:15px 0 17px;font-size:11.5px;color:var(--text2);line-height:1.45}
.legal input{margin-top:2px;width:15px;height:15px;flex-shrink:0;accent-color:var(--hd)}
.legal a{color:var(--hd-dark);font-weight:700;text-decoration:none}

.btn{
  width:100%;padding:14px;border:none;border-radius:10px;cursor:pointer;
  font-family:'Manrope',sans-serif;font-size:15.5px;font-weight:800;letter-spacing:.2px;
  background:var(--hd);color:#fff;transition:background .2s,transform .1s;
}
.btn:hover{background:var(--hd-dark)}
.btn:active{transform:scale(.985)}
.btn:disabled{background:#c3cbd8;cursor:not-allowed}
.btn.ghost{background:none;color:var(--text3);font-weight:600;font-size:13px;padding:11px}
.btn.ghost:hover{background:none;color:var(--text2)}

.err{color:#c0392b;font-size:12px;font-weight:700;margin-top:9px;display:none}

.ad-wrap{background:var(--hd-ink);position:relative}
.ad-wrap img{width:100%;display:block;max-height:58vh;object-fit:contain;background:var(--hd)}
.timer-bar{height:4px;background:rgba(255,255,255,.18)}
.timer-fill{height:100%;width:0;background:var(--hd);transition:width .1s linear}
.count{text-align:center;padding:11px;font-size:12.5px;color:var(--text3);font-weight:600;background:#f8fafc;border-bottom:1px solid var(--border)}

.done{text-align:center;padding:30px 22px 26px}
.check{width:60px;height:60px;border-radius:50%;background:#eaf6ef;display:flex;align-items:center;justify-content:center;margin:0 auto 15px;font-size:30px;color:var(--ok)}
.done h2{font-size:20px;font-weight:800;margin-bottom:7px}
.done p{font-size:13.5px;color:var(--text2);margin-bottom:19px}


footer{max-width:460px;width:100%;text-align:center;color:var(--text3);font-size:11.5px;margin-top:18px;padding:0 16px}

@media (max-width:600px){
  .stage{padding:0 12px}
  .hero h1{font-size:19px}
  footer{padding:0 12px}
}
@media print{
  @page{size:Letter;margin:13mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;display:block;padding:0}
  .screen{display:block!important;break-inside:auto;margin-bottom:14px}
  .phone,.ad-wrap,img{break-inside:avoid}
  h1,h2,h3{break-after:avoid}
  p,li{orphans:3;widows:3}
  .btn{display:none!important}
  a[href]:after{content:none}
}
</style>
</head>

<script>
var SEGUNDOS = 7;
var timer = null;

function show(id){
  var s = document.querySelectorAll('.screen');
  for (var i=0;i<s.length;i++) s[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function go(){
  var n = document.getElementById('n').value.trim();
  var e = document.getElementById('e').value.trim();
  var ck = document.getElementById('ck').checked;
  var err = document.getElementById('err');
  if(!n || !e || e.indexOf('@') === -1 || !ck){ err.style.display='block'; return; }
  err.style.display='none';
  show('s2'); runAd();
}

function runAd(){
  var fill=document.getElementById('fill'), count=document.getElementById('count'), cont=document.getElementById('cont');
  cont.disabled=true; fill.style.width='0%';
  count.textContent='Tu internet se activa en '+SEGUNDOS+' s';
  var paso=0, total=SEGUNDOS*10;
  timer=setInterval(function(){
    paso++;
    fill.style.width=(paso/total*100)+'%';
    var rest=Math.ceil((total-paso)/10);
    if(rest>0) count.textContent='Tu internet se activa en '+rest+' s';
    if(paso>=total){
      clearInterval(timer);
      count.textContent='Ya puedes continuar';
      cont.disabled=false;
      document.getElementById('netdot').classList.add('on');
      document.getElementById('nettext').innerHTML='Conectado a MEXIBUS RADIO WiFi &middot; con internet';
    }
  },100);
}

function finish(){ show('s3'); }

function reset(){
  if(timer) clearInterval(timer);
  document.getElementById('n').value='';
  document.getElementById('e').value='';
  document.getElementById('ck').checked=false;
  document.getElementById('err').style.display='none';
  document.getElementById('netdot').classList.remove('on');
  document.getElementById('nettext').innerHTML='Conectado a MEXIBUS RADIO WiFi &middot; sin internet';
  show('s1');
}
</script>
