<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orden del Día — ExcelentIA | Mayo 22</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',sans-serif;background:#f5f6f8;color:#1a2035;min-height:100vh;padding-bottom:3rem}

  .header{background:linear-gradient(135deg,#0d1b3e 0%,#1a3a6b 60%,#1e5096 100%);border-bottom:3px solid #4a9fd4;padding:1.4rem 2rem;display:flex;align-items:center;gap:1.2rem}
  .logo-box{background:#fff;border-radius:10px;padding:.4rem .75rem;display:flex;align-items:center;justify-content:center;min-width:80px;min-height:52px;flex-shrink:0}
  .logo-box img{height:40px;width:auto;display:block}
  .logo-fallback{font-family:'Manrope',sans-serif;font-size:15px;font-weight:800;color:#1a3a6b;letter-spacing:-.3px;display:none}
  .logo-fallback span{color:#4a9fd4}
  .header-info h1{color:#fff;font-size:19px;font-weight:700;letter-spacing:.2px}
  .header-info p{color:#a8c4e0;font-size:13px;margin-top:3px}

  .progress-wrap{max-width:760px;margin:1.2rem auto 0;padding:0 1.5rem}
  .progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem}
  .progress-top span{font-size:12px;color:#4a5068;font-weight:600}
  .progress-bar-bg{background:#dde1e9;border-radius:99px;height:7px;overflow:hidden}
  .progress-bar{background:linear-gradient(90deg,#4a9fd4,#1a3a6b);height:100%;border-radius:99px;transition:width .4s ease;width:0%}

  .content{max-width:760px;margin:1rem auto;padding:0 1.5rem}

  .section{background:#fff;border:1px solid #dde1e9;border-radius:12px;margin-bottom:.9rem;overflow:hidden;box-shadow:0 1px 4px rgba(26,58,107,.04)}
  .sec-header{background:#dce8f7;padding:.75rem 1.25rem;display:flex;align-items:center;gap:.7rem;cursor:pointer;user-select:none;transition:background .15s}
  .sec-header:hover{background:#ccdff5}
  .sec-num{background:#1a3a6b;color:#fff;font-size:11px;font-weight:700;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .sec-header h2{font-size:14px;font-weight:700;color:#0d1b3e;flex:1}
  .sec-chev{color:#4a9fd4;font-size:20px;line-height:1;transition:transform .22s}
  .sec-header.collapsed .sec-chev{transform:rotate(-90deg)}
  .sec-body{padding:.5rem 1.25rem .9rem}

  .item-wrap{border-bottom:.5px solid #eef0f4}
  .item-wrap:last-child{border-bottom:none}

  .item-row{display:flex;align-items:flex-start;gap:.65rem;padding:.45rem .3rem;cursor:pointer;border-radius:7px;transition:background .15s}
  .item-row:hover{background:#e8f0fb}
  .cb{width:20px;height:20px;border:2px solid #4a9fd4;border-radius:5px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .2s;background:#fff}
  .item-row.checked .cb{background:#1a3a6b;border-color:#1a3a6b}
  .item-row.checked .cb::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
  .item-lbl{font-size:14px;color:#1a2035;line-height:1.4;flex:1;padding-top:1px}
  .item-row.checked .item-lbl{color:#8a90a0;text-decoration:line-through}
  .note-toggle{background:none;border:1px solid #c8d9f0;cursor:pointer;color:#1a3a6b;font-size:11px;font-family:'Manrope',sans-serif;font-weight:700;padding:.2rem .55rem;border-radius:20px;white-space:nowrap;margin-top:1px;transition:all .15s;flex-shrink:0}
  .note-toggle:hover{background:#e8f0fb;border-color:#4a9fd4}
  .note-toggle.active{background:#1a3a6b;color:#fff;border-color:#1a3a6b}

  .note-area{display:none;margin:.15rem .3rem .55rem 1.8rem}
  .note-area.open{display:block}
  .note-area textarea{width:100%;font-family:'Manrope',sans-serif;font-size:13px;color:#1a2035;background:#f0f6ff;border:1px solid #c8d9f0;border-left:3px solid #4a9fd4;border-radius:0 7px 7px 0;padding:.55rem .75rem;resize:vertical;min-height:68px;outline:none;transition:all .2s;line-height:1.5}
  .note-area textarea:focus{border-color:#4a9fd4;background:#e8f0fb;box-shadow:0 0 0 3px rgba(74,159,212,.1)}
  .note-area textarea::placeholder{color:#aab4c8}

  .sub-wrap{padding-left:1.6rem}
  .sub-wrap .item-row{padding:.35rem .3rem}
  .sub-wrap .item-lbl{font-size:13px;color:#4a5068}
  .sub-wrap .item-row.checked .item-lbl{color:#aaa}
  .sub-wrap .cb{width:17px;height:17px;border-radius:4px}
  .sub-wrap .note-area{margin-left:1.5rem}

  .footer-note{background:#eef4fc;border-left:3px solid #1a3a6b;border-radius:0 8px 8px 0;margin:.6rem 0 0;padding:.5rem .8rem;font-size:12px;color:#4a5068}

  .actions{max-width:760px;margin:0 auto;padding:0 1.5rem;display:flex;gap:.8rem;flex-wrap:wrap}
  .btn-pdf{flex:1;background:linear-gradient(135deg,#0d1b3e,#1e5096);color:#fff;border:none;font-family:'Manrope',sans-serif;font-size:14px;font-weight:700;padding:.75rem 1.5rem;border-radius:10px;cursor:pointer;transition:opacity .2s;min-width:200px}
  .btn-pdf:hover{opacity:.88}
  .btn-reset{background:transparent;border:1.5px solid #4a9fd4;color:#1a3a6b;font-family:'Manrope',sans-serif;font-size:14px;font-weight:600;padding:.75rem 1.25rem;border-radius:10px;cursor:pointer;transition:background .2s}
  .btn-reset:hover{background:#e8f0fb}

  @media(max-width:600px){
    .header{padding:1rem 1.2rem;gap:.8rem}
    .logo-box{min-height:42px;min-width:64px;padding:.3rem .5rem}
    .logo-box img{height:32px}
    .header-info h1{font-size:15px}
    .progress-wrap,.content,.actions{padding:0 1rem}
    .btn-pdf,.btn-reset{font-size:13px;padding:.65rem 1rem}
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo-box">
    <img src="https://excelentia.com.mx/assets/logo%20excelentIA.png" alt="ExcelentIA"
         onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
    <span class="logo-fallback">Excelent<span>IA</span></span>
  </div>
  <div class="header-info">
    <h1>Orden del Día — ExcelentIA</h1>
    <p>Viernes 22 de Mayo, 2025 &nbsp;·&nbsp; 1:00 PM</p>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-top">
    <span>Progreso de la reunión</span>
    <span id="plabel">0 de 0 completados</span>
  </div>
  <div class="progress-bar-bg"><div class="progress-bar" id="pb"></div></div>
</div>

<div class="content" id="agenda"></div>

<div class="actions">
  <button class="btn-pdf" onclick="exportPDF()">⬇&nbsp; Exportar resumen a PDF</button>
  <button class="btn-reset" onclick="resetAll()">↺ Reiniciar todo</button>
</div>

<script>
const data = [
  {
    title: "Revisión de Página Web",
    items: [
      { lbl: "Revisión" },
      { lbl: "Feedback" }
    ]
  },
  {
    title: "Eco Interpretador",
    items: [
      { lbl: "Pruebas" },
      { lbl: "Pendientes" },
      { lbl: "Siguientes pasos" }
    ]
  },
  {
    title: "Club Berimbau",
    items: [
      { lbl: "Revisar Dashboard" },
      { lbl: "Feedback" },
      { lbl: "Siguientes pasos" }
    ]
  },
  {
    title: "ExcelentIA Dashboard",
    items: [
      {
        lbl: "Definir qué pestañas lo van a integrar",
        subs: ["Resumen de Correo","Facturas Dashboard","Noticias","Gastos","CRM","Notas tipo Post-it","Otros: Diario / Recordatorio de pagos / Juego"]
      },
      {
        lbl: "Definir alcances del CRM",
        subs: ["Tareas","Contactos","Enlace a WhatsApp","Enlace a Correos","Base de datos de Clientes","Proyectos","Status de proyectos","Archivos"]
      }
    ],
    note: "Definir prioridades antes de cerrar este punto"
  },
  {
    title: "Firmas Partners",
    items: [
      { lbl: "Tener imagen de firmas para propuestas comerciales" }
    ]
  }
];

const container = document.getElementById('agenda');

function makeItem(lbl, nid, isSub) {
  const wrap = document.createElement('div');
  wrap.className = 'item-wrap';

  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `<div class="cb"></div><span class="item-lbl">${lbl}</span><button class="note-toggle" onclick="toggleNote('${nid}',this,event)">+ Nota</button>`;
  row.addEventListener('click', e => {
    if (e.target.classList.contains('note-toggle')) return;
    row.classList.toggle('checked');
    updateProgress();
  });
  wrap.appendChild(row);

  const na = document.createElement('div');
  na.className = 'note-area';
  na.id = nid;
  na.innerHTML = `<textarea placeholder="Escribe notas, acuerdos o comentarios aquí..."></textarea>`;
  wrap.appendChild(na);

  return wrap;
}

data.forEach((sec, si) => {
  const sdiv = document.createElement('div');
  sdiv.className = 'section';

  const hdr = document.createElement('div');
  hdr.className = 'sec-header';
  hdr.innerHTML = `<span class="sec-num">${si+1}</span><h2>${sec.title}</h2><span class="sec-chev">›</span>`;
  hdr.onclick = () => {
    const body = sdiv.querySelector('.sec-body');
    hdr.classList.toggle('collapsed');
    body.style.display = hdr.classList.contains('collapsed') ? 'none' : 'block';
  };
  sdiv.appendChild(hdr);

  const body = document.createElement('div');
  body.className = 'sec-body';

  sec.items.forEach((it, ii) => {
    const nid = `n_${si}_${ii}`;
    const wrap = makeItem(it.lbl, nid, false);

    if (it.subs) {
      const subdiv = document.createElement('div');
      subdiv.className = 'sub-wrap';
      it.subs.forEach((s, ki) => {
        const snid = `n_${si}_${ii}_${ki}`;
        subdiv.appendChild(makeItem(s, snid, true));
      });
      wrap.appendChild(subdiv);
    }
    body.appendChild(wrap);
  });

  if (sec.note) {
    const fn = document.createElement('div');
    fn.className = 'footer-note';
    fn.textContent = '💡 ' + sec.note;
    body.appendChild(fn);
  }

  sdiv.appendChild(body);
  container.appendChild(sdiv);
});

function toggleNote(id, btn, e) {
  e.stopPropagation();
  const el = document.getElementById(id);
  el.classList.toggle('open');
  const open = el.classList.contains('open');
  btn.textContent = open ? '− Nota' : '+ Nota';
  btn.classList.toggle('active', open);
  if (open) el.querySelector('textarea').focus();
}

function updateProgress() {
  const all = document.querySelectorAll('.item-row');
  const done = document.querySelectorAll('.item-row.checked');
  const pct = all.length ? Math.round(done.length / all.length * 100) : 0;
  document.getElementById('pb').style.width = pct + '%';
  document.getElementById('plabel').textContent = done.length + ' de ' + all.length + ' completados';
}

function resetAll() {
  if (!confirm('¿Reiniciar todo? Se borrarán las notas y el progreso.')) return;
  document.querySelectorAll('.item-row.checked').forEach(el => el.classList.remove('checked'));
  document.querySelectorAll('textarea').forEach(el => el.value = '');
  document.querySelectorAll('.note-area.open').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.note-toggle').forEach(el => { el.textContent = '+ Nota'; el.classList.remove('active'); });
  updateProgress();
}

function exportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, M = 16, CW = W - M * 2;
  let y = 0;

  // Header
  doc.setFillColor(13, 27, 62);
  doc.rect(0, 0, W, 30, 'F');
  doc.setFillColor(74, 159, 212);
  doc.rect(0, 30, W, 1.2, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.text('Orden del Día — ExcelentIA', M, 13);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(168, 196, 224);
  doc.text('Viernes 22 de Mayo, 2025  ·  1:00 PM', M, 21);
  const all = document.querySelectorAll('.item-row');
  const done = document.querySelectorAll('.item-row.checked');
  doc.text(`Progreso: ${done.length} de ${all.length} completados`, W - M, 21, { align: 'right' });
  y = 42;

  const sections = document.querySelectorAll('.section');
  sections.forEach((sec, si) => {
    const title = sec.querySelector('h2').textContent;
    if (y > 265) { doc.addPage(); y = 20; }

    // Section header
    doc.setFillColor(220, 232, 247);
    doc.roundedRect(M - 2, y - 5.5, CW + 4, 10, 2, 2, 'F');
    doc.setTextColor(13, 27, 62);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text(`${si + 1}. ${title}`, M + 1, y);
    y += 10;

    sec.querySelectorAll('.item-wrap').forEach(wrap => {
      const isSub = !!wrap.closest('.sub-wrap');
      const indent = M + (isSub ? 8 : 1);
      const maxW = CW - (isSub ? 10 : 2);
      const row = wrap.querySelector(':scope > .item-row');
      if (!row) return;
      const lbl = row.querySelector('.item-lbl').textContent;
      const checked = row.classList.contains('checked');
      const note = wrap.querySelector(':scope > .note-area textarea')?.value?.trim() || '';

      if (y > 272) { doc.addPage(); y = 20; }

      // Checkbox symbol
      doc.setDrawColor(74, 159, 212);
      doc.setLineWidth(0.5);
      if (checked) {
        doc.setFillColor(26, 58, 107);
        doc.roundedRect(indent, y - 3.5, 4, 4, 0.8, 0.8, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(7);
        doc.text('✓', indent + 0.7, y - 0.2);
      } else {
        doc.setFillColor(255, 255, 255);
        doc.roundedRect(indent, y - 3.5, 4, 4, 0.8, 0.8, 'FD');
      }

      // Label
      doc.setFont('helvetica', checked ? 'normal' : 'normal');
      doc.setFontSize(isSub ? 9 : 10);
      doc.setTextColor(checked ? 138 : 26, checked ? 144 : 32, checked ? 160 : 53);
      const lines = doc.splitTextToSize(lbl, maxW - 7);
      doc.text(lines, indent + 6, y);
      if (checked) {
        const tw = doc.getTextWidth(lbl);
        doc.setDrawColor(160, 160, 160);
        doc.setLineWidth(0.3);
        doc.line(indent + 6, y - 0.8, Math.min(indent + 6 + tw, W - M), y - 0.8);
      }
      y += lines.length * (isSub ? 4.5 : 5.2) + 1.5;

      if (note) {
        if (y > 270) { doc.addPage(); y = 20; }
        const nlines = doc.splitTextToSize(note, maxW - 10);
        const boxH = nlines.length * 4.5 + 6;
        doc.setFillColor(240, 246, 255);
        doc.roundedRect(indent + 5, y - 3, maxW - 5, boxH, 2, 2, 'F');
        doc.setFillColor(74, 159, 212);
        doc.rect(indent + 5, y - 3, 1.5, boxH, 'F');
        doc.setTextColor(26, 58, 107);
        doc.setFont('helvetica', 'italic');
        doc.setFontSize(8.5);
        doc.text(nlines, indent + 9, y + 1);
        y += boxH + 3;
      }
    });
    y += 5;
  });

  // Footer
  if (y > 278) { doc.addPage(); y = 20; }
  doc.setDrawColor(221, 225, 233);
  doc.setLineWidth(0.4);
  doc.line(M, y, W - M, y);
  y += 5;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.setTextColor(138, 144, 160);
  doc.text('ExcelentIA — excelentia.com.mx', W / 2, y, { align: 'center' });

  doc.save('OrdenDelDia_ExcelentIA_Mayo22.pdf');
}

updateProgress();
</script>
</body>
</html>
