  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --border: #dde1e9;
      --header-start: #0d1b3e;
      --header-end: #1e5096;
      --header-accent: #4a9fd4;
      --hover: #e8f0fb;
      --row-head-bg: #dce8f7;
      --alert-bg: #f0f6ff;
      --note-bg: #eef4fc;
      --text-main: #1a2035;
      --text-sec: #4a5068;
      --text-gray: #8a90a0;
      --blue-light: #e8f0fb;
      --blue-mid: #4a9fd4;
      --blue-strong: #1a3a6b;
      --blue-dark: #0d1b3e;
      --unassigned: #f0f6ff;
      --unassigned-text: #8a90a0;
    }

    body {
      font-family: 'Manrope', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* ── LOCK SCREEN ── */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, var(--header-start) 0%, var(--header-end) 60%, #1e5096 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      flex-direction: column;
    }

    .lock-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 48px 44px;
      width: 360px;
      max-width: 90vw;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
    }

    .lock-icon {
      font-size: 48px;
      margin-bottom: 20px;
      display: block;
    }

    .lock-title {
      font-family: 'Special Elite', serif;
      font-size: 22px;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .lock-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .lock-input {
      width: 100%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 16px;
      color: #fff;
      font-family: 'Manrope', sans-serif;
      letter-spacing: 2px;
      outline: none;
      transition: border 0.2s, background 0.2s;
      margin-bottom: 16px;
    }

    .lock-input::placeholder { color: rgba(255,255,255,0.35); letter-spacing: 0; }
    .lock-input:focus { border-color: var(--header-accent); background: rgba(255,255,255,0.15); }

    .lock-btn {
      width: 100%;
      background: var(--header-accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Manrope', sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.5px;
    }

    .lock-btn:hover { background: #3a8bc4; }
    .lock-btn:active { transform: scale(0.98); }

    .lock-error {
      margin-top: 14px;
      font-size: 13px;
      color: #ff8080;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .lock-error.show { opacity: 1; }

    /* ── MAIN CONTENT ── */
    #main-content {
      display: none;
      opacity: 0;
      transition: opacity 0.5s;
    }

    header {
      background: linear-gradient(135deg, var(--header-start) 0%, var(--header-end) 60%, #1e5096 100%);
      border-bottom: 3px solid var(--header-accent);
      padding: 32px 40px 28px;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-badge {
      background: rgba(74,159,212,0.2);
      border: 1px solid rgba(74,159,212,0.4);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 28px;
      line-height: 1;
    }

    .header-text h1 {
      font-family: 'Special Elite', serif;
      font-size: 26px;
      color: #ffffff;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .header-text p {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
    }

    .header-stats {
      margin-left: auto;
      display: flex;
      gap: 16px;
    }

    .stat-pill {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50px;
      padding: 8px 18px;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      font-weight: 600;
    }

    .stat-pill span {
      color: var(--header-accent);
      font-size: 16px;
    }

    /* ── TABLE WRAPPER ── */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }

    /* Search bar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .search-wrap {
      position: relative;
      flex: 1;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-gray);
      font-size: 16px;
    }

    .search-input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      font-family: 'Manrope', sans-serif;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      transition: border 0.2s;
    }

    .search-input:focus { border-color: var(--blue-mid); }

    .filter-select {
      padding: 11px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      font-family: 'Manrope', sans-serif;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    /* Table card */
    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 16px rgba(13,27,62,0.07);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr {
      background: linear-gradient(90deg, var(--blue-strong) 0%, #1e5096 100%);
    }

    thead th {
      padding: 15px 18px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.75);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    thead th:first-child { width: 56px; text-align: center; }
    thead th:nth-child(3) { width: 110px; }
    thead th:nth-child(4) { width: 80px; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--hover); }

    tbody tr.unassigned { background: #fafbfd; }
    tbody tr.unassigned:hover { background: var(--hover); }

    td {
      padding: 13px 18px;
      font-size: 14px;
      color: var(--text-main);
      vertical-align: middle;
    }

    td:first-child {
      text-align: center;
      font-size: 12px;
      color: var(--text-gray);
      font-weight: 600;
    }

    .code-cell {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--blue-strong);
      background: var(--blue-light);
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 1px;
    }

    .pin-cell {
      font-family: 'Courier New', monospace;
      font-weight: 700;
      font-size: 15px;
      color: var(--blue-mid);
      letter-spacing: 2px;
    }

    .email-cell {
      font-size: 13px;
      color: var(--text-sec);
    }

    .badge-unassigned {
      display: inline-block;
      background: #f0f3f8;
      color: var(--text-gray);
      border: 1px solid #dde1e9;
      border-radius: 50px;
      padding: 3px 12px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Row counter */
    .result-count {
      margin-top: 14px;
      font-size: 13px;
      color: var(--text-gray);
      padding-left: 2px;
    }

    /* Responsive */
    @media(max-width: 680px) {
      header { padding: 24px 20px 20px; }
      .header-stats { display: none; }
      .container { padding: 20px 12px 40px; }
      td, thead th { padding: 11px 12px; }
      .code-cell { font-size: 11px; }
    }
  </style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock-screen">
  <div class="lock-card">
    <span class="lock-icon">🔐</span>
    <div class="lock-title">Acceso Restringido</div>
    <div class="lock-subtitle">Códigos Innova 2026<br/>Ingresa la contraseña para continuar</div>
    <input
      class="lock-input"
      type="password"
      id="pwd-input"
      placeholder="Contraseña"
      autocomplete="off"
    />
    <button class="lock-btn" onclick="checkPassword()">Ingresar →</button>
    <div class="lock-error" id="lock-error">Contraseña incorrecta. Intenta de nuevo.</div>
  </div>
</div>

<!-- MAIN CONTENT -->
<div id="main-content">

  <header>
    <div class="header-inner">
      <div class="header-badge">🎟️</div>
      <div class="header-text">
        <h1>Códigos Innova 2026</h1>
        <p>Directorio de accesos y asignaciones</p>
      </div>
      <div class="header-stats">
        <div class="stat-pill">Total <span id="stat-total">60</span></div>
        <div class="stat-pill">Asignados <span id="stat-assigned">0</span></div>
        <div class="stat-pill">Disponibles <span id="stat-free">0</span></div>
      </div>
    </div>
  </header>

  <div class="container">

    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" type="text" id="search" placeholder="Buscar código, email o PIN…" oninput="filterTable()"/>
      </div>
      <select class="filter-select" id="filter-status" onchange="filterTable()">
        <option value="all">Todos</option>
        <option value="assigned">Asignados</option>
        <option value="unassigned">Sin asignar</option>
      </select>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Código</th>
            <th>PIN</th>
            <th>Asignado a</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
    <div class="result-count" id="result-count"></div>

  </div>
</div>

function checkPassword() {
  const val = document.getElementById('pwd-input').value;
  const err = document.getElementById('lock-error');
  if (val === 'Innovajuega$$') {
    document.getElementById('lock-screen').style.opacity = '0';
    document.getElementById('lock-screen').style.transition = 'opacity 0.5s';
    setTimeout(() => {
      document.getElementById('lock-screen').style.display = 'none';
      const main = document.getElementById('main-content');
      main.style.display = 'block';
      setTimeout(() => { main.style.opacity = '1'; }, 30);
    }, 500);
    renderTable(DATA);
    updateStats();
  } else {
    err.classList.add('show');
    document.getElementById('pwd-input').value = '';
    document.getElementById('pwd-input').focus();
    setTimeout(() => err.classList.remove('show'), 3000);
  }
}

document.getElementById('pwd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPassword();
});

function updateStats() {
  const assigned = DATA.filter(r => r[3]).length;
  document.getElementById('stat-total').textContent = DATA.length;
  document.getElementById('stat-assigned').textContent = assigned;
  document.getElementById('stat-free').textContent = DATA.length - assigned;
}

function renderTable(rows) {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  rows.forEach(([no, code, pin, email]) => {
    const isAssigned = !!email;
    const tr = document.createElement('tr');
    if (!isAssigned) tr.classList.add('unassigned');
    tr.innerHTML = `
      <td>${no}</td>
      <td><span class="code-cell">${code}</span></td>
      <td><span class="pin-cell">${pin}</span></td>
      <td>${isAssigned
        ? `<span class="email-cell">${email}</span>`
        : `<span class="badge-unassigned">Sin asignar</span>`
      }</td>
    `;
    tbody.appendChild(tr);
  });
  document.getElementById('result-count').textContent =
    rows.length < DATA.length ? `Mostrando ${rows.length} de ${DATA.length} registros` : '';
}

function filterTable() {
  const q = document.getElementById('search').value.toLowerCase();
  const status = document.getElementById('filter-status').value;
  const filtered = DATA.filter(([no, code, pin, email]) => {
    const matchQuery = !q ||
      code.toLowerCase().includes(q) ||
      pin.includes(q) ||
      (email && email.toLowerCase().includes(q)) ||
      String(no).includes(q);
    const matchStatus =
      status === 'all' ||
      (status === 'assigned' && !!email) ||
      (status === 'unassigned' && !email);
    return matchQuery && matchStatus;
  });
  renderTable(filtered);
}
