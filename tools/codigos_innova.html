<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Códigos Innova</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
}

/* 🔒 Pantalla de login */
#login {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #0b2a4a;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.login-box {
    background: white;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
    width: 300px;
}

.login-box h2 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
}

button {
    width: 100%;
    padding: 10px;
    background: #0b2a4a;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #163b66;
}

/* Contenido oculto */
#contenido {
    display: none;
    padding: 40px;
}

.container {
    max-width: 1100px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background-color: #0b2a4a;
    color: white;
    padding: 12px;
}

td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}
</style>

<script>
function login() {
    const pass = document.getElementById("pass").value;
    if (pass === "Innovajuega$$") {
        document.getElementById("login").style.display = "none";
        document.getElementById("contenido").style.display = "block";
    } else {
        alert("Contraseña incorrecta");
    }
}
</script>

</head>

<body>

<!-- 🔒 LOGIN -->
<div id="login">
    <div class="login-box">
        <h2>Acceso</h2>
        <input type="password" id="pass" placeholder="Contraseña">
        <button onclick="login()">Entrar</button>
    </div>
</div>

<!-- CONTENIDO -->
<div id="contenido">

<div class="container">
<h1>Códigos Innova</h1>
