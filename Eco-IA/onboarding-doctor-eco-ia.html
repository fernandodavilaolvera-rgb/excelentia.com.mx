<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco IA — Guía de inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d1b3e;
    --navy-mid: #1a3a6b;
    --navy-light: #1e5096;
    --accent: #4a9fd4;
    --accent-light: #e8f0fb;
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #dde1e9;
    --text: #1a2035;
    --muted: #4a5068;
    --hint: #8a90a0;
    --green: #1D9E75;
    --green-light: #E1F5EE;
    --green-dark: #085041;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 1.5rem 1rem 3rem;
  }
  .wrap { max-width: 620px; margin: 0 auto; }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 60%, var(--navy-light) 100%);
    border-radius: 16px;
    padding: 2rem 1.75rem 1.75rem;
    margin-bottom: 1.5rem;
    border-bottom: 3px solid var(--accent);
  }
  .logo-box {
    background: #fff;
    border-radius: 10px;
    padding: .4rem .75rem;
    display: inline-flex;
    align-items: center;
    margin-bottom: 1.25rem;
  }
  .logo-box span { font-size: 15px; font-weight: 800; color: var(--navy-mid); }
  .logo-box span em { font-style: normal; color: var(--accent); }
  .header h1 { color: #fff; font-size: 22px; font-weight: 700; margin-bottom: .4rem; }
  .header p { color: #b5d4f4; font-size: 14px; line-height: 1.7; }

  /* PROGRESS */
  .progress-bar-wrap { margin-bottom: 1.5rem; }
  .steps-row {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: .75rem;
  }
  .step-pill {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
  }
  .pill-dot {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--card);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    color: var(--hint);
    transition: all .25s;
  }
  .pill-dot.active { background: var(--navy-mid); border-color: var(--navy-mid); color: #fff; }
  .pill-dot.done { background: var(--green); border-color: var(--green); color: #fff; }
  .step-pill span {
    font-size: 11px; color: var(--hint);
    text-align: center; line-height: 1.3;
    max-width: 64px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .step-pill span.active-lbl { color: var(--navy-mid); font-weight: 700; }
  .connector { flex: 1; height: 1.5px; background: var(--border); transition: background .3s; margin: 0 4px; margin-bottom: 20px; }
  .connector.done { background: var(--green); }

  /* CARD */
  .card {
    background: var(--card);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    padding: 1.75rem;
    margin-bottom: 1rem;
    animation: fadeUp .3s ease;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  .card-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 1.1rem;
    font-size: 24px;
  }
  .card h2 { font-size: 19px; font-weight: 700; margin-bottom: .3rem; }
  .card .why {
    font-size: 13px; color: var(--accent); font-weight: 700;
    margin-bottom: .85rem;
    display: flex; align-items: center; gap: 6px;
  }
  .card > p { font-size: 14px; color: var(--muted); line-height: 1.75; margin-bottom: 1.25rem; }

  /* STEP LIST */
  .step-list { list-style: none; display: flex; flex-direction: column; gap: 12px; margin-bottom: 1.25rem; }
  .step-list li { display: flex; align-items: flex-start; gap: 12px; font-size: 14px; color: var(--muted); line-height: 1.6; }
  .snum {
    flex-shrink: 0; width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--accent-light);
    color: var(--navy-mid);
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }

  /* TIP */
  .tip {
    background: #f0f6ff;
    border-left: 3px solid var(--accent);
    padding: .85rem 1rem;
    font-size: 13px;
    color: var(--navy-mid);
    line-height: 1.65;
    margin-bottom: 1rem;
  }

  /* TAGS */
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: .75rem; }
  .tag {
    display: inline-block;
    font-size: 12px; font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
  }
  .tag-blue { background: var(--accent-light); color: #0C447C; }
  .tag-green { background: var(--green-light); color: var(--green-dark); }

  /* BADGE */
  .badge-priv {
    background: var(--green-light);
    border: 0.5px solid #5DCAA5;
    border-radius: 10px;
    padding: .85rem 1rem;
    font-size: 14px;
    color: var(--green-dark);
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 1rem;
    font-weight: 500;
  }
  .badge-priv svg { flex-shrink: 0; }

  /* FAQ */
  .faq-item { border-top: 0.5px solid var(--border); padding: .85rem 0; }
  .faq-item:last-child { border-bottom: 0.5px solid var(--border); }
  .faq-q {
    font-size: 14px; font-weight: 700;
    color: var(--text);
    cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    user-select: none;
  }
  .faq-chevron { transition: transform .25s; font-size: 18px; color: var(--hint); flex-shrink: 0; }
  .faq-a {
    font-size: 13px; color: var(--muted); line-height: 1.75;
    max-height: 0; overflow: hidden;
    transition: max-height .35s ease, padding .25s;
  }
  .faq-a.open { max-height: 300px; padding-top: .6rem; }

  /* NAV */
  .nav-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
  }
  .btn {
    padding: .65rem 1.4rem;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--bg); border-color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; pointer-events: none; }
  .btn-primary {
    background: var(--navy-mid);
    border-color: var(--navy-mid);
    color: #fff;
  }
  .btn-primary:hover { background: var(--navy); border-color: var(--navy); }
  .progress-txt { font-size: 13px; color: var(--hint); font-weight: 500; }

  /* FINAL */
  .final-card {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
    border-radius: 16px;
    padding: 2rem 1.75rem;
    text-align: center;
    margin-bottom: 1rem;
    animation: fadeUp .3s ease;
  }
  .final-card h2 { color: #fff; font-size: 20px; font-weight: 700; margin-bottom: .5rem; }
  .final-card p { color: #b5d4f4; font-size: 14px; line-height: 1.7; margin-bottom: 1.5rem; }
  .final-card .btn-white {
    display: inline-flex; align-items: center; gap: 8px;
    background: #fff; color: var(--navy-mid);
    padding: .75rem 1.75rem;
    border-radius: 10px;
    font-size: 15px; font-weight: 800;
    border: none; cursor: pointer;
    font-family: 'Manrope', sans-serif;
    transition: opacity .2s;
    text-decoration: none;
  }
  .final-card .btn-white:hover { opacity: .9; }

  @media (max-width: 480px) {
    .header { padding: 1.5rem 1.25rem 1.25rem; }
    .card { padding: 1.25rem; }
    .header h1 { font-size: 19px; }
    .step-pill span { font-size: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="logo-box"><span>Excelent<em>IA</em></span></div>
    <h1>Bienvenido a Eco IA</h1>
    <p>Su asistente de inteligencia artificial para la generación automática de reportes de ecocardiograma. Esta guía le tomará menos de 5 minutos.</p>
  </div>

  <div class="progress-bar-wrap">
    <div class="steps-row" id="steps-row"></div>
  </div>

  <div id="panel"></div>

  <div class="nav-row">
    <button class="btn" id="btn-prev" onclick="navigate(-1)" disabled>
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      Anterior
    </button>
    <span class="progress-txt" id="prog-txt"></span>
    <button class="btn btn-primary" id="btn-next" onclick="navigate(1)">
      Siguiente
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

</div>
<script>
const FORM_URL = "#LINK_FORMULARIO_DOCTOR";

const steps = [
  {
    label: "Bienvenida",
    iconBg: "#fbeaf0",
    iconColor: "#993556",
    iconSvg: `<svg width="24" height="24" fill="none" stroke="#993556" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
    title: "¿Para qué sirve Eco IA?",
    why: "Conozca el sistema antes de empezar",
    desc: "Eco IA analiza las imágenes de su estudio ecocardiográfico con inteligencia artificial y genera automáticamente un reporte Word completo en minutos, listo para revisar, ajustar y entregar a su paciente.",
    content: `
      <ul class="step-list">
        <li><span class="snum">1</span><span>Usted sube las imágenes del estudio desde su formulario personal</span></li>
        <li><span class="snum">2</span><span>El Eco Agente analiza cada imagen y extrae los parámetros relevantes</span></li>
        <li><span class="snum">3</span><span>Se genera un reporte Word con sus datos, su firma y su logo</span></li>
        <li><span class="snum">4</span><span>El reporte aparece en su carpeta en la nube en minutos, listo para descargarse</span></li>
      </ul>
      <div class="tip">El reporte es un punto de partida — usted siempre tiene la última palabra para revisarlo y ajustarlo antes de entregarlo.</div>`,
    tags: [`<span class="tag tag-blue">Automático</span>`, `<span class="tag tag-blue">Word descargable</span>`, `<span class="tag tag-green">Su firma y logo</span>`]
  },
  {
    label: "El formulario",
    iconBg: "#e8f0fb",
    iconColor: "#0C447C",
    iconSvg: `<svg width="24" height="24" fill="none" stroke="#0C447C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>`,
    title: "Cómo subir un estudio",
    why: "Siga estos pasos cada vez que tenga un estudio listo",
    desc: "El formulario es su punto de entrada al sistema. Desde ahí sube las imágenes del estudio y el sistema hace el resto automáticamente.",
    content: `
      <ul class="step-list">
        <li><span class="snum">1</span><span>Abra su formulario personal — el link que le compartió ExcelentIA</span></li>
        <li><span class="snum">2</span><span>Ingrese con su correo autorizado, el mismo que registró al darse de alta</span></li>
        <li><span class="snum">3</span><span>Capture los datos del paciente: nombre, fecha, peso, talla y fecha de nacimiento</span></li>
        <li><span class="snum">4</span><span>Suba las imágenes del estudio — puede seleccionar y/o arrastrar hasta 40 imágenes a la vez, o también puede seleccionar y/o arrastrar la carpeta completa que contiene las imágenes</span></li>
        <li><span class="snum">5</span><span>Presione "Generar reporte" y espere — el proceso toma entre 3 y 5 minutos</span></li>
      </ul>
      <div class="tip">Suba las imágenes en el mejor formato disponible desde su equipo de ecocardiografía. Cuanto más claras, más precisos los valores extraídos.</div>`,
    tags: [`<span class="tag tag-blue">Hasta 40 imágenes</span>`, `<span class="tag tag-blue">3 a 5 minutos</span>`, `<span class="tag tag-green">Carpeta completa o individual</span>`]
  },
  {
    label: "Sus reportes",
    iconBg: "#E1F5EE",
    iconColor: "#085041",
    iconSvg: `<svg width="24" height="24" fill="none" stroke="#085041" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`,
    title: "Dónde encontrar sus reportes",
    why: "Sus reportes siempre disponibles en la nube",
    desc: "Todos sus reportes se guardan automáticamente en una carpeta de Google Drive privada que solo usted puede ver.",
    content: `
      <div class="badge-priv">
        <svg width="20" height="20" fill="none" stroke="#085041" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Su carpeta es privada. Solo usted tiene acceso a sus reportes.</span>
      </div>
      <ul class="step-list">
        <li><span class="snum">1</span><span>Puede acceder a su carpeta dando clic en el botón "Ver mis reportes" del formulario</span></li>
        <li><span class="snum">2</span><span>Dentro encontrará una carpeta por cada paciente con su nombre y la fecha del estudio</span></li>
        <li><span class="snum">3</span><span>Descargue el archivo Word, revíselo y ajuste lo que considere necesario antes de entregarlo</span></li>
      </ul>
      <div class="tip">También puede acceder desde la app de Google Drive en su celular para ver reportes en cualquier momento.</div>`,
    tags: [`<span class="tag tag-green">Privado y seguro</span>`, `<span class="tag tag-blue">Organizado por paciente</span>`, `<span class="tag tag-blue">Descarga en Word</span>`]
  },
  {
    label: "Preguntas",
    iconBg: "#f5f6f8",
    iconColor: "#4a5068",
    iconSvg: `<svg width="24" height="24" fill="none" stroke="#4a5068" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
    title: "Preguntas frecuentes",
    why: "Lo que más nos preguntan los doctores",
    desc: "Haga clic en cada pregunta para ver la respuesta.",
    content: `
      <div>
        <div class="faq-item">
          <div class="faq-q" onclick="toggleFaq(this)">
            <span>¿El reporte reemplaza mi criterio clínico?</span>
            <span class="faq-chevron">›</span>
          </div>
          <div class="faq-a">No. Eco IA genera un reporte borrador basado en las imágenes. Usted siempre debe revisarlo, validarlo y ajustarlo antes de entregarlo al paciente. El sistema es un asistente, no un sustituto.</div>
        </div>
        <div class="faq-item">
          <div class="faq-q" onclick="toggleFaq(this)">
            <span>¿Qué pasa si el sistema no extrae bien un valor?</span>
            <span class="faq-chevron">›</span>
          </div>
          <div class="faq-a">Puede corregirlo directamente en el archivo Word descargado. Si el error es recurrente en un tipo específico de imagen, repórtelo a soporte para que lo ajustemos en el sistema.</div>
        </div>
        <div class="faq-item">
          <div class="faq-q" onclick="toggleFaq(this)">
            <span>¿Cuántas imágenes debo subir por estudio?</span>
            <span class="faq-chevron">›</span>
          </div>
          <div class="faq-a">El sistema acepta hasta 40 imágenes. Recomendamos subir todas las vistas relevantes del estudio para obtener el reporte más completo posible. También puede arrastrar la carpeta completa del estudio.</div>
        </div>
        <div class="faq-item">
          <div class="faq-q" onclick="toggleFaq(this)">
            <span>¿Mis datos y los de mis pacientes están seguros?</span>
            <span class="faq-chevron">›</span>
          </div>
          <div class="faq-a">Sí. Las imágenes se procesan de forma cifrada y los reportes se almacenan únicamente en su carpeta privada de Google Drive. Sus datos clínicos son completamente confidenciales.</div>
        </div>
        <div class="faq-item">
          <div class="faq-q" onclick="toggleFaq(this)">
            <span>¿Puedo acceder desde mi celular?</span>
            <span class="faq-chevron">›</span>
          </div>
          <div class="faq-a">Sí. El formulario funciona desde cualquier dispositivo con navegador. Para ver sus reportes puede usar la app de Google Drive en iOS o Android.</div>
        </div>
      </div>`
  }
];

let current = 0;

function buildNav() {
  const row = document.getElementById('steps-row');
  row.innerHTML = '';
  steps.forEach((s, i) => {
    if (i > 0) {
      const c = document.createElement('div');
      c.className = 'connector' + (i <= current ? ' done' : '');
      row.appendChild(c);
    }
    const pill = document.createElement('div');
    pill.className = 'step-pill';
    pill.onclick = () => goTo(i);
    const dot = document.createElement('div');
    dot.className = 'pill-dot' + (i === current ? ' active' : i < current ? ' done' : '');
    dot.innerHTML = i < current
      ? `<svg width="14" height="14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`
      : (i + 1);
    const lbl = document.createElement('span');
    lbl.className = i === current ? 'active-lbl' : '';
    lbl.textContent = s.label;
    pill.appendChild(dot);
    pill.appendChild(lbl);
    row.appendChild(pill);
  });
}

function buildPanel() {
  const s = steps[current];
  const isFinal = current === steps.length - 1;
  const tagsHtml = s.tags ? `<div class="tags">${s.tags.join('')}</div>` : '';

  document.getElementById('panel').innerHTML = `
    <div class="card">
      <div class="card-icon" style="background:${s.iconBg}">${s.iconSvg}</div>
      <h2>${s.title}</h2>
      <div class="why">${s.why}</div>
      <p>${s.desc}</p>
      ${s.content}
      ${tagsHtml}
    </div>`;

  document.getElementById('prog-txt').textContent = (current + 1) + ' de ' + steps.length;
  document.getElementById('btn-prev').disabled = current === 0;

  const btnNext = document.getElementById('btn-next');
  if (isFinal) {
    btnNext.innerHTML = `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Ir a mi formulario`;
    btnNext.onclick = () => window.open(FORM_URL, '_blank');
  } else {
    btnNext.innerHTML = `Siguiente <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>`;
    btnNext.onclick = () => navigate(1);
  }
}

function goTo(i) { current = i; buildNav(); buildPanel(); }
function navigate(d) {
  if (current + d >= 0 && current + d < steps.length) {
    current += d; buildNav(); buildPanel();
  }
}
function toggleFaq(el) {
  const a = el.nextElementSibling;
  const chev = el.querySelector('.faq-chevron');
  const isOpen = a.classList.toggle('open');
  if (chev) chev.style.transform = isOpen ? 'rotate(90deg)' : '';
}

buildNav();
buildPanel();
</script>
</body>
</html>
