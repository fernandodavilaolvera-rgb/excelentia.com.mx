<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco IA — Guía de inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy:       #0d1b3e;
  --navy-mid:   #1a3a6b;
  --navy-light: #1e5096;
  --accent:     #4a9fd4;
  --accent-bg:  #e8f0fb;
  --accent-hover: #dce8f7;
  --bg:         #f5f6f8;
  --card:       #ffffff;
  --border:     #dde1e9;
  --text:       #1a2035;
  --muted:      #4a5068;
  --hint:       #8a90a0;
  --green:      #1D9E75;
  --green-bg:   #E1F5EE;
  --green-dark: #085041;
  --note-bg:    #f0f6ff;
  --note-border:#c8d9f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Manrope', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 1.5rem 1rem 3rem;
}
.wrap { max-width: 620px; margin: 0 auto; }

/* HEADER */
.header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 60%, var(--navy-light) 100%);
  border-radius: 16px;
  padding: 1.75rem 1.75rem 1.5rem;
  margin-bottom: 1.5rem;
  border-bottom: 3px solid var(--accent);
}
.logo-box {
  background: #fff;
  border-radius: 10px;
  padding: .4rem .75rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 80px;
  min-height: 44px;
  margin-bottom: 1.1rem;
}
.logo-box img { height: 36px; width: auto; display: block; }
.logo-fallback { font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 800; color: var(--navy-mid); display: none; }
.logo-fallback em { font-style: normal; color: var(--accent); }
.header h1 { color: #fff; font-size: 21px; font-weight: 800; margin-bottom: .4rem; letter-spacing: -.3px; }
.header p  { color: #b5d4f4; font-size: 14px; line-height: 1.7; }

/* NAV STEPS */
.steps-row {
  display: flex;
  align-items: flex-start;
  margin-bottom: 1.25rem;
}
.step-pill {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  padding: 0 2px;
}
.pill-dot {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--card);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800;
  color: var(--hint);
  transition: all .22s;
  flex-shrink: 0;
}
.pill-dot.active { background: var(--navy-mid); border-color: var(--navy-mid); color: #fff; }
.pill-dot.done   { background: var(--green);    border-color: var(--green);    color: #fff; }
.step-pill .lbl {
  font-size: 11px; font-weight: 700;
  color: var(--hint);
  text-align: center;
  line-height: 1.3;
  max-width: 68px;
}
.step-pill .lbl.active-lbl { color: var(--navy-mid); }
.connector {
  flex: 1;
  height: 1.5px;
  background: var(--border);
  margin: 18px 4px 0;
  transition: background .3s;
  flex-shrink: 1;
  min-width: 8px;
}
.connector.done { background: var(--green); }

/* CARD */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.5rem 1.5rem 1.25rem;
  margin-bottom: 1rem;
  animation: fadeUp .28s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-bottom: 1rem;
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--border);
}
.card-icon {
  width: 46px; height: 46px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.card h2  { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 2px; }
.card-why { font-size: 12px; color: var(--accent); font-weight: 700; }
.card-desc { font-size: 14px; color: var(--muted); line-height: 1.75; margin-bottom: 1.1rem; }

/* STEP LIST */
.step-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.1rem; }
.step-list li { display: flex; align-items: flex-start; gap: 11px; font-size: 14px; color: var(--muted); line-height: 1.6; }
.snum {
  flex-shrink: 0;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--accent-bg);
  color: var(--navy-mid);
  font-size: 12px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  margin-top: 1px;
}

/* TIP / NOTA */
.tip {
  background: var(--note-bg);
  border-left: 3px solid var(--accent);
  padding: .8rem 1rem;
  font-size: 13px;
  color: var(--navy-mid);
  line-height: 1.65;
  margin-bottom: 1rem;
  border-radius: 0;
}
.tip strong { font-weight: 700; }

/* BADGE */
.badge-priv {
  background: var(--green-bg);
  border: 1px solid #9FE1CB;
  border-radius: 10px;
  padding: .8rem 1rem;
  font-size: 13px;
  color: var(--green-dark);
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 1rem;
  font-weight: 700;
  line-height: 1.5;
}

/* TAGS */
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: .9rem; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }
.tag-blue  { background: var(--accent-bg); color: #0C447C; }
.tag-green { background: var(--green-bg);  color: var(--green-dark); }

/* FAQ */
.faq-list { border-top: 1px solid var(--border); }
.faq-item { border-bottom: 1px solid var(--border); }
.faq-q {
  font-size: 14px; font-weight: 700;
  color: var(--text);
  cursor: pointer;
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: .9rem 0;
  user-select: none;
}
.faq-chevron { font-size: 20px; color: var(--hint); flex-shrink: 0; transition: transform .25s; font-weight: 400; }
.faq-a {
  font-size: 13px; color: var(--muted); line-height: 1.75;
  max-height: 0; overflow: hidden;
  transition: max-height .35s ease, padding-bottom .25s;
}
.faq-a.open { max-height: 300px; padding-bottom: .9rem; }

/* BOTTOM NAV */
.nav-row {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.btn {
  padding: .6rem 1.3rem;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  transition: background .15s, border-color .15s;
  display: flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--accent-hover); border-color: var(--accent); }
.btn:disabled { opacity: .35; cursor: default; pointer-events: none; }
.btn-primary { background: var(--navy-mid); border-color: var(--navy-mid); color: #fff; }
.btn-primary:hover { background: var(--navy); border-color: var(--navy); }
.prog-txt { font-size: 13px; color: var(--hint); font-weight: 700; }

@media (max-width: 480px) {
  .header { padding: 1.4rem 1.25rem 1.25rem; }
  .card   { padding: 1.1rem; }
  .header h1 { font-size: 18px; }
  .lbl { font-size: 10px; max-width: 52px; }
}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="logo-box">
      <img src="https://excelentia.com.mx/assets/logo%20excelentIA.png" alt="ExcelentIA"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
      <span class="logo-fallback">Excelent<em>IA</em></span>
    </div>
    <h1>Bienvenido a Eco IA</h1>
    <p>Su asistente de inteligencia artificial para la generación automática de reportes de ecocardiograma. Esta guía le tomará menos de 5 minutos.</p>
  </div>

  <div class="steps-row" id="steps-row"></div>

  <div id="panel"></div>

  <div class="nav-row">
    <button class="btn" id="btn-prev" onclick="navigate(-1)" disabled>
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      Anterior
    </button>
    <span class="prog-txt" id="prog-txt"></span>
    <button class="btn btn-primary" id="btn-next" onclick="navigate(1)">
      Siguiente
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

</div>
<script>
const FORM_URL = "https://excelentia.com.mx/Eco-IA/formulariointerpretacion";

const steps = [
  {
    label: "Bienvenida",
    iconBg: "#fbeaf0",
    iconSvg: `<svg width="22" height="22" fill="none" stroke="#993556" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
    title: "¿Para qué sirve Eco IA?",
    why: "Conozca el sistema antes de empezar",
    desc: "Eco IA analiza las imágenes de su estudio ecocardiográfico con inteligencia artificial y genera automáticamente un reporte Word completo en minutos, listo para revisar, ajustar y entregar a su paciente.",
    content: `
      <ul class="step-list">
        <li><span class="snum">1</span><span>Usted sube las imágenes del estudio desde su formulario personal</span></li>
        <li><span class="snum">2</span><span>El Eco Agente analiza cada imagen y extrae los parámetros relevantes</span></li>
        <li><span class="snum">3</span><span>Se genera un reporte Word con sus datos, su firma y su logo</span></li>
        <li><span class="snum">4</span><span>El reporte aparece en su carpeta en la nube en minutos, listo para descargarse</span></li>
      </ul>
      <div class="tip">El reporte es un punto de partida — usted siempre tiene la última palabra para revisarlo y ajustarlo antes de entregarlo.</div>`,
    tags: [`<span class="tag tag-blue">Automático</span>`,`<span class="tag tag-blue">Word descargable</span>`,`<span class="tag tag-green">Su firma y logo</span>`]
  },
  {
    label: "El formulario",
    iconBg: "#e8f0fb",
    iconSvg: `<svg width="22" height="22" fill="none" stroke="#0C447C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>`,
    title: "Cómo subir un estudio",
    why: "Siga estos pasos cada vez que tenga un estudio listo",
    desc: "El formulario es su punto de entrada al sistema. Desde ahí sube las imágenes del estudio y el sistema hace el resto automáticamente.",
    content: `
      <ul class="step-list">
        <li><span class="snum">1</span><span>Abra su formulario personal — el link que le compartió ExcelentIA</span></li>
        <li><span class="snum">2</span><span>Ingrese con su correo autorizado, el mismo que registró al darse de alta</span></li>
        <li><span class="snum">3</span><span>Capture los datos del paciente: nombre, fecha, peso, talla y fecha de nacimiento</span></li>
        <li><span class="snum">4</span><span>Suba las imágenes del estudio — puede seleccionar y/o arrastrar hasta 40 imágenes a la vez, o también puede seleccionar y/o arrastrar la carpeta completa que contiene las imágenes</span></li>
        <li><span class="snum">5</span><span>Presione "Generar reporte" y espere — el proceso toma entre 3 y 5 minutos</span></li>
      </ul>
      <div class="tip">Suba las imágenes en el mejor formato disponible desde su equipo de ecocardiografía. Cuanto más claras, más precisos los valores extraídos.</div>`,
    tags: [`<span class="tag tag-blue">Hasta 40 imágenes</span>`,`<span class="tag tag-blue">3 a 5 minutos</span>`,`<span class="tag tag-green">Carpeta completa o individual</span>`]
  },
  {
    label: "Sus reportes",
    iconBg: "#E1F5EE",
    iconSvg: `<svg width="22" height="22" fill="none" stroke="#085041" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`,
    title: "Dónde encontrar sus reportes",
    why: "Sus reportes siempre disponibles en la nube",
    desc: "Todos sus reportes se guardan automáticamente en una carpeta de Google Drive privada que solo usted puede ver.",
    content: `
      <div class="badge-priv">
        <svg width="20" height="20" fill="none" stroke="#085041" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Su carpeta es privada. Solo usted tiene acceso a sus reportes.</span>
      </div>
      <ul class="step-list">
        <li><span class="snum">1</span><span>Puede acceder a su carpeta dando clic en el botón "Ver mis reportes" del formulario</span></li>
        <li><span class="snum">2</span><span>Dentro encontrará una carpeta por cada paciente con su nombre y la fecha del estudio</span></li>
        <li><span class="snum">3</span><span>Descargue el archivo Word, revíselo y ajuste lo que considere necesario antes de entregarlo</span></li>
      </ul>
      <div class="tip">También puede acceder desde la app de Google Drive en su celular para ver reportes en cualquier momento.</div>`,
    tags: [`<span class="tag tag-green">Privado y seguro</span>`,`<span class="tag tag-blue">Organizado por paciente</span>`,`<span class="tag tag-blue">Descarga en Word</span>`]
  },
  {
    label: "Preguntas",
    iconBg: "#f0f6ff",
    iconSvg: `<svg width="22" height="22" fill="none" stroke="#185FA5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
    title: "Preguntas frecuentes",
    why: "Lo que más nos preguntan los doctores",
    desc: "Haga clic en cada pregunta para ver la respuesta.",
    content: `
      <div class="faq-list">
        <div class="faq-item">
          <div class="faq-q" onclick="toggleFaq(this)"><span>¿El reporte reemplaza mi criterio clínico?</span><span class="faq-chevron">›</span></div>
          <div class="faq-a">No. Eco IA genera un reporte borrador basado en las imágenes. Usted siempre debe revisarlo, validarlo y ajustarlo antes de entregarlo al paciente. El sistema es un asistente, no un sustituto.</div>
        </div>
        <div class="faq-item">
          <div class="faq-q" onclick="toggleFaq(this)"><span>¿Qué pasa si el sistema no extrae bien un valor?</span><span class="faq-chevron">›</span></div>
          <div class="faq-a">Puede corregirlo directamente en el archivo Word descargado. Si el error es recurrente en un tipo específico de imagen, repórtelo a soporte para que lo ajustemos en el sistema.</div>
        </div>
        <div class="faq-item">
          <div class="faq-q" onclick="toggleFaq(this)"><span>¿Cuántas imágenes debo subir por estudio?</span><span class="faq-chevron">›</span></div>
          <div class="faq-a">El sistema acepta hasta 40 imágenes. Recomendamos subir todas las vistas relevantes del estudio. También puede arrastrar directamente la carpeta completa del estudio.</div>
        </div>
        <div class="faq-item">
          <div class="faq-q" onclick="toggleFaq(this)"><span>¿Mis datos y los de mis pacientes están seguros?</span><span class="faq-chevron">›</span></div>
          <div class="faq-a">Sí. Las imágenes se procesan de forma cifrada y los reportes se almacenan únicamente en su carpeta privada de Google Drive. Sus datos clínicos son completamente confidenciales.</div>
        </div>
        <div class="faq-item">
          <div class="faq-q" onclick="toggleFaq(this)"><span>¿Puedo acceder desde mi celular?</span><span class="faq-chevron">›</span></div>
          <div class="faq-a">Sí. El formulario funciona desde cualquier dispositivo con navegador. Para ver sus reportes puede usar la app de Google Drive en iOS o Android.</div>
        </div>
      </div>`
  }
];

let current = 0;

function buildNav() {
  const row = document.getElementById('steps-row');
  row.innerHTML = '';
  steps.forEach((s, i) => {
    if (i > 0) {
      const c = document.createElement('div');
      c.className = 'connector' + (i <= current ? ' done' : '');
      row.appendChild(c);
    }
    const pill = document.createElement('div');
    pill.className = 'step-pill';
    pill.onclick = () => goTo(i);
    const dot = document.createElement('div');
    dot.className = 'pill-dot' + (i === current ? ' active' : i < current ? ' done' : '');
    dot.innerHTML = i < current
      ? `<svg width="13" height="13" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`
      : (i + 1);
    const lbl = document.createElement('span');
    lbl.className = 'lbl' + (i === current ? ' active-lbl' : '');
    lbl.textContent = s.label;
    pill.appendChild(dot);
    pill.appendChild(lbl);
    row.appendChild(pill);
  });
}

function buildPanel() {
  const s = steps[current];
  const tagsHtml = s.tags ? `<div class="tags">${s.tags.join('')}</div>` : '';
  document.getElementById('panel').innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="card-icon" style="background:${s.iconBg}">${s.iconSvg}</div>
        <div>
          <h2>${s.title}</h2>
          <div class="card-why">${s.why}</div>
        </div>
      </div>
      <p class="card-desc">${s.desc}</p>
      ${s.content}
      ${tagsHtml}
    </div>`;
  document.getElementById('prog-txt').textContent = (current + 1) + ' de ' + steps.length;
  document.getElementById('btn-prev').disabled = current === 0;
  const btnNext = document.getElementById('btn-next');
  if (current === steps.length - 1) {
    btnNext.innerHTML = `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Ir a mi formulario`;
    btnNext.onclick = () => window.open(FORM_URL, '_blank');
  } else {
    btnNext.innerHTML = `Siguiente <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>`;
    btnNext.onclick = () => navigate(1);
  }
}

function goTo(i) { current = i; buildNav(); buildPanel(); }
function navigate(d) {
  if (current + d >= 0 && current + d < steps.length) {
    current += d; buildNav(); buildPanel();
  }
}
function toggleFaq(el) {
  const a = el.nextElementSibling;
  const chev = el.querySelector('.faq-chevron');
  const isOpen = a.classList.toggle('open');
  if (chev) chev.style.transform = isOpen ? 'rotate(90deg)' : '';
}

buildNav();
buildPanel();
</script>
</body>
</html>
