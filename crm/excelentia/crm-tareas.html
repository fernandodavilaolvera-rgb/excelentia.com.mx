<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM · Tareas — ExcelentIA</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:#f5f6f8;color:#1a2035;min-height:100vh;font-size:15px}

/* ── HEADER ── */
.header{background:linear-gradient(135deg,#0d1b3e 0%,#1a3a6b 60%,#1e5096 100%);border-bottom:3px solid #4a9fd4;padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.logo-header-wrap{display:flex;align-items:center;gap:.9rem;flex-shrink:0}
.logo-box{background:#fff;border-radius:10px;padding:.4rem .75rem;display:flex;align-items:center;justify-content:center;min-width:80px;min-height:52px;flex-shrink:0}
.logo-box img{height:48px;width:auto;display:block}
.logo-fallback{font-family:'Manrope',sans-serif;font-size:15px;font-weight:800;color:#1a3a6b;display:none}
.logo-slogan{font-family:'Manrope',sans-serif;font-size:13px;font-weight:500;color:#fff;letter-spacing:.2px}
.header-center{flex:1;text-align:center}
.header-title{color:#fff;font-size:1.05rem;font-weight:700;letter-spacing:.3px}
.header-sub{color:#a8c4e0;font-size:.78rem;margin-top:.1rem}
.header-right{display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.user-chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:.3rem .85rem;color:#fff;font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:.4rem;cursor:pointer;transition:.2s;position:relative}
.user-chip:hover{background:rgba(255,255,255,.2)}
.user-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.user-menu{display:none;position:fixed;top:72px;right:1.5rem;background:#fff;border:1px solid #dde1e9;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:150;min-width:160px;overflow:hidden}
.user-menu.open{display:block}
.user-menu-item{padding:.55rem 1rem;cursor:pointer;font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:.5rem;transition:.15s}
.user-menu-item:hover{background:#f0f4ff}

/* ── CONTENIDO ── */
.page{padding:1.25rem 1.5rem;max-width:1400px;margin:0 auto}

/* ── RESUMEN PILLS ── */
.summary-bar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.pill{background:#fff;border:1px solid #dde1e9;border-radius:20px;padding:.35rem .9rem;font-size:.8rem;font-weight:700;color:#4a5068;display:flex;align-items:center;gap:.35rem}
.pill-val{font-size:.92rem;font-weight:800}
.pill-blue .pill-val{color:#1a3a6b}
.pill-yellow .pill-val{color:#b45309}
.pill-green .pill-val{color:#059669}
.pill-red .pill-val{color:#dc2626}

/* ── CARD ── */
.card{background:#fff;border:1px solid #dde1e9;border-radius:12px;overflow:hidden;margin-bottom:1rem}
.card-head{background:#dce8f7;padding:.7rem 1rem;font-weight:700;font-size:.88rem;color:#1a2035;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.card-body{padding:.75rem}

/* ── FILTROS ── */
.filters{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:.85rem;align-items:center}
.filter-input{padding:.42rem .7rem;border:1px solid #dde1e9;border-radius:8px;font-family:'Manrope',sans-serif;font-size:.82rem;width:auto;min-width:160px;background:#fff;color:#1a2035}
.filter-select{padding:.42rem .7rem;border:1px solid #dde1e9;border-radius:8px;font-family:'Manrope',sans-serif;font-size:.82rem;background:#fff;color:#1a2035;width:auto}
.filter-input:focus,.filter-select:focus{outline:none;border-color:#4a9fd4}

/* ── TABLA ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th{background:#dce8f7;padding:.6rem .8rem;text-align:left;font-weight:700;color:#1a2035;border-bottom:2px solid #c8d9f0;white-space:nowrap;user-select:none}
th.sortable{cursor:pointer;transition:.15s}
th.sortable:hover{background:#c8d9f0}
th .sort-arrow{margin-left:.3rem;opacity:.4;font-size:.75rem}
th.sort-asc .sort-arrow::after{content:'▲';opacity:1}
th.sort-desc .sort-arrow::after{content:'▼';opacity:1}
th:not(.sort-asc):not(.sort-desc) .sort-arrow::after{content:'⇅'}
td{padding:.55rem .8rem;border-bottom:1px solid #eef2f8;color:#1a2035;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8faff}

/* ── BADGES ── */
.badge{display:inline-block;padding:.2rem .55rem;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap}
.b-red{background:#fee2e2;color:#991b1b}
.b-yellow{background:#fef9c3;color:#713f12}
.b-blue{background:#dce8f7;color:#1a3a6b}
.b-green{background:#d1fae5;color:#065f46}
.b-gray{background:#f3f4f6;color:#374151}
.b-purple{background:#ede9fe;color:#5b21b6}

/* ── BOTONES ── */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;transition:.2s;border:none;font-family:'Manrope',sans-serif;text-decoration:none}
.btn-primary{background:#1a3a6b;color:#fff}.btn-primary:hover{background:#0d1b3e}
.btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-secondary{background:#f0f4ff;color:#1a3a6b;border:1px solid #c8d9f0}.btn-secondary:hover{background:#dce8f7}
.btn-edit{background:#f0f4ff;color:#1a3a6b;border:1px solid #c8d9f0;padding:.28rem .5rem;border-radius:6px;font-size:.8rem}.btn-edit:hover{background:#dce8f7}
.btn-del{background:#fee2e2;color:#991b1b;border:none;padding:.28rem .5rem;border-radius:6px;font-size:.8rem;cursor:pointer}.btn-del:hover{background:#fca5a5}
.actions-cell{display:flex;gap:.3rem;align-items:center}

/* ── MODAL ── */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-backdrop.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{background:linear-gradient(135deg,#0d1b3e,#1a3a6b);color:#fff;padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;border-radius:14px 14px 0 0;position:sticky;top:0;z-index:1}
.modal-head h3{font-size:.95rem;font-weight:700}
.modal-close{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-body{padding:1.25rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.form-group{display:flex;flex-direction:column;gap:.3rem}
.form-group.full{grid-column:1/-1}
label{font-size:.8rem;font-weight:600;color:#4a5068}
input,select,textarea{width:100%;padding:.5rem .7rem;border:1px solid #dde1e9;border-radius:8px;font-family:'Manrope',sans-serif;font-size:.83rem;color:#1a2035;background:#fff;transition:.2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#4a9fd4;box-shadow:0 0 0 3px rgba(74,159,212,.12)}
input[readonly]{background:#f5f6f8;color:#8a90a0;cursor:not-allowed}
.modal-foot{padding:.85rem 1.25rem;border-top:1px solid #eef2f8;display:flex;gap:.6rem;justify-content:flex-end}

/* ── EMPTY / LOADING ── */
.empty-state{text-align:center;padding:2.5rem 1rem;color:#8a90a0}
.empty-state span{font-size:2rem;display:block;margin-bottom:.5rem}
.loading{text-align:center;padding:1.5rem;color:#4a5068;font-size:.85rem}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #dde1e9;border-top-color:#4a9fd4;border-radius:50%;animation:spin .7s linear infinite;margin-right:.4rem;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MISC ── */
.text-muted{color:#8a90a0;font-size:.78rem}
.date-vencida{color:#dc2626;font-weight:700}
.date-ok{color:#4a5068}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .header{padding:.6rem 1rem;flex-wrap:wrap;gap:.5rem}
  .logo-header-wrap{flex-direction:column;align-items:flex-start;gap:.3rem}
  .logo-slogan{font-size:11px}
  .header-center{text-align:left;width:100%}
  .page{padding:1rem}
  .form-grid{grid-template-columns:1fr}
  .form-group.full{grid-column:1}
  .modal{max-width:100%;border-radius:14px 14px 0 0;align-self:flex-end;max-height:95vh}
  .modal-backdrop{align-items:flex-end;padding:0}
  table{font-size:.78rem}
  th,td{padding:.45rem .55rem}
  .summary-bar{gap:.4rem}
  .user-menu{right:1rem}
  .filters{flex-direction:column;align-items:stretch}
  .filter-input,.filter-select{width:100%}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo-header-wrap">
    <div class="logo-box">
      <img src="https://raw.githubusercontent.com/fernandodavilaolvera-rgb/excelentia.com.mx/main/assets/logo_excelentIA_clean.png"
           alt="ExcelentIA"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="logo-fallback">Excelent<span style="color:#4a9fd4">IA</span></span>
    </div>
    <span class="logo-slogan">Inteligencia Artificial con esencia Humana</span>
  </div>
  <div class="header-center">
    <div class="header-title">☑️ CRM · Tareas</div>
    <div class="header-sub" id="headerSub"></div>
  </div>
  <div class="header-right">
    <div class="user-chip" id="userChip" onclick="toggleUserMenu()">
      <span class="user-dot" id="userDot"></span>
      <span id="userChipName">—</span>
      <span>▾</span>
    </div>
  </div>
</header>

<!-- MENÚ USUARIO -->
<div class="user-menu" id="userMenu">
  <div class="user-menu-item" onclick="setUser('fernando')">
    <span style="width:10px;height:10px;border-radius:50%;background:#1a3a6b;display:inline-block"></span>Fernando
  </div>
  <div class="user-menu-item" onclick="setUser('juanjose')">
    <span style="width:10px;height:10px;border-radius:50%;background:#7c3aed;display:inline-block"></span>Juan José
  </div>
  <div class="user-menu-item" onclick="setUser('adolfo')">
    <span style="width:10px;height:10px;border-radius:50%;background:#059669;display:inline-block"></span>Adolfo
  </div>
</div>

<!-- PÁGINA -->
<div class="page">

  <!-- RESUMEN -->
  <div class="summary-bar" id="summaryBar">
    <div class="pill pill-blue"><span class="pill-val" id="pillTotal">—</span> tareas totales</div>
    <div class="pill pill-yellow"><span class="pill-val" id="pillPendiente">—</span> pendientes</div>
    <div class="pill pill-blue"><span class="pill-val" id="pillEnProceso">—</span> en proceso</div>
    <div class="pill pill-green"><span class="pill-val" id="pillCompletada">—</span> completadas</div>
    <div class="pill pill-red"><span class="pill-val" id="pillVencidas">—</span> vencidas</div>
  </div>

  <!-- CARD PRINCIPAL -->
  <div class="card">
    <div class="card-head">
      ☑️ Tareas del CRM
      <button class="btn btn-primary" style="font-size:.8rem;padding:.35rem .8rem" onclick="abrirModalNuevo()">+ Nueva tarea</button>
    </div>
    <div class="card-body">

      <!-- FILTROS -->
      <div class="filters">
        <input class="filter-input" type="text" id="filtroTexto" placeholder="🔍 Buscar tarea..." oninput="aplicarFiltros()">
        <select class="filter-select" id="filtroAsignado" onchange="aplicarFiltros()">
          <option value="">Asignado</option>
          <option value="fernando">Fernando</option>
          <option value="juanjose">Juan José</option>
          <option value="adolfo">Adolfo</option>
        </select>
        <select class="filter-select" id="filtroPrioridad" onchange="aplicarFiltros()">
          <option value="">Prioridad</option>
          <option value="Alta">Alta</option>
          <option value="Media">Media</option>
          <option value="Baja">Baja</option>
        </select>
        <select class="filter-select" id="filtroStatus" onchange="aplicarFiltros()">
          <option value="">Status</option>
          <option value="Pendiente">Pendiente</option>
          <option value="En proceso">En proceso</option>
          <option value="Completada">Completada</option>
        </select>
      </div>

      <!-- TABLA -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="sortable" data-col="Titulo" onclick="ordenarPor('Titulo')">Título <span class="sort-arrow"></span></th>
              <th class="sortable" data-col="ProyectoID" onclick="ordenarPor('ProyectoID')">Proyecto <span class="sort-arrow"></span></th>
              <th class="sortable" data-col="Asignado" onclick="ordenarPor('Asignado')">Asignado <span class="sort-arrow"></span></th>
              <th class="sortable" data-col="Prioridad" onclick="ordenarPor('Prioridad')">Prioridad <span class="sort-arrow"></span></th>
              <th class="sortable" data-col="FechaLimite" onclick="ordenarPor('FechaLimite')">Fecha límite <span class="sort-arrow"></span></th>
              <th class="sortable" data-col="Status" onclick="ordenarPor('Status')">Status <span class="sort-arrow"></span></th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaTareas">
            <tr><td colspan="7"><div class="loading"><span class="spinner"></span>Cargando tareas...</div></td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div><!-- /page -->

<!-- MODAL CREAR / EDITAR -->
<div class="modal-backdrop" id="modalTarea">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitulo">☑️ Nueva Tarea</h3>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group full">
          <label>Título *</label>
          <input type="text" id="mTitulo" placeholder="Ej: Enviar propuesta a cliente">
        </div>
        <div class="form-group">
          <label>Asignado</label>
          <select id="mAsignado">
            <option value="fernando">Fernando</option>
            <option value="juanjose">Juan José</option>
            <option value="adolfo">Adolfo</option>
          </select>
        </div>
        <div class="form-group">
          <label>Prioridad</label>
          <select id="mPrioridad">
            <option>Alta</option>
            <option selected>Media</option>
            <option>Baja</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="mStatus">
            <option>Pendiente</option>
            <option>En proceso</option>
            <option>Completada</option>
          </select>
        </div>
        <div class="form-group">
          <label>Fecha límite</label>
          <input type="date" id="mFechaLimite">
        </div>
        <div class="form-group">
          <label>Proyecto (ID)</label>
          <input type="text" id="mProyectoID" placeholder="ID del proyecto">
        </div>
        <div class="form-group">
          <label>Contacto (ID)</label>
          <input type="text" id="mContactoID" placeholder="ID del contacto">
        </div>
        <div class="form-group full" id="grupoID" style="display:none">
          <label>ID de registro</label>
          <input type="text" id="mID" readonly>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardar" onclick="guardarTarea()">Guardar tarea</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════
// CONFIG
// ═══════════════════════════════════
const ENDPOINT      = 'https://excelentia.app.n8n.cloud/webhook/crm-tareas';
const HIST_ENDPOINT = 'https://excelentia.app.n8n.cloud/webhook/crm-historial';

const USERS = {
  fernando: { nombre: 'Fernando', color: '#1a3a6b' },
  juanjose: { nombre: 'Juan José', color: '#7c3aed' },
  adolfo:   { nombre: 'Adolfo',   color: '#059669' }
};

const PRIOR_ORDER = { 'Alta': 0, 'Media': 1, 'Baja': 2 };
const STATUS_ORDER = { 'Pendiente': 0, 'En proceso': 1, 'Completada': 2 };

let ITEMS     = [];
let FILTERED  = [];
let sortCol   = 'FechaLimite';
let sortDir   = 'asc';
let modoEditar = false;
let currentUser = 'fernando';

// ═══════════════════════════════════
// INIT
// ═══════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const u = params.get('user') || 'fernando';
  currentUser = USERS[u] ? u : 'fernando';
  actualizarUserUI();
  actualizarReloj();
  setInterval(actualizarReloj, 60000);
  cargarTareas();
});

document.addEventListener('click', e => {
  if (!e.target.closest('#userChip') && !e.target.closest('#userMenu')) {
    document.getElementById('userMenu').classList.remove('open');
  }
});

document.getElementById('modalTarea').addEventListener('click', e => {
  if (e.target === document.getElementById('modalTarea')) cerrarModal();
});

// ═══════════════════════════════════
// USUARIO
// ═══════════════════════════════════
function actualizarUserUI() {
  const u = USERS[currentUser];
  document.getElementById('userDot').style.background = u.color;
  document.getElementById('userChipName').textContent = u.nombre;
}

function setUser(uid) {
  currentUser = uid;
  actualizarUserUI();
  document.getElementById('userMenu').classList.remove('open');
  const url = new URL(window.location);
  url.searchParams.set('user', uid);
  window.history.replaceState({}, '', url);
}

function toggleUserMenu() {
  document.getElementById('userMenu').classList.toggle('open');
}

// ═══════════════════════════════════
// RELOJ
// ═══════════════════════════════════
function actualizarReloj() {
  const now  = new Date();
  const dias  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const txt = `${dias[now.getDay()]} ${now.getDate()} de ${meses[now.getMonth()]} de ${now.getFullYear()}`;
  const el = document.getElementById('headerSub');
  if (el) el.textContent = txt.charAt(0).toUpperCase() + txt.slice(1);
}

// ═══════════════════════════════════
// HELPERS
// ═══════════════════════════════════
function toStr(v) { return v === undefined || v === null ? '' : String(v); }

function genId() {
  return 'T-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
}

function fmtFecha(d) {
  if (!d) return '';
  const dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('es-MX', { day:'2-digit', month:'2-digit', year:'numeric' });
}

function esVencida(item) {
  if (!item.FechaLimite) return false;
  if (item.Status === 'Completada') return false;
  return new Date(item.FechaLimite + 'T23:59:59') < new Date();
}

function badgePrioridad(p) {
  const cls = { Alta: 'b-red', Media: 'b-yellow', Baja: 'b-gray' };
  return `<span class="badge ${cls[p] || 'b-gray'}">${p || '—'}</span>`;
}

function badgeStatus(s) {
  const cls = { 'Pendiente': 'b-yellow', 'En proceso': 'b-blue', 'Completada': 'b-green' };
  return `<span class="badge ${cls[s] || 'b-gray'}">${s || '—'}</span>`;
}

function badgeAsignado(uid) {
  const u = USERS[uid] || { nombre: uid || '—', color: '#8a90a0' };
  return `<span class="badge" style="background:${u.color}18;color:${u.color}">${u.nombre}</span>`;
}

function toast(msg, tipo = 'ok') {
  let t = document.getElementById('_toast');
  if (!t) {
    t = document.createElement('div');
    t.id = '_toast';
    t.style.cssText = 'position:fixed;bottom:1.5rem;right:1.5rem;padding:.65rem 1.1rem;border-radius:8px;font-size:.83rem;font-weight:600;z-index:999;transition:opacity .3s;font-family:Manrope,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.15);opacity:0';
    document.body.appendChild(t);
  }
  t.style.background = tipo === 'ok' ? '#059669' : '#dc2626';
  t.style.color = '#fff';
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.opacity = '0', 2800);
}

function normalizar(raw) {
  return {
    ID:          toStr(raw.ID),
    Titulo:      toStr(raw.Titulo),
    ProyectoID:  toStr(raw.ProyectoID),
    ContactoID:  toStr(raw.ContactoID),
    Asignado:    toStr(raw.Asignado),
    Prioridad:   toStr(raw.Prioridad)   || 'Media',
    FechaLimite: toStr(raw.FechaLimite),
    Status:      toStr(raw.Status)      || 'Pendiente'
  };
}

// ═══════════════════════════════════
// API
// ═══════════════════════════════════
async function api(endpoint, body) {
  const res = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function logHistorial(accion, titulo) {
  try {
    await api(HIST_ENDPOINT, {
      accion: 'save',
      ID: 'H-' + Date.now(),
      FechaHora: new Date().toISOString(),
      UserID: currentUser,
      NombreUsuario: USERS[currentUser]?.nombre,
      Accion: accion,
      Proyecto: titulo,
      CampoModificado: '',
      ValorAnterior: '',
      ValorNuevo: '',
      Dispositivo: 'web'
    });
  } catch { /* silencioso */ }
}

// ═══════════════════════════════════
// CARGAR
// ═══════════════════════════════════
async function cargarTareas() {
  document.getElementById('tablaTareas').innerHTML =
    '<tr><td colspan="7"><div class="loading"><span class="spinner"></span>Cargando tareas...</div></td></tr>';
  try {
    const data = await api(ENDPOINT, { accion: 'get' });
    ITEMS = Array.isArray(data) ? data.map(normalizar) : [];
  } catch {
    ITEMS = [];
    toast('Error al cargar tareas', 'err');
  }
  aplicarFiltros();
}

// ═══════════════════════════════════
// FILTROS + ORDENAMIENTO
// ═══════════════════════════════════
function aplicarFiltros() {
  const txt  = document.getElementById('filtroTexto').value.toLowerCase();
  const asig = document.getElementById('filtroAsignado').value;
  const prio = document.getElementById('filtroPrioridad').value;
  const stat = document.getElementById('filtroStatus').value;

  FILTERED = ITEMS.filter(t => {
    if (txt  && !t.Titulo.toLowerCase().includes(txt) && !t.ProyectoID.toLowerCase().includes(txt)) return false;
    if (asig && t.Asignado !== asig) return false;
    if (prio && t.Prioridad !== prio) return false;
    if (stat && t.Status !== stat)   return false;
    return true;
  });

  ordenarFiltered();
  renderTabla();
  renderResumen();
}

function ordenarPor(col) {
  if (sortCol === col) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortCol = col;
    sortDir = 'asc';
  }
  document.querySelectorAll('th.sortable').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.col === sortCol) th.classList.add(sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
  });
  ordenarFiltered();
  renderTabla();
}

function ordenarFiltered() {
  FILTERED.sort((a, b) => {
    let va = a[sortCol] || '';
    let vb = b[sortCol] || '';

    if (sortCol === 'Prioridad') {
      va = PRIOR_ORDER[va] ?? 99;
      vb = PRIOR_ORDER[vb] ?? 99;
      return sortDir === 'asc' ? va - vb : vb - va;
    }
    if (sortCol === 'Status') {
      va = STATUS_ORDER[va] ?? 99;
      vb = STATUS_ORDER[vb] ?? 99;
      return sortDir === 'asc' ? va - vb : vb - va;
    }
    if (sortCol === 'FechaLimite') {
      va = va || '9999-99-99';
      vb = vb || '9999-99-99';
    }
    return sortDir === 'asc'
      ? va.localeCompare(vb, 'es', { sensitivity: 'base' })
      : vb.localeCompare(va, 'es', { sensitivity: 'base' });
  });
}

// ═══════════════════════════════════
// RENDER TABLA
// ═══════════════════════════════════
function renderTabla() {
  const tbody = document.getElementById('tablaTareas');
  if (!FILTERED.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><span>☑️</span>Sin tareas${ITEMS.length ? ' con esos filtros' : ' aún'}</div></td></tr>`;
    return;
  }

  tbody.innerHTML = FILTERED.map(t => {
    const vencida = esVencida(t);
    const fechaTxt = t.FechaLimite ? fmtFecha(t.FechaLimite) : '—';
    const fechaClass = vencida ? 'date-vencida' : 'date-ok';
    const vencidaIco = vencida ? '⚠️ ' : '';
    const proyLabel = t.ProyectoID || '<span class="text-muted">—</span>';

    return `<tr>
      <td><strong>${escHtml(t.Titulo)}</strong></td>
      <td style="font-size:.78rem;color:#4a5068">${escHtml(proyLabel)}</td>
      <td>${badgeAsignado(t.Asignado)}</td>
      <td>${badgePrioridad(t.Prioridad)}</td>
      <td class="${fechaClass}" style="font-size:.78rem;white-space:nowrap">${vencidaIco}${fechaTxt}</td>
      <td>${badgeStatus(t.Status)}</td>
      <td>
        <div class="actions-cell">
          <button class="btn-edit" title="Editar" onclick="abrirModalEditar('${escHtml(t.ID)}')">✏️</button>
          <button class="btn-del" title="Eliminar" onclick="eliminarTarea('${escHtml(t.ID)}')">✕</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════
// RESUMEN PILLS
// ═══════════════════════════════════
function renderResumen() {
  const hoy = new Date();
  const total      = ITEMS.length;
  const pendiente  = ITEMS.filter(t => t.Status === 'Pendiente').length;
  const enProceso  = ITEMS.filter(t => t.Status === 'En proceso').length;
  const completada = ITEMS.filter(t => t.Status === 'Completada').length;
  const vencidas   = ITEMS.filter(t => esVencida(t)).length;

  document.getElementById('pillTotal').textContent     = total;
  document.getElementById('pillPendiente').textContent = pendiente;
  document.getElementById('pillEnProceso').textContent = enProceso;
  document.getElementById('pillCompletada').textContent = completada;
  document.getElementById('pillVencidas').textContent  = vencidas;
}

// ═══════════════════════════════════
// MODAL
// ═══════════════════════════════════
function abrirModalNuevo() {
  modoEditar = false;
  document.getElementById('modalTitulo').textContent = '☑️ Nueva Tarea';
  document.getElementById('btnGuardar').textContent  = 'Guardar tarea';
  document.getElementById('mTitulo').value      = '';
  document.getElementById('mAsignado').value    = currentUser;
  document.getElementById('mPrioridad').value   = 'Media';
  document.getElementById('mStatus').value      = 'Pendiente';
  document.getElementById('mFechaLimite').value = '';
  document.getElementById('mProyectoID').value  = '';
  document.getElementById('mContactoID').value  = '';
  document.getElementById('mID').value          = '';
  document.getElementById('grupoID').style.display = 'none';
  document.getElementById('modalTarea').classList.add('open');
  setTimeout(() => document.getElementById('mTitulo').focus(), 100);
}

function abrirModalEditar(id) {
  const t = ITEMS.find(x => x.ID === id);
  if (!t) return;
  modoEditar = true;
  document.getElementById('modalTitulo').textContent = '✏️ Editar Tarea';
  document.getElementById('btnGuardar').textContent  = 'Guardar cambios';
  document.getElementById('mTitulo').value      = t.Titulo;
  document.getElementById('mAsignado').value    = t.Asignado || 'fernando';
  document.getElementById('mPrioridad').value   = t.Prioridad || 'Media';
  document.getElementById('mStatus').value      = t.Status || 'Pendiente';
  document.getElementById('mFechaLimite').value = t.FechaLimite || '';
  document.getElementById('mProyectoID').value  = t.ProyectoID || '';
  document.getElementById('mContactoID').value  = t.ContactoID || '';
  document.getElementById('mID').value          = t.ID;
  document.getElementById('grupoID').style.display = 'flex';
  document.getElementById('modalTarea').classList.add('open');
}

function cerrarModal() {
  document.getElementById('modalTarea').classList.remove('open');
}

// ═══════════════════════════════════
// GUARDAR (CREATE / UPDATE)
// ═══════════════════════════════════
async function guardarTarea() {
  const titulo = document.getElementById('mTitulo').value.trim();
  if (!titulo) { toast('El título es obligatorio', 'err'); return; }

  const btn = document.getElementById('btnGuardar');
  btn.disabled = true;
  btn.textContent = 'Guardando…';

  const payload = {
    accion:      modoEditar ? 'update' : 'create',
    ID:          modoEditar ? document.getElementById('mID').value : genId(),
    Titulo:      titulo,
    Asignado:    document.getElementById('mAsignado').value,
    Prioridad:   document.getElementById('mPrioridad').value,
    Status:      document.getElementById('mStatus').value,
    FechaLimite: document.getElementById('mFechaLimite').value,
    ProyectoID:  document.getElementById('mProyectoID').value.trim(),
    ContactoID:  document.getElementById('mContactoID').value.trim()
  };

  try {
    await api(ENDPOINT, payload);
    cerrarModal();

    if (modoEditar) {
      const idx = ITEMS.findIndex(x => x.ID === payload.ID);
      if (idx !== -1) ITEMS[idx] = normalizar(payload);
      toast('✅ Tarea actualizada');
      logHistorial('Actualizó tarea CRM', payload.Titulo);
    } else {
      ITEMS.unshift(normalizar(payload));
      toast('✅ Tarea creada');
      logHistorial('Creó tarea CRM', payload.Titulo);
    }

    aplicarFiltros();
  } catch {
    toast('Error al guardar', 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = modoEditar ? 'Guardar cambios' : 'Guardar tarea';
  }
}

// ═══════════════════════════════════
// ELIMINAR
// ═══════════════════════════════════
async function eliminarTarea(id) {
  const t = ITEMS.find(x => x.ID === id);
  if (!t) return;
  if (!confirm(`¿Eliminar la tarea "${t.Titulo}"?`)) return;
  try {
    await api(ENDPOINT, { accion: 'delete', ID: id });
    ITEMS = ITEMS.filter(x => x.ID !== id);
    aplicarFiltros();
    toast('Tarea eliminada');
    logHistorial('Eliminó tarea CRM', t.Titulo);
  } catch {
    toast('Error al eliminar', 'err');
  }
}
</script>
