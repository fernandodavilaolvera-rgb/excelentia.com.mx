<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM · Proyectos — ExcelentIA</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:#f5f6f8;color:#1a2035;min-height:100vh;font-size:15px}

/* ── HEADER FERROCK ── */
.header{background:linear-gradient(135deg,#0d1b3e 0%,#1a3a6b 60%,#1e5096 100%);border-bottom:3px solid #4a9fd4;padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.6rem}
.logo-header-wrap{display:flex;align-items:center;gap:.9rem}
.logo-box{background:#fff;border-radius:10px;padding:.4rem .75rem;display:flex;align-items:center;justify-content:center;min-width:80px;min-height:52px;flex-shrink:0}
.logo-box img{height:48px;width:auto;display:block}
.logo-fallback{font-family:'Manrope',sans-serif;font-size:15px;font-weight:800;color:#1a3a6b;display:none}
.logo-slogan{font-family:'Manrope',sans-serif;font-size:13px;font-weight:500;color:#fff;letter-spacing:.2px}
.header-module{color:#a8c4e0;font-size:.85rem;font-weight:700;text-align:right}
.header-module strong{color:#fff;font-size:.95rem;display:block}

/* ── MAIN ── */
.page{padding:1.25rem 1.5rem;max-width:1400px;margin:0 auto}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem}
.toolbar h2{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:.4rem}
.resumen-pill{background:#fff;border:1px solid #dde1e9;border-radius:20px;padding:.35rem .9rem;font-size:.8rem;color:#4a5068;display:flex;align-items:center;gap:.4rem}
.resumen-pill strong{color:#1a3a6b}
.resumen-pill .v{color:#059669}

.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .95rem;border-radius:8px;font-size:.83rem;font-weight:700;cursor:pointer;transition:.2s;border:none;font-family:'Manrope',sans-serif}
.btn-primary{background:#1a3a6b;color:#fff}.btn-primary:hover{background:#0d1b3e}
.btn-secondary{background:#f0f4ff;color:#1a3a6b;border:1px solid #c8d9f0}.btn-secondary:hover{background:#dce8f7}
.btn-danger{background:#fee2e2;color:#991b1b}.btn-danger:hover{background:#fecaca}
.btn-sm{padding:.32rem .6rem;font-size:.75rem}
.btn-icon{padding:.32rem .42rem;border-radius:6px;width:26px;height:26px;justify-content:center}

/* ── FILTROS ── */
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.9rem}
.filter-input{flex:1 1 240px;width:auto;max-width:320px;min-width:180px;padding:.45rem .75rem;border:1px solid #dde1e9;border-radius:8px;font-family:'Manrope',sans-serif;font-size:.82rem;background:#fff}
.filter-select{flex:0 0 auto;width:auto;min-width:150px;max-width:200px;padding:.45rem .7rem;border:1px solid #dde1e9;border-radius:8px;font-family:'Manrope',sans-serif;font-size:.82rem;background:#fff;color:#1a2035}

/* ── CARD / TABLA ── */
.card{background:#fff;border:1px solid #dde1e9;border-radius:12px;overflow:hidden}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:920px}
th{background:#dce8f7;padding:.65rem .8rem;text-align:left;font-weight:700;color:#1a2035;border-bottom:2px solid #c8d9f0;white-space:nowrap;cursor:pointer;user-select:none}
th.no-sort{cursor:default}
th .arrow{font-size:.68rem;opacity:.5;margin-left:.2rem}
th.sorted .arrow{opacity:1;color:#1a3a6b}
td{padding:.6rem .8rem;border-bottom:1px solid #eef2f8;color:#1a2035;vertical-align:middle}
tr:hover td{background:#f8faff}
tr:last-child td{border-bottom:none}
.celda-proyecto{font-weight:700;color:#1a2035}
.celda-tags{display:flex;gap:.25rem;flex-wrap:wrap;margin-top:.25rem}
.tag-chip{background:#f3f4f6;color:#4a5068;font-size:.68rem;padding:.1rem .4rem;border-radius:6px;font-weight:600}
.celda-empresa{color:#4a5068}
.celda-valor{font-weight:700;color:#059669;white-space:nowrap}
.celda-prob{color:#4a5068}
.celda-accion-txt{font-size:.78rem;color:#4a5068;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.celda-accion-fecha{font-size:.71rem;color:#8a90a0;margin-top:.1rem}
.vencido .celda-accion-txt,.vencido .celda-accion-fecha{color:#dc2626;font-weight:600}

/* ── BADGES ── */
.badge{display:inline-block;padding:.2rem .6rem;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap}
.badge-etapa{color:#fff}
.badge-blue{background:#dce8f7;color:#1a3a6b}
.badge-green{background:#d1fae5;color:#065f46}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-gray{background:#f3f4f6;color:#374151}
.resp-badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.75rem;font-weight:700}
.resp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── NOTAS (mismo lenguaje visual que Contactos) ── */
.notas-btn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:none;cursor:default}
.notas-btn.tiene{background:#059669;cursor:pointer;transition:.15s}
.notas-btn.tiene:hover{background:#047857;transform:scale(1.08)}
.notas-btn.vacia{background:#dc2626}
.notas-btn svg{width:13px;height:13px}

/* ── VACÍO / CARGA ── */
.empty-state{text-align:center;padding:2.5rem 1rem;color:#8a90a0}
.empty-state span{font-size:2rem;display:block;margin-bottom:.5rem}
.loading{text-align:center;padding:1.5rem;color:#4a5068;font-size:.85rem}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #dde1e9;border-top-color:#4a9fd4;border-radius:50%;animation:spin .7s linear infinite;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MODAL ── */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-backdrop.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{background:linear-gradient(135deg,#0d1b3e,#1a3a6b);color:#fff;padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;border-radius:14px 14px 0 0;position:sticky;top:0}
.modal-head h3{font-size:.95rem;font-weight:700}
.modal-close{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:1rem}
.modal-body{padding:1.25rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.form-group{display:flex;flex-direction:column;gap:.3rem}

/* ── PANEL: CREAR CONTACTO AL VUELO ── */
.nuevo-contacto{display:none;background:#f0f6ff;border:1px solid #c8d9f0;border-left:4px solid #4a9fd4;border-radius:0 10px 10px 0;padding:.8rem .9rem;max-width:720px;margin:0 auto;width:100%}
.nuevo-contacto.open{display:block}
.nc-head{font-size:.82rem;font-weight:800;color:#1a3a6b;margin-bottom:.6rem}
.nc-grid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.nc-field{display:flex;flex-direction:column;gap:.25rem}
.nc-field.nc-full{grid-column:1/-1}
.nc-field label{font-size:.73rem;font-weight:700;color:#4a5068}
.nc-field input{width:100%;padding:.45rem .6rem;border:1px solid #dde1e9;border-radius:7px;font-family:'Manrope',sans-serif;font-size:.83rem;color:#1a2035;background:#fff}
.nc-field input:focus{outline:none;border-color:#4a9fd4;box-shadow:0 0 0 3px rgba(74,159,212,.12)}
.nc-hint{font-size:.73rem;color:#8a90a0;margin-top:.5rem;line-height:1.4}
.nc-aviso{display:none;margin-top:.55rem;border-radius:8px;padding:.5rem .65rem;font-size:.77rem;line-height:1.45}
.nc-aviso.open{display:block}
.nc-aviso.dup{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b}
.nc-aviso.parecido{background:#fef9c3;border:1px solid #fde047;color:#713f12}
.nc-aviso b{font-weight:800}
.nc-usar{background:#fff;border:1px solid #c8d9f0;border-radius:6px;padding:.2rem .5rem;font-size:.74rem;font-weight:700;color:#1a3a6b;cursor:pointer;font-family:'Manrope',sans-serif;margin-top:.35rem;margin-right:.3rem}
.nc-usar:hover{background:#dce8f7}
.nc-acciones{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.7rem}
.nc-sugerencia{display:none;font-size:.76rem;color:#4a5068;background:#eef4fc;border-left:4px solid #1a3a6b;border-radius:0 6px 6px 0;padding:.5rem .7rem;line-height:1.45;max-width:720px;margin:0 auto;width:100%}
.nc-sugerencia.open{display:block}
@media(max-width:600px){
  .nc-grid{grid-template-columns:1fr}
  .nc-field.nc-full{grid-column:1}
}
.form-group.full{grid-column:1/-1}
label{font-size:.8rem;font-weight:600;color:#4a5068}
input,select,textarea{padding:.5rem .7rem;border:1px solid #dde1e9;border-radius:8px;font-family:'Manrope',sans-serif;font-size:.83rem;color:#1a2035;background:#fff}
.modal-body input,.modal-body select,.modal-body textarea{width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:#4a9fd4;box-shadow:0 0 0 3px rgba(74,159,212,.12)}
textarea{resize:vertical;min-height:70px}
.modal-foot{padding:.85rem 1.25rem;border-top:1px solid #eef2f8;display:flex;gap:.6rem;justify-content:flex-end;position:sticky;bottom:0;background:#fff}

.modal-nota .modal{max-width:440px}
.nota-nombre{font-weight:700;font-size:.9rem;margin-bottom:.5rem}
.nota-texto{font-size:.85rem;line-height:1.55;color:#1a2035;white-space:pre-wrap}

/* ── RESPONSIVE ≤600px ── */
@media(max-width:600px){
  .header{padding:.6rem 1rem}
  .logo-header-wrap{flex-direction:column;align-items:flex-start;gap:.3rem}
  .logo-slogan{font-size:11px}
  .header-module{text-align:left;width:100%}
  .page{padding:1rem}
  .toolbar{flex-direction:column;align-items:flex-start}
  .filters{flex-direction:column}
  .filter-input,.filter-select{width:100%}
  .form-grid{grid-template-columns:1fr}
  .form-grid .form-group.full{grid-column:1}
  .modal{max-width:100%;border-radius:14px 14px 0 0;align-self:flex-end;max-height:95vh}
  .modal-backdrop{align-items:flex-end;padding:0}
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     CONTENIDO
══════════════════════════════════════ -->
<main class="page">

  <div class="toolbar">
    <h2>📋 Proyectos</h2>
    <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
      <span class="resumen-pill">🔥 <strong id="resumen-activos">0</strong> activos · <span class="v" id="resumen-valor">$0</span> en pipeline</span>
      <button class="btn btn-primary" onclick="abrirModal()">+ Nuevo proyecto</button>
    </div>
  </div>

  <div class="filters">
    <input class="filter-input" type="text" id="f-buscar" placeholder="Buscar proyecto o empresa..." oninput="render()">
    <select class="filter-select" id="f-etapa" onchange="render()">
      <option value="">Todas las etapas</option>
      <option>Prospecto</option><option>Contacto</option><option>Presentación</option>
      <option>Seguimiento</option><option>Propuesta</option><option>Cierre</option>
      <option>Desarrollo</option><option>Entrega</option><option>Mantenimiento</option>
    </select>
    <select class="filter-select" id="f-responsable" onchange="render()">
      <option value="">Todos los responsables</option>
      <option value="fernando">Fernando</option>
      <option value="juanjose">Juan José</option>
      <option value="adolfo">Adolfo</option>
    </select>
    <select class="filter-select" id="f-status" onchange="render()">
      <option value="">Todos los status</option>
      <option value="activo">Activo</option>
      <option value="ganado">Ganado</option>
      <option value="perdido">Perdido</option>
      <option value="pausado">Pausado</option>
    </select>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th onclick="toggleSort('nombre')" data-col="nombre">Proyecto <span class="arrow">⇕</span></th>
            <th onclick="toggleSort('empresa')" data-col="empresa">Empresa <span class="arrow">⇕</span></th>
            <th onclick="toggleSort('etapa')" data-col="etapa">Etapa <span class="arrow">⇕</span></th>
            <th onclick="toggleSort('valor')" data-col="valor">Valor <span class="arrow">⇕</span></th>
            <th onclick="toggleSort('prob')" data-col="prob">Prob. <span class="arrow">⇕</span></th>
            <th onclick="toggleSort('responsable')" data-col="responsable">Responsable <span class="arrow">⇕</span></th>
            <th onclick="toggleSort('accionfecha')" data-col="accionfecha">Próx. Acción <span class="arrow">⇕</span></th>
            <th onclick="toggleSort('status')" data-col="status">Status <span class="arrow">⇕</span></th>
            <th class="no-sort">Notas</th>
            <th class="no-sort"></th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="10"><div class="loading"><span class="spinner"></span>Cargando proyectos...</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<!-- ══════════════════════════════════════
     MODAL: Crear / Editar proyecto
══════════════════════════════════════ -->
<div class="modal-backdrop" id="modal-proyecto">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-titulo">📋 Nuevo Proyecto</h3><button class="modal-close" onclick="cerrarModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group full"><label>Nombre del proyecto *</label><input type="text" id="p-nombre" placeholder="Ej: Dashboard Berimbau v2"></div>
        <div class="form-group"><label>Empresa</label><input type="text" id="p-empresa" placeholder="Razón social o nombre"></div>
        <div class="form-group"><label>Contacto</label><input type="text" id="p-contacto" list="dl-contactos" placeholder="Elige de la lista o escribe" autocomplete="off" oninput="revisarContactoProyecto()"><datalist id="dl-contactos"></datalist></div>
        <div class="form-group full nuevo-contacto" id="panelNuevoContacto">
          <div class="nc-head">➕ Agregar al directorio</div>
          <div class="nc-grid">
            <div class="nc-field nc-full">
              <label>Nombre *</label>
              <input type="text" id="ncNombre" placeholder="Nombre completo" oninput="revisarDuplicado()" autocomplete="off">
            </div>
            <div class="nc-field">
              <label>Empresa</label>
              <input type="text" id="ncEmpresa" placeholder="Dónde trabaja" oninput="validarNuevoContacto()">
            </div>
            <div class="nc-field">
              <label>WhatsApp</label>
              <input type="tel" id="ncWhatsApp" placeholder="+52 55 1234 5678" oninput="validarNuevoContacto()">
            </div>
            <div class="nc-field nc-full">
              <label>Email</label>
              <input type="email" id="ncEmail" placeholder="correo@empresa.com" oninput="validarNuevoContacto()">
            </div>
          </div>
          <div class="nc-aviso" id="ncAviso"></div>
          <div class="nc-hint" id="ncHint">Además del nombre, agrega al menos empresa, WhatsApp o email.</div>
          <div class="nc-acciones">
            <button type="button" class="btn btn-secondary btn-sm" onclick="cancelarNuevoContacto()">Cancelar</button>
            <button type="button" class="btn btn-primary btn-sm" id="ncBtnCrear" onclick="crearContactoRapido()" disabled>Crear y usar</button>
          </div>
        </div>
        <div class="form-group full nc-sugerencia" id="ncSugerencia"></div>
        <div class="form-group"><label>Etapa</label>
          <select id="p-etapa"><option>Prospecto</option><option>Contacto</option><option>Presentación</option><option>Seguimiento</option><option>Propuesta</option><option>Cierre</option><option>Desarrollo</option><option>Entrega</option><option>Mantenimiento</option></select>
        </div>
        <div class="form-group"><label>Status</label>
          <select id="p-status"><option value="activo">Activo</option><option value="ganado">Ganado</option><option value="perdido">Perdido</option><option value="pausado">Pausado</option></select>
        </div>
        <div class="form-group"><label>Valor estimado (MXN)</label><input type="number" id="p-valor" placeholder="0.00" step="500" min="0"></div>
        <div class="form-group"><label>Probabilidad (%)</label><input type="number" id="p-probabilidad" placeholder="50" min="0" max="100"></div>
        <div class="form-group"><label>Responsable</label>
          <select id="p-responsable"><option value="fernando">Fernando</option><option value="juanjose">Juan José</option><option value="adolfo">Adolfo</option></select>
        </div>
        <div class="form-group"><label>Fecha inicio</label><input type="date" id="p-finicio"></div>
        <div class="form-group"><label>Fecha cierre estimada</label><input type="date" id="p-fcierre"></div>
        <div class="form-group full"><label>Próxima acción</label><input type="text" id="p-prox-accion" placeholder="Ej: Enviar propuesta formal"></div>
        <div class="form-group"><label>Fecha próxima acción</label><input type="date" id="p-fecha-accion"></div>
        <div class="form-group"><label>Tags (separados por coma)</label><input type="text" id="p-tags" placeholder="Ej: automatización,whatsapp"></div>
        <div class="form-group full"><label>Link carpeta Drive</label><input type="url" id="p-drive" placeholder="https://drive.google.com/..."></div>
        <div class="form-group full"><label>Notas</label><textarea id="p-notas" placeholder="Contexto adicional del proyecto..."></textarea></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" id="btn-guardar" onclick="guardarProyecto()">Guardar proyecto</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     MODAL: Ver nota (mismo patrón que Contactos)
══════════════════════════════════════ -->
<div class="modal-backdrop modal-nota" id="modal-vernota">
  <div class="modal">
    <div class="modal-head"><h3>📝 Nota del proyecto</h3><button class="modal-close" onclick="cerrarModalNota()">✕</button></div>
    <div class="modal-body">
      <div class="nota-nombre" id="vernota-nombre"></div>
      <div class="nota-texto" id="vernota-texto"></div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════
const N8N_BASE = 'https://n8n.excelentia.com.mx/webhook';
const ENDPOINT = '/crm-proyectos';
const HISTORIAL_ENDPOINT = '/crm-historial';

const USERS = {
  fernando: { nombre:'Fernando', color:'#1a3a6b' },
  juanjose: { nombre:'Juan José', color:'#7c3aed' },
  adolfo:   { nombre:'Adolfo',    color:'#059669' }
};

const ETAPAS = ['Prospecto','Contacto','Presentación','Seguimiento','Propuesta','Cierre','Desarrollo','Entrega','Mantenimiento'];
const ETAPA_COLORS = {
  'Prospecto':'#8a90a0','Contacto':'#4a9fd4','Presentación':'#7c3aed',
  'Seguimiento':'#f59e0b','Propuesta':'#f97316','Cierre':'#dc2626',
  'Desarrollo':'#2563eb','Entrega':'#059669','Mantenimiento':'#065f46'
};
const STATUS_BADGE = { activo:'badge-blue', ganado:'badge-green', perdido:'badge-red', pausado:'badge-gray' };
const STATUS_LABEL = { activo:'Activo', ganado:'Ganado', perdido:'Perdido', pausado:'Pausado' };

let currentUser = 'fernando';
let ITEMS = [];
let CONTACTOS = [];
let sortCol = 'accionfecha';
let sortDir = 1;
let editId = null;

// ── Contactos: se guarda el nombre visible SIEMPRE (texto libre), y el ID solo
//    cuando el texto coincide con un contacto formal existente ──
function nombreContacto(idOrText, nombreLibre){
  // 1) Si hay nombre libre guardado, ese manda
  const libre = toStr(nombreLibre).trim();
  if(libre) return libre;
  // 2) Si el valor es un ID de contacto formal, mostrar su nombre
  const c = CONTACTOS.find(x => x.id === toStr(idOrText));
  return c ? c.nombre : toStr(idOrText);
}
function idDeContacto(text){
  const t = toStr(text).trim();
  const c = CONTACTOS.find(x => x.nombre.toLowerCase() === t.toLowerCase());
  return c ? c.id : '';   // coincide un contacto formal → su ID; si no, vacío (será texto libre)
}

// ═══════════════════════════════════════
// CREAR CONTACTO AL VUELO
// ═══════════════════════════════════════

// ── Anti-duplicados: ignora acentos, mayúsculas y errores de dedo ──
function normNombre(s){
  return String(s || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9ñ ]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function distanciaTexto(a,b){
  if(a === b) return 0;
  const m = a.length, n = b.length;
  if(!m) return n;
  if(!n) return m;
  let prev = Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    }
    prev = cur;
  }
  return prev[n];
}
function buscarSimilares(nombre){
  const n = normNombre(nombre);
  const res = { exacto:null, parecidos:[] };
  if(n.length < 3) return res;
  for(const c of CONTACTOS){
    const cn = normNombre(c.nombre);
    if(!cn) continue;
    if(cn === n){ res.exacto = c; return res; }
    const largo = Math.max(cn.length, n.length);
    const umbral = largo <= 6 ? 1 : Math.max(2, Math.floor(largo * 0.25));
    if(distanciaTexto(cn,n) <= umbral || cn.includes(n) || n.includes(cn)) res.parecidos.push(c);
  }
  res.parecidos = res.parecidos.slice(0,3);
  return res;
}

// Mientras escribes en el campo Contacto del proyecto: si no está en el directorio, ofrecer crearlo
function revisarContactoProyecto(){
  const txt = document.getElementById('p-contacto').value.trim();
  const sug = document.getElementById('ncSugerencia');
  const panel = document.getElementById('panelNuevoContacto');
  if(panel.classList.contains('open')) return;   // el panel manda

  if(txt.length < 3){ sug.classList.remove('open'); return; }
  const { exacto, parecidos } = buscarSimilares(txt);

  if(exacto){
    sug.classList.remove('open');
  } else if(parecidos.length){
    sug.className = 'form-group full nc-sugerencia open';
    sug.innerHTML = '🤔 ¿Te refieres a ' +
      parecidos.map(c => `<button type="button" class="nc-usar" onclick="usarContactoExistente('${escHtml(c.nombre)}')">${escHtml(c.nombre)}${c.empresa?' · '+escHtml(c.empresa):''}</button>`).join('') +
      '? Si no, <button type="button" class="nc-usar" onclick="abrirNuevoContacto()">➕ agregarlo al directorio</button>';
  } else {
    sug.className = 'form-group full nc-sugerencia open';
    sug.innerHTML = `<b>${escHtml(txt)}</b> no está en tu directorio. Se guardará como texto libre, o puedes ` +
      '<button type="button" class="nc-usar" onclick="abrirNuevoContacto()">➕ agregarlo al directorio</button>';
  }
}

function abrirNuevoContacto(){
  const panel = document.getElementById('panelNuevoContacto');
  document.getElementById('ncSugerencia').classList.remove('open');
  panel.classList.add('open');
  document.getElementById('ncNombre').value = document.getElementById('p-contacto').value.trim();
  ['ncEmpresa','ncWhatsApp','ncEmail'].forEach(id => { const el = document.getElementById(id); if(el) el.value=''; });
  // Precargar la empresa del proyecto, que casi siempre es la misma
  const emp = document.getElementById('p-empresa').value.trim();
  if(emp) document.getElementById('ncEmpresa').value = emp;
  revisarDuplicado();
  setTimeout(()=>document.getElementById('ncNombre')?.focus(), 60);
}

function cerrarPanelNuevoContacto(){
  document.getElementById('panelNuevoContacto')?.classList.remove('open');
  document.getElementById('ncSugerencia')?.classList.remove('open');
  ocultarAviso();
}
function cancelarNuevoContacto(){ cerrarPanelNuevoContacto(); }

function ocultarAviso(){
  const av = document.getElementById('ncAviso');
  if(av){ av.className = 'nc-aviso'; av.innerHTML = ''; }
}

function revisarDuplicado(){
  const nombre = document.getElementById('ncNombre').value;
  const av = document.getElementById('ncAviso');
  const { exacto, parecidos } = buscarSimilares(nombre);

  if(exacto){
    av.className = 'nc-aviso open dup';
    av.innerHTML = `⚠️ <b>${escHtml(exacto.nombre)}</b> ya está en tu directorio${exacto.empresa?' · '+escHtml(exacto.empresa):''}. No se puede duplicar.
      <br><button type="button" class="nc-usar" onclick="usarContactoExistente('${escHtml(exacto.nombre)}')">Usar este contacto</button>`;
  } else if(parecidos.length){
    av.className = 'nc-aviso open parecido';
    av.innerHTML = '🤔 Se parece a ' + (parecidos.length>1?'estos contactos':'este contacto') + ':<br>' +
      parecidos.map(c => `<button type="button" class="nc-usar" onclick="usarContactoExistente('${escHtml(c.nombre)}')">${escHtml(c.nombre)}${c.empresa?' · '+escHtml(c.empresa):''}</button>`).join('') +
      '<br><span style="font-size:.73rem">Si de verdad es alguien distinto, puedes crearlo.</span>';
  } else {
    ocultarAviso();
  }
  validarNuevoContacto();
}

function usarContactoExistente(nombre){
  document.getElementById('p-contacto').value = nombre;
  cerrarPanelNuevoContacto();
  showToast('Contacto tomado del directorio');
}

// ── Ficha mínima: nombre + al menos un dato de contexto ──
function validarNuevoContacto(){
  const nombre = document.getElementById('ncNombre').value.trim();
  const empresa = document.getElementById('ncEmpresa').value.trim();
  const wa = document.getElementById('ncWhatsApp').value.trim();
  const mail = document.getElementById('ncEmail').value.trim();
  const btn = document.getElementById('ncBtnCrear');
  const hint = document.getElementById('ncHint');
  const { exacto } = buscarSimilares(nombre);

  const tieneContexto = !!(empresa || wa || mail);
  btn.disabled = !(nombre.length >= 3 && tieneContexto && !exacto);

  if(exacto)                  hint.textContent = 'Ese contacto ya existe — úsalo desde el aviso de arriba.';
  else if(nombre.length < 3)  hint.textContent = 'Escribe el nombre completo del contacto.';
  else if(!tieneContexto)     hint.textContent = 'Falta contexto: agrega empresa, WhatsApp o email para no dejar la ficha vacía.';
  else                        hint.textContent = 'Listo para crear. Quedará etiquetado como «ficha-rápida» para completarlo después.';
}

async function crearContactoRapido(){
  const nombre = document.getElementById('ncNombre').value.trim();
  const empresa = document.getElementById('ncEmpresa').value.trim();
  const wa = document.getElementById('ncWhatsApp').value.trim();
  const mail = document.getElementById('ncEmail').value.trim();
  if(!nombre) return;

  const { exacto } = buscarSimilares(nombre);
  if(exacto){ revisarDuplicado(); return; }

  const btn = document.getElementById('ncBtnCrear');
  btn.disabled = true;
  const textoPrevio = btn.textContent;
  btn.textContent = 'Creando…';

  const nuevo = {
    accion: 'create',
    ID: 'C-' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
    Tipo: 'Persona',
    Nombre: nombre,
    Empresa: empresa,
    Cargo: '',
    WhatsApp: wa,
    Email: mail,
    Telefono: '',
    LinkedIn: '',
    Status: 'Lead',
    Tags: 'ficha-rápida',
    Notas: 'Creado desde Proyectos'
  };

  try{
    const res = await fetch(`${N8N_BASE}/crm-contactos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(nuevo)
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);

    CONTACTOS.push({ id: nuevo.ID, nombre: nuevo.Nombre, empresa: nuevo.Empresa });
    const dl = document.getElementById('dl-contactos');
    if(dl) dl.innerHTML = CONTACTOS.map(c => `<option value="${escHtml(c.nombre)}">${escHtml(c.empresa)}</option>`).join('');
    document.getElementById('p-contacto').value = nuevo.Nombre;
    cerrarPanelNuevoContacto();
    showToast('✅ ' + nombre + ' agregado al directorio');
  }catch(e){
    showToast('No se pudo crear el contacto', 'err');
    btn.disabled = false;
  }
  btn.textContent = textoPrevio;
}

// ═══════════════════════════════════════
// HELPERS — blindaje contra Bug raíz #2
// ═══════════════════════════════════════
function toStr(v){
  if(v === null || v === undefined) return '';
  return String(v);
}
function toNum(v){
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}
function escHtml(s){
  return toStr(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmt$(n){
  return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(toNum(n));
}
function fmtDate(d){
  d = toStr(d);
  if(!d) return '';
  const dt = new Date(d.length===10 ? d+'T12:00:00' : d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function estaVencida(fechaStr){
  const f = toStr(fechaStr);
  if(!f) return false;
  const dt = new Date(f.length===10 ? f+'T23:59:59' : f);
  return !isNaN(dt) && dt < new Date();
}

// Normaliza cada fila: TODO pasa por String() — ValorEstimado/Probabilidad/ID/Tags
// llegan como número de Google Sheets cuando solo tienen dígitos (Bug raíz #2, ya
// confirmado en Contactos y Proyectos). Nunca asumir que un campo es texto.
function normalizeItem(p){
  return {
    ID: toStr(p.ID),
    Nombre: toStr(p.Nombre),
    Empresa: toStr(p.Empresa),
    ContactoID: toStr(p.ContactoID),
    ContactoNombre: toStr(p.ContactoNombre),
    Etapa: toStr(p.Etapa) || 'Prospecto',
    ValorEstimado: toStr(p.ValorEstimado),
    Responsable: toStr(p.Responsable),
    Probabilidad: toStr(p.Probabilidad),
    Status: toStr(p.Status) || 'activo',
    FechaInicio: toStr(p.FechaInicio),
    FechaCierreEst: toStr(p.FechaCierreEst),
    ProximaAccion: toStr(p.ProximaAccion),
    FechaAccion: toStr(p.FechaAccion),
    Tags: toStr(p.Tags),
    DriveFolder: toStr(p.DriveFolder),
    Notas: toStr(p.Notas)
  };
}

function genId(){
  return `P-${Date.now()}-${Math.random().toString(36).slice(2,6)}`;
}

function showToast(msg, tipo='ok'){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:1.5rem;right:1.5rem;padding:.65rem 1.1rem;border-radius:8px;font-size:.83rem;font-weight:600;z-index:999;transition:.3s;font-family:Manrope,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.15)';
    document.body.appendChild(t);
  }
  t.style.background = tipo === 'ok' ? '#059669' : '#dc2626';
  t.style.color = '#fff';
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._h);

}

async function apiCall(accion, data = {}){
  try{
    const res = await fetch(`${N8N_BASE}${ENDPOINT}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion, ...data })
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  }catch(e){
    console.error('Error API crm-proyectos:', e);
    return null;
  }
}

// ═══════════════════════════════════════
// FILTROS + ORDEN
// ═══════════════════════════════════════
function getFiltrados(){
  const q = (document.getElementById('f-buscar')?.value || '').toLowerCase().trim();
  const etapaF = document.getElementById('f-etapa')?.value;
  const respF = document.getElementById('f-responsable')?.value;
  const statusF = document.getElementById('f-status')?.value;

  let lista = ITEMS.filter(p => {
    if(q && !(p.Nombre.toLowerCase().includes(q) || p.Empresa.toLowerCase().includes(q))) return false;
    if(etapaF && p.Etapa !== etapaF) return false;
    if(respF && p.Responsable !== respF) return false;
    if(statusF && p.Status !== statusF) return false;
    return true;
  });

  if(sortCol) lista = aplicarOrden(lista);
  return lista;
}

function toggleSort(col){
  if(sortCol === col){ sortDir *= -1; }
  else { sortCol = col; sortDir = 1; }
  render();
}

function aplicarOrden(lista){
  return [...lista].sort((a,b) => {
    let va, vb;
    switch(sortCol){
      case 'valor':        va = toNum(a.ValorEstimado); vb = toNum(b.ValorEstimado); break;
      case 'prob':         va = toNum(a.Probabilidad);  vb = toNum(b.Probabilidad);  break;
      case 'etapa':        va = ETAPAS.indexOf(a.Etapa); vb = ETAPAS.indexOf(b.Etapa); break;
      case 'accionfecha':  va = a.FechaAccion || '9999-99-99'; vb = b.FechaAccion || '9999-99-99'; break;
      case 'responsable':  va = (USERS[a.Responsable]?.nombre || a.Responsable).toLowerCase(); vb = (USERS[b.Responsable]?.nombre || b.Responsable).toLowerCase(); break;
      case 'status':       va = a.Status.toLowerCase(); vb = b.Status.toLowerCase(); break;
      case 'empresa':      va = a.Empresa.toLowerCase(); vb = b.Empresa.toLowerCase(); break;
      default:             va = a.Nombre.toLowerCase(); vb = b.Nombre.toLowerCase();
    }
    if(va < vb) return -1 * sortDir;
    if(va > vb) return 1 * sortDir;
    return 0;
  });
}

function actualizarFlechas(){
  document.querySelectorAll('th[data-col]').forEach(th => {
    th.classList.remove('sorted');
    const arrow = th.querySelector('.arrow');
    if(th.dataset.col === sortCol){
      th.classList.add('sorted');
      if(arrow) arrow.textContent = sortDir === 1 ? '▲' : '▼';
    } else if(arrow){
      arrow.textContent = '⇕';
    }
  });
}

// ═══════════════════════════════════════
function render(){
  const lista = getFiltrados();
  actualizarFlechas();
  renderResumen();
  renderTabla(lista);
}

function renderResumen(){
  const activos = ITEMS.filter(p => p.Status === 'activo');
  const valor = activos.reduce((s,p) => s + toNum(p.ValorEstimado), 0);
  document.getElementById('resumen-activos').textContent = activos.length;
  document.getElementById('resumen-valor').textContent = fmt$(valor);
}

function renderTabla(lista){
  const tbody = document.getElementById('tbody');
  if(!lista.length){
    tbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><span>📋</span>Sin proyectos que coincidan</div></td></tr>';
    return;
  }
  tbody.innerHTML = lista.map(p => {
    const colorEtapa = ETAPA_COLORS[p.Etapa] || '#8a90a0';
    const resp = USERS[p.Responsable] || { nombre: p.Responsable || '—', color: '#8a90a0' };
    const vencido = p.Status === 'activo' && estaVencida(p.FechaAccion);
    const tags = p.Tags ? p.Tags.split(',').map(t => t.trim()).filter(Boolean) : [];
    const tieneNota = p.Notas.trim().length > 0;

    return `<tr>
      <td>
        <div class="celda-proyecto">${escHtml(p.Nombre)}</div>
        ${tags.length ? `<div class="celda-tags">${tags.map(t=>`<span class="tag-chip">${escHtml(t)}</span>`).join('')}</div>` : ''}
      </td>
      <td class="celda-empresa">${escHtml(p.Empresa) || '—'}</td>
      <td><span class="badge badge-etapa" style="background:${colorEtapa}">${escHtml(p.Etapa)}</span></td>
      <td class="celda-valor">${fmt$(p.ValorEstimado)}</td>
      <td class="celda-prob">${p.Probabilidad ? toNum(p.Probabilidad)+'%' : '—'}</td>
      <td><span class="resp-badge"><span class="resp-dot" style="background:${resp.color}"></span>${escHtml(resp.nombre)}</span></td>
      <td class="${vencido?'vencido':''}">
        ${p.ProximaAccion ? `<span class="celda-accion-txt">${vencido?'⚠️ ':''}${escHtml(p.ProximaAccion)}</span>` : '<span class="celda-accion-txt">—</span>'}
        ${p.FechaAccion ? `<span class="celda-accion-fecha">${fmtDate(p.FechaAccion)}</span>` : ''}
      </td>
      <td><span class="badge ${STATUS_BADGE[p.Status]||'badge-gray'}">${STATUS_LABEL[p.Status]||escHtml(p.Status)}</span></td>
      <td>${tieneNota
          ? `<button class="notas-btn tiene" onclick="verNota('${p.ID}')" title="Ver nota">${iconoNota()}</button>`
          : `<span class="notas-btn vacia" title="Sin nota">${iconoNota()}</span>`}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-secondary btn-sm btn-icon" onclick="abrirModal('${p.ID}')" title="Editar">✏️</button>
        <button class="btn btn-danger btn-sm btn-icon" onclick="eliminarProyecto('${p.ID}')" title="Eliminar">✕</button>
      </td>
    </tr>`;
  }).join('');
}

async function guardarProyecto(){
  const nombre = document.getElementById('p-nombre').value.trim();
  if(!nombre){ showToast('El nombre del proyecto es obligatorio', 'err'); return; }

  const payload = {
    ID: editId || genId(),
    Nombre: nombre,
    Empresa: document.getElementById('p-empresa').value.trim(),
    ContactoID: idDeContacto(document.getElementById('p-contacto').value),
    ContactoNombre: document.getElementById('p-contacto').value.trim(),
    Etapa: document.getElementById('p-etapa').value,
    ValorEstimado: toNum(document.getElementById('p-valor').value),
    Responsable: document.getElementById('p-responsable').value,
    Probabilidad: toNum(document.getElementById('p-probabilidad').value),
    Status: document.getElementById('p-status').value,
    FechaInicio: document.getElementById('p-finicio').value,
    FechaCierreEst: document.getElementById('p-fcierre').value,
    ProximaAccion: document.getElementById('p-prox-accion').value.trim(),
    FechaAccion: document.getElementById('p-fecha-accion').value,
    Tags: document.getElementById('p-tags').value.trim(),
    DriveFolder: document.getElementById('p-drive').value.trim(),
    Notas: document.getElementById('p-notas').value.trim()
  };

  const esEdicion = !!editId;
  const res = await apiCall(esEdicion ? 'update' : 'create', payload);

  if(res){
    if(esEdicion){
      const idx = ITEMS.findIndex(x => x.ID === editId);
      if(idx > -1) ITEMS[idx] = normalizeItem(payload);
      showToast('✅ Proyecto actualizado');
      logHistorial('Actualizó proyecto', nombre);
    } else {
      ITEMS.unshift(normalizeItem(payload));
      showToast('✅ Proyecto guardado');
      logHistorial('Creó proyecto', nombre);
    }
    cerrarModal();
    render();
  } else {
    showToast('Error al guardar — revisa tu conexión', 'err');
  }
}

async function eliminarProyecto(id){
  const p = ITEMS.find(x => x.ID === id);
  if(!p) return;
  if(!confirm(`¿Eliminar el proyecto "${p.Nombre}"?`)) return;

  const res = await apiCall('delete', { ID: id });
  if(res !== null){
    ITEMS = ITEMS.filter(x => x.ID !== id);
    render();
    showToast('Proyecto eliminado');
    logHistorial('Eliminó proyecto', p.Nombre);
  } else {
    showToast('Error al eliminar', 'err');
  }
}
