<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contactos · ExcelentIA Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:#f5f6f8;color:#1a2035;min-height:100vh;font-size:15px}

/* ── HEADER (igual que el resto de módulos) ── */
.demo-header{background:linear-gradient(135deg,#0d1b3e 0%,#1a3a6b 60%,#1e5096 100%);border-bottom:3px solid #4a9fd4;padding:.75rem 1.5rem;display:flex;align-items:center;gap:1rem}
.logo-box{background:#fff;border-radius:10px;padding:.4rem .75rem;display:flex;align-items:center;justify-content:center;min-width:80px;min-height:52px;flex-shrink:0}
.logo-box img{height:40px;width:auto;display:block}
.logo-fallback{font-family:'Manrope',sans-serif;font-size:15px;font-weight:800;color:#1a3a6b;display:none}
.demo-header-text{display:flex;flex-direction:column;gap:.1rem}
.demo-header h1{font-size:1.05rem;font-weight:700;color:#fff}
.demo-header span{color:#a8c4e0;font-size:.78rem}

.page{padding:1.25rem 1.5rem;max-width:1500px;margin:0 auto}

/* ── CARDS ── */
.card{background:#fff;border:1px solid #dde1e9;border-radius:12px;overflow:hidden;margin-bottom:1rem}
.card-head{background:#dce8f7;padding:.7rem 1rem;font-weight:700;font-size:.88rem;color:#1a2035;display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.card-body{padding:1rem}

/* ── BOTONES ── */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;transition:.2s;border:none;font-family:'Manrope',sans-serif}
.btn-primary{background:#1a3a6b;color:#fff}.btn-primary:hover{background:#0d1b3e}
.btn-success{background:#059669;color:#fff}.btn-success:hover{background:#047857}
.btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-secondary{background:#f0f4ff;color:#1a3a6b;border:1px solid #c8d9f0}.btn-secondary:hover{background:#dce8f7}
.btn-sm{padding:.3rem .65rem;font-size:.78rem}
.btn-icon{padding:.35rem .45rem;border-radius:6px}

/* ── ALERTAS ── */
.alert-box{background:#f0f6ff;border:1px solid #c8d9f0;border-left:4px solid #4a9fd4;border-radius:8px;padding:.75rem 1rem;font-size:.82rem;color:#1a2035;margin-bottom:.75rem}

/* ── FILTROS ── */
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem;align-items:center;justify-content:flex-start}
.filter-input{width:240px;padding:.42rem .7rem;border:1px solid #dde1e9;border-radius:8px;font-family:'Manrope',sans-serif;font-size:.82rem}
.filter-select{width:150px;padding:.42rem .7rem;border:1px solid #dde1e9;border-radius:8px;font-family:'Manrope',sans-serif;font-size:.82rem;background:#fff}

/* ── FORMULARIO / MODAL ── */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-backdrop.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{background:linear-gradient(135deg,#0d1b3e,#1a3a6b);color:#fff;padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;border-radius:14px 14px 0 0}
.modal-head h3{font-size:.95rem;font-weight:700}
.modal-close{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
.modal-body{padding:1.25rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.form-group{display:flex;flex-direction:column;gap:.3rem}
.form-group.full{grid-column:1/-1}
label{font-size:.8rem;font-weight:600;color:#4a5068}
input,select,textarea{width:100%;padding:.5rem .7rem;border:1px solid #dde1e9;border-radius:8px;font-family:'Manrope',sans-serif;font-size:.83rem;color:#1a2035;background:#fff;transition:.2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#4a9fd4;box-shadow:0 0 0 3px rgba(74,159,212,.12)}
textarea{resize:vertical;min-height:70px}
.modal-foot{padding:.85rem 1.25rem;border-top:1px solid #eef2f8;display:flex;gap:.6rem;justify-content:flex-end}
.radio-row{display:flex;gap:.75rem}
.radio-row label{display:flex;align-items:center;gap:.3rem;cursor:pointer;font-weight:500;color:#1a2035}

/* ── BADGES ── */
.badge{display:inline-block;padding:.2rem .55rem;border-radius:20px;font-size:.73rem;font-weight:700}
.badge-blue{background:#dce8f7;color:#1a3a6b}
.badge-green{background:#d1fae5;color:#065f46}
.badge-gray{background:#f3f4f6;color:#374151}
.badge-purple{background:#ede9fe;color:#5b21b6}

/* ── EMPTY / LOADING ── */
.empty-state{text-align:center;padding:2.5rem 1rem;color:#8a90a0}
.empty-state span{font-size:2rem;display:block;margin-bottom:.5rem}
.loading{text-align:center;padding:1.5rem;color:#4a5068;font-size:.85rem}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #dde1e9;border-top-color:#4a9fd4;border-radius:50%;animation:spin .7s linear infinite;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── TABLA DE CONTACTOS ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th{background:#dce8f7;padding:.35rem .8rem;text-align:left;font-weight:700;color:#1a2035;border-bottom:2px solid #c8d9f0;white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:#cfe0f5}
.sort-arrow{font-size:.7rem;color:#8a90a0;margin-left:.25rem}
th.sort-active .sort-arrow{color:#1a3a6b}
td{padding:.32rem .8rem;border-bottom:1px solid #eef2f8;color:#1a2035;vertical-align:middle}
tr:hover td{background:#f8faff}
tr:last-child td{border-bottom:none}
.email-link{color:#1a3a6b;font-weight:600;text-decoration:underline}
.email-link:hover{color:#0d1b3e}
.wa-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#059669;flex-shrink:0;transition:.15s}
.wa-btn:hover{background:#047857}
.wa-btn svg{width:12px;height:12px;fill:#fff}
.row-actions{display:flex;gap:.2rem}
.row-actions button{background:none;border:none;cursor:pointer;font-size:.78rem;color:#8a90a0;padding:.2rem .35rem;border-radius:4px}
.row-actions button:hover{background:#f0f4ff;color:#1a3a6b}

/* ── INDICADOR DE NOTAS ── */
.notas-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;transition:.15s;flex-shrink:0}
.notas-btn.tiene{background:#059669}
.notas-btn.tiene:hover{background:#047857}
.notas-btn.vacia{background:#dc2626;cursor:default}
.notas-btn svg{width:11px;height:11px;fill:#fff}
.notas-modal-text{font-size:.88rem;line-height:1.6;color:#1a2035;white-space:pre-wrap;word-break:break-word}

@media(max-width:700px){
  .page{padding:.85rem}
  .form-grid{grid-template-columns:1fr}
  .form-grid .form-group.full{grid-column:1}
  table{font-size:.78rem}
  th,td{padding:.45rem .55rem}
}
</style>
</head>
<body>

<div class="page">

  <div class="card">
    <div class="card-head">
      👤 Directorio de Contactos
      <button class="btn btn-primary btn-sm" onclick="openContactoModal(null)">+ Nuevo contacto</button>
    </div>
    <div class="card-body">

      <div class="alert-box" id="empty-alert" style="display:none">
        💡 Aún no tienes contactos. Crea el primero con <strong>+ Nuevo contacto</strong>.
      </div>
      <div class="alert-box" id="error-alert" style="display:none;border-color:#fecaca;border-left-color:#dc2626;background:#fef2f2">
        ⚠️ No se pudo conectar con el servidor (puede tardar unos segundos en "despertar"). <button class="btn btn-secondary btn-sm" onclick="loadContactos()">Reintentar</button>
      </div>

      <div class="filters">
        <input class="filter-input" type="text" placeholder="Buscar por nombre o empresa..." oninput="actualizarFiltro('q', this.value)">
        <select class="filter-select" onchange="actualizarFiltro('tipo', this.value)">
          <option value="">Tipo</option>
          <option>Persona</option>
          <option>Empresa</option>
        </select>
        <select class="filter-select" onchange="actualizarFiltro('status', this.value)">
          <option value="">Status</option>
          <option>Lead</option>
          <option>Prospecto</option>
          <option>Cliente</option>
          <option>Inactivo</option>
        </select>
        <div id="loadingTag" class="loading" style="display:none;padding:0"><span class="spinner"></span>Cargando...</div>
      </div>

      <div class="table-wrap">
        <table id="contactosTabla"></table>
      </div>

    </div>
  </div>

</div>

<!-- Modal Contacto -->
<div class="modal-backdrop" id="modal-contacto">
  <div class="modal">
    <div class="modal-head"><h3 id="contactoModalTitle">👤 Nuevo Contacto</h3><button class="modal-close" onclick="closeModal('modal-contacto')">✕</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group full">
          <label>Tipo</label>
          <div class="radio-row">
            <label><input type="radio" name="co-tipo" value="Persona" checked> Persona física</label>
            <label><input type="radio" name="co-tipo" value="Empresa"> Empresa</label>
          </div>
        </div>
        <div class="form-group full"><label>Nombre *</label><input type="text" id="co-nombre" placeholder="Nombre completo o razón social"></div>
        <div class="form-group"><label>Empresa</label><input type="text" id="co-empresa" placeholder="Empresa donde trabaja"></div>
        <div class="form-group"><label>Cargo</label><input type="text" id="co-cargo" placeholder="Director, Gerente, etc."></div>
        <div class="form-group"><label>WhatsApp</label><input type="tel" id="co-whatsapp" placeholder="+52 55 1234 5678"></div>
        <div class="form-group"><label>Email</label><input type="email" id="co-email" placeholder="correo@empresa.com"></div>
        <div class="form-group"><label>Teléfono</label><input type="tel" id="co-telefono" placeholder="+52 55 1234 5678"></div>
        <div class="form-group"><label>LinkedIn</label><input type="url" id="co-linkedin" placeholder="linkedin.com/in/..."></div>
        <div class="form-group"><label>Status</label>
          <select id="co-status"><option>Lead</option><option>Prospecto</option><option>Cliente</option><option>Inactivo</option></select>
        </div>
        <div class="form-group"><label>Tags</label><input type="text" id="co-tags" placeholder="Ej: clave,decisor"></div>
        <div class="form-group full"><label>Notas</label><textarea id="co-notas" rows="2" placeholder="Notas adicionales..."></textarea></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger btn-sm" id="co-delete-btn" style="display:none;margin-right:auto" onclick="deleteContacto()">Eliminar contacto</button>
      <button class="btn btn-secondary" onclick="closeModal('modal-contacto')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveContacto()">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal Ver Nota -->
<div class="modal-backdrop" id="modal-vernota">
  <div class="modal" style="max-width:420px">
    <div class="modal-head"><h3 id="vernotaTitle">📝 Nota</h3><button class="modal-close" onclick="closeModal('modal-vernota')">✕</button></div>
    <div class="modal-body">
      <div class="notas-modal-text" id="vernotaTexto"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal('modal-vernota')">Cerrar</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════
const N8N_BASE = 'https://138.197.139.75.nip.io/webhook';
const CONTACTOS_ENDPOINT = '/crm-contactos';

let ITEMS = []; // todos los contactos cargados
let editingId = null;
let filtro = { q: '', tipo: '', status: '' };
let sortCol = null;   // columna activa de ordenamiento (null = sin ordenar / orden de llegada)
let sortDir = 'asc';  // 'asc' | 'desc'

// ═══════════════════════════════════════
// API
// ═══════════════════════════════════════
async function apiCall(body){
  try{
    const controller = new AbortController();
    const timeout = setTimeout(()=>controller.abort(), 25000); // n8n + Google Sheets a veces tardan más de 8s, sobre todo en "cold start"
    const res = await fetch(`${N8N_BASE}${CONTACTOS_ENDPOINT}`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body),
      signal: controller.signal
    });
    clearTimeout(timeout);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  }catch(e){
    console.error('Contactos API error:', e);
    return null; // null = "no sabemos qué pasó" (puede que sí se haya guardado del lado del servidor aunque el navegador no alcanzó a leer la respuesta)
  }
}

function genId(prefix){ return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,6)}`; }
function escHtml(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showToast(msg, tipo='ok'){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:1.5rem;right:1.5rem;padding:.65rem 1.1rem;border-radius:8px;font-size:.83rem;font-weight:600;z-index:999;transition:.3s;font-family:Manrope,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.15)';
    document.body.appendChild(t);
  }
  t.style.background = tipo === 'ok' ? '#059669' : '#dc2626';
  t.style.color = '#fff';
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 2800);
}

// ═══════════════════════════════════════
// CARGA INICIAL
// ═══════════════════════════════════════
async function loadContactos(){
  document.getElementById('loadingTag').style.display = 'flex';
  document.getElementById('error-alert').style.display = 'none';
  const res = await apiCall({ accion: 'get' });
  document.getElementById('loadingTag').style.display = 'none';

  if(res === null){
    // No llegó respuesta (timeout, red caída, etc.) — no asumimos que el Sheet está vacío, avisamos.
    document.getElementById('error-alert').style.display = 'block';
    document.getElementById('empty-alert').style.display = 'none';
    document.getElementById('contactosTabla').innerHTML = '';
    return;
  }

  // Filtra la fila fantasma de encabezados que a veces n8n devuelve como si fuera un registro
  const limpio = (Array.isArray(res) ? res : []).filter(r => r.ID && r.ID !== 'ID');
  ITEMS = limpio.map(normalizeItem);
  renderAll();
}

function toStr(v){ return (v === null || v === undefined) ? '' : String(v); }

function normalizeItem(raw){
  // Google Sheets devuelve como NÚMERO cualquier columna que solo tenga dígitos (ID, WhatsApp, Telefono, Tags...),
  // así que forzamos todo a string aquí — si no, cosas como WhatsApp.replace() truenan más adelante.
  return {
    ID: toStr(raw.ID || raw.id),
    Tipo: toStr(raw.Tipo) || 'Persona',
    Nombre: toStr(raw.Nombre) || '(sin nombre)',
    Empresa: toStr(raw.Empresa),
    Cargo: toStr(raw.Cargo),
    WhatsApp: toStr(raw.WhatsApp),
    Email: toStr(raw.Email),
    Telefono: toStr(raw.Telefono),
    LinkedIn: toStr(raw.LinkedIn),
    Status: toStr(raw.Status) || 'Lead',
    Tags: toStr(raw.Tags),
    Notas: toStr(raw.Notas)
  };
}

// ═══════════════════════════════════════
// FILTROS — un solo estado combinado (texto + tipo + status), todos aplican juntos
// ═══════════════════════════════════════
function actualizarFiltro(campo, valor){
  filtro[campo] = valor;
  renderContactos();
}

function contactosFiltrados(){
  const q = filtro.q.toLowerCase();
  return ITEMS.filter(c => {
    if(filtro.tipo && c.Tipo !== filtro.tipo) return false;
    if(filtro.status && c.Status !== filtro.status) return false;
    if(q && !(c.Nombre.toLowerCase().includes(q) || c.Empresa.toLowerCase().includes(q))) return false;
    return true;
  });
}

// ── Ordenamiento por columna: clic en un encabezado ordena asc, otro clic en el mismo lo invierte a desc ──
// Las columnas WhatsApp y Correo no son ordenables (son de acción, no de datos a comparar).
function toggleSort(col){
  if(sortCol === col){ sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
  else { sortCol = col; sortDir = 'asc'; }
  renderContactos();
}

function sortArrow(col){
  if(sortCol !== col) return '⇕';
  return sortDir === 'asc' ? '↑' : '↓';
}

function aplicarOrden(lista){
  if(!sortCol) return lista;
  const copia = [...lista];
  copia.sort((a, b) => {
    const va = (a[sortCol] || '').toString().toLowerCase();
    const vb = (b[sortCol] || '').toString().toLowerCase();
    const cmp = va.localeCompare(vb, 'es');
    return sortDir === 'asc' ? cmp : -cmp;
  });
  return copia;
}

function renderAll(){
  document.getElementById('empty-alert').style.display = ITEMS.length ? 'none' : 'block';
  renderContactos();
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
const BADGE_STATUS = { 'Lead':'badge-gray','Prospecto':'badge-blue','Cliente':'badge-green','Inactivo':'badge-gray' };

function renderContactos(){
  const tabla = document.getElementById('contactosTabla');
  const lista = aplicarOrden(contactosFiltrados());

  if(!ITEMS.length){
    tabla.innerHTML = '';
    return;
  }

  // Nombre..Status son ordenables y van primero; WhatsApp/Correo son de acción (no ordenan);
  // Tags va al final, después de Correo, y sí ordena.
  const cols = [
    { key:'Nombre', label:'Nombre' },
    { key:'Tipo', label:'Tipo' },
    { key:'Empresa', label:'Empresa' },
    { key:'Cargo', label:'Cargo' },
    { key:'Status', label:'Status' }
  ];
  let theadHtml = '<thead><tr>';
  cols.forEach(c => {
    const activa = sortCol === c.key ? 'sort-active' : '';
    theadHtml += `<th class="sortable ${activa}" onclick="toggleSort('${c.key}')">${c.label} <span class="sort-arrow">${sortArrow(c.key)}</span></th>`;
  });
  theadHtml += '<th>WhatsApp</th><th>Correo</th>';
  theadHtml += '<th>Notas</th>';
  const tagsActiva = sortCol === 'Tags' ? 'sort-active' : '';
  theadHtml += `<th class="sortable ${tagsActiva}" onclick="toggleSort('Tags')">Tags <span class="sort-arrow">${sortArrow('Tags')}</span></th>`;
  theadHtml += '<th></th></tr></thead>';

  if(!lista.length){
    tabla.innerHTML = theadHtml + `<tbody><tr><td colspan="10"><div class="empty-state"><span>🔍</span>Nadie coincide con ese filtro</div></td></tr></tbody>`;
    return;
  }

  const filas = lista.map(c => {
    const badgeClass = BADGE_STATUS[c.Status] || 'badge-gray';
    const waCell = c.WhatsApp
      ? `<div style="display:flex;align-items:center;gap:.45rem"><a href="https://wa.me/${c.WhatsApp.replace(/[^0-9]/g,'')}" target="_blank" rel="noopener" class="wa-btn" title="Abrir WhatsApp"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></a><span>${escHtml(c.WhatsApp)}</span></div>`
      : (c.Telefono ? escHtml(c.Telefono) : '-');
    const correoCell = c.Email ? `<a href="mailto:${escHtml(c.Email)}" class="email-link">${escHtml(c.Email)}</a>` : '-';
    const notasCell = c.Notas
      ? `<button class="notas-btn tiene" title="Ver nota" onclick="verNota('${c.ID}')"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H6l-2 2V4zm2 2v9.17L6.83 14H18V6H6z"/></svg></button>`
      : `<span class="notas-btn vacia" title="Sin nota"></span>`;

    return `<tr>
      <td><strong>${escHtml(c.Nombre)}</strong></td>
      <td><span class="badge badge-purple">${escHtml(c.Tipo)}</span></td>
      <td>${escHtml(c.Empresa) || '-'}</td>
      <td>${escHtml(c.Cargo) || '-'}</td>
      <td><span class="badge ${badgeClass}">${escHtml(c.Status)}</span></td>
      <td>${waCell}</td>
      <td>${correoCell}</td>
      <td>${notasCell}</td>
      <td>${escHtml(c.Tags) || '-'}</td>
      <td><div class="row-actions">
        <button onclick="openContactoModal('${c.ID}')" title="Editar">✏️</button>
        <button onclick="deleteContacto('${c.ID}')" title="Eliminar">✕</button>
      </div></td>
    </tr>`;
  }).join('');

  tabla.innerHTML = theadHtml + `<tbody>${filas}</tbody>`;
}

function verNota(id){
  const item = ITEMS.find(i => i.ID === id);
  if(!item || !item.Notas) return;
  document.getElementById('vernotaTitle').textContent = `📝 Nota — ${item.Nombre}`;
  document.getElementById('vernotaTexto').textContent = item.Notas;
  document.getElementById('modal-vernota').classList.add('open');
}

// ═══════════════════════════════════════
// MODAL — crear / editar / eliminar
// ═══════════════════════════════════════
function openContactoModal(idToEdit){
  editingId = idToEdit || null;
  const item = editingId ? ITEMS.find(i => i.ID === editingId) : null;

  document.getElementById('contactoModalTitle').textContent = item ? '👤 Editar Contacto' : '👤 Nuevo Contacto';
  document.getElementById('co-delete-btn').style.display = item ? 'inline-flex' : 'none';

  const tipoVal = item ? item.Tipo : 'Persona';
  document.querySelectorAll('input[name="co-tipo"]').forEach(r => { r.checked = (r.value === tipoVal); });

  document.getElementById('co-nombre').value = item ? item.Nombre : '';
  document.getElementById('co-empresa').value = item ? item.Empresa : '';
  document.getElementById('co-cargo').value = item ? item.Cargo : '';
  document.getElementById('co-whatsapp').value = item ? item.WhatsApp : '';
  document.getElementById('co-email').value = item ? item.Email : '';
  document.getElementById('co-telefono').value = item ? item.Telefono : '';
  document.getElementById('co-linkedin').value = item ? item.LinkedIn : '';
  document.getElementById('co-status').value = item ? item.Status : 'Lead';
  document.getElementById('co-tags').value = item ? item.Tags : '';
  document.getElementById('co-notas').value = item ? item.Notas : '';

  document.getElementById('modal-contacto').classList.add('open');
}

async function saveContacto(){
  const nombre = document.getElementById('co-nombre').value.trim();
  if(!nombre){ showToast('El nombre es obligatorio', 'err'); return; }

  const item = {
    ID: editingId || genId('C'),
    Tipo: document.querySelector('input[name="co-tipo"]:checked').value,
    Nombre: nombre,
    Empresa: document.getElementById('co-empresa').value.trim(),
    Cargo: document.getElementById('co-cargo').value.trim(),
    WhatsApp: document.getElementById('co-whatsapp').value.trim(),
    Email: document.getElementById('co-email').value.trim(),
    Telefono: document.getElementById('co-telefono').value.trim(),
    LinkedIn: document.getElementById('co-linkedin').value.trim(),
    Status: document.getElementById('co-status').value,
    Tags: document.getElementById('co-tags').value.trim(),
    Notas: document.getElementById('co-notas').value.trim()
  };

  // Cierra el modal de inmediato (ya validado) para que no se generen duplicados con varios clics
  closeModal('modal-contacto');
  showToast('⏳ Guardando...');

  const res = await apiCall({ accion: editingId ? 'update' : 'create', ...item });

  if(res){
    if(editingId){
      const idx = ITEMS.findIndex(i => i.ID === editingId);
      ITEMS[idx] = item;
    }else{
      ITEMS.unshift(item);
    }
    renderAll();
    showToast('✅ Contacto guardado');
  }else{
    showToast('⚠️ No hubo confirmación — recarga para verificar si sí se guardó', 'err');
  }
}

async function deleteContacto(id){
  const targetId = id || editingId;
  if(!targetId) return;
  if(!confirm('¿Eliminar este contacto?')) return;

  const res = await apiCall({ accion: 'delete', ID: targetId });
  closeModal('modal-contacto');

  if(res){
    ITEMS = ITEMS.filter(i => i.ID !== targetId);
    renderAll();
    showToast('Contacto eliminado');
  }else{
    showToast('No se pudo eliminar — revisa tu conexión', 'err');
  }
}

function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-backdrop').forEach(m => {
  m.addEventListener('click', e => { if(e.target === m) m.classList.remove('open'); });
});

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
document.addEventListener('DOMContentLoaded', loadContactos);
</script>
</body>
</html>
