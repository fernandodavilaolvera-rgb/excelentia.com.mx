<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive · Archivos — ExcelentIA</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/fernandodavilaolvera-rgb/excelentia.com.mx/main/assets/ExcelentiA_favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:#f5f6f8;color:#1a2035;min-height:100vh;font-size:15px}

/* ── SHELL ── */
.page{padding:1.25rem 1.5rem;max-width:1100px;margin:0 auto}
.layout{display:grid;grid-template-columns:270px 1fr;gap:1rem;align-items:start}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem}
.toolbar h2{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:.4rem}
.resumen-pill{background:#fff;border:1px solid #dde1e9;border-radius:20px;padding:.35rem .9rem;font-size:.8rem;color:#4a5068;display:flex;align-items:center;gap:.4rem;white-space:nowrap}
.resumen-pill strong{color:#1a3a6b}

/* ── BOTONES ── */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .95rem;border-radius:8px;font-size:.83rem;font-weight:700;cursor:pointer;transition:.2s;border:none;font-family:'Manrope',sans-serif;text-decoration:none}
.btn-primary{background:#1a3a6b;color:#fff}.btn-primary:hover{background:#0d1b3e}
.btn-secondary{background:#f0f4ff;color:#1a3a6b;border:1px solid #c8d9f0}.btn-secondary:hover{background:#dce8f7}
.btn-danger{background:#fee2e2;color:#991b1b}.btn-danger:hover{background:#fecaca}
.btn-sm{padding:.32rem .6rem;font-size:.75rem}
.btn-icon{padding:.32rem .42rem;border-radius:6px;width:26px;height:26px;justify-content:center}
.btn-icon.copiado{background:#d1fae5;color:#065f46;border-color:#6ee7b7}

/* ── CARD ── */
.card{background:#fff;border:1px solid #dde1e9;border-radius:12px;overflow:hidden}
.card-head{background:#dce8f7;padding:.75rem 1rem;font-weight:700;font-size:.9rem;color:#1a2035;display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.card-body{padding:1rem}

/* ── PANEL IZQUIERDO ── */
.side{position:sticky;top:1rem}
.side-body{padding:.6rem}
.side-search{width:100%;padding:.45rem .65rem;border:1px solid #dde1e9;border-radius:8px;font-family:'Manrope',sans-serif;font-size:.8rem;color:#1a2035;background:#fff;margin-bottom:.45rem}
.side-search:focus{outline:none;border-color:#4a9fd4;box-shadow:0 0 0 3px rgba(74,159,212,.12)}
.proj-list{max-height:62vh;overflow-y:auto;display:flex;flex-direction:column;gap:.05rem}
.proj-item{display:flex;align-items:center;gap:.45rem;padding:.24rem .5rem;border-radius:7px;cursor:pointer;transition:.15s;border:1px solid transparent;line-height:1.2}
.proj-item:hover{background:#e8f0fb}
.proj-item.active{background:#1a3a6b;border-color:#1a3a6b}
.proj-item.active .proj-nombre,.proj-item.active .proj-empresa{color:#fff}
.proj-item.active .proj-count{background:rgba(255,255,255,.22);color:#fff}
.proj-txt{flex:1;min-width:0}
.proj-nombre{font-size:.8rem;font-weight:700;color:#1a2035;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.proj-empresa{font-size:.67rem;color:#8a90a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15;margin-top:-.03rem}
.proj-count{background:#eef4fc;color:#1a3a6b;font-size:.66rem;font-weight:800;padding:.05rem .38rem;border-radius:10px;flex-shrink:0;line-height:1.35}
.proj-sep{height:1px;background:#dde1e9;margin:.32rem .2rem}
.proj-acc{display:flex;align-items:center;gap:.35rem;padding:.3rem .5rem;margin-top:.15rem;border-radius:7px;cursor:pointer;font-size:.66rem;font-weight:800;color:#8a90a0;text-transform:uppercase;letter-spacing:.3px;transition:.15s;user-select:none}
.proj-acc:hover{background:#e8f0fb;color:#1a3a6b}
.proj-acc .flecha{font-size:.55rem;width:9px}
.proj-acc .n{margin-left:auto;background:#eef4fc;color:#1a3a6b;font-size:.62rem;font-weight:800;padding:.03rem .35rem;border-radius:10px;text-transform:none;letter-spacing:0}
.side-vacio{font-size:.75rem;color:#8a90a0;padding:.5rem .3rem;text-align:center}

/* ── ACCIONES DE ARCHIVOS ── */
.arch-actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.55rem;align-items:center}
.quien-sube{display:flex;align-items:center;gap:.35rem;font-size:.78rem;font-weight:700;color:#4a5068;background:#f0f6ff;border:1px solid #c8d9f0;border-radius:8px;padding:.25rem .5rem}
.quien-sube select{border:none;background:transparent;font-family:'Manrope',sans-serif;font-size:.79rem;font-weight:700;color:#1a3a6b;cursor:pointer;padding:.15rem .1rem}
.quien-sube select:focus{outline:none}
.quien-sube.sin-autor{background:#fffbeb;border-color:#fde68a}
.quien-sube.sin-autor select{color:#92400e}
.parpadeo{animation:parpadeo .4s ease-in-out 3}
@keyframes parpadeo{50%{background:#fde68a;border-radius:6px}}

/* ── FORM LIGAR ── */
.arch-ligar{background:#f0f6ff;border:1px solid #c8d9f0;border-left:4px solid #4a9fd4;border-radius:8px;padding:.75rem;margin-bottom:.85rem;display:none;flex-direction:column;gap:.5rem;max-width:720px}
.arch-ligar.open{display:flex}
.arch-ligar .row{display:flex;gap:.5rem;flex-wrap:wrap}
.arch-ligar input{flex:1 1 180px;min-width:0;padding:.5rem .7rem;border:1px solid #dde1e9;border-radius:8px;font-family:'Manrope',sans-serif;font-size:.83rem;color:#1a2035;background:#fff}
.arch-ligar input:focus{outline:none;border-color:#4a9fd4;box-shadow:0 0 0 3px rgba(74,159,212,.12)}

/* ── BUSCADOR DE ARCHIVOS ── */
.file-search-wrap{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;max-width:720px}
.file-search{flex:1;min-width:0;padding:.55rem .75rem;border:1px solid #dde1e9;border-radius:8px;font-family:'Manrope',sans-serif;font-size:.83rem;color:#1a2035;background:#fff}
.file-search:focus{outline:none;border-color:#4a9fd4;box-shadow:0 0 0 3px rgba(74,159,212,.12)}
.scope-tag{font-size:.68rem;font-weight:700;color:#4a5068;background:#eef4fc;border:1px solid #c8d9f0;border-radius:20px;padding:.25rem .6rem;white-space:nowrap}

/* ── NOTA DE LOS 15 ── */

/* ── TABLA DE ARCHIVOS ── */
.tabla-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:860px;border:1px solid #dde1e9;border-radius:8px}
.arch-tabla{width:100%;border-collapse:collapse;font-size:.8rem}
.arch-tabla thead th{text-align:left;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#8a90a0;background:#f8fafd;padding:.4rem .6rem;border-bottom:1px solid #dde1e9;white-space:nowrap}
.th-orden{cursor:pointer;user-select:none;transition:.15s}
.th-orden:hover{background:#eef4fc;color:#1a3a6b}
.orden-ico{font-size:.6rem;opacity:.3;margin-left:.15rem}
.orden-ico.activo{opacity:1;color:#1a3a6b;font-size:.65rem}
.arch-tabla tbody tr{border-bottom:1px solid #eef2f8;transition:.12s}
.arch-tabla tbody tr:last-child{border-bottom:none}
.arch-tabla tbody tr:hover{background:#e8f0fb}
.arch-tabla td{padding:.28rem .6rem;vertical-align:middle}
.arch-tabla .btn-icon{width:24px;height:24px;padding:.22rem}
.td-nombre{display:flex;align-items:center;gap:.45rem;min-width:0}
.td-ico{font-size:.95rem;line-height:1;flex-shrink:0;cursor:help}
.td-nom{font-weight:700;color:#1a2035;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:var(--w-nom,340px)}

/* ── COLUMNA NOMBRE AJUSTABLE ── */
.th-nombre{position:relative}
.resize-grip{position:absolute;top:0;right:0;width:8px;height:100%;cursor:col-resize;user-select:none;touch-action:none;z-index:2}
.resize-grip::after{content:'';position:absolute;top:20%;bottom:20%;right:3px;width:2px;background:#dde1e9;border-radius:2px;transition:.15s}
.th-nombre:hover .resize-grip::after,.resize-grip.activo::after{background:#4a9fd4}
body.resizing{cursor:col-resize;user-select:none}

/* ── PILL DE QUIÉN SUBIÓ ── */
.td-autor{width:1%;white-space:nowrap}
.autor-pill{display:inline-flex;align-items:center;gap:.25rem;font-size:.66rem;font-weight:800;color:#fff;border-radius:10px;padding:.08rem .45rem;line-height:1.35;white-space:nowrap}
.autor-pill.sin{background:#f5f6f8;color:#8a90a0;border:1px solid #dde1e9;font-weight:700}
.col-proy{width:1%;white-space:nowrap}
.col-fecha{width:1%;white-space:nowrap;color:#8a90a0;font-size:.75rem}
.col-acc{width:1%;white-space:nowrap}
.acc-wrap{display:flex;gap:.3rem;justify-content:flex-end}
.arch-proj{font-size:.68rem;font-weight:700;color:#1a3a6b;background:#eef4fc;border:1px solid #c8d9f0;border-radius:10px;padding:.1rem .45rem;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:.2rem;vertical-align:middle}
.arch-proj:hover{background:#dce8f7;border-color:#4a9fd4;color:#0d1b3e}
.arch-proj.sin{color:#8a90a0;background:#f5f6f8;border-color:#dde1e9}
.arch-proj.sin:hover{background:#eef4fc;border-color:#4a9fd4;color:#1a3a6b}

/* ── ESTADOS ── */
.empty-state{text-align:center;padding:2.5rem 1rem;color:#8a90a0}
.empty-state span{font-size:2rem;display:block;margin-bottom:.5rem}
.loading{text-align:center;padding:1.5rem;color:#4a5068;font-size:.85rem}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #dde1e9;border-top-color:#4a9fd4;border-radius:50%;animation:spin .7s linear infinite;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── URLs DE INTERÉS ── */
.sep-sec{height:1px;background:#dde1e9;margin:1.75rem 0 1.25rem}
.urls-wrap{max-width:820px;margin:0 auto}
.url-form{background:#f0f6ff;border:1px solid #c8d9f0;border-left:4px solid #4a9fd4;border-radius:8px;padding:.85rem;margin-bottom:.9rem;display:none;flex-direction:column;gap:.55rem;max-width:720px}
.url-form.open{display:flex}
.url-form .row{display:flex;gap:.5rem;flex-wrap:wrap}
.url-form input,.url-form select{flex:1 1 180px;min-width:0;padding:.5rem .7rem;border:1px solid #dde1e9;border-radius:8px;font-family:'Manrope',sans-serif;font-size:.83rem;color:#1a2035;background:#fff}
.url-form input:focus,.url-form select:focus{outline:none;border-color:#4a9fd4;box-shadow:0 0 0 3px rgba(74,159,212,.12)}
.url-form .foot{display:flex;justify-content:flex-end;gap:.5rem}

.url-filtros{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.85rem}
.url-fchip{cursor:pointer;font-size:.75rem;font-weight:700;padding:.3rem .65rem;border-radius:20px;background:#fff;border:1px solid #dde1e9;color:#4a5068;transition:.15s}
.url-fchip:hover{border-color:#4a9fd4;color:#1a3a6b}
.url-fchip.active{background:#1a3a6b;color:#fff;border-color:#1a3a6b}

.url-grupo{margin-bottom:1rem}
.url-grupo:last-child{margin-bottom:0}
.url-grupo-tit{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#8a90a0;margin-bottom:.4rem;padding-left:.2rem}
.url-item{display:flex;align-items:center;gap:.6rem;padding:.6rem .3rem;border-bottom:1px solid #eef2f8}
.url-item:last-child{border-bottom:none}
.url-ico{width:34px;height:34px;border-radius:8px;background:#ede9fe;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.url-info{flex:1;min-width:0}
.url-nombre{font-size:.85rem;font-weight:700;color:#1a2035;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.url-link{font-size:.72rem;color:#4a9fd4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;text-decoration:none}
.url-link:hover{text-decoration:underline}
.url-notas{font-size:.72rem;color:#8a90a0;margin-top:.1rem}
.url-acc{display:flex;gap:.35rem;flex-shrink:0}

/* ── RESPONSIVE ── */
@media(max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .proj-list{max-height:230px}
}
@media(max-width:600px){
  .page{padding:1rem}
  .toolbar{flex-direction:column;align-items:flex-start}
  .arch-actions .btn{flex:1 1 auto;justify-content:center}
  .file-search-wrap{flex-direction:column;align-items:stretch}
  .scope-tag{align-self:flex-start}
  .url-form input,.url-form select{flex:1 1 100%}
  .arch-proj{max-width:130px}
  .arch-tabla{min-width:520px;--w-nom:180px !important}
  .resize-grip{display:none}
  .td-autor{display:none}
  .th-autor{display:none}
}
</style>
</head>
<body>

<main class="page">

  <div class="layout">

    <!-- ══════════ PANEL IZQUIERDO ══════════ -->
    <aside class="card side">
      <div class="card-head"><span>Proyectos</span></div>
      <div class="side-body">
        <input type="text" class="side-search" id="buscar-proyecto" placeholder="🔍 Buscar proyecto..." oninput="renderProyectos()">
        <div class="proj-list" id="proj-list">
          <div class="loading"><span class="spinner"></span></div>
        </div>
      </div>
    </aside>

    <!-- ══════════ CONTENIDO ══════════ -->
    <section class="card">
      <div class="card-head">
        <span id="panel-nombre">📁 Todos los archivos</span>
        <button class="btn btn-secondary btn-sm" onclick="abrirCarpetaDrive()" title="Abrir la carpeta en Google Drive">📁 Abrir en Drive</button>
      </div>
      <div class="card-body">

        <div class="arch-actions">
          <button class="btn btn-primary btn-sm" onclick="seleccionarArchivo()">📤 Subir archivo</button>
          <button class="btn btn-secondary btn-sm" onclick="toggleLigar()">🔗 Ligar link de Drive</button>
          <label class="quien-sube" title="Quién queda registrado como autor del archivo">
            <span>Sube:</span>
            <select id="arch-autor" onchange="fijarAutor(this.value)">
              <option value="">— Elige quién —</option>
              <option value="fernando">Fernando</option>
              <option value="juanjose">Juan José</option>
              <option value="adolfo">Adolfo</option>
            </select>
          </label>
          <input type="file" id="arch-file" style="display:none" onchange="subirArchivo(this)">
        </div>

        <div class="arch-ligar" id="arch-ligar">
          <div class="row">
            <input type="url" id="arch-link-url" placeholder="https://drive.google.com/...">
            <input type="text" id="arch-link-nombre" placeholder="Nombre (opcional)">
          </div>
          <div style="text-align:right">
            <button class="btn btn-primary btn-sm" onclick="ligarLink()">Ligar link</button>
          </div>
        </div>

        <div class="file-search-wrap">
          <input type="text" class="file-search" id="buscar-archivo" placeholder="🔍 Buscar archivo por nombre..." oninput="renderArchivos()">
          <span class="scope-tag" id="scope-tag">en todos los proyectos</span>
        </div>


        <div id="arch-lista">
          <div class="loading"><span class="spinner"></span>Cargando archivos...</div>
        </div>

      </div>
    </section>

  </div>

  <!-- ══════════ URLs DE INTERÉS ══════════ -->
  <div class="sep-sec"></div>

  <div class="urls-wrap">
    <div class="toolbar">
      <h2>🔗 URLs de Interés</h2>
      <span class="resumen-pill">⭐ <strong id="url-total">0</strong>&nbsp;ligas</span>
    </div>

    <div class="card">
      <div class="card-head">
        <span>Favoritos del equipo</span>
        <button class="btn btn-primary btn-sm" onclick="abrirFormUrl()">+ Nueva liga</button>
      </div>
      <div class="card-body">

        <div class="url-form" id="url-form">
          <div class="row">
            <input type="text" id="u-nombre" placeholder="Nombre (ej: CRM ExcelentIA)">
            <input type="url" id="u-url" placeholder="https://...">
          </div>
          <div class="row">
            <input type="text" id="u-categoria" list="u-cats" placeholder="Categoría (ej: Herramientas)">
            <datalist id="u-cats">
              <option value="General"></option>
              <option value="Herramientas"></option>
              <option value="Clientes"></option>
              <option value="Pruebas"></option>
              <option value="Plataformas"></option>
              <option value="Documentación"></option>
            </datalist>
            <input type="text" id="u-notas" placeholder="Nota corta (opcional)">
          </div>
          <div class="foot">
            <button class="btn btn-secondary btn-sm" onclick="cerrarFormUrl()">Cancelar</button>
            <button class="btn btn-primary btn-sm" id="u-guardar" onclick="guardarUrl()">Guardar liga</button>
          </div>
        </div>

        <div class="url-filtros" id="url-filtros"></div>

        <div id="url-lista">
          <div class="loading"><span class="spinner"></span>Cargando ligas...</div>
        </div>
      </div>
    </div>
  </div>

</main>

<script>
// ═══════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════
const N8N_BASE = 'https://n8n.excelentia.com.mx/webhook';
const PROYECTOS_ENDPOINT = '/crm-proyectos';
const ARCHIVOS_ENDPOINT  = '/proyecto-archivos';
const URLS_ENDPOINT      = '/urls-interes';
const MAX_ARCHIVO_MB = 10;
const TOPE_RECIENTES = 15;
const CARPETA_MADRE_DRIVE = 'https://drive.google.com/drive/folders/1PNsI3kgobXoytYpzZtIvEb9kvAPbeHbv';

const USERS = {
  fernando: { nombre:'Fernando',  color:'#1a3a6b' },
  juanjose: { nombre:'Juan José', color:'#7c3aed' },
  adolfo:   { nombre:'Adolfo',    color:'#059669' }
};

// Ancho de la columna Nombre (se recuerda entre sesiones)
const ANCHO_NOMBRE_KEY = 'drive_ancho_nombre';
const ANCHO_NOMBRE_MIN = 140;
let anchoNombre = 0;   // 0 = automático

// Quién sube los archivos (se recuerda entre sesiones, por navegador)
const AUTOR_KEY = 'drive_autor';

let currentUser   = '';
let PROYECTOS     = [];
let ARCHIVOS      = [];      // TODOS los archivos (fuente única de verdad)
let vista         = 'todos'; // 'todos' | 'sin' | <ID de proyecto>
let proyectoActivo = null;
let accSinArchivos = false;  // acordeón "sin archivos": cerrado por default

// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
function toStr(v){ return (v === null || v === undefined) ? '' : String(v); }
function escHtml(s){ return toStr(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return escHtml(s).replace(/'/g,'&#39;'); }
function norm(s){ return toStr(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
function fmtDate(d){
  d = toStr(d);
  if(!d) return '';
  const dt = new Date(d.length===10 ? d+'T12:00:00' : d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function genId(){ return `A-${Date.now()}-${Math.random().toString(36).slice(2,6)}`; }
function urlCarpeta(folderId){
  return toStr(folderId) ? `https://drive.google.com/drive/folders/${toStr(folderId)}` : CARPETA_MADRE_DRIVE;
}
function abrirCarpeta(folderId, ev){
  if(ev) ev.stopPropagation();
  window.open(urlCarpeta(folderId), '_blank', 'noopener');
}

function showToast(msg, tipo='ok'){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:1.5rem;right:1.5rem;padding:.65rem 1.1rem;border-radius:8px;font-size:.83rem;font-weight:600;z-index:999;transition:.3s;font-family:Manrope,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.15)';
    document.body.appendChild(t);
  }
  t.style.background = tipo === 'ok' ? '#059669' : '#dc2626';
  t.style.color = '#fff';
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._h);
  t._h = setTimeout(()=> t.style.opacity = '0', 2600);
}

function iconoPorTipo(tipo, nombre){
  const t = toStr(tipo).toLowerCase();
  const n = toStr(nombre).toLowerCase();
  if(t === 'link') return '🔗';
  if(t.includes('pdf') || n.endsWith('.pdf')) return '📄';
  if(t.includes('image') || /\.(png|jpe?g|gif|webp|svg)$/.test(n)) return '🖼️';
  if(t.includes('sheet') || /\.(xlsx?|csv)$/.test(n)) return '📊';
  if(t.includes('word') || t.includes('opendocument.text') || /\.(docx?|odt)$/.test(n)) return '📝';
  if(t.includes('presentation') || /\.pptx?$/.test(n)) return '📽️';
  if(t.includes('html') || /\.html?$/.test(n)) return '🌐';
  if(/\.(zip|rar|7z)$/.test(n)) return '🗜️';
  return '📎';
}

// API

async function apiProyectos(accion, data = {}){
  try{
    const res = await fetch(`${N8N_BASE}${PROYECTOS_ENDPOINT}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ accion, ...data })
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  }catch(e){ console.error('Error API proyectos:', e); return null; }
}
async function apiArchivos(accion, data = {}){
  try{
    const res = await fetch(`${N8N_BASE}${ARCHIVOS_ENDPOINT}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ accion, ...data })
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const txt = await res.text();
    return txt ? JSON.parse(txt) : null;
  }catch(e){ console.error('Error API archivos:', e); return null; }
}

async function cargarProyectos(){

async function cargarArchivos(){

// PANEL IZQUIERDO

function contarDe(pid){ return ARCHIVOS.filter(a => toStr(a.ProyectoID) === toStr(pid)).length; }
function contarSinProyecto(){ return ARCHIVOS.filter(a => !toStr(a.ProyectoID)).length; }

function renderProyectos(){
  const el = document.getElementById('proj-list');
  if(!el) return;
  const q = norm(document.getElementById('buscar-proyecto').value);

  const coincide = p => norm(p.Nombre).includes(q) || norm(p.Empresa).includes(q);
  const conArch  = PROYECTOS.filter(p => contarDe(p.ID) > 0);
  const sinArch  = PROYECTOS.filter(p => contarDe(p.ID) === 0);

  let html = '';

  // ── BUSCANDO: lista plana, con archivos primero ──
  if(q){
    const hits = [...conArch.filter(coincide), ...sinArch.filter(coincide)];
    html = hits.length
      ? hits.map(p => itemProyecto(toStr(p.ID), '📌 ' + toStr(p.Nombre), toStr(p.Empresa), contarDe(p.ID))).join('')
      : '<div class="side-vacio">Sin coincidencias</div>';
    el.innerHTML = html;
    return;
  }

  // ── VISTA NORMAL ──
  html += itemProyecto('todos', '📁 Todos los archivos', '', ARCHIVOS.length);
  if(contarSinProyecto() > 0){
    html += itemProyecto('sin', '🗂️ Sin proyecto', 'en la carpeta madre', contarSinProyecto());
  }
  html += '<div class="proj-sep"></div>';

  // Con archivos (alfabético, siempre visibles)
  if(conArch.length){
    html += conArch.map(p => itemProyecto(toStr(p.ID), '📌 ' + toStr(p.Nombre), toStr(p.Empresa), contarDe(p.ID))).join('');
  } else {
    html += '<div class="side-vacio">Ningún proyecto tiene archivos todavía</div>';
  }

  // Sin archivos (alfabético, en acordeón). Se abre solo si el activo está adentro.
  if(sinArch.length){
    const activoAdentro = sinArch.some(p => toStr(p.ID) === toStr(vista));
    const abierto = accSinArchivos || activoAdentro;
    html += `<div class="proj-acc" onclick="toggleAccSin()">
      <span class="flecha">${abierto ? '▾' : '▸'}</span>
      <span>Sin archivos</span>
      <span class="n">${sinArch.length}</span>
    </div>`;
    if(abierto){
      html += sinArch.map(p => itemProyecto(toStr(p.ID), '📌 ' + toStr(p.Nombre), toStr(p.Empresa), 0)).join('');
    }
  }

  el.innerHTML = html;
}

function toggleAccSin(){ accSinArchivos = !accSinArchivos; renderProyectos(); }

function itemProyecto(id, nombre, empresa, n){
  const act = (vista === id) ? ' active' : '';
  return `<div class="proj-item${act}" onclick="elegirVista('${escAttr(id)}')">
    <div class="proj-txt">

      ${empresa ? `<div class="proj-empresa">${escHtml(empresa)}</div>` : ''}

}

function elegirVista(id){
  vista = id;
  proyectoActivo = PROYECTOS.find(p => toStr(p.ID) === toStr(id)) || null;

  // Encabezado del panel
  const nom = document.getElementById('panel-nombre');
  if(vista === 'todos'){

  } else if(vista === 'sin'){

// ═══════════════════════════════════════
// ORDENAMIENTO DE LA TABLA
// ═══════════════════════════════════════
let ordenCampo = 'fecha';   // 'nombre' | 'proyecto' | 'fecha'
let ordenDir   = 'desc';    // 'asc' | 'desc'

function ordenarPor(campo){
  if(ordenCampo === campo){
    ordenDir = (ordenDir === 'asc') ? 'desc' : 'asc';
  } else {
    ordenCampo = campo;
    // Texto arranca A→Z; fecha arranca de la más reciente
    ordenDir = (campo === 'fecha') ? 'desc' : 'asc';
  }
  renderArchivos();
}

function valorOrden(a, campo){
  if(campo === 'nombre')   return norm(a.Nombre);
  if(campo === 'proyecto') return norm(toStr(a.Proyecto) || 'Sin proyecto');
  if(campo === 'autor'){
    const u = USERS[toStr(a.SubidoPor)];
    return norm(u ? u.nombre : 'zzz');   // los sin autor se van al final
  }
  return toStr(a.Fecha);   // ISO: el orden alfabético coincide con el cronológico
}

function aplicarOrden(lista){
  const dir = (ordenDir === 'asc') ? 1 : -1;
  return lista.slice().sort((a, b) => {
    const va = valorOrden(a, ordenCampo);
    const vb = valorOrden(b, ordenCampo);
    if(va < vb) return -dir;
    if(va > vb) return  dir;
    return norm(a.Nombre).localeCompare(norm(b.Nombre));   // desempate estable
  });
}

function flechaOrden(campo){
  if(ordenCampo !== campo) return '<span class="orden-ico">⇅</span>';
  return `<span class="orden-ico activo">${ordenDir === 'asc' ? '▲' : '▼'}</span>`;
}

function archivosDeVista(){
  if(vista === 'todos') return ARCHIVOS;
  if(vista === 'sin')   return ARCHIVOS.filter(a => !toStr(a.ProyectoID));
  return ARCHIVOS.filter(a => toStr(a.ProyectoID) === toStr(vista));
}

function renderArchivos(){
  const el   = document.getElementById('arch-lista');

  // Etiqueta de ámbito

  else if(vista === 'sin')   tag.textContent = 'en «Sin proyecto»';
  else                       tag.textContent = 'en este proyecto';

  // Ordenar ANTES de recortar, para que el recorte respete el orden elegido
  lista = aplicarOrden(lista);

  // Recorte a 15 solo en la vista general y sin búsqueda
  const recortar = (vista === 'todos' && !q && lista.length > TOPE_RECIENTES);
  if(recortar) lista = lista.slice(0, TOPE_RECIENTES);

  if(!lista.length){
    el.innerHTML = q
      ? `<div class="empty-state"><span>🔍</span>Ningún archivo coincide con «${escHtml(document.getElementById('buscar-archivo').value)}»</div>`

  }

  const mostrarProy = (vista === 'todos' || vista === 'sin' || q);

  const filas = lista.map(a => {
    const id     = toStr(a.ID);
    const origen = toStr(a.Origen) || 'subido';
    const link   = toStr(a.Link);
    const driveId= toStr(a.DriveFileID);
    const proy   = toStr(a.Proyecto) || 'Sin proyecto';
    const sinP   = !toStr(a.ProyectoID);
    const fecha  = toStr(a.Fecha).slice(0,10);
    const carp   = toStr(a.DriveFolderID);
    const ligado = origen === 'ligado';
    const tipChip= carp
      ? `Abrir la carpeta de «${proy}» en Drive`
      : (sinP ? 'Abrir la carpeta madre «Drive ExcelentIA»'
              : `«${proy}» aún no tiene carpeta propia · abre la carpeta madre`);
    const tipIco = ligado
      ? 'Link ligado · el archivo vive fuera de este módulo. Borrarlo aquí NO toca el original.'
      : 'Archivo subido desde este módulo · al borrarlo puedes mandarlo también a la papelera de Drive.';
    const nombre  = toStr(a.Nombre);
    const esHtml  = !ligado && driveId && /\.html?$/i.test(nombre);
    const puedeDL = !!driveId;
    return `<tr>
      <td class="col-nombre">
        <div class="td-nombre">
          <span class="td-ico" title="${escAttr(tipIco)}">${iconoPorTipo(a.Tipo, a.Nombre)}</span>
          <span class="td-nom" title="${escAttr(a.Nombre)}">${escHtml(a.Nombre)}</span>
        </div>
      </td>
      ${mostrarProy ? `<td class="col-proy"><span class="arch-proj${sinP ? ' sin' : ''}" title="${escAttr(tipChip)}" onclick="abrirCarpeta('${escAttr(carp)}', event)">📁 ${escHtml(proy)}</span></td>` : ''}
      <td class="td-autor">${pillAutor(a.SubidoPor)}</td>
      <td class="col-fecha">${fecha ? fmtDate(fecha) : '—'}</td>
      <td class="col-acc">
        <div class="acc-wrap">
          ${esHtml ? `<button class="btn btn-secondary btn-sm btn-icon" title="Ver la página como se ve en el navegador" onclick="verHtml('${escAttr(driveId)}','${escAttr(nombre)}', event)">👁️</button>` : ''}
          ${puedeDL ? `<button class="btn btn-secondary btn-sm btn-icon" title="Descargar archivo" onclick="descargarArchivo('${escAttr(driveId)}','${escAttr(nombre)}', event)">📥</button>` : ''}
          ${link ? `<a href="${escAttr(link)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm btn-icon" title="Abrir">↗</a>` : ''}
          ${link ? `<button class="btn btn-secondary btn-sm btn-icon" title="Copiar link para compartir" onclick="copiarLink('${escAttr(link)}', event)">📋</button>` : ''}

        </div>

  }).join('');

  el.innerHTML = `<div class="tabla-wrap"><table class="arch-tabla">
    <thead><tr>
      <th class="th-orden th-nombre" onclick="ordenarPor('nombre')" title="Ordenar por nombre">Nombre ${flechaOrden('nombre')}<span class="resize-grip" title="Arrastra para ensanchar · doble clic para ajustar al nombre más largo"></span></th>
      ${mostrarProy ? `<th class="th-orden" onclick="ordenarPor('proyecto')" title="Ordenar por proyecto">Proyecto ${flechaOrden('proyecto')}</th>` : ''}
      <th class="th-autor th-orden" onclick="ordenarPor('autor')" title="Ordenar por quién lo subió">Subió ${flechaOrden('autor')}</th>
      <th class="th-orden" onclick="ordenarPor('fecha')" title="Ordenar por fecha">Fecha ${flechaOrden('fecha')}</th>
      <th></th>
    </tr></thead>
    <tbody>${filas}</tbody>
  </table></div>`;

  aplicarAnchoNombre();
  activarResize();
}

// ═══════════════════════════════════════
// COLUMNA NOMBRE AJUSTABLE
// ═══════════════════════════════════════
function thNombre(){ return document.querySelector('.arch-tabla .th-nombre'); }

function aplicarAnchoNombre(){
  const t = document.querySelector('.arch-tabla');
  if(!t) return;
  if(anchoNombre) t.style.setProperty('--w-nom', anchoNombre + 'px');
  else            t.style.removeProperty('--w-nom');
}

// Ancho visible hoy de la columna (para arrancar el arrastre desde ahí)
function anchoActualNombre(){
  if(anchoNombre) return anchoNombre;
  const n = document.querySelector('.arch-tabla .td-nom');
  return n ? Math.round(n.getBoundingClientRect().width) : 340;
}

function guardarAnchoNombre(){
  try{ localStorage.setItem(ANCHO_NOMBRE_KEY, String(anchoNombre)); }catch(e){}
}

function anchoIdealNombre(){
  // Mide el nombre más largo visible y le deja aire para el ícono y el padding
  const nodos = document.querySelectorAll('.arch-tabla .td-nom');
  if(!nodos.length) return 0;
  const cv = document.createElement('canvas').getContext('2d');
  cv.font = '700 12px Manrope, sans-serif';   // coincide con el .8rem de la tabla
  let max = 0;
  nodos.forEach(n => { max = Math.max(max, cv.measureText(n.getAttribute('title') || n.textContent || '').width); });
  const wrap = document.querySelector('.tabla-wrap');
  const tope = wrap ? Math.round(wrap.clientWidth * 0.7) : 600;
  return Math.min(Math.max(tope, ANCHO_NOMBRE_MIN), Math.max(ANCHO_NOMBRE_MIN, Math.round(max) + 24));
}

function activarResize(){
  const th = thNombre();
  if(!th) return;
  const grip = th.querySelector('.resize-grip');
  if(!grip) return;

  // El agarradero no debe disparar el ordenamiento de la columna
  grip.addEventListener('click', e => { e.stopPropagation(); });

  const iniciar = (xInicial) => {
    const anchoInicial = anchoActualNombre();
    grip.classList.add('activo');
    document.body.classList.add('resizing');

    const mover = (x) => {
      anchoNombre = Math.max(ANCHO_NOMBRE_MIN, Math.round(anchoInicial + (x - xInicial)));
      aplicarAnchoNombre();
    };
    const soltar = () => {
      grip.classList.remove('activo');
      document.body.classList.remove('resizing');
      guardarAnchoNombre();
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', soltar);
      document.removeEventListener('touchmove', onTouch);
      document.removeEventListener('touchend', soltar);
    };
    const onMove  = e => mover(e.clientX);
    const onTouch = e => { if(e.touches[0]){ e.preventDefault(); mover(e.touches[0].clientX); } };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', soltar);
    document.addEventListener('touchmove', onTouch, { passive:false });
    document.addEventListener('touchend', soltar);
  };

  grip.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); iniciar(e.clientX); });
  grip.addEventListener('touchstart', e => {
    if(!e.touches[0]) return;
    e.preventDefault(); e.stopPropagation();
    iniciar(e.touches[0].clientX);
  }, { passive:false });

  // Doble clic en el agarradero: ajustar al nombre más largo
  grip.addEventListener('dblclick', e => {
    e.preventDefault(); e.stopPropagation();
    anchoNombre = anchoIdealNombre();
    aplicarAnchoNombre();
    guardarAnchoNombre();
    showToast('Columna ajustada al nombre más largo');
  });
}

function pillAutor(quien){
  const k = toStr(quien);
  const u = USERS[k];
  if(!u) return `<span class="autor-pill sin" title="No quedó registrado quién lo subió">—</span>`;
  return `<span class="autor-pill" style="background:${u.color}" title="Subido por ${escAttr(u.nombre)}">${escHtml(u.nombre)}</span>`;
}

// Copia el link del archivo al portapapeles.
// Usa la API moderna y, si el navegador la bloquea (pasa en iframes y en
// Safari viejo), cae al método clásico del textarea invisible.
async function copiarLink(link, ev){
  if(ev) ev.stopPropagation();
  const btn = ev ? ev.currentTarget : null;   // se captura ANTES del await
  const url = toStr(link);
  if(!url){ showToast('Este archivo no tiene link para compartir', 'err'); return; }

  let ok = false;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(url);
      ok = true;
    }
  }catch(e){ ok = false; }

  if(!ok){
    try{
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){ ok = false; }
  }

  if(ok){
    showToast('✅ Link copiado');
    if(btn){
      const prev = btn.innerHTML;
      btn.innerHTML = '✓';
      btn.classList.add('copiado');
      setTimeout(() => { btn.innerHTML = prev; btn.classList.remove('copiado'); }, 1400);
    }
  } else {
    showToast('No se pudo copiar. Abre con ↗ y copia la URL de la barra.', 'err');
  }
}

// ── Trae el archivo real desde Drive (vía n8n) y lo devuelve como Blob ──
async function bajarBlob(driveFileId){
  const res = await fetch(`${N8N_BASE}${ARCHIVOS_ENDPOINT}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ accion:'descargar', driveFileId: toStr(driveFileId) })
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.blob();
}

// 📥 Descargar: baja el archivo y lo guarda con su nombre real
async function descargarArchivo(driveFileId, nombre, ev){
  if(ev) ev.stopPropagation();
  const btn = ev ? ev.currentTarget : null;   // se captura ANTES del await
  if(!toStr(driveFileId)){
    showToast('Este registro no tiene archivo propio. Ábrelo con ↗', 'err');
    return;
  }
  if(btn){ btn.disabled = true; btn.innerHTML = '⏳'; }
  try{
    const blob = await bajarBlob(driveFileId);
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = toStr(nombre) || 'archivo';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    showToast('✅ Descargando ' + toStr(nombre));
  }catch(e){
    console.error('Descargar:', e);
    showToast('No se pudo descargar. Ábrelo con ↗ desde Drive.', 'err');
  }finally{
    if(btn){ btn.disabled = false; btn.innerHTML = '📥'; }
  }
}

// 👁️ Ver HTML renderizado: Drive muestra el código, así que lo abrimos como página
async function verHtml(driveFileId, nombre, ev){
  if(ev) ev.stopPropagation();
  const btn = ev ? ev.currentTarget : null;
  // La pestaña se abre ANTES del await, si no Safari la bloquea
  const win = window.open('', '_blank');
  if(win){
    win.document.write('<title>Abriendo…</title><body style="font-family:sans-serif;padding:2rem;color:#4a5068">Abriendo ' +
      String(nombre).replace(/[<>&]/g,'') + '…</body>');
  }
  if(btn){ btn.disabled = true; btn.innerHTML = '⏳'; }
  try{
    const raw  = await bajarBlob(driveFileId);
    const blob = new Blob([raw], { type:'text/html;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    if(win){ win.location.href = url; }
    else   { window.open(url, '_blank'); showToast('Si no se abrió, permite las ventanas emergentes', 'err'); }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }catch(e){
    console.error('Ver HTML:', e);
    if(win) win.close();
    showToast('No se pudo abrir la vista. Descárgalo con 📥.', 'err');
  }finally{
    if(btn){ btn.disabled = false; btn.innerHTML = '👁️'; }
  }
}

async function subirArchivo(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > MAX_ARCHIVO_MB * 1024 * 1024){
    showToast(`El archivo pesa más de ${MAX_ARCHIVO_MB} MB. Súbelo directo con «Abrir en Drive».`, 'err');
    input.value = '';
    return;
  }
  showToast('Subiendo archivo...');
  let base64;
  try{
    base64 = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload  = () => resolve(String(r.result).split(',')[1] || '');
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }catch(e){
    showToast('No se pudo leer el archivo', 'err');
    input.value = '';
    return;
  }
  const res = await apiArchivos('subir', {
    proyectoId:  proyectoDestino(),
    archivoId:   genId(),
    nombre:      file.name,
    tipo:        file.type || '',
    archivoBase64: base64,
    subidoPor:   currentUser
  });
  input.value = '';
  if(res && res.ok){
    showToast('✅ Archivo subido');
    cargarArchivos();
  } else {
    showToast('Error al subir el archivo', 'err');
  }
}

async function ligarLink(){
  if(!autorListo()) return;
  const url = document.getElementById('arch-link-url').value.trim();
  let nombre = document.getElementById('arch-link-nombre').value.trim();
  if(!url){ showToast('Pega el link de Drive primero', 'err'); return; }
  if(!nombre) nombre = 'Documento de Drive';
  const res = await apiArchivos('ligar', {
    proyectoId: proyectoDestino(),
    archivoId:  genId(),
    nombre:     nombre,
    tipo:       'link',
    link:       url,
    subidoPor:  currentUser
  });
  if(res && res.ok){
    document.getElementById('arch-link-url').value = '';
    document.getElementById('arch-link-nombre').value = '';
    document.getElementById('arch-ligar').classList.remove('open');
    showToast('✅ Link ligado');
    cargarArchivos();
  } else {
    showToast('Error al ligar el link', 'err');
  }
}

function abrirCarpetaDrive(){
  let url = CARPETA_MADRE_DRIVE;
  if(proyectoActivo){
    if(toStr(proyectoActivo.DriveFolderID))      url = urlCarpeta(proyectoActivo.DriveFolderID);
    else if(toStr(proyectoActivo.DriveFolder))   url = toStr(proyectoActivo.DriveFolder);
  }
  window.open(url, '_blank', 'noopener');
}

async function eliminarArchivo(id, driveFileId, origen){
  if(!confirm('¿Eliminar este archivo del proyecto?')) return;
  let borrarDrive = false;
  if(origen === 'subido' && driveFileId){
    borrarDrive = confirm('¿También enviarlo a la papelera de Google Drive?\n\nAceptar = también a la papelera.\nCancelar = solo quitarlo de la lista.');
  }
  const res = await apiArchivos('eliminar', {
    archivoId:   id,
    driveFileId: driveFileId || '',
    origen:      origen || '',
    borrarDrive: borrarDrive
  });
  if(res && res.ok){
    showToast(borrarDrive ? 'Archivo eliminado y enviado a papelera' : 'Archivo quitado de la lista');
    cargarArchivos();
  } else {
    showToast('Error al eliminar', 'err');
  }
}

// ═══════════════════════════════════════
// URLs DE INTERÉS (favoritos compartidos)
// ═══════════════════════════════════════
let URLS = [];
let filtroCat = '';
let editandoUrl = null;

async function apiUrls(accion, data = {}){
  try {
    const res = await fetch(`${N8N_BASE}${URLS_ENDPOINT}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ accion, userID: currentUser, ...data })
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text();
    return txt ? JSON.parse(txt) : null;
  } catch(e){ console.error('API URLs:', e); return null; }
}

function icoUrl(u){
  const s = (toStr(u.url) + ' ' + toStr(u.nombre)).toLowerCase();
  if(s.includes('teams') || s.includes('microsoft')) return '👥';
  if(s.includes('drive.google') || s.includes('docs.google')) return '📁';
  if(s.includes('github')) return '🐙';
  if(s.includes('n8n')) return '⚙️';
  if(s.includes('supabase')) return '🗄️';
  if(s.includes('crm')) return '🤝';
  if(s.includes('excelentia.com.mx')) return '🌐';
  if(s.includes('notion')) return '📝';
  if(s.includes('whatsapp') || s.includes('ycloud')) return '💬';
  return '🔗';
}

async function cargarUrls(){
  const res = await apiUrls('listar');
  URLS = Array.isArray(res) ? res : (res && Array.isArray(res.data) ? res.data : []);
  renderUrls();
}

function renderUrls(){
  const el  = document.getElementById('url-lista');
  const tot = document.getElementById('url-total');
  if(tot) tot.textContent = URLS.length;
  if(!el) return;

  renderFiltrosUrl();

  const lista = filtroCat ? URLS.filter(u => toStr(u.categoria) === filtroCat) : URLS;
  if(!lista.length){
    el.innerHTML = '<div class="empty-state"><span>🔗</span>Sin ligas todavía. Agrega la primera con «+ Nueva liga».</div>';
    return;
  }

  const grupos = {};
  lista.forEach(u => {
    const c = toStr(u.categoria) || 'General';
    if(!grupos[c]) grupos[c] = [];
    grupos[c].push(u);
  });

  el.innerHTML = Object.keys(grupos).sort().map(cat => {
    const items = grupos[cat].map(u => {
      const id = toStr(u.id);
      const url = toStr(u.url);
      const autor = USERS[toStr(u.user_id)] ? USERS[toStr(u.user_id)].nombre : '';
      return `<div class="url-item">
        <div class="url-ico">${icoUrl(u)}</div>
        <div class="url-info">
          <div class="url-nombre">${escHtml(u.nombre)}</div>
          <a class="url-link" href="${escAttr(url)}" target="_blank" rel="noopener">${escHtml(url)}</a>
          ${u.notas ? `<div class="url-notas">${escHtml(u.notas)}${autor ? ' · ' + escHtml(autor) : ''}</div>` : (autor ? `<div class="url-notas">${escHtml(autor)}</div>` : '')}
        </div>
        <div class="url-acc">
          <button class="btn btn-secondary btn-sm btn-icon" title="Abrir" onclick="window.open('${escAttr(url)}','_blank')">↗</button>
          <button class="btn btn-secondary btn-sm btn-icon" title="Editar" onclick="editarUrl('${escAttr(id)}')">✏️</button>
          <button class="btn btn-danger btn-sm btn-icon" title="Eliminar" onclick="eliminarUrl('${escAttr(id)}')">✕</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="url-grupo"><div class="url-grupo-tit">${escHtml(cat)}</div>${items}</div>`;
  }).join('');
}

function renderFiltrosUrl(){
  const el = document.getElementById('url-filtros');
  if(!el) return;
  const cats = [...new Set(URLS.map(u => toStr(u.categoria) || 'General'))].sort();
  if(cats.length < 2){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="url-fchip ${filtroCat===''?'active':''}" onclick="filtrarUrl('')">Todas</div>`
    + cats.map(c => `<div class="url-fchip ${filtroCat===c?'active':''}" onclick="filtrarUrl('${escAttr(c)}')">${escHtml(c)}</div>`).join('');
}

function filtrarUrl(c){ filtroCat = c; renderUrls(); }

function abrirFormUrl(){
  editandoUrl = null;
  document.getElementById('u-nombre').value = '';
  document.getElementById('u-url').value = '';
  document.getElementById('u-categoria').value = '';
  document.getElementById('u-notas').value = '';
  document.getElementById('u-guardar').textContent = 'Guardar liga';
  document.getElementById('url-form').classList.add('open');
  document.getElementById('u-nombre').focus();
}

function cerrarFormUrl(){
  editandoUrl = null;
  document.getElementById('url-form').classList.remove('open');
}

function editarUrl(id){
  const u = URLS.find(x => toStr(x.id) === toStr(id));
  if(!u) return;
  editandoUrl = toStr(u.id);
  document.getElementById('u-nombre').value = toStr(u.nombre);
  document.getElementById('u-url').value = toStr(u.url);
  document.getElementById('u-categoria').value = toStr(u.categoria);
  document.getElementById('u-notas').value = toStr(u.notas);
  document.getElementById('u-guardar').textContent = 'Guardar cambios';
  document.getElementById('url-form').classList.add('open');
  document.getElementById('u-nombre').focus();
}

async function guardarUrl(){
  const nombre = document.getElementById('u-nombre').value.trim();
  const url = document.getElementById('u-url').value.trim();
  if(!nombre || !url){ showToast('Nombre y URL son obligatorios', 'err'); return; }

  const payload = {
    nombre, url,
    categoria: document.getElementById('u-categoria').value.trim() || 'General',
    notas: document.getElementById('u-notas').value.trim()
  };
  if(editandoUrl) payload.id = editandoUrl;

  const res = await apiUrls(editandoUrl ? 'editar' : 'crear', payload);
  if(res && res.ok){
    showToast(editandoUrl ? '✅ Liga actualizada' : '✅ Liga agregada');
    cerrarFormUrl();
    cargarUrls();
  } else {
    showToast('Error al guardar', 'err');
  }
}

async function eliminarUrl(id){
  if(!confirm('¿Eliminar esta liga de los favoritos del equipo?')) return;
  const res = await apiUrls('eliminar', { id });
  if(res && res.ok){ showToast('Liga eliminada'); cargarUrls(); }
  else { showToast('Error al eliminar', 'err'); }
}

document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const u = params.get('user');

  // Quién firma los archivos. Orden de mando:
  //   1) lo que la persona eligió en el selector (se recuerda en su navegador)
  //   2) el usuario que venga del contenedor
  //   3) vacío — NUNCA se firma a nadie por default
  let guardado = '';
  try{ guardado = localStorage.getItem(AUTOR_KEY) || ''; }catch(e){}
  currentUser = USERS[guardado] ? guardado : (USERS[u] ? u : '');
  pintarAutor();

  try{
    const g = parseInt(localStorage.getItem(ANCHO_NOMBRE_KEY) || '0', 10);
    if(g >= ANCHO_NOMBRE_MIN) anchoNombre = g;
  }catch(e){}

  cargarProyectos().then(() => {
    // Si viene ?proyecto=ID en la URL, abrir ese proyecto
    const pid = params.get('proyecto');
    if(pid && PROYECTOS.find(p => toStr(p.ID) === pid)) elegirVista(pid);
  });
  cargarArchivos();
  cargarUrls();
});
