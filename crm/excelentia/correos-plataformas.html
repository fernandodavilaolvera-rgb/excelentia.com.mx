<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correos de Plataformas · ExcelentIA</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:#f5f6f8;color:#1a2035;font-size:15px;padding:1rem}
.wrap{max-width:720px;margin:0 auto}

/* ── BARRA SUPERIOR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem}
.topbar h1{font-size:1.05rem;font-weight:800;color:#1a2035;display:flex;align-items:center;gap:.4rem}
.topbar .sub{font-size:.78rem;color:#8a90a0;font-weight:500;margin-top:.1rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .95rem;border-radius:8px;font-size:.83rem;font-weight:700;cursor:pointer;border:none;font-family:'Manrope',sans-serif;transition:.2s}
.btn-primary{background:#1a3a6b;color:#fff}.btn-primary:hover{background:#0d1b3e}
.btn-primary:disabled{background:#8a90a0;cursor:not-allowed}
.btn-ghost{background:#f0f4ff;color:#1a3a6b;border:1px solid #c8d9f0}.btn-ghost:hover{background:#dce8f7}
.btn-sm{padding:.32rem .6rem;font-size:.78rem}

/* ── NAVEGADOR DE DÍA ── */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:.6rem;background:#fff;border:1px solid #dde1e9;border-radius:12px;padding:.6rem .8rem;margin-bottom:1rem}
.daynav .arrow{width:36px;height:36px;border-radius:8px;border:1px solid #c8d9f0;background:#f0f4ff;color:#1a3a6b;font-size:1rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.daynav .arrow:hover:not(:disabled){background:#dce8f7}
.daynav .arrow:disabled{opacity:.35;cursor:not-allowed}
.daynav .day-center{flex:1;text-align:center;min-width:0}
.daynav .day-label{font-size:.92rem;font-weight:800;color:#1a3a6b}
.daynav .day-meta{font-size:.74rem;color:#8a90a0;margin-top:.1rem}

/* ── CONTADORES SEMÁFORO ── */
.tally{display:flex;gap:.4rem;justify-content:center;margin-top:.35rem;flex-wrap:wrap}
.tally span{font-size:.72rem;font-weight:800;padding:.1rem .45rem;border-radius:20px;background:#f0f4ff;color:#4a5068;border:1px solid #dde1e9}

/* ── CARD ── */
.card{background:#fff;border:1px solid #dde1e9;border-radius:12px;overflow:hidden;margin-bottom:1rem}
.card-head{background:#dce8f7;padding:.7rem 1rem;font-weight:700;font-size:.86rem;color:#1a2035;display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.card-body{padding:1rem}

.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.9rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.74rem;font-weight:700;padding:.22rem .6rem;border-radius:20px;background:#f0f4ff;color:#1a3a6b;border:1px solid #dbe6f7}

/* ── SECCIÓN ── */
.sec-head{font-size:.86rem;font-weight:800;color:#1a2035;margin:0 0 .55rem;display:flex;align-items:center;gap:.4rem}
.sec{margin-bottom:1.1rem}
.sec:last-child{margin-bottom:0}

/* ── MENSAJE (unidad base) ── */
.msg{display:flex;gap:.55rem;align-items:flex-start;border-radius:10px;padding:.65rem .75rem;margin-bottom:.5rem;border:1px solid #dde1e9;background:#fff;transition:.15s}
.msg:last-child{margin-bottom:0}
.msg-rojo{background:#fef2f2;border-color:#fecaca;border-left:4px solid #dc2626}
.msg-amarillo{background:#fffbeb;border-color:#fde68a;border-left:4px solid #f59e0b}
.msg-verde{background:#f0fdf4;border-color:#bbf7d0;border-left:4px solid #059669}
.msg.leido{opacity:.5}
.msg.leido .msg-text{text-decoration:line-through;text-decoration-color:#8a90a0}

.msg-check{width:18px;height:18px;margin-top:.15rem;cursor:pointer;flex-shrink:0;accent-color:#1a3a6b}
.msg-dot{font-size:.95rem;line-height:1.35;flex-shrink:0}
.msg-body{flex:1;min-width:0}
.msg-plat{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.3px;margin-bottom:.15rem}
.msg-rojo .msg-plat{color:#991b1b}
.msg-amarillo .msg-plat{color:#92400e}
.msg-verde .msg-plat{color:#065f46}
.msg-text{font-size:.85rem;line-height:1.5;color:#1a2035;word-break:break-word}
.msg-tools{display:flex;flex-direction:column;gap:.25rem;flex-shrink:0}
.tool{width:28px;height:28px;border-radius:7px;border:1px solid #dde1e9;background:#fff;cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center;transition:.15s;padding:0}
.tool:hover{background:#f0f4ff;border-color:#4a9fd4}
.tool-del:hover{background:#fee2e2;border-color:#dc2626}

.none-box{font-size:.82rem;color:#4a5068;background:#f0fdf4;border:1px solid #bbf7d0;border-left:4px solid #059669;border-radius:8px;padding:.65rem .85rem}

/* ── ENCABEZADO DE PLATAFORMA ── */
.plat-head{display:flex;align-items:center;gap:.5rem;margin:.85rem 0 .45rem}
.plat-head:first-child{margin-top:0}
.plat-ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0}
.plat-name{font-size:.86rem;font-weight:800;color:#1a2035}

.plain{font-size:.88rem;line-height:1.6;color:#1a2035;white-space:pre-wrap;word-break:break-word}

/* ── ANTERIORES ── */
.recent-title{font-size:.78rem;font-weight:700;color:#4a5068;margin:.2rem 0 .5rem}
.recent{display:flex;flex-wrap:wrap;gap:.4rem}
.rchip{cursor:pointer;font-size:.76rem;font-weight:700;padding:.32rem .65rem;border-radius:8px;background:#fff;border:1px solid #dde1e9;color:#4a5068;transition:.15s;display:flex;align-items:center;gap:.25rem}
.rchip:hover{border-color:#4a9fd4;color:#1a3a6b}
.rchip.active{background:#1a3a6b;color:#fff;border-color:#1a3a6b}

/* ── ESTADOS ── */
.alert{background:#f0f6ff;border:1px solid #c8d9f0;border-left:4px solid #4a9fd4;border-radius:8px;padding:.75rem 1rem;font-size:.82rem;color:#1a2035;margin-bottom:1rem}
.empty{text-align:center;padding:2.5rem 1rem;color:#8a90a0}
.empty span{font-size:2rem;display:block;margin-bottom:.5rem}
.loading{text-align:center;padding:2rem;color:#4a5068;font-size:.85rem}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #dde1e9;border-top-color:#4a9fd4;border-radius:50%;animation:spin .7s linear infinite;margin-right:.4rem;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);padding:.6rem 1.1rem;border-radius:8px;font-size:.82rem;font-weight:700;color:#fff;background:#059669;opacity:0;transition:.3s;z-index:999;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.15)}

@media(max-width:600px){
  body{padding:.75rem}
  .topbar h1{font-size:.98rem}
  .daynav .day-label{font-size:.85rem}
  .msg{padding:.6rem .55rem;gap:.45rem}
  .msg-tools{flex-direction:row}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <h1>📧 Correos de Plataformas</h1>
      <div class="sub">Digest cada 3 días · Anthropic · YCloud · n8n · Supabase · GitHub · Railway · OpenAI · Google · Redis</div>
    </div>
    <button class="btn btn-primary" id="btnGenerar" onclick="generarAhora()">🔄 Generar ahora</button>
  </div>

  <div id="app">
    <div class="loading"><span class="spinner"></span>Cargando resúmenes…</div>
  </div>

</div>
<div id="toast"></div>

<script>
const N8N_BASE = 'https://n8n.excelentia.com.mx/webhook';
const ENDPOINT = '/correos-resumen';

const params = new URLSearchParams(location.search);
const USER = params.get('user') || 'fernando';

let DIAS = [];
let idx = 0;

const PLAT = [
  { key:'anthropic', ic:'🤖', bg:'#f4ede4' },
  { key:'claude',    ic:'🤖', bg:'#f4ede4' },
  { key:'ycloud',    ic:'💬', bg:'#e3f6ec' },
  { key:'n8n',       ic:'⚙️', bg:'#f3e9fb' },
  { key:'supabase',  ic:'🗄️', bg:'#e3f6ec' },
  { key:'github',    ic:'🐙', bg:'#eef0f4' },
  { key:'railway',   ic:'🚆', bg:'#ecebfb' },
  { key:'openai',    ic:'🧠', bg:'#e6f5f1' },
  { key:'google',    ic:'🔵', bg:'#e8f0ff' },
  { key:'redis',     ic:'🧱', bg:'#fdeaea' }
];
function platInfo(nombre){
  const n = (nombre||'').toLowerCase();
  for(const p of PLAT){ if(n.includes(p.key)) return p; }
  return { ic:'📨', bg:'#eef2f8' };
}
const NIVEL_ICON = { rojo:'🔴', amarillo:'🟡', verde:'✅' };
const ORDEN = { rojo:0, amarillo:1, verde:2 };

function toast(msg, ok){
  const t = document.getElementById('toast');
  t.style.background = (ok === false) ? '#dc2626' : '#059669';
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(function(){ t.style.opacity = '0'; }, 2200);
}

async function api(accion, extra){
  const res = await fetch(N8N_BASE + ENDPOINT, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify(Object.assign({ accion: accion, userID: USER }, extra||{}))
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const txt = await res.text();
  try { return txt ? JSON.parse(txt) : null; } catch(e){ return null; }
}

function fmtFecha(f){
  if(!f) return '';
  const dt = new Date(f + 'T12:00:00');
  const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const s = dias[dt.getDay()] + ' ' + dt.getDate() + ' ' + meses[dt.getMonth()] + ' ' + dt.getFullYear();
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function normalizar(rows){
  const arr = Array.isArray(rows) ? rows : (rows && rows.data ? rows.data : []);
  const porFecha = {};
  for(const r of arr){
    if(!r || !r.fecha) continue;
    const prev = porFecha[r.fecha];
    if(!prev || (r.created_at||'') > (prev.created_at||'')) porFecha[r.fecha] = r;
  }
  return Object.values(porFecha).sort(function(a,b){ return a.fecha < b.fecha ? 1 : -1; });
}

// ── Normaliza el detalle a la forma nueva. Tolera formato viejo (puntos como strings).
let _fallbackSeq = 0;
function parseDetalle(dia){
  let obj = dia.detalle;
  if(typeof obj === 'string'){ try { obj = JSON.parse(obj); } catch(e){ obj = null; } }
  if(!obj) return { porPlataforma:[], acciones:[] };
  if(Array.isArray(obj)) obj = { porPlataforma: obj, acciones: [] };

  const nivelOk = function(n){
    n = (n||'verde').toString().toLowerCase();
    return (n==='rojo'||n==='amarillo'||n==='verde') ? n : 'verde';
  };

  const porPlataforma = (Array.isArray(obj.porPlataforma) ? obj.porPlataforma : []).map(function(p){
    const puntos = (Array.isArray(p.puntos) ? p.puntos : []).map(function(pt){
      if(typeof pt === 'string'){
        _fallbackSeq++;
        return { id: 'X-'+dia.id+'-'+_fallbackSeq, txt: pt, nivel:'verde', leido:false };
      }
      _fallbackSeq++;
      return {
        id: pt.id || ('X-'+dia.id+'-'+_fallbackSeq),
        txt: pt.txt || pt.texto || '',
        nivel: nivelOk(pt.nivel),
        leido: pt.leido === true
      };
    }).filter(function(pt){ return pt.txt; });
    puntos.sort(function(a,b){ return (ORDEN[a.nivel]||2) - (ORDEN[b.nivel]||2); });
    return { plataforma: p.plataforma || 'Plataforma', puntos: puntos };
  }).filter(function(p){ return p.puntos.length; });

  const acciones = (Array.isArray(obj.acciones) ? obj.acciones : []).map(function(a){
    _fallbackSeq++;
    return {
      id: a.id || ('XA-'+dia.id+'-'+_fallbackSeq),
      nivel: nivelOk(a.nivel),
      plataforma: a.plataforma || '',
      accion: a.accion || '',
      leido: a.leido === true
    };
  }).filter(function(a){ return a.accion; });
  acciones.sort(function(a,b){ return (ORDEN[a.nivel]||2) - (ORDEN[b.nivel]||2); });

  return { porPlataforma: porPlataforma, acciones: acciones };
}

// ── Guarda el detalle del día actual en Supabase (vía n8n)
async function guardarDetalle(dia, det){
  dia.detalle = det;                 // optimista: pinta ya
  render();
  try {
    await api('actualizar', { id: dia.id, detalle: det });
  } catch(e){
    toast('No se pudo guardar el cambio', false);
  }
}

// ── ACCIONES SOBRE UN MENSAJE ────────────────────────
async function toggleLeido(tipo, mid){
  const dia = DIAS[idx];
  const det = parseDetalle(dia);
  let encontrado = null;
  if(tipo === 'a'){
    encontrado = det.acciones.find(function(a){ return a.id === mid; });
  } else {
    for(const p of det.porPlataforma){
      const f = p.puntos.find(function(pt){ return pt.id === mid; });
      if(f){ encontrado = f; break; }
    }
  }
  if(!encontrado) return;
  encontrado.leido = !encontrado.leido;
  await guardarDetalle(dia, det);
}

async function borrarMensaje(tipo, mid){
  if(!confirm('¿Borrar este mensaje del resumen?')) return;
  const dia = DIAS[idx];
  const det = parseDetalle(dia);
  if(tipo === 'a'){
    det.acciones = det.acciones.filter(function(a){ return a.id !== mid; });
  } else {
    det.porPlataforma = det.porPlataforma.map(function(p){
      p.puntos = p.puntos.filter(function(pt){ return pt.id !== mid; });
      return p;
    }).filter(function(p){ return p.puntos.length; });
  }
  await guardarDetalle(dia, det);
  toast('🗑️ Mensaje borrado');
}

function copiarMensaje(tipo, mid){
  const det = parseDetalle(DIAS[idx]);
  let txt = '', plat = '', nivel = 'verde';
  if(tipo === 'a'){
    const a = det.acciones.find(function(x){ return x.id === mid; });
    if(a){ txt = a.accion; plat = a.plataforma; nivel = a.nivel; }
  } else {
    for(const p of det.porPlataforma){
      const f = p.puntos.find(function(pt){ return pt.id === mid; });
      if(f){ txt = f.txt; plat = p.plataforma; nivel = f.nivel; break; }
    }
  }
  if(!txt) return;
  const full = (NIVEL_ICON[nivel]||'') + ' ' + (plat ? '['+plat+'] ' : '') + txt;
  navigator.clipboard.writeText(full).then(
    function(){ toast('📋 Copiado'); },
    function(){ toast('No se pudo copiar', false); }
  );
}

// ── RENDER DE UN MENSAJE ────────────────────────────
function msgHTML(tipo, m, plataforma){
  const n = m.nivel || 'verde';
  const txt = (tipo === 'a') ? m.accion : m.txt;
  return '<div class="msg msg-'+n+(m.leido?' leido':'')+'">'
    + '<input type="checkbox" class="msg-check" '+(m.leido?'checked':'')
    + ' onchange="toggleLeido(\''+tipo+'\',\''+esc(m.id)+'\')" title="Marcar como leído">'
    + '<div class="msg-dot">'+(NIVEL_ICON[n]||'✅')+'</div>'
    + '<div class="msg-body">'
    + (plataforma ? '<div class="msg-plat">'+esc(plataforma)+'</div>' : '')
    + '<div class="msg-text">'+esc(txt)+'</div>'
    + '</div>'
    + '<div class="msg-tools">'
    + '<button class="tool" onclick="copiarMensaje(\''+tipo+'\',\''+esc(m.id)+'\')" title="Copiar">📋</button>'
    + '<button class="tool tool-del" onclick="borrarMensaje(\''+tipo+'\',\''+esc(m.id)+'\')" title="Borrar mensaje">🗑️</button>'
    + '</div></div>';
}

function contar(det){
  let r=0, a=0, v=0, leidos=0, total=0;
  const todos = det.acciones.concat(
    det.porPlataforma.reduce(function(acc,p){ return acc.concat(p.puntos); }, [])
  );
  for(const m of todos){
    total++;
    if(m.leido) leidos++;
    if(m.nivel==='rojo') r++; else if(m.nivel==='amarillo') a++; else v++;
  }
  return { rojo:r, amarillo:a, verde:v, leidos:leidos, total:total };
}

function render(){
  const app = document.getElementById('app');
  if(!DIAS.length){
    app.innerHTML = '<div class="empty"><span>📭</span>Aún no hay resúmenes.<br>Usa <strong>Generar ahora</strong> para crear el primero.</div>';
    return;
  }
  if(idx < 0) idx = 0;
  if(idx > DIAS.length-1) idx = DIAS.length-1;
  const dia = DIAS[idx];
  const det = parseDetalle(dia);
  const c = contar(det);
  const plataformas = (dia.plataformas||'').split(',').map(function(s){ return s.trim(); }).filter(Boolean);

  // Acciones sugeridas
  let secAcciones = '';
  if(Number(dia.num_correos) > 0){
    secAcciones = '<div class="sec"><div class="sec-head">⚠️ Acciones sugeridas</div>'
      + (det.acciones.length
          ? det.acciones.map(function(a){ return msgHTML('a', a, a.plataforma); }).join('')
          : '<div class="none-box">✅ Nada que hacer por ahora. Todo es informativo.</div>')
      + '</div>';
  }

  // Mensajes por plataforma
  let secMensajes = '';
  if(det.porPlataforma.length){
    secMensajes = '<div class="sec"><div class="sec-head">🗂️ Mensajes</div>'
      + det.porPlataforma.map(function(p){
          const info = platInfo(p.plataforma);
          return '<div class="plat-head"><div class="plat-ic" style="background:'+info.bg+'">'+info.ic+'</div>'
            + '<div class="plat-name">'+esc(p.plataforma)+'</div></div>'
            + p.puntos.map(function(pt){ return msgHTML('m', pt, ''); }).join('');
        }).join('')
      + '</div>';
  } else {
    secMensajes = '<div class="sec"><div class="plain">'+esc(dia.resumen||'Sin contenido.')+'</div></div>';
  }

  const chips = plataformas.length
    ? '<div class="chips">'+ plataformas.map(function(n){ const i=platInfo(n); return '<span class="chip">'+i.ic+' '+esc(n)+'</span>'; }).join('') +'</div>'
    : '';

  const tally = c.total
    ? '<div class="tally">'
      + (c.rojo ? '<span>🔴 '+c.rojo+'</span>' : '')
      + (c.amarillo ? '<span>🟡 '+c.amarillo+'</span>' : '')
      + (c.verde ? '<span>✅ '+c.verde+'</span>' : '')
      + '<span>☑️ '+c.leidos+'/'+c.total+' leídos</span>'
      + '</div>'
    : '';

  app.innerHTML =
    '<div class="daynav">'
    + '<button class="arrow" onclick="mover(1)" '+(idx>=DIAS.length-1?'disabled':'')+'>‹</button>'
    + '<div class="day-center"><div class="day-label">'+fmtFecha(dia.fecha)+'</div>'
    + '<div class="day-meta">'+ (Number(dia.num_correos)||0) +' correo(s) resumido(s)</div>'
    + tally + '</div>'
    + '<button class="arrow" onclick="mover(-1)" '+(idx<=0?'disabled':'')+'>›</button>'
    + '</div>'
    + '<div class="card">'
    + '<div class="card-head">📅 '+fmtFecha(dia.fecha)
    + '<button class="btn btn-ghost btn-sm" onclick="eliminarDia(\''+esc(dia.id)+'\')">🗑️ Borrar todo el día</button></div>'
    + '<div class="card-body">'
    + chips + secAcciones + secMensajes
    + '</div></div>'
    + recientes();
}

function recientes(){
  if(DIAS.length < 2) return '';
  const chips = DIAS.slice(0,14).map(function(d,i){
    const dt = new Date(d.fecha+'T12:00:00');
    const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const lbl = dt.getDate()+' '+meses[dt.getMonth()];
    const det = parseDetalle(d);
    const hayRojo = det.acciones.some(function(a){ return a.nivel==='rojo' && !a.leido; })
      || det.porPlataforma.some(function(p){ return p.puntos.some(function(pt){ return pt.nivel==='rojo' && !pt.leido; }); });
    return '<div class="rchip'+(i===idx?' active':'')+'" onclick="irA('+i+')">'+(hayRojo?'🔴':'')+lbl+'</div>';
  }).join('');
  return '<div class="recent-title">Resúmenes anteriores</div><div class="recent">'+chips+'</div>';
}

function mover(delta){ idx += delta; render(); }
function irA(i){ idx = i; render(); }

async function cargar(){
  document.getElementById('app').innerHTML = '<div class="loading"><span class="spinner"></span>Cargando resúmenes…</div>';
  try {
    const rows = await api('get');
    DIAS = normalizar(rows);
    idx = 0;
    render();
  } catch(e){
    document.getElementById('app').innerHTML =
      '<div class="alert">No se pudo conectar con el servidor. Revisa que el workflow esté activo e inténtalo de nuevo.</div>';
  }
}

async function generarAhora(){
  const btn = document.getElementById('btnGenerar');
  btn.disabled = true;
  const original = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span>Generando…';
  try {
    await api('generar');
    await cargar();
  } catch(e){
    toast('No se pudo generar el resumen', false);
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

async function eliminarDia(id){
  if(!confirm('¿Borrar TODOS los mensajes de este día?')) return;
  try { await api('eliminar', { id: id }); await cargar(); toast('Día eliminado'); }
  catch(e){ toast('No se pudo borrar', false); }
}

function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

cargar();
</script>
