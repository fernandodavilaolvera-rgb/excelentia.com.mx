<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferrock CRM — Fernando Dávila</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/fernandodavilaolvera-rgb/excelentia.com.mx/main/assets/ExcelentiA_favicon.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/fernandodavilaolvera-rgb/excelentia.com.mx/main/assets/ExcelentiA_favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Manrope',sans-serif;background:#f5f6f8;display:flex;flex-direction:column;overflow:hidden;color:#1a2035}

.crm-header{background:linear-gradient(135deg,#0d1b3e 0%,#1a3a6b 60%,#1e5096 100%);border-bottom:3px solid #4a9fd4;padding:.3rem 1.1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-shrink:0}
.logo-header-wrap{display:flex;align-items:center;gap:.9rem;min-width:0}
.logo-box{background:#fff;border-radius:8px;padding:.2rem .6rem;display:flex;align-items:center;justify-content:center;min-width:70px;min-height:38px;flex-shrink:0}
.logo-box img{height:34px;width:auto;display:block}
.logo-fallback{font-family:'Manrope',sans-serif;font-size:15px;font-weight:800;color:#1a3a6b;display:none}
.logo-slogan{font-size:13px;font-weight:500;color:#fff;letter-spacing:.2px;white-space:nowrap}
.hdr-right{display:flex;align-items:center;gap:1rem;flex-shrink:0}
.crm-title{color:#fff;font-weight:700;font-size:.92rem;letter-spacing:.2px;white-space:nowrap}
.user-chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:.3rem .7rem;color:#fff;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:.4rem;cursor:pointer;transition:.15s;white-space:nowrap;font-family:'Manrope',sans-serif}
.user-chip:hover{background:rgba(255,255,255,.16)}
.user-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.user-menu{display:none;position:fixed;top:52px;right:1.1rem;background:#fff;border:1px solid #dde1e9;border-radius:6px;box-shadow:0 8px 24px rgba(13,27,62,.15);z-index:300;min-width:160px;overflow:hidden}
.user-menu.open{display:block}
.user-menu-item{padding:.55rem .9rem;cursor:pointer;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:.5rem;color:#1a2035}
.user-menu-item:hover{background:#e8f0fb}
.btn-hamb{display:none;background:none;border:1px solid rgba(255,255,255,.3);border-radius:6px;color:#fff;font-size:1.2rem;width:36px;height:34px;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0}

.shell{flex:1;min-height:0;display:flex}
.side-nav{width:212px;flex-shrink:0;background:#fff;border-right:1px solid #dde1e9;overflow-y:auto;padding:.4rem 0 1rem;transition:width .18s}
.nav-toggle{display:flex;align-items:center;gap:.7rem;width:100%;background:none;border:none;padding:.55rem 1rem;font-family:'Manrope',sans-serif;font-size:.76rem;font-weight:600;color:#8a90a0;cursor:pointer;text-align:left}
.nav-toggle i{font-size:18px}
.nav-toggle:hover{color:#1a3a6b}
.nav-group{font-size:.68rem;font-weight:700;color:#8a90a0;letter-spacing:.06em;padding:.95rem 1rem .3rem;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:.7rem;width:100%;background:none;border:none;border-left:3px solid transparent;padding:.5rem 1rem .5rem calc(1rem - 3px);font-family:'Manrope',sans-serif;font-size:.83rem;font-weight:600;color:#4a5068;cursor:pointer;text-align:left;white-space:nowrap;transition:background .12s,color .12s}
.nav-item i{font-size:18px;color:#8a90a0;flex-shrink:0;transition:color .12s}
.nav-item:hover{background:#f5f6f8;color:#1a3a6b}
.nav-item:hover i{color:#1a3a6b}
.nav-item.active{background:#e8f0fb;color:#1a3a6b;border-left-color:#1a3a6b;font-weight:700}
.nav-item.active i{color:#1a3a6b}
.side-nav.mini{width:58px}
.side-nav.mini .nav-label,.side-nav.mini .nav-group span{display:none}
.side-nav.mini .nav-group{padding:.7rem 0 .2rem;text-align:center}
.side-nav.mini .nav-group::after{content:'';display:block;height:1px;background:#dde1e9;margin:0 .9rem}
.side-nav.mini .nav-item,.side-nav.mini .nav-toggle{justify-content:center;padding-left:0;padding-right:0}

.main-area{flex:1;min-width:0;display:flex;flex-direction:column}
.crumb{flex-shrink:0;background:#fff;border-bottom:1px solid #dde1e9;padding:.5rem 1.2rem;font-size:.76rem;color:#8a90a0;display:flex;align-items:center;gap:.35rem}
.crumb i{font-size:13px}
.crumb b{color:#1a2035;font-weight:700}
.frames{flex:1;min-height:0;position:relative}
.tab-frame-wrap{display:none;height:100%}
.tab-frame-wrap.active{display:block}
.tab-frame-wrap iframe{width:100%;height:100%;border:none;display:block}

.personas-wrap{height:100%;overflow-y:auto;background:#f5f6f8}
.personas-iframe-co{width:100%;border:none;display:block;height:640px}
.personas-divider{display:flex;align-items:center;gap:.6rem;padding:1rem 1.5rem .4rem;background:#f5f6f8}
.personas-divider-line{flex:1;height:2px;background:linear-gradient(to right,#4a9fd4,transparent)}
.personas-divider-label{font-size:.78rem;font-weight:800;color:#4a5068;letter-spacing:.04em;white-space:nowrap}
.personas-iframe-eq{width:100%;border:none;display:block;height:560px}
.nav-veil{display:none}

@media(max-width:600px){
  .crm-header{padding:.45rem .7rem;gap:.5rem}
  .logo-header-wrap{flex-direction:column;align-items:flex-start;gap:.3rem}
  .logo-slogan{font-size:11px}
  .logo-box{min-height:34px;padding:.2rem .5rem}
  .logo-box img{height:30px}
  .crm-title{display:none}
  .btn-hamb{display:flex}
  .side-nav{position:fixed;top:0;bottom:0;left:0;z-index:400;width:240px;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(13,27,62,.18)}
  .side-nav.mini{width:240px}
  .side-nav.mini .nav-label,.side-nav.mini .nav-group span{display:inline}
  .side-nav.mini .nav-group{text-align:left;padding:.95rem 1rem .3rem}
  .side-nav.mini .nav-group::after{display:none}
  .side-nav.mini .nav-item{justify-content:flex-start;padding:.5rem 1rem .5rem calc(1rem - 3px)}
  .side-nav.abierto{transform:translateX(0)}
  .nav-toggle{display:none}
  .nav-veil.abierto{display:block;position:fixed;inset:0;background:rgba(13,27,62,.35);z-index:350}
  .crumb{padding:.45rem .8rem}
}

@media print{
  @page{size:Letter;margin:12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{height:auto;overflow:visible}
  .no-print,.side-nav,.nav-veil,.user-menu{display:none!important}
  .shell,.main-area,.frames{display:block;height:auto}
  .tab-frame-wrap{break-inside:auto}
  .tab-frame-wrap.active iframe{height:auto;min-height:900px}
  h1,h2,h3,h4{break-after:avoid}
  p,li{orphans:3;widows:3}
  a[href]:after{content:none}
}
</style>
</head>
<body>

<header class="crm-header">
  <div style="display:flex;align-items:center;gap:.6rem;min-width:0">
    <button class="btn-hamb no-print" onclick="abrirMenuMovil()" aria-label="Abrir menú"><i class="ti ti-menu-2" aria-hidden="true"></i></button>
    <div class="logo-header-wrap">
      <div class="logo-box">
        <img src="https://raw.githubusercontent.com/fernandodavilaolvera-rgb/excelentia.com.mx/main/assets/logo_excelentIA_clean.png" alt="ExcelentIA" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
        <span class="logo-fallback">Excelent<span style="color:#4a9fd4">IA</span></span>
      </div>
      <span class="logo-slogan">Inteligencia Artificial con esencia Humana</span>
    </div>
  </div>
  <div class="hdr-right">
    <span class="crm-title">Ferrock CRM</span>
    <button class="user-chip no-print" onclick="toggleUserMenu()">
      <span class="user-dot" id="userDot" style="background:#4a9fd4"></span>
      <span id="userChipName">Fernando</span>
      <i class="ti ti-chevron-down" aria-hidden="true"></i>
    </button>
  </div>
</header>

<div class="user-menu no-print" id="userMenu">
  <div class="user-menu-item" onclick="setUser('fernando')"><span style="width:9px;height:9px;border-radius:50%;background:#1a3a6b;display:inline-block"></span>Fernando</div>
  <div class="user-menu-item" onclick="setUser('juanjose')"><span style="width:9px;height:9px;border-radius:50%;background:#7c3aed;display:inline-block"></span>Juan José</div>
  <div class="user-menu-item" onclick="setUser('adolfo')"><span style="width:9px;height:9px;border-radius:50%;background:#059669;display:inline-block"></span>Adolfo</div>
</div>

<div class="nav-veil no-print" id="navVeil" onclick="cerrarMenuMovil()"></div>

<div class="shell">
  <nav class="side-nav no-print" id="sideNav">
    <button class="nav-toggle" onclick="toggleMini()" title="Contraer o expandir el menú"><i class="ti ti-menu-2" aria-hidden="true"></i><span class="nav-label">Contraer menú</span></button>
    <div class="nav-group"><span>HERRAMIENTAS</span></div>
    <button class="nav-item" data-tab="ferrock" data-grupo="Herramientas" onclick="showTab('ferrock')" title="Ferrock Index"><i class="ti ti-layout-grid" aria-hidden="true"></i><span class="nav-label">Ferrock Index</span></button>
    <button class="nav-item" data-tab="plats" data-grupo="Herramientas" onclick="showTab('plats')" title="Plat´s Info"><i class="ti ti-mail" aria-hidden="true"></i><span class="nav-label">Plat´s Info</span></button>
    <button class="nav-item" data-tab="ecoia" data-grupo="Herramientas" onclick="showTab('ecoia')" title="Eco IA"><i class="ti ti-heartbeat" aria-hidden="true"></i><span class="nav-label">Eco IA</span></button>
    <div class="nav-group"><span>OPERACIÓN</span></div>
    <button class="nav-item" data-tab="timeline" data-grupo="Operación" onclick="showTab('timeline')" title="Timeline"><i class="ti ti-timeline" aria-hidden="true"></i><span class="nav-label">Timeline</span></button>
    <button class="nav-item" data-tab="pendientes" data-grupo="Operación" onclick="showTab('pendientes')" title="Pendientes"><i class="ti ti-checklist" aria-hidden="true"></i><span class="nav-label">Pendientes</span></button>
    <button class="nav-item" data-tab="agenda" data-grupo="Operación" onclick="showTab('agenda')" title="Agenda"><i class="ti ti-calendar" aria-hidden="true"></i><span class="nav-label">Agenda</span></button>
    <button class="nav-item" data-tab="drive" data-grupo="Operación" onclick="showTab('drive')" title="Drive"><i class="ti ti-folder" aria-hidden="true"></i><span class="nav-label">Drive</span></button>
    <div class="nav-group"><span>COMERCIAL</span></div>
    <button class="nav-item" data-tab="empresas" data-grupo="Comercial" onclick="showTab('empresas')" title="Empresas"><i class="ti ti-building" aria-hidden="true"></i><span class="nav-label">Empresas</span></button>
    <button class="nav-item" data-tab="contactos" data-grupo="Comercial" onclick="showTab('contactos')" title="Contactos"><i class="ti ti-users" aria-hidden="true"></i><span class="nav-label">Contactos</span></button>
    <button class="nav-item" data-tab="funnel" data-grupo="Comercial" onclick="showTab('funnel')" title="Funnel"><i class="ti ti-filter" aria-hidden="true"></i><span class="nav-label">Funnel</span></button>
    <button class="nav-item" data-tab="proyectos" data-grupo="Comercial" onclick="showTab('proyectos')" title="Proyectos"><i class="ti ti-briefcase" aria-hidden="true"></i><span class="nav-label">Proyectos</span></button>
    <div class="nav-group"><span>ADMINISTRACIÓN</span></div>
    <button class="nav-item" data-tab="facturacion" data-grupo="Administración" onclick="showTab('facturacion')" title="Facturación"><i class="ti ti-file-invoice" aria-hidden="true"></i><span class="nav-label">Facturación</span></button>
    <button class="nav-item" data-tab="finanzas" data-grupo="Administración" onclick="showTab('finanzas')" title="Finanzas"><i class="ti ti-coin" aria-hidden="true"></i><span class="nav-label">Finanzas</span></button>
  </nav>

  <main class="main-area">
    <div class="crumb"><span id="crumbGrupo"></span><i class="ti ti-chevron-right" aria-hidden="true"></i><b id="crumbModulo"></b></div>
    <div class="frames">
    <div class="tab-frame-wrap" id="wrap-ferrock"><iframe data-base="excelentia/Ferrock_Index.html" title="Ferrock Index"></iframe></div>
    <div class="tab-frame-wrap" id="wrap-plats"><iframe data-base="excelentia/correos-plataformas.html" title="Plat´s Info"></iframe></div>
    <div class="tab-frame-wrap" id="wrap-ecoia"><iframe data-base="excelentia/dashboard-eco-ia_actividad.html" title="Eco IA"></iframe></div>
    <div class="tab-frame-wrap" id="wrap-timeline"><iframe data-base="excelentia/timeline.html" title="Timeline"></iframe></div>
    <div class="tab-frame-wrap" id="wrap-pendientes"><iframe data-base="excelentia/crm-tareas.html" title="Pendientes"></iframe></div>
    <div class="tab-frame-wrap" id="wrap-agenda"><iframe data-base="excelentia/agenda.html" title="Agenda"></iframe></div>
    <div class="tab-frame-wrap" id="wrap-drive"><iframe data-base="excelentia/drive.html" title="Drive"></iframe></div>
    <div class="tab-frame-wrap" id="wrap-empresas"><iframe data-base="excelentia/crm-empresas.html" title="Empresas"></iframe></div>
    <div class="tab-frame-wrap" id="wrap-contactos">
      <div class="personas-wrap">
        <iframe class="personas-iframe-co" data-base="excelentia/crm-contactos.html" title="Contactos" onload="autoSize(this)"></iframe>
        <div class="personas-divider">
          <div class="personas-divider-line"></div>
          <span class="personas-divider-label">Equipo ExcelentIA</span>
          <div class="personas-divider-line" style="background:linear-gradient(to left,#4a9fd4,transparent)"></div>
        </div>
        <iframe class="personas-iframe-eq" data-base="excelentia/crm-equipo.html" title="Equipo" onload="autoSize(this)"></iframe>
      </div>
    </div>
    <div class="tab-frame-wrap" id="wrap-funnel"><iframe data-base="excelentia/crm-funnel.html" title="Funnel"></iframe></div>
    <div class="tab-frame-wrap" id="wrap-proyectos"><iframe data-base="excelentia/crm-proyectos.html" title="Proyectos"></iframe></div>
    <div class="tab-frame-wrap" id="wrap-facturacion"><iframe data-base="excelentia/crm-facturacion.html" title="Facturación"></iframe></div>
    <div class="tab-frame-wrap" id="wrap-finanzas"><iframe data-base="excelentia/finanzas.html" title="Finanzas"></iframe></div>
    </div>
  </main>
</div>

<script>
const USERS = {
  fernando: { nombre: 'Fernando', color: '#4a9fd4' },
  juanjose: { nombre: 'Juan José', color: '#a78bfa' },
  adolfo:   { nombre: 'Adolfo',   color: '#34d399' }
};
let currentUser = 'fernando';
const NAV_KEY = 'ferrock_nav_mini';

function cargarFrame(tab){
  const wrap = document.getElementById('wrap-'+tab);
  if(!wrap) return;
  wrap.querySelectorAll('iframe[data-base]').forEach(f=>{
    if(!f.getAttribute('src')) f.src = f.dataset.base + '?user=' + currentUser;
  });
}

function showTab(tab){
  const item = document.querySelector(`.nav-item[data-tab="${tab}"]`);
  if(!item || !document.getElementById('wrap-'+tab)) return;
  document.querySelectorAll('.nav-item').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-frame-wrap').forEach(w=>w.classList.remove('active'));
  item.classList.add('active');
  document.getElementById('wrap-'+tab).classList.add('active');
  document.getElementById('crumbGrupo').textContent = item.dataset.grupo;
  document.getElementById('crumbModulo').textContent = item.querySelector('.nav-label').textContent;
  cargarFrame(tab);
  cerrarMenuMovil();
  const url = new URL(window.location);
  url.searchParams.set('tab', tab);
  window.history.replaceState({}, '', url);
}

function toggleMini(){
  const nav = document.getElementById('sideNav');
  nav.classList.toggle('mini');
  try{ localStorage.setItem(NAV_KEY, nav.classList.contains('mini') ? '1' : '0'); }catch(e){}
}
function abrirMenuMovil(){
  document.getElementById('sideNav').classList.add('abierto');
  document.getElementById('navVeil').classList.add('abierto');
}
function cerrarMenuMovil(){
  document.getElementById('sideNav').classList.remove('abierto');
  document.getElementById('navVeil').classList.remove('abierto');
}

function setUser(uid){
  currentUser = uid;
  const u = USERS[uid];
  document.getElementById('userDot').style.background = u.color;
  document.getElementById('userChipName').textContent = u.nombre;
  document.getElementById('userMenu').classList.remove('open');
  document.querySelectorAll('iframe[data-base]').forEach(f=>{
    if(f.getAttribute('src')) f.src = f.dataset.base + '?user=' + uid;
  });
  const activa = document.querySelector('.nav-item.active')?.dataset.tab;
  if(activa) cargarFrame(activa);
}
function toggleUserMenu(){ document.getElementById('userMenu').classList.toggle('open'); }
document.addEventListener('click', e=>{
  if(!e.target.closest('.user-chip') && !e.target.closest('#userMenu')){
    document.getElementById('userMenu').classList.remove('open');
  }
});

function autoSize(iframe){
  try{
    const doc = iframe.contentWindow.document;
    const resize = () => { const h = doc.documentElement.scrollHeight; if(h > 100) iframe.style.height = h + 'px'; };
    resize(); setTimeout(resize, 1200); setTimeout(resize, 3000);
    new MutationObserver(resize).observe(doc.body, { childList:true, subtree:true });
  }catch(e){}
}

document.addEventListener('DOMContentLoaded', ()=>{
  try{ if(localStorage.getItem(NAV_KEY) === '1') document.getElementById('sideNav').classList.add('mini'); }catch(e){}
  const tabParam = new URLSearchParams(window.location.search).get('tab');
  if(tabParam && document.getElementById('wrap-'+tabParam) && document.querySelector(`.nav-item[data-tab="${tabParam}"]`)) showTab(tabParam);
  else showTab('ferrock');
});
</script>
</body>
</html>
