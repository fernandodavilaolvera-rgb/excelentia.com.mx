<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferrock CRM — Fernando Dávila</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/fernandodavilaolvera-rgb/excelentia.com.mx/main/assets/ExcelentiA_favicon.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/fernandodavilaolvera-rgb/excelentia.com.mx/main/assets/ExcelentiA_favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:#f5f6f8;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── HEADER ── */
.crm-header{background:linear-gradient(135deg,#0d1b3e 0%,#1a3a6b 60%,#1e5096 100%);border-bottom:3px solid #4a9fd4;padding:.6rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;position:relative;flex-shrink:0}
.logo-box{background:#fff;border-radius:10px;padding:.35rem .7rem;display:flex;align-items:center;justify-content:center;min-width:70px;min-height:44px;flex-shrink:0}
.logo-box img{height:38px;width:auto;display:block}
.logo-fallback{font-family:'Manrope',sans-serif;font-size:14px;font-weight:800;color:#1a3a6b;display:none}
.logo-slogan{font-size:12px;font-weight:500;color:#fff;white-space:nowrap}
.logo-wrap{display:flex;align-items:center;gap:.7rem;flex-shrink:0}
.crm-title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:.4rem;color:#fff;font-weight:800;font-size:1rem;white-space:nowrap}
.user-chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:.3rem .8rem;color:#fff;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:.35rem;cursor:pointer;transition:.2s;white-space:nowrap;flex-shrink:0}
.user-chip:hover{background:rgba(255,255,255,.2)}
.user-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.user-menu{display:none;position:fixed;top:58px;right:1.5rem;background:#fff;border:1px solid #dde1e9;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:300;min-width:150px;overflow:hidden}
.user-menu.open{display:block}
.user-menu-item{padding:.5rem .9rem;cursor:pointer;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:.5rem}
.user-menu-item:hover{background:#f0f4ff}

/* ── NAV PILLS (centrados) ── */
.nav-bar{background:#fff;border-bottom:1px solid #dde1e9;padding:.6rem 1rem;display:flex;flex-direction:column;gap:.45rem;flex-shrink:0}
.nav-row{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
.nav-pill{padding:.4rem .9rem;border-radius:20px;font-size:.82rem;font-weight:700;color:#4a5068;background:#f0f4ff;border:1px solid #dde1e9;cursor:pointer;white-space:nowrap;transition:.15s;display:flex;align-items:center;gap:.35rem;font-family:'Manrope',sans-serif}
.nav-pill:hover{background:#dce8f7;color:#1a3a6b}
.nav-pill.active{background:#1a3a6b;color:#fff;border-color:#1a3a6b}

/* ── CONTENIDO ── */
.tab-frame-wrap{display:none;flex:1;min-height:0}
.tab-frame-wrap.active{display:block}
.tab-frame-wrap iframe{width:100%;height:100%;border:none;display:block}

/* ── CONTACTOS: Contactos + Equipo apilados ── */
.personas-wrap{height:100%;overflow-y:auto;background:#f5f6f8}
.personas-iframe-co{width:100%;border:none;display:block;height:640px}
.personas-divider{display:flex;align-items:center;gap:.6rem;padding:1rem 1.5rem .4rem;background:#f5f6f8}
.personas-divider-line{flex:1;height:2px;background:linear-gradient(to right,#4a9fd4,transparent)}
.personas-divider-label{font-size:.78rem;font-weight:800;color:#4a5068;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.personas-iframe-eq{width:100%;border:none;display:block;height:560px}

@media(max-width:600px){
  .crm-header{padding:.5rem .8rem;flex-wrap:wrap;gap:.4rem}
  .logo-slogan{display:none}
  .crm-title{position:static;transform:none;font-size:.85rem;order:3;width:100%;justify-content:center;margin-top:.3rem}
  .nav-bar{padding:.5rem .6rem;gap:.35rem}
  .nav-row{gap:.35rem}
  .nav-pill{padding:.35rem .7rem;font-size:.76rem}
}
</style>
</head>
<body>

<header class="crm-header">
  <div class="logo-wrap">
    <div class="logo-box">
      <img src="https://raw.githubusercontent.com/fernandodavilaolvera-rgb/excelentia.com.mx/main/assets/logo_excelentIA_clean.png" alt="ExcelentIA"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="logo-fallback">Excelent<span style="color:#4a9fd4">IA</span></span>
    </div>
    <span class="logo-slogan">Inteligencia Artificial con esencia Humana</span>
  </div>
  <div class="crm-title">⚡ Ferrock CRM</div>
  <div class="user-chip" onclick="toggleUserMenu()">
    <span class="user-dot" id="userDot" style="background:#fff"></span>
    <span id="userChipName">Fernando</span>
    <span>▾</span>
  </div>
</header>

<div class="user-menu" id="userMenu">
  <div class="user-menu-item" onclick="setUser('fernando')"><span style="width:9px;height:9px;border-radius:50%;background:#1a3a6b;display:inline-block"></span>Fernando</div>
  <div class="user-menu-item" onclick="setUser('juanjose')"><span style="width:9px;height:9px;border-radius:50%;background:#7c3aed;display:inline-block"></span>Juan José</div>
  <div class="user-menu-item" onclick="setUser('adolfo')"><span style="width:9px;height:9px;border-radius:50%;background:#059669;display:inline-block"></span>Adolfo</div>
</div>

<nav class="nav-bar">
  <div class="nav-row">
    <button class="nav-pill" data-tab="tracker" onclick="showTab('tracker')">⏱️ Tracker</button>
    <button class="nav-pill" data-tab="drive" onclick="showTab('drive')">📂 Drive</button>
    <button class="nav-pill" data-tab="contactos" onclick="showTab('contactos')">👥 Contactos</button>
    <button class="nav-pill" data-tab="proyectos" onclick="showTab('proyectos')">📋 Proyectos</button>
    <button class="nav-pill" data-tab="plats" onclick="showTab('plats')">📧 Plat´s Info</button>
    <button class="nav-pill" data-tab="finanzas" onclick="showTab('finanzas')">💰 Finanzas</button>
  </div>
  <div class="nav-row">
    <button class="nav-pill" data-tab="ferrock" onclick="showTab('ferrock')">🗂️ Ferrock</button>
    <button class="nav-pill" data-tab="agenda" onclick="showTab('agenda')">📅 Agenda</button>
    <button class="nav-pill active" data-tab="timeline" onclick="showTab('timeline')">📅 Timeline</button>
    <button class="nav-pill" data-tab="pendientes" onclick="showTab('pendientes')">☑️ Pendientes</button>
    <button class="nav-pill" data-tab="ecoia" onclick="showTab('ecoia')">🫀 Eco IA</button>
  </div>
</nav>

<!-- FERROCK -->
<div class="tab-frame-wrap" id="wrap-ferrock">
  <iframe src="excelentia/Ferrock_Index.html" data-base="excelentia/Ferrock_Index.html" title="Ferrock"></iframe>
</div>

<!-- TRACKER -->
<div class="tab-frame-wrap" id="wrap-tracker">
  <iframe src="excelentia/tracker-horas.html" data-base="excelentia/tracker-horas.html" title="Tracker"></iframe>
</div>

<!-- AGENDA -->
<div class="tab-frame-wrap" id="wrap-agenda">
  <iframe src="excelentia/agenda.html" data-base="excelentia/agenda.html" title="Agenda"></iframe>
</div>

<!-- CONTACTOS (Contactos + Equipo apilados) -->
<div class="tab-frame-wrap" id="wrap-contactos">
  <div class="personas-wrap">
    <iframe class="personas-iframe-co" src="excelentia/crm-contactos.html" data-base="excelentia/crm-contactos.html" title="Contactos" onload="autoSize(this)"></iframe>
    <div class="personas-divider">
      <div class="personas-divider-line"></div>
      <span class="personas-divider-label">👥 Equipo ExcelentIA</span>
      <div class="personas-divider-line" style="background:linear-gradient(to left,#4a9fd4,transparent)"></div>
    </div>
    <iframe class="personas-iframe-eq" src="excelentia/crm-equipo.html" data-base="excelentia/crm-equipo.html" title="Equipo" onload="autoSize(this)"></iframe>
  </div>
</div>

<!-- PROYECTOS -->
<div class="tab-frame-wrap" id="wrap-proyectos">
  <iframe src="excelentia/crm-proyectos.html" data-base="excelentia/crm-proyectos.html" title="Proyectos"></iframe>
</div>

<!-- LISTA DE PENDIENTES -->
<div class="tab-frame-wrap" id="wrap-pendientes">
  <iframe src="excelentia/crm-tareas.html" data-base="excelentia/crm-tareas.html" title="Lista de Pendientes"></iframe>
</div>

<!-- TIMELINE (default) -->
<div class="tab-frame-wrap active" id="wrap-timeline">
  <iframe src="excelentia/timeline.html" data-base="excelentia/timeline.html" title="Timeline"></iframe>
</div>

<!-- DRIVE -->
<div class="tab-frame-wrap" id="wrap-drive">
  <iframe src="excelentia/drive.html" data-base="excelentia/drive.html" title="Drive"></iframe>
</div>

<!-- FINANZAS (editable) -->
<div class="tab-frame-wrap" id="wrap-finanzas">
  <iframe src="excelentia/finanzas.html" data-base="excelentia/finanzas.html" title="Finanzas"></iframe>
</div>

<!-- PLAT´S INFO (resumen de correos de plataformas) -->
<div class="tab-frame-wrap" id="wrap-plats">
  <iframe src="excelentia/correos-plataformas.html" data-base="excelentia/correos-plataformas.html" title="Plat´s Info"></iframe>
</div>

<!-- ECO-IA ACTIVIDAD -->
<div class="tab-frame-wrap" id="wrap-ecoia">
  <iframe src="excelentia/dashboard-eco-ia_actividad.html" data-base="excelentia/dashboard-eco-ia_actividad.html" title="Eco-IA Actividad"></iframe>
</div>

<script>
const USERS = {
  fernando: { nombre: 'Fernando', color: '#1a3a6b' },
  juanjose: { nombre: 'Juan José', color: '#7c3aed' },
  adolfo:   { nombre: 'Adolfo',   color: '#059669' }
};
let currentUser = 'fernando';

function showTab(tab){
  document.querySelectorAll('.nav-pill').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-frame-wrap').forEach(w=>w.classList.remove('active'));
  document.querySelector(`.nav-pill[data-tab="${tab}"]`)?.classList.add('active');
  document.getElementById('wrap-'+tab)?.classList.add('active');
  const url = new URL(window.location);
  url.searchParams.set('tab', tab);
  window.history.replaceState({}, '', url);
}

function setUser(uid){
  currentUser = uid;
  const u = USERS[uid];
  document.getElementById('userDot').style.background = u.color;
  document.getElementById('userChipName').textContent = u.nombre;
  document.getElementById('userMenu').classList.remove('open');
  // Propaga ?user=xxx a TODOS los módulos (cada iframe recarga con su base)
  document.querySelectorAll('iframe[data-base]').forEach(f=>{
    f.src = f.dataset.base + '?user=' + uid;
  });
}

function toggleUserMenu(){
  document.getElementById('userMenu').classList.toggle('open');
}
document.addEventListener('click', e=>{
  if(!e.target.closest('.user-chip') && !e.target.closest('#userMenu')){
    document.getElementById('userMenu').classList.remove('open');
  }
});

function autoSize(iframe){
  try{
    const doc = iframe.contentWindow.document;
    const resize = () => {
      const h = doc.documentElement.scrollHeight;
      if(h > 100) iframe.style.height = h + 'px';
    };
    resize();
    setTimeout(resize, 1200);
    setTimeout(resize, 3000);
    new MutationObserver(resize).observe(doc.body, { childList:true, subtree:true });
  }catch(e){ /* same-origin, no debería fallar */ }
}

document.addEventListener('DOMContentLoaded', ()=>{
  const params = new URLSearchParams(window.location.search);
  const tabParam = params.get('tab');
  if(tabParam && document.getElementById('wrap-'+tabParam)){
    showTab(tabParam);
  }
});
</script>
</body>
</html>
