<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ferrock CRM · Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:#f5f6f8;color:#1a2035;min-height:100vh;display:flex;flex-direction:column}
.crm-header{background:linear-gradient(135deg,#0d1b3e 0%,#1a3a6b 60%,#1e5096 100%);border-bottom:3px solid #4a9fd4;padding:.8rem 1.4rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.logo-header-wrap{display:flex;align-items:center;gap:.9rem}
.logo-box{background:#fff;border-radius:10px;padding:.4rem .75rem;display:flex;align-items:center;justify-content:center;min-width:80px;min-height:52px;flex-shrink:0}
.logo-box img{height:48px;width:auto;display:block}
.logo-fallback{font-family:'Manrope',sans-serif;font-size:15px;font-weight:800;color:#1a3a6b;display:none}
.logo-slogan{font-size:13px;font-weight:500;color:#fff;letter-spacing:.2px}
.crm-title{color:#fff;font-weight:800;font-size:15px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 16px}
.card{width:100%;max-width:420px;margin:0 auto;background:#fff;border:1px solid #dde1e9;border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(13,27,62,.08)}
.card-head{background:#dce8f7;padding:1rem 1.3rem;border-bottom:1px solid #dde1e9}
.card-head h1{font-size:17px;font-weight:800;color:#1a3a6b}
.card-head p{font-size:12.5px;color:#4a5068;margin-top:.2rem}
form{padding:1.3rem;display:flex;flex-direction:column;gap:.9rem}
label{font-size:12px;font-weight:700;color:#4a5068;display:block;margin-bottom:.3rem}
input{width:100%;font-family:inherit;font-size:15px;padding:.7rem .8rem;border:1px solid #dde1e9;border-radius:9px;color:#1a2035;background:#fff}
input:focus{outline:none;border-color:#4a9fd4;box-shadow:0 0 0 3px #e8f0fb}
.pass-wrap{position:relative}
.pass-wrap button{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);background:none;border:none;color:#8a90a0;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:.3rem}
.btn{background:#1a3a6b;color:#fff;border:none;border-radius:9px;padding:.8rem;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;margin-top:.2rem}
.btn:hover{background:#1e5096}
.btn:disabled{opacity:.6;cursor:wait}
.alerta{display:none;background:#f0f6ff;border:1px solid #c8d9f0;border-left:4px solid #4a9fd4;border-radius:8px;padding:.6rem .8rem;font-size:13px;color:#1a2035}
.alerta.error{background:#fdf2f2;border-color:#f5c6c6;border-left-color:#dc2626}
.nota{background:#eef4fc;border-left:3px solid #1a3a6b;margin:0 1.3rem 1.3rem;padding:.6rem .8rem;border-radius:6px;font-size:12px;color:#4a5068}
@media (max-width:600px){
  .crm-header{padding:.7rem 16px}
  .logo-header-wrap{flex-direction:column;align-items:flex-start;gap:.3rem}
  .logo-slogan{font-size:11px}
  .crm-title{font-size:13px}
  main{align-items:flex-start;padding-top:1.5rem}
}
@media print{
  @page{size:Letter;margin:12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .no-print{display:none!important}
  .card{break-inside:avoid}
  a[href]:after{content:none}
}
</style>
</head>
<body>
<header class="crm-header">
  <div class="logo-header-wrap">
    <div class="logo-box">
      <img src="https://raw.githubusercontent.com/fernandodavilaolvera-rgb/excelentia.com.mx/main/assets/logo_excelentIA_clean.png" alt="ExcelentIA" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
      <span class="logo-fallback">Excelent<span style="color:#4a9fd4">IA</span></span>
    </div>
    <span class="logo-slogan">Inteligencia Artificial con esencia Humana</span>
  </div>
  <span class="crm-title">Ferrock CRM</span>
</header>
<main>
  <div class="card">
    <div class="card-head">
      <h1>Entrar al CRM</h1>
      <p>Escribe tu usuario y tu contraseña.</p>
    </div>
    <form id="f" autocomplete="on">
      <div class="alerta" id="msg"></div>
      <div>
        <label for="usuario">Usuario</label>
        <input id="usuario" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div>
        <label for="clave">Contraseña</label>
        <div class="pass-wrap">
          <input id="clave" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="no-print" onclick="verClave()" id="btnVer">Ver</button>
        </div>
      </div>
      <button class="btn" id="btn" type="submit">Entrar</button>
    </form>
    <div class="nota">La sesión se queda abierta 30 días en este navegador. Para cerrarla antes, usa “Salir” en el menú de tu nombre.</div>
  </div>
</main>
<script>
const API = 'https://n8n.excelentia.com.mx/webhook/crm-login';
const PAGINA = { fernando: 'Ferrock-CRM.html' };
const PAGINA_DEFAULT = 'crm_excelentIA_index.html';
const $ = id => document.getElementById(id);
function guardar(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function leer(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function aviso(t, error){ const m = $('msg'); m.textContent = t; m.className = 'alerta' + (error ? ' error' : ''); m.style.display = t ? 'block' : 'none'; }
function verClave(){ const c = $('clave'); const v = c.type === 'password'; c.type = v ? 'text' : 'password'; $('btnVer').textContent = v ? 'Ocultar' : 'Ver'; }
function destino(usuario){
  const r = new URLSearchParams(location.search).get('r') || '';
  // Solo regresa a páginas del propio CRM
  if (/^\/crm\/[A-Za-z0-9_\-\/]+\.html/.test(r) && !/login\.html/.test(r)) {
    const u = new URL(r, location.origin);
    if (u.searchParams.has('u')) u.searchParams.delete('u');
    if (/\/crm\/[^\/]+\.html$/.test(u.pathname)) return u.pathname + u.search;
  }
  return PAGINA[usuario] || PAGINA_DEFAULT;
}
// Si ya hay sesión vigente en este navegador, entra directo
(function(){
  const t = leer('crm_token'), e = leer('crm_expira'), u = leer('crm_usuario');
  if (t && u && (!e || new Date(e) > new Date())) location.replace(destino(u));
  if (u) { $('usuario').value = u; }
  (u ? $('clave') : $('usuario')).focus();
})();
$('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  aviso('');
  const usuario = $('usuario').value.trim().toLowerCase();
  const clave = $('clave').value;
  if (!usuario || !clave) return;
  $('btn').disabled = true; $('btn').textContent = 'Entrando…';
  try {
    const r = await fetch(API, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ accion:'entrar', usuario, clave }) });
    const j = await r.json();
    if (!j || !j.ok) throw new Error((j && j.error) || 'Usuario o contraseña incorrectos');
    guardar('crm_token', j.token);
    guardar('crm_usuario', j.usuario);
    guardar('crm_nombre', j.nombre || j.usuario);
    guardar('crm_expira', j.expira || '');
    location.replace(destino(j.usuario));
  } catch (e) {
    aviso(e.message && e.message !== 'Failed to fetch' ? e.message : 'No se pudo conectar; intenta de nuevo en un momento.', true);
    $('btn').disabled = false; $('btn').textContent = 'Entrar';
    $('clave').select();
  }
});
</script>
</body>
</html>
