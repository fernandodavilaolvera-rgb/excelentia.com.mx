<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wonderville Store · Ride the Cyclone</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060d0b;
  --neon-green: #00ff88;
  --neon-green-dim: #00cc66;
  --neon-cyan: #00e5ff;
  --neon-magenta: #ff2d78;
  --dark-green: #003322;
  --mid-green: #005533;
  --btn-green: #00a855;
  --btn-green-hover: #00d466;
  --text: #e8fff4;
  --text-dim: #5a8870;
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background-color: var(--bg);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  padding-bottom: 40px;
  position: relative;
  overflow-x: hidden;
}

/* ── FONDO PSICODÉLICO ── */
.bg-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

body > *:not(.bg-canvas) { position: relative; z-index: 1; }

/* ── HEADER ── */
header {
  text-align: center;
  padding: 24px 16px 18px;
  border-bottom: 1px solid rgba(0,255,136,0.2);
  background: linear-gradient(180deg, rgba(0,20,12,0.9) 0%, transparent 100%);
}

.logo-wrap {
  width: 320px;
  height: 150px;
  margin: 0 auto 10px;
  border-radius: 20px;
  overflow: hidden;
  border: 1.5px solid rgba(0,255,136,0.25);
  background: rgba(0,20,12,0.6);
  box-shadow: none;
}

.logo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 40%;
}

header .subtitle {
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--neon-green-dim);
  margin-top: 6px;
}

/* ── SECTIONS ── */
.section {
  margin: 18px 14px 0;
}

.section-label {
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
  padding-left: 2px;
}

/* ── BOTONES UNIFICADOS — misma cuadrícula, mismo tamaño ── */
.btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}

/* BASE común para los 6 botones de producto + pago */
.main-btn {
  background: linear-gradient(160deg, #004d2a 0%, #002d18 100%);
  border: 2px solid var(--btn-green);
  border-radius: var(--radius);
  padding: 0;
  height: 100px;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s ease;
  position: relative;
  user-select: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  box-shadow: 0 0 12px rgba(0,168,85,0.25), inset 0 1px 0 rgba(0,255,136,0.1);
}

.main-btn:active {
  transform: scale(0.93);
  box-shadow: 0 0 20px rgba(0,255,136,0.4);
}

.main-btn.active-product {
  background: linear-gradient(160deg, #006b38 0%, #003d20 100%);
  border-color: var(--neon-green);
  box-shadow: 0 0 20px rgba(0,255,136,0.5), inset 0 0 20px rgba(0,255,136,0.08);
}

.main-btn.active-pay {
  background: linear-gradient(160deg, #006b38 0%, #003d20 100%);
  border-color: var(--neon-cyan);
  box-shadow: 0 0 20px rgba(0,229,255,0.5), inset 0 0 20px rgba(0,229,255,0.08);
}

.main-btn .btn-icon {
  font-size: 28px;
  line-height: 1;
}

.main-btn .btn-name {
  font-size: 13px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.2;
}

.main-btn .btn-price {
  font-family: 'Black Ops One', cursive;
  font-size: 16px;
  color: var(--neon-green);
  text-shadow: 0 0 8px rgba(0,255,136,0.6);
}

.main-btn .pay-label {
  font-size: 14px;
  font-weight: 900;
  color: var(--text);
}

/* Badge de cantidad */
.qty-badge {
  position: absolute;
  top: -8px; right: -8px;
  background: var(--neon-magenta);
  color: white;
  font-size: 13px;
  font-weight: 900;
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0);
  transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: 0 2px 8px rgba(255,45,120,0.5);
}
.qty-badge.visible { opacity: 1; transform: scale(1); }

/* ── SECCIÓN 3: ACCIÓN ── */
.action-row {
  display: grid;
  grid-template-columns: 1fr 1.2fr 1fr;
  gap: 10px;
  align-items: stretch;
}

.action-btn {
  border: none;
  border-radius: var(--radius);
  padding: 0;
  height: 100px;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  font-size: 15px;
  font-weight: 900;
  transition: all 0.15s ease;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.action-btn:active { transform: scale(0.94); }

.btn-clear {
  background: linear-gradient(160deg, #004d2a 0%, #002d18 100%);
  border: 2px solid var(--btn-green);
  color: var(--text);
  box-shadow: 0 0 12px rgba(0,168,85,0.25), inset 0 1px 0 rgba(0,255,136,0.1);
}

.btn-register {
  background: linear-gradient(135deg, #c4003a, #ff2d78);
  color: white;
  font-size: 14px;
  box-shadow: 0 0 12px rgba(0,168,85,0.25), inset 0 1px 0 rgba(0,255,136,0.1);
  border: 2px solid var(--btn-green);
}
.btn-register:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; box-shadow: none; }

.total-display {
  background: linear-gradient(160deg, #004d2a 0%, #002d18 100%);
  border: 2px solid var(--btn-green);
  border-radius: var(--radius);
  padding: 0;
  height: 100px;
  text-align: center;
  box-shadow: 0 0 12px rgba(0,168,85,0.25), inset 0 1px 0 rgba(0,255,136,0.1);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.total-label {
  font-size: 9px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--text-dim);
  display: block;
}
.total-amount {
  font-family: 'Black Ops One', cursive;
  font-size: 28px;
  color: var(--neon-green);
  display: block;
  text-shadow: 0 0 16px rgba(0,255,136,0.7);
  line-height: 1.1;
}

/* ── CART SUMMARY ── */
.cart-summary {
  margin: 8px 0 0;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-dim);
  min-height: 14px;
  text-align: center;
  letter-spacing: 0.05em;
}

/* ── DIVIDER ── */
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,255,136,0.2), transparent);
  margin: 18px 14px 0;
}

/* ── DB BUTTON ── */
.db-section { margin: 18px 14px 0; }

.db-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 15px;
  background: rgba(0,255,136,0.04);
  border: 1.5px dashed rgba(0,255,136,0.25);
  border-radius: var(--radius);
  color: var(--text-dim);
  font-family: 'Nunito', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.18s ease;
  letter-spacing: 0.03em;
}
.db-btn:hover { background: rgba(0,255,136,0.08); color: var(--neon-green); border-color: rgba(0,255,136,0.5); }

/* ── CLABE ── */
.clabe-section {
  margin: 18px 14px 0;
  background: linear-gradient(160deg, #001a0f, #000d07);
  border: 1px solid rgba(0,229,255,0.25);
  border-radius: var(--radius);
  padding: 16px 16px 16px 20px;
  position: relative;
  overflow: hidden;
}
.clabe-section::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 100%;
  background: linear-gradient(180deg, var(--neon-cyan), var(--neon-green));
}
.clabe-title {
  font-size: 9px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--neon-cyan);
  opacity: 0.7;
  margin-bottom: 8px;
}
.clabe-number {
  font-family: 'Black Ops One', cursive;
  font-size: 18px;
  color: var(--text);
  letter-spacing: 0.06em;
  display: block;
  word-spacing: 4px;
}
.clabe-holder {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-dim);
  margin-top: 5px;
  display: block;
}

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--mid-green);
  border: 1px solid var(--neon-green);
  color: var(--neon-green);
  padding: 12px 26px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 800;
  white-space: nowrap;
  transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
  opacity: 0;
  z-index: 200;
  box-shadow: 0 4px 24px rgba(0,255,136,0.3);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.error { background: #3a000f; border-color: var(--neon-magenta); color: var(--neon-magenta); box-shadow: 0 4px 24px rgba(255,45,120,0.3); }
</style>
</head>

<script>
// ── CONFIGURACIÓN ──────────────────────────────────
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKMqASBXbW7ZzyhUTN_HBB8z8Vr2VWQr0c2SNpezFIL2_cONpoTMNOt7NA_FDUCG_gAQ/exec';
// ───────────────────────────────────────────────────

const PRODUCTS = [
  { name: 'Tote Bag Oficial',   price: 210 },
  { name: 'Plantilla Stickers', price: 120 },
  { name: 'Oráculo de Karnak',  price: 150 },
];

let cart = [0, 0, 0];
let paymentMethod = null;

// ── FONDO CANVAS PSICODÉLICO ──
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W, H, t = 0;

function resizeCanvas() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function drawBg() {
  ctx.fillStyle = '#060d0b';
  ctx.fillRect(0, 0, W, H);
  const cx = W * 0.5, cy = H * 0.38;
  const rings = 18;
  for (let i = rings; i > 0; i--) {
    const r = (i / rings) * Math.max(W, H) * 0.75;
    const wave = Math.sin(t * 0.4 + i * 0.5) * 12;
    const alpha = 0.04 + (i % 3 === 0 ? 0.03 : 0);
    ctx.beginPath();
    ctx.arc(cx, cy, r + wave, 0, Math.PI * 2);
    const hue = 150 + i * 4 + t * 5;
    ctx.strokeStyle = `hsla(${hue}, 80%, 45%, ${alpha})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  const spokes = 12;
  for (let i = 0; i < spokes; i++) {
    const angle = (i / spokes) * Math.PI * 2 + t * 0.05;
    const x2 = cx + Math.cos(angle) * Math.max(W, H);
    const y2 = cy + Math.sin(angle) * Math.max(W, H);
    const grad = ctx.createLinearGradient(cx, cy, x2, y2);
    grad.addColorStop(0, 'rgba(0,255,136,0.06)');
    grad.addColorStop(1, 'rgba(0,255,136,0)');
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  const dotCount = 24;
  for (let i = 0; i < dotCount; i++) {
    const angle = (i / dotCount) * Math.PI * 2 + t * 0.08;
    const orbitR = Math.min(W, H) * 0.35;
    const x = cx + Math.cos(angle) * orbitR;
    const y = cy + Math.sin(angle) * orbitR;
    const pulse = 0.5 + 0.5 * Math.sin(t * 2 + i * 0.8);
    ctx.beginPath();
    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,255,136,${0.15 * pulse})`;
    ctx.fill();
  }
  t += 0.012;
  requestAnimationFrame(drawBg);
}
drawBg();

// ── LÓGICA DE VENTAS ──
function addProduct(idx) {
  cart[idx]++;
  updateUI();
  if (navigator.vibrate) navigator.vibrate(30);
}

function selectPayment(method) {
  paymentMethod = method;
  ['cash','card','transfer'].forEach(m => {
    const el = document.getElementById('pay-' + m);
    el.className = 'main-btn';
    if (m === method) el.classList.add('active-pay');
  });
  updateUI();
}

function updateUI() {
  const total = cart.reduce((s, q, i) => s + q * PRODUCTS[i].price, 0);
  document.getElementById('totalAmount').textContent = '$' + total.toLocaleString('es-MX');
  cart.forEach((qty, i) => {
    const badge = document.getElementById('badge-' + i);
    const btn   = document.getElementById('btn-' + i);
    badge.textContent = qty;
    badge.classList.toggle('visible', qty > 0);
    btn.classList.toggle('active-product', qty > 0);
  });
  const items = cart.map((q,i) => q > 0 ? `${q}× ${PRODUCTS[i].name}` : null).filter(Boolean);
  document.getElementById('cartSummary').textContent = items.join('  ·  ');
  document.getElementById('registerBtn').disabled = !(cart.some(q => q > 0) && paymentMethod);
}

function clearCart(silent) {
  cart = [0,0,0];
  paymentMethod = null;
  ['cash','card','transfer'].forEach(m => document.getElementById('pay-' + m).className = 'main-btn');
  updateUI();
  if (!silent) showToast('Venta borrada');
}

async function registerSale() {
  const total = cart.reduce((s,q,i) => s + q * PRODUCTS[i].price, 0);
  if (!total || !paymentMethod) return;

  const btn = document.getElementById('registerBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Guardando...';

  const payLabels = { cash: 'Efectivo', card: 'Tarjeta', transfer: 'Transferencia' };
  const items = cart.map((q,i) => q > 0 ? `${q}x ${PRODUCTS[i].name}` : null).filter(Boolean).join(', ');
  const fecha = new Date().toLocaleString('es-MX', { timeZone: 'America/Mexico_City' });
  const pago  = payLabels[paymentMethod];

  const esEfectivo      = pago === 'Efectivo'      ? total : 0;
  const esTarjeta       = pago === 'Tarjeta'       ? total : 0;
  const esTransferencia = pago === 'Transferencia' ? total : 0;

  // Guardar local como respaldo
  const local = JSON.parse(localStorage.getItem('ventas_rtc') || '[]');
  local.push({ fecha, bolsas: cart[0], stickers: cart[1], oraculos: cart[2], items, pago, total });
  localStorage.setItem('ventas_rtc', JSON.stringify(local));

  // Enviar a Sheets via GET (evita CORS)
  const params = new URLSearchParams({
    fecha,
    bolsas:   cart[0],
    stickers: cart[1],
    oraculos: cart[2],
    items,
    pago,
    total,
    esEfectivo,
    esTarjeta,
    esTransferencia
  });

  try {
    await fetch(GOOGLE_SCRIPT_URL + '?' + params.toString(), {
      method: 'GET',
      mode: 'no-cors'
    });
  } catch(e) {
    console.log('fetch error:', e);
  }

  // Esperar 1.5s y mostrar éxito
  await new Promise(r => setTimeout(r, 1500));

  showToast(`✓ Registrado — $${total.toLocaleString('es-MX')}`);
  clearCart(true);
  btn.textContent = '✓ Registrar';
  btn.disabled = false;
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
